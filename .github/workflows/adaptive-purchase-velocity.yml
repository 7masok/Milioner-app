name: Adaptive purchase velocity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adaptive-purchase-velocity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply adaptive purchase velocity patch
        run: python tools/adaptive_purchase_velocity.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.rfind('<script>')
          end=s.find('</script>', start)
          Path('/tmp/app.js').write_text(s[start+8:end], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use adaptive sales velocity for purchase recommendations'
          git push
