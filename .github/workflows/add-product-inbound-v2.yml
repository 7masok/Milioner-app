name: Add inbound quantities to products v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-product-inbound-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch products view
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='<div class="card"><div class="label">В резерве</div><div class="num" id="productReservedQty">0 шт.</div></div><div class="card"><div class="label">Себестоимость остатка</div><div class="num" id="productStockCost">0 ₸</div></div>'
          new='<div class="card"><div class="label">В резерве</div><div class="num" id="productReservedQty">0 шт.</div></div><div class="card"><div class="label">В пути</div><div class="num" id="productInboundQty">0 шт.</div></div><div class="card"><div class="label">Себестоимость остатка</div><div class="num" id="productStockCost">0 ₸</div></div>'
          if old in s: s=s.replace(old,new,1)

          old2="function purchaseInboundQty(productId){return (state.purchases||[]).filter(x=>String(x.productId)===String(productId)&&purchaseStatus(x)!=='received').reduce((sum,x)=>sum+Math.max(0,Number(x.qty)||0),0)}"
          if 'function purchaseInboundTotalQty()' not in s:
              if old2 not in s: raise SystemExit('purchaseInboundQty marker missing')
              s=s.replace(old2,old2+"\nfunction purchaseInboundTotalQty(){return stockProducts().reduce((sum,p)=>sum+purchaseInboundQty(p.id),0)}",1)

          old3="stockQty=document.getElementById('productStockQty'),reservedQty=document.getElementById('productReservedQty'),stockCost=document.getElementById('productStockCost')"
          if "inboundQty=document.getElementById('productInboundQty')" not in s:
              if old3 not in s: raise SystemExit('renderProducts metrics marker missing')
              s=s.replace(old3,"stockQty=document.getElementById('productStockQty'),reservedQty=document.getElementById('productReservedQty'),inboundQty=document.getElementById('productInboundQty'),stockCost=document.getElementById('productStockCost')",1)

          old4="if(reservedQty)reservedQty.textContent=reservedStockTotal().toLocaleString('ru-RU')+' шт.';if(stockCost)stockCost.textContent=fmt(warehouseInventoryCost())"
          if "purchaseInboundTotalQty().toLocaleString('ru-RU')+' шт.'" not in s:
              if old4 not in s: raise SystemExit('renderProducts value marker missing')
              s=s.replace(old4,"if(reservedQty)reservedQty.textContent=reservedStockTotal().toLocaleString('ru-RU')+' шт.';if(inboundQty)inboundQty.textContent=purchaseInboundTotalQty().toLocaleString('ru-RU')+' шт.';if(stockCost)stockCost.textContent=fmt(warehouseInventoryCost())",1)

          old5="function productCard(p,profit=productAllTimeProfitStats(p),d=productAverageDailySales(p,25),stock=productAvailableStock(p)){const kind=isBundleProduct(p)?'Набор · ':'',r=reserved(p),physical=isBundleProduct(p)?stock:(Number(p.stock)||0);return `"
          if 'inbound=isBundleProduct(p)?0:purchaseInboundQty(p.id)' not in s:
              if old5 not in s: raise SystemExit('productCard header marker missing')
              s=s.replace(old5,"function productCard(p,profit=productAllTimeProfitStats(p),d=productAverageDailySales(p,25),stock=productAvailableStock(p)){const kind=isBundleProduct(p)?'Набор · ':'',r=reserved(p),physical=isBundleProduct(p)?stock:(Number(p.stock)||0),inbound=isBundleProduct(p)?0:purchaseInboundQty(p.id);return `",1)

          old6='${r>0?`<div class="muted" style="color:#8a5300">Резерв: ${r} шт. · физически: ${physical} шт.</div>`:\'\'}<div class="muted">Средняя прибыль/шт. за всё время: ${fmt(profit.unitProfit)}</div>'
          new6='${r>0?`<div class="muted" style="color:#8a5300">Резерв: ${r} шт. · физически: ${physical} шт.</div>`:\'\'}${inbound>0?`<div class="muted" style="color:#6f42c1">В пути: ${inbound} шт.</div>`:\'\'}<div class="muted">Средняя прибыль/шт. за всё время: ${fmt(profit.unitProfit)}</div>'
          if 'В пути: ${inbound} шт.' not in s:
              if old6 not in s: raise SystemExit('productCard body marker missing')
              s=s.replace(old6,new6,1)

          checks=['id="productInboundQty"','function purchaseInboundTotalQty()','inbound=isBundleProduct(p)?0:purchaseInboundQty(p.id)','В пути: ${inbound} шт.']
          missing=[x for x in checks if x not in s]
          if missing: raise SystemExit('missing after patch: '+', '.join(missing))
          p.write_text(s,encoding='utf-8')
          print('product inbound patch ok')
          PY
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show inbound stock on product cards'
          git push origin HEAD:main
