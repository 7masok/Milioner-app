name: Add WB access check
on:
  push:
    branches: [main]
    paths:
      - 'tools/add_wb_access_check.py'
      - '.github/workflows/add-wb-access-check.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python tools/add_wb_access_check.py
      - run: node --check cloudflare/millioner-api/src/index.js
      - run: |
          if git diff --quiet -- cloudflare/millioner-api/src/index.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Expose safe WB API permission check'
          git push origin main