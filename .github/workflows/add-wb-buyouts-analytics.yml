name: Add WB analytics buyouts
on:
  push:
    paths: ['.github/workflows/add-wb-buyouts-analytics.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_wb_buyout_retry_ui.py
      - run: node --check cloudflare/millioner-api/src/fixed.js
      - name: Check browser JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/app.js
      - run: grep -q 'wbBuyoutCacheDue' cloudflare/millioner-api/src/fixed.js
      - run: grep -q 'синхронизация WB' index.html
      - run: |
          if git diff --quiet -- cloudflare/millioner-api/src/fixed.js index.html; then exit 0; fi
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add cloudflare/millioner-api/src/fixed.js index.html
          git commit -m 'Retry WB buyouts safely and hide false zeros'
          git push
