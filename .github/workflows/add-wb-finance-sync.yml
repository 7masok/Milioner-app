name: Add WB finance sync
on:
  push:
    branches: [main]
    paths:
      - 'tools/add_wb_finance_sync.py'
      - '.github/workflows/add-wb-finance-sync.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python tools/add_wb_finance_sync.py
      - run: node --check cloudflare/millioner-api/src/index.js
      - run: |
          grep -q 'async function syncWbFinance' cloudflare/millioner-api/src/index.js
          grep -q '/api/wb-finance-summary' cloudflare/millioner-api/src/index.js
      - run: |
          if git diff --quiet -- cloudflare/millioner-api/src/index.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Sync WB finance and advertising expenses'
          git push origin main