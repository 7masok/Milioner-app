name: Add WB sales direct
on:
  push:
    paths: ['.github/workflows/add-wb-sales-direct.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/add_wb_sales_direct.py
      - run: node --check cloudflare/millioner-api/src/fixed.js
      - name: Check browser JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(); m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script not found')
          Path('/tmp/app.js').write_text(m.group(1))
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name 7masok
          git config user.email 7masok@gmail.com
          git add cloudflare/millioner-api/src/fixed.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add D1-independent WB realized sales fallback'
          git push
