name: Add WB live sales
on:
  push:
    paths:
      - 'tools/add_wb_sales_live.py'
      - '.github/workflows/add-wb-sales-live.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python tools/add_wb_sales_live.py
      - run: node --check cloudflare/millioner-api/src/index.js
      - run: grep -q '/api/wb-sales-live' cloudflare/millioner-api/src/index.js
      - run: |
          if git diff --quiet -- cloudflare/millioner-api/src/index.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Add live WB realized sales source'
          git push origin main
