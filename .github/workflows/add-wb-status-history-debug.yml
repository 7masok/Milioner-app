name: Add WB sold history debug
on:
  push:
    paths: ['.github/workflows/add-wb-status-history-debug.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/add_wb_status_history_debug.py
      - run: node --check cloudflare/millioner-api/src/fixed.js
      - name: Commit
        run: |
          git config user.name 7masok
          git config user.email 7masok@gmail.com
          git add cloudflare/millioner-api/src/fixed.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add WB sold status history diagnostic'
          git push
