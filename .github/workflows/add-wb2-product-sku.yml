name: Add WB2 product SKU fields
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-wb2-product-sku.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Read full current index and patch WB2 SKU UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if not (s.startswith('<!doctype html>') and s.rstrip().endswith('</html>')):
              raise SystemExit('full current index.html read failed')
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          search_old="[p.name,p.kaspi,p.wb,p.ozon]"
          if s.count(search_old)!=2: raise SystemExit(f'product search WB2: expected 2 matches, got {s.count(search_old)}')
          s=s.replace(search_old,"[p.name,p.kaspi,p.wb,p.wb2,p.ozon]")
          sku_old="Kaspi: ${esc(p.kaspi||'—')} · WB: ${esc(p.wb||'—')} · Ozon: ${esc(p.ozon||'—')}"
          if s.count(sku_old)!=2: raise SystemExit(f'visible SKU summaries: expected 2 matches, got {s.count(sku_old)}')
          s=s.replace(sku_old,"Kaspi: ${esc(p.kaspi||'—')} · WB1: ${esc(p.wb||'—')} · WB2: ${esc(p.wb2||'—')} · Ozon: ${esc(p.ozon||'—')}")

          old_product="""<div class=\"two\"><div class=\"field\"><label>Kaspi артикул</label><input id=\"pk\"></div><div class=\"field\"><label>WB артикул</label><input id=\"pw\"></div></div><div class=\"field\"><label>Ozon артикул</label><input id=\"po\"></div>"""
          new_product="""<div class=\"two\"><div class=\"field\"><label>Kaspi артикул</label><input id=\"pk\"></div><div class=\"field\"><label>WB1 артикул</label><input id=\"pw\"></div></div><div class=\"two\"><div class=\"field\"><label>WB2 артикул</label><input id=\"pw2\"></div><div class=\"field\"><label>Ozon артикул</label><input id=\"po\"></div></div>"""
          once(old_product,new_product,'create form WB2')

          old_edit="""<div class=\"two\"><div class=\"field\"><label>Kaspi артикул</label><input id=\"ek\" value=\"${esc(p.kaspi||'')}\"></div><div class=\"field\"><label>WB артикул</label><input id=\"ew\" value=\"${esc(p.wb||'')}\"></div></div><div class=\"field\"><label>Ozon артикул</label><input id=\"eo\" value=\"${esc(p.ozon||'')}\"></div>"""
          new_edit="""<div class=\"two\"><div class=\"field\"><label>Kaspi артикул</label><input id=\"ek\" value=\"${esc(p.kaspi||'')}\"></div><div class=\"field\"><label>WB1 артикул</label><input id=\"ew\" value=\"${esc(p.wb||'')}\"></div></div><div class=\"two\"><div class=\"field\"><label>WB2 артикул</label><input id=\"ew2\" value=\"${esc(p.wb2||'')}\"></div><div class=\"field\"><label>Ozon артикул</label><input id=\"eo\" value=\"${esc(p.ozon||'')}\"></div></div>"""
          once(old_edit,new_edit,'edit form WB2')

          once("p.wb=document.getElementById('ew').value;p.ozon=", "p.wb=document.getElementById('ew').value;p.wb2=document.getElementById('ew2').value;p.ozon=", 'save WB2')
          once("wb:document.getElementById('pw').value,ozon:", "wb:document.getElementById('pw').value,wb2:document.getElementById('pw2').value,ozon:", 'create WB2')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          for marker in ['id="pw2"','id="ew2"','WB1 артикул','WB2 артикул',"p.wb2=document.getElementById('ew2').value","wb2:document.getElementById('pw2').value",'[p.name,p.kaspi,p.wb,p.wb2,p.ozon]','WB1: ${esc(p.wb||\'—\')} · WB2: ${esc(p.wb2||\'—\')}']:
              if marker not in h: raise SystemExit('missing '+marker)
          scripts=re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add separate WB2 SKU to product cards'
          git push origin HEAD:main
