name: Apply immediate WB stock synchronization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-immediate-wb-stock-sync.yml'
      - 'tools/patch_immediate_wb_stock_sync.py'
permissions:
  contents: write
jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_immediate_wb_stock_sync.py
      - name: Validate JavaScript
        run: |
          node --check cloudflare/millioner-api/src/index.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          grep -q '/api/stock-sync-now' cloudflare/millioner-api/src/index.js
          grep -q 'triggerImmediateWbStockSync' index.html
          grep -q 'wbStockStatus' index.html
          git diff --check
      - name: Commit
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Sync sellable stock to WB immediately after warehouse save'
          git push origin HEAD:main
      - name: Deploy millioner-api when credentials are available
        working-directory: cloudflare/millioner-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx --yes wrangler@4 deploy
          else
            echo 'Cloudflare repo credentials unavailable; Worker Builds will deploy from main.'
          fi
      - name: Wait for Worker endpoint and trigger live sync
        run: |
          set -e
          live=''
          for attempt in $(seq 1 48); do
            code=$(curl -sS -o /tmp/sync.json -w '%{http_code}' --max-time 30 -X POST -H 'Origin: https://7masok.github.io' -H 'Content-Type: application/json' --data '{"markets":["WB","WB2"],"force":false}' 'https://millioner-api.7masok.workers.dev/api/stock-sync-now' || true)
            if [ "$code" = '200' ]; then live=1; cat /tmp/sync.json | jq .; break; fi
            sleep 5
          done
          test -n "$live"
      - name: Verify live status
        run: |
          curl -fsSL --max-time 30 'https://millioner-api.7masok.workers.dev/api/stock-sync-status' | jq '{mode,markets:[.markets[]|{market,active,lastWrite,state}]}'
