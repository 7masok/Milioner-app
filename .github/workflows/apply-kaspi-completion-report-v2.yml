name: Run Kaspi completion report patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-kaspi-completion-report-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          python .github/scripts/fix_kaspi_completion_report.py
          node --check kaspi-report-v2.js
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          git config user.name millioner-maintenance
          git config user.email actions@users.noreply.github.com
          git add index.html kaspi-report-v2.js cloudflare/millioner-api/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Use Kaspi completionDate for report revenue'
          git push origin HEAD:main
