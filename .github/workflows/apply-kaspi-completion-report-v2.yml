name: Optimize Kaspi completion report
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-kaspi-completion-report-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reduce report requests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/millioner-api/src/index.js')
          s=p.read_text(encoding='utf-8')
          old="""        const specs = [
          { days: 2, state: '' },
          { days: 14, state: 'KASPI_DELIVERY' },
          { days: 14, state: 'PICKUP' },
          { days: 14, state: 'DELIVERY' },
          { days: 14, state: 'NEW' },
          { days: 14, state: 'SIGN_REQUIRED' },
          { days: 3, state: 'ARCHIVE' }
        ];"""
          new="""        const specs = [
          { days: 2, state: '' },
          { days: 3, state: 'ARCHIVE' }
        ];"""
          if old not in s:
              raise SystemExit('Kaspi specs marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          git config user.name millioner-maintenance
          git config user.email actions@users.noreply.github.com
          git add cloudflare/millioner-api/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Reduce Kaspi report requests'
          git push origin HEAD:main
