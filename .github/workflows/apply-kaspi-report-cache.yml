name: Apply exact paged Kaspi report cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-kaspi-report-cache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch backend
        run: |
          python .github/scripts/use_kaspi_report_cache.py
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          git config user.name millioner-maintenance
          git config user.email actions@users.noreply.github.com
          git add cloudflare/millioner-api/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Use exact paged Kaspi report cache for every period'
          git push origin HEAD:main
