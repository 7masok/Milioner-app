name: Apply purchase warehouse holding stage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-purchase-warehouse-stage.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Patch purchase lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if not (s.startswith('<!doctype html>') and s.rstrip().endswith('</html>')):
              raise SystemExit('full current index.html read failed')

          def rep(old,new,count=None,label='replacement'):
              global s
              found=s.count(old)
              if count is not None and found!=count:
                  raise SystemExit(f'{label}: expected {count}, found {found}')
              if found==0:
                  raise SystemExit(f'{label}: not found')
              s=s.replace(old,new, found if count is None else count)

          def sub_once(pattern,new,label):
              global s
              out,n=re.subn(pattern,new,s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s=out

          # 1) New persistent status is accepted everywhere warehouse snapshots are normalized.
          rep("['to_forwarder','to_me','received'].includes(String(x.status||''))", "['to_forwarder','to_me','at_warehouse','received'].includes(String(x.status||''))", count=2, label='purchase status normalization')
          rep("function purchaseStatus(x){const v=String(x?.status||'');return ['to_forwarder','to_me','received'].includes(v)?v:'received'}", "function purchaseStatus(x){const v=String(x?.status||'');return ['to_forwarder','to_me','at_warehouse','received'].includes(v)?v:'received'}", count=1, label='purchaseStatus')

          # 2) Visual treatment for the holding stage.
          rep(".purchase-card.to-me{border-left:4px solid #7c3aed}.purchase-card.received{background:#f1f2f3}", ".purchase-card.to-me{border-left:4px solid #7c3aed}.purchase-card.at-warehouse{border-left:4px solid #0f766e;background:#f0fdfa}.purchase-card.received{background:#f1f2f3}", count=1, label='purchase card css')
          rep(".badge.purple{background:#eee7ff;color:#5b21b6}", ".badge.purple{background:#eee7ff;color:#5b21b6}.badge.teal{background:#ccfbf1;color:#115e59}", count=1, label='purchase badge css')

          # 3) Add a clickable warehouse-holding KPI and clarify final release metric.
          old_metrics='<button id="purchaseFilterToForwarder" type="button" class="card purchase-filter-card" onclick="setPurchaseStatusFilter(\'to_forwarder\')"><div class="label">Едет на склад</div><div class="num" id="pToForwarder">0 шт.</div></button><button id="purchaseFilterToMe" type="button" class="card purchase-filter-card" onclick="setPurchaseStatusFilter(\'to_me\')"><div class="label">Едет ко мне</div><div class="num" id="pToMe">0 шт.</div></button><div class="card"><div class="label">В пути, вложено в товар</div><div class="num" id="pInTransitValue">0 ₸</div></div><div class="card"><div class="label">Приехало за 30 дней</div><div class="num" id="pReceived30">0 шт.</div></div>'
          new_metrics='<button id="purchaseFilterToForwarder" type="button" class="card purchase-filter-card" onclick="setPurchaseStatusFilter(\'to_forwarder\')"><div class="label">Едет на склад</div><div class="num" id="pToForwarder">0 шт.</div></button><button id="purchaseFilterToMe" type="button" class="card purchase-filter-card" onclick="setPurchaseStatusFilter(\'to_me\')"><div class="label">Едет ко мне</div><div class="num" id="pToMe">0 шт.</div></button><button id="purchaseFilterAtWarehouse" type="button" class="card purchase-filter-card" onclick="setPurchaseStatusFilter(\'at_warehouse\')"><div class="label">Поступило на склад</div><div class="num" id="pAtWarehouse">0 шт.</div></button><div class="card"><div class="label">В пути, вложено в товар</div><div class="num" id="pInTransitValue">0 ₸</div></div><div class="card"><div class="label">Введено в продажу за 30 дней</div><div class="num" id="pReceived30">0 шт.</div></div>'
          rep(old_metrics,new_metrics,count=1,label='purchase metrics html')

          # 4) Filter supports the new state.
          rep("function setPurchaseStatusFilter(status){const next=['to_forwarder','to_me'].includes(String(status))?String(status):'all';", "function setPurchaseStatusFilter(status){const next=['to_forwarder','to_me','at_warehouse'].includes(String(status))?String(status):'all';", count=1, label='purchase status filter')

          # 5) Shipment grouping tracks warehouse arrival separately from sale release.
          old_group="function purchaseShipmentGroups(){const map=new Map();for(const x of(state.purchases||[])){const key=String(x.shipmentId||x.id||'');if(!key)continue;let g=map.get(key);if(!g){g={key,rows:[],status:purchaseStatus(x),batch:x.batch||'',orderedAt:Number(x.orderedAt||x.date)||0,receivedAt:Number(x.receivedAt)||0,forwarderReceivedAt:Number(x.forwarderReceivedAt)||0};map.set(key,g)}g.rows.push(x);if(purchaseStatus(x)!=='received')g.status=purchaseStatus(x);const ox=Number(x.orderedAt||x.date)||0;if(!g.orderedAt||ox<g.orderedAt)g.orderedAt=ox;g.receivedAt=Math.max(g.receivedAt,Number(x.receivedAt)||0);g.forwarderReceivedAt=Math.max(g.forwarderReceivedAt,Number(x.forwarderReceivedAt)||0)}return [...map.values()].sort((a,b)=>(Number(b.receivedAt||b.forwarderReceivedAt||b.orderedAt)||0)-(Number(a.receivedAt||a.forwarderReceivedAt||a.orderedAt)||0))}"
          new_group="function purchaseShipmentGroups(){const map=new Map();for(const x of(state.purchases||[])){const key=String(x.shipmentId||x.id||'');if(!key)continue;let g=map.get(key);if(!g){g={key,rows:[],status:purchaseStatus(x),batch:x.batch||'',orderedAt:Number(x.orderedAt||x.date)||0,receivedAt:Number(x.receivedAt)||0,warehouseReceivedAt:Number(x.warehouseReceivedAt)||0,forwarderReceivedAt:Number(x.forwarderReceivedAt)||0};map.set(key,g)}g.rows.push(x);if(purchaseStatus(x)!=='received')g.status=purchaseStatus(x);const ox=Number(x.orderedAt||x.date)||0;if(!g.orderedAt||ox<g.orderedAt)g.orderedAt=ox;g.receivedAt=Math.max(g.receivedAt,Number(x.receivedAt)||0);g.warehouseReceivedAt=Math.max(g.warehouseReceivedAt,Number(x.warehouseReceivedAt)||0);g.forwarderReceivedAt=Math.max(g.forwarderReceivedAt,Number(x.forwarderReceivedAt)||0)}return [...map.values()].sort((a,b)=>(Number(b.receivedAt||b.warehouseReceivedAt||b.forwarderReceivedAt||b.orderedAt)||0)-(Number(a.receivedAt||a.warehouseReceivedAt||a.forwarderReceivedAt||a.orderedAt)||0))}"
          rep(old_group,new_group,count=1,label='shipment grouping')

          # 6) Recommendation text: at-warehouse stock is inbound but intentionally not sellable yet.
          rep("Свободно ${x.available} · в пути ${x.inbound} · продажи", "Свободно ${x.available} · заказано/ждёт продажи ${x.inbound} · продажи", count=1, label='purchase plan text')

          # 7) Replace purchase list renderer with four-stage lifecycle.
          new_render=r'''function renderPurchases(){
  const allGroups=purchaseShipmentGroups(),q=normalizeName(document.getElementById('purchaseSearch')?.value||''),searched=q?allGroups.filter(g=>normalizeName([g.batch,g.key].filter(Boolean).join(' ')).includes(q)):allGroups,groups=purchaseStatusFilter==='all'?searched:searched.filter(g=>g.status===purchaseStatusFilter),toForwarder=allGroups.filter(g=>g.status==='to_forwarder'),toMe=allGroups.filter(g=>g.status==='to_me'),atWarehouse=allGroups.filter(g=>g.status==='at_warehouse'),received=allGroups.filter(g=>g.status==='received'),sumQty=a=>a.reduce((n,g)=>n+purchaseShipmentTotals(g).qty,0),inTransit=[...toForwarder,...toMe],inTransitValue=inTransit.reduce((n,g)=>n+purchaseShipmentTotals(g).buy,0),deliveryDue=purchaseDeliveryDue(allGroups),since=reportPeriodStart(30),received30=received.filter(g=>Number(g.receivedAt)>=since);
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('pToForwarder',sumQty(toForwarder).toLocaleString('ru-RU')+' шт.');set('pToMe',sumQty(toMe).toLocaleString('ru-RU')+' шт.');set('pAtWarehouse',sumQty(atWarehouse).toLocaleString('ru-RU')+' шт.');set('pInTransitValue',fmt(inTransitValue));set('pDeliveryDue',fmt(deliveryDue));set('pReceived30',sumQty(received30).toLocaleString('ru-RU')+' шт.');renderPurchasePlan();
  const fw=document.getElementById('purchaseFilterToForwarder'),tm=document.getElementById('purchaseFilterToMe'),aw=document.getElementById('purchaseFilterAtWarehouse'),reset=document.getElementById('purchaseFilterReset');if(fw)fw.classList.toggle('active',purchaseStatusFilter==='to_forwarder');if(tm)tm.classList.toggle('active',purchaseStatusFilter==='to_me');if(aw)aw.classList.toggle('active',purchaseStatusFilter==='at_warehouse');if(reset)reset.classList.toggle('show',purchaseStatusFilter!=='all');
  const list=document.getElementById('purchaseList');if(!list)return;
  if(!allGroups.length){list.innerHTML='<div class="empty">Закупок пока нет</div>';return}
  if(!groups.length){purchasePage=1;const msg=purchaseStatusFilter==='to_forwarder'?'Поставок «Едет на склад» не найдено':purchaseStatusFilter==='to_me'?'Поставок «Едет ко мне» не найдено':purchaseStatusFilter==='at_warehouse'?'Поставок «Поступило на склад» не найдено':'Поставки по этому трек-коду не найдены';list.innerHTML='<div class="empty">'+msg+'</div>';return}
  const totalPages=Math.max(1,Math.ceil(groups.length/PURCHASE_PAGE_SIZE));
  purchasePage=Math.min(Math.max(1,purchasePage),totalPages);
  const pageGroups=groups.slice((purchasePage-1)*PURCHASE_PAGE_SIZE,purchasePage*PURCHASE_PAGE_SIZE);
  const cards=pageGroups.map(g=>{const t=purchaseShipmentTotals(g),status=g.status,label=status==='to_forwarder'?'Едет на склад':status==='to_me'?'Едет ко мне':status==='at_warehouse'?'Поступило на склад':'В продаже',badge=status==='to_me'?'purple':status==='at_warehouse'?'teal':status==='received'?'ok':'',date=status==='received'?g.receivedAt:status==='at_warehouse'?g.warehouseReceivedAt:status==='to_me'?g.forwarderReceivedAt:g.orderedAt,dateLabel=status==='received'?'В продажу с':status==='at_warehouse'?'На складе с':status==='to_me'?'Едет ко мне с':'Заказано',lines=g.rows.map(x=>{const qty=Number(x.qty)||0,buy=Number(x.buyTotal)||((Number(x.unitCost)||0)*qty),unitBuy=qty?buy/qty:0,withDelivery=Number(x.landedUnitCost)||(qty?(buy+(Number(x.delivery)||0))/qty:0);return `<div class="purchase-line"><div class="grow"><b>${esc(productNameById(x.productId,'—'))}</b><div class="muted">${qty} шт. · закуп ${fmt(unitBuy)}/шт.</div></div><div class="right"><div class="muted">с доставкой</div><b>${fmt(withDelivery)}/шт.</b></div></div>`}).join(''),key=encodeURIComponent(g.key),deliveryLabel=status==='to_me'?'доставка к оплате':'доставка',cardClass=status==='to_me'?'to-me':status==='at_warehouse'?'at-warehouse':status==='received'?'received':'to-forwarder';return `<div class="item purchase-card ${cardClass}" role="button" tabindex="0" onclick="openPurchaseShipment('${key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openPurchaseShipment('${key}')}"><div class="order-head"><div class="grow"><div class="name">${esc(g.batch||'Поставка')}</div><div class="muted">${dateLabel}: ${date?new Date(date).toLocaleDateString('ru-RU'):'—'} · ${g.rows.length} поз. · ${t.qty} шт.</div></div><span class="badge ${badge}">${label}</span></div><div class="muted" style="margin-top:7px">Закупка: ${fmt(t.buy)} · ${deliveryLabel}: ${fmt(t.delivery)} · всего: ${fmt(t.buy+t.delivery)}</div><div class="purchase-lines">${lines}</div></div>`}).join('');
  const pager=totalPages>1?`<div class="item" style="padding:10px"><div class="row" style="justify-content:space-between"><button class="btn" ${purchasePage<=1?'disabled':''} onclick="setPurchasePage(${purchasePage-1})">← Назад</button><div class="muted" style="text-align:center">Страница ${purchasePage} из ${totalPages}<br>${groups.length} поставок</div><button class="btn" ${purchasePage>=totalPages?'disabled':''} onclick="setPurchasePage(${purchasePage+1})">Вперёд →</button></div></div>`:'';
  list.innerHTML=cards+pager;
}'''
          sub_once(r"function renderPurchases\(\)\{.*?\n\}\nlet xlsxLoadPromise=", new_render+"\nlet xlsxLoadPromise=", 'renderPurchases')

          # 8) Shipment detail gains the new stage and manual release button.
          new_open=r'''function openPurchaseShipment(encodedKey){const rows=purchaseShipmentRows(encodedKey);if(!rows.length)return alert('Поставка не найдена');const first=rows[0],status=purchaseStatus(first),t=purchaseShipmentTotals({rows}),key=encodeURIComponent(String(first.shipmentId||first.id||'')),label=status==='to_forwarder'?'Едет на склад':status==='to_me'?'Едет ко мне':status==='at_warehouse'?'Поступило на склад':'В продаже',badge=status==='to_me'?'purple':status==='at_warehouse'?'teal':status==='received'?'ok':'',date=status==='received'?rows.reduce((a,x)=>Math.max(a,Number(x.receivedAt)||0),0):status==='at_warehouse'?rows.reduce((a,x)=>Math.max(a,Number(x.warehouseReceivedAt)||0),0):status==='to_me'?rows.reduce((a,x)=>Math.max(a,Number(x.forwarderReceivedAt)||0),0):Number(first.orderedAt||first.date)||0,dateLabel=status==='received'?'В продажу с':status==='at_warehouse'?'На складе с':status==='to_me'?'Едет ко мне с':'Заказано',lines=rows.map(x=>{const qty=Number(x.qty)||0,buy=Number(x.buyTotal)||((Number(x.unitCost)||0)*qty),unitBuy=qty?buy/qty:0,withDelivery=Number(x.landedUnitCost)||(qty?(buy+(Number(x.delivery)||0))/qty:0);return `<div class="purchase-line"><div class="grow"><b>${esc(productNameById(x.productId,'—'))}</b><div class="muted">${qty} шт. · закуп ${fmt(unitBuy)}/шт.</div></div><div class="right"><div class="muted">с доставкой</div><b>${fmt(withDelivery)}/шт.</b></div></div>`}).join(''),deliveryLabel=status==='to_me'?'доставка к оплате':'доставка',edit=status!=='received'?`<button class="btn full" onclick="openEditPurchaseShipment('${key}')">Редактировать поставку</button>`:'<div class="link-note">Поставка уже введена в продажу: остаток и FIFO зафиксированы. Изменение количества отключено.</div>',holding=status==='at_warehouse'?'<div class="link-note"><b>Товар физически на складе, но ещё не продаётся.</b><br>Он учитывается как ожидающая партия и не добавлен в свободный остаток, FIFO и остатки маркетплейсов.</div>':'',action=status==='to_forwarder'?`<button class="btn dark full" onclick="advancePurchaseShipment('${key}')">Приехал на склад доставщика</button>`:status==='to_me'?`<button class="btn dark full" onclick="openReceivePurchaseShipment('${key}')">Отметить: поступило на склад</button>`:status==='at_warehouse'?`<button class="btn dark full" onclick="releasePurchaseShipment('${key}')">Ввести в продажу</button>`:'';showSheet(`<h3>${esc(first.batch||'Поставка')}</h3><div class="item"><div class="order-head"><div class="grow"><div class="muted">${dateLabel}: ${date?new Date(date).toLocaleDateString('ru-RU'):'—'}</div><div class="muted" style="margin-top:4px">${rows.length} поз. · ${t.qty} шт.</div></div><span class="badge ${badge}">${label}</span></div><div class="muted" style="margin-top:9px">Закупка: ${fmt(t.buy)} · ${deliveryLabel}: ${fmt(t.delivery)} · всего: ${fmt(t.buy+t.delivery)}</div><div class="purchase-lines">${lines}</div></div>${holding}${edit}${action}`)}'''
          sub_once(r"function openPurchaseShipment\(encodedKey\)\{.*?\}\nfunction openEditPurchaseShipment", new_open+"\nfunction openEditPurchaseShipment", 'openPurchaseShipment')

          # 9) Editing remains available while the batch is physically held, because this is when quantity can be checked.
          rep("if(rows.some(x=>purchaseStatus(x)==='received'))return alert('Приехавшую поставку нельзя менять здесь: она уже вошла в склад и FIFO.');", "if(rows.some(x=>purchaseStatus(x)==='received'))return alert('Поставку в продаже нельзя менять здесь: она уже вошла в остаток и FIFO.');", count=1, label='edit guard text')
          rep("Пока поставка не приехала, склад и FIFO не меняются.", "Пока поставка не введена в продажу, свободный остаток и FIFO не меняются.", count=1, label='edit hint')
          rep("if(oldRows.some(x=>purchaseStatus(x)==='received'))return alert('Приехавшую поставку редактировать нельзя.');", "if(oldRows.some(x=>purchaseStatus(x)==='received'))return alert('Поставку в продаже редактировать нельзя.');", count=1, label='save edit guard')

          # Preserve the warehouse-received stage and its landed cost when editing after physical receipt.
          old_save="const valid=purchaseDraftCosts(draft,totalBuy,totalDelivery),first=oldRows[0],shipmentId=String(first.shipmentId||first.id||''),status=purchaseStatus(first),forwarderReceivedAt=oldRows.reduce((a,x)=>Math.max(a,Number(x.forwarderReceivedAt)||0),0),label=batch||('Китай '+new Date(orderedAt).toLocaleDateString('ru-RU')),oldByProduct=new Map(oldRows.map(x=>[String(x.productId),x])),updated=valid.map(x=>{const old=oldByProduct.get(String(x.productId));return {...(old||{}),id:old?.id||id(),shipmentId,status,productId:x.productId,qty:x.qty,remainingQty:0,buyTotal:x.buyTotal,unitCost:x.unitCost,delivery:x.deliveryShare,landedUnitCost:0,batch:label,orderedAt,date:orderedAt,receivedAt:0,createdAt:Number(old?.createdAt)||Date.now(),forwarderReceivedAt:status==='to_me'?forwarderReceivedAt:0,shipmentPurchaseTotal:totalBuy,shipmentDeliveryTotal:totalDelivery}})"
          new_save="const valid=purchaseDraftCosts(draft,totalBuy,totalDelivery),first=oldRows[0],shipmentId=String(first.shipmentId||first.id||''),status=purchaseStatus(first),forwarderReceivedAt=oldRows.reduce((a,x)=>Math.max(a,Number(x.forwarderReceivedAt)||0),0),warehouseReceivedAt=oldRows.reduce((a,x)=>Math.max(a,Number(x.warehouseReceivedAt)||0),0),label=batch||('Китай '+new Date(orderedAt).toLocaleDateString('ru-RU')),oldByProduct=new Map(oldRows.map(x=>[String(x.productId),x])),updated=valid.map(x=>{const old=oldByProduct.get(String(x.productId));return {...(old||{}),id:old?.id||id(),shipmentId,status,productId:x.productId,qty:x.qty,remainingQty:0,buyTotal:x.buyTotal,unitCost:x.unitCost,delivery:x.deliveryShare,landedUnitCost:status==='at_warehouse'?x.landedUnitCost:0,batch:label,orderedAt,date:orderedAt,receivedAt:0,warehouseReceivedAt:status==='at_warehouse'?warehouseReceivedAt:0,createdAt:Number(old?.createdAt)||Date.now(),forwarderReceivedAt:['to_me','at_warehouse'].includes(status)?forwarderReceivedAt:0,shipmentPurchaseTotal:totalBuy,shipmentDeliveryTotal:totalDelivery}})"
          rep(old_save,new_save,count=1,label='edit stage preservation')

          # 10) Physical receipt now finalizes delivery/cost only; it does NOT change sellable stock.
          new_receive=r'''function openReceivePurchaseShipment(encodedKey){const rows=purchaseShipmentRows(encodedKey);if(!rows.length)return alert('Поставка не найдена');if(!rows.every(x=>purchaseStatus(x)==='to_me'))return alert('Поступление на склад можно отметить только для поставки в статусе «Едет ко мне».');const g={rows},t=purchaseShipmentTotals(g),key=encodeURIComponent(String(rows[0].shipmentId||rows[0].id||'')),deliveryValue=Math.round(t.delivery*100)/100;showSheet(`<h3>Поступило на склад</h3><div class="item"><b>${esc(rows[0].batch||'Поставка')}</b><div class="muted">${rows.length} поз. · ${t.qty} шт. · закупка ${fmt(t.buy)} · доставка ${fmt(t.delivery)}</div></div><div class="field"><label>Дата поступления</label><input id="receivePurchaseDate" type="date" value="${localDateInputValue()}"></div><div class="field"><label>Фактическая доставка всей поставки ₸</label><input id="receivePurchaseDelivery" type="number" min="0" value="${deliveryValue}"></div><div class="link-note">После подтверждения партия будет отмечена как «Поступило на склад». Себестоимость с доставкой зафиксируется, но товар <b>не попадёт в свободный остаток, FIFO и остатки маркетплейсов</b>. После пересчёта и проверки отдельно нажмите «Ввести в продажу».</div><button class="btn dark full" onclick="receivePurchaseShipment('${key}')">Поступило на склад</button>`)}
function receivePurchaseShipment(encodedKey){const rows=purchaseShipmentRows(encodedKey);if(!rows.length)return alert('Поставка не найдена');if(!rows.every(x=>purchaseStatus(x)==='to_me'))return alert('Поставка уже поступила на склад или ещё не передана доставщиком.');const warehouseReceivedAt=localDateStart(document.getElementById('receivePurchaseDate')?.value),delivery=Math.max(0,Number(document.getElementById('receivePurchaseDelivery')?.value)||0),totalQty=rows.reduce((a,x)=>a+(Number(x.qty)||0),0),totalBuy=rows.reduce((a,x)=>a+(Number(x.buyTotal)||((Number(x.unitCost)||0)*(Number(x.qty)||0))),0),base=totalBuy>0?totalBuy:totalQty;if(!totalQty)return alert('В поставке нет количества');for(const x of rows){const qty=Math.max(0,Number(x.qty)||0);if(!qty)continue;const buy=Number(x.buyTotal)||((Number(x.unitCost)||0)*qty),weight=totalBuy>0?buy:qty,deliveryShare=base>0?delivery*(weight/base):0,unitCost=qty?buy/qty:0,landedUnitCost=qty?(buy+deliveryShare)/qty:0;x.status='at_warehouse';x.warehouseReceivedAt=warehouseReceivedAt;x.receivedAt=0;x.remainingQty=0;x.unitCost=unitCost;x.delivery=deliveryShare;x.landedUnitCost=landedUnitCost;x.shipmentPurchaseTotal=totalBuy;x.shipmentDeliveryTotal=delivery}save();closeModal();render();alert('Поставка отмечена «Поступило на склад». В продажу и остатки маркетплейсов она пока не добавлена.')}
function releasePurchaseShipment(encodedKey){const rows=purchaseShipmentRows(encodedKey);if(!rows.length)return alert('Поставка не найдена');if(!rows.every(x=>purchaseStatus(x)==='at_warehouse'))return alert('В продажу можно ввести только поставку со статусом «Поступило на склад».');const total=rows.reduce((a,x)=>a+Math.max(0,Number(x.qty)||0),0);if(!total)return alert('В поставке нет количества');if(!confirm(`Ввести эту поставку в продажу?\n\n${total} шт. будут добавлены в свободный остаток и FIFO, после чего новые остатки смогут уйти на маркетплейсы.`))return;const releasedAt=Date.now();for(const x of rows){const p=prod(x.productId),qty=Math.max(0,Number(x.qty)||0);if(!p||!qty)continue;x.status='received';x.receivedAt=releasedAt;x.remainingQty=qty;p.stock=(Number(p.stock)||0)+qty;refreshProductAverageCost(p);log('приход',p.id,qty,`в продажу · поставка ${x.batch||x.shipmentId} · себестоимость ${fmt(Number(x.landedUnitCost)||Number(x.unitCost)||0)}/шт.`)}save();closeModal();render();alert('Поставка введена в продажу. Товар добавлен в свободный остаток и FIFO.')}'''
          sub_once(r"function openReceivePurchaseShipment\(encodedKey\)\{.*?\nfunction saleForm\(\)", new_receive+"\nfunction saleForm()", 'receive/release lifecycle')

          # 11) Validate feature markers and JS syntax.
          markers=[
              "'at_warehouse'",
              'id="purchaseFilterAtWarehouse"',
              'id="pAtWarehouse"',
              "status==='at_warehouse'?\'Поступило на склад\'",
              "x.status='at_warehouse'",
              'function releasePurchaseShipment(encodedKey)',
              'Товар физически на складе, но ещё не продаётся.',
              'не попадёт в свободный остаток, FIFO и остатки маркетплейсов'
          ]
          for marker in markers:
              if marker not in s:
                  raise SystemExit('missing feature marker: '+marker)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I)
          if not scripts: raise SystemExit('no scripts found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Hold arrived purchases before sale release'
          git push origin HEAD:main
