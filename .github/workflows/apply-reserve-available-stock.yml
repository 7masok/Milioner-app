name: Apply reserve available stock UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-reserve-available-stock.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Patch reserve UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if not (s.startswith('<!doctype html>') and s.rstrip().endswith('</html>')):
              raise SystemExit('full current index.html read failed')

          def replace_once(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          replace_once(
              '.product-stock-metrics{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:12px}',
              '.product-stock-metrics{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}',
              'product metric grid'
          )

          old_metrics='''<section id="products" class="view"><div class="metrics product-stock-metrics"><div class="card"><div class="label">Остаток склада</div><div class="num" id="productStockQty">0 шт.</div></div><div class="card"><div class="label">Себестоимость остатка</div><div class="num" id="productStockCost">0 ₸</div></div><div class="card"><div class="label">Прибыль с остатка</div><div class="num" id="productStockProfit">0 ₸</div></div></div>'''
          new_metrics='''<section id="products" class="view"><div class="metrics product-stock-metrics"><div class="card"><div class="label">Доступно к продаже</div><div class="num" id="productStockQty">0 шт.</div></div><div class="card"><div class="label">В резерве</div><div class="num" id="productReservedQty">0 шт.</div></div><div class="card"><div class="label">Себестоимость остатка</div><div class="num" id="productStockCost">0 ₸</div></div><div class="card"><div class="label">Прибыль с остатка</div><div class="num" id="productStockProfit">0 ₸</div></div></div>'''
          replace_once(old_metrics,new_metrics,'product metrics html')

          replace_once(
              'stockMap.set(String(p.id),productDisplayStock(p))',
              'stockMap.set(String(p.id),productAvailableStock(p))',
              'available stock map'
          )

          replace_once(
              "function stockTotal(){return stockProducts().reduce((a,p)=>a+(Number(p.stock)||0),0)}",
              "function stockTotal(){return stockProducts().reduce((a,p)=>a+(Number(p.stock)||0),0)}\nfunction reservedStockTotal(){return stockProducts().reduce((a,p)=>a+Math.min(Math.max(0,Number(p.stock)||0),Math.max(0,reserved(p))),0)}\nfunction availableStockTotal(){return stockProducts().reduce((a,p)=>a+productAvailableStock(p),0)}",
              'stock totals helpers'
          )

          replace_once(
              "stockQty=document.getElementById('productStockQty'),stockCost=document.getElementById('productStockCost')",
              "stockQty=document.getElementById('productStockQty'),reservedQty=document.getElementById('productReservedQty'),stockCost=document.getElementById('productStockCost')",
              'reserve metric binding'
          )

          replace_once(
              "if(stockQty)stockQty.textContent=stockTotal().toLocaleString('ru-RU')+' шт.';if(stockCost)",
              "if(stockQty)stockQty.textContent=availableStockTotal().toLocaleString('ru-RU')+' шт.';if(reservedQty)reservedQty.textContent=reservedStockTotal().toLocaleString('ru-RU')+' шт.';if(stockCost)",
              'reserve metric render'
          )

          replace_once(
              'stock=productDisplayStock(p)){const kind=isBundleProduct(p)?\'Набор · \':\'\';return `',
              'stock=productAvailableStock(p)){const kind=isBundleProduct(p)?\'Набор · \':\'\',r=reserved(p),physical=isBundleProduct(p)?stock:(Number(p.stock)||0);return `',
              'product card stock variables'
          )

          replace_once(
              '<div class="muted">Продажи/день за 25 дней: ${d.toFixed(1)} · Запас: ${d?(stock/d).toFixed(1):\'∞\'} дн.</div><div class="muted">Средняя прибыль/шт. за всё время:',
              '<div class="muted">Продажи/день за 25 дней: ${d.toFixed(1)} · Запас: ${d?(stock/d).toFixed(1):\'∞\'} дн.</div>${r>0?`<div class="muted" style="color:#8a5300">Резерв: ${r} шт. · физически: ${physical} шт.</div>`:\'\'}<div class="muted">Средняя прибыль/шт. за всё время:',
              'product card reserve line'
          )

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          markers=[
            'id="productReservedQty"',
            'function reservedStockTotal()',
            'function availableStockTotal()',
            'stockMap.set(String(p.id),productAvailableStock(p))',
            'Резерв: ${r} шт. · физически: ${physical} шт.',
            "stock=productAvailableStock(p)"
          ]
          for marker in markers:
              if marker not in h: raise SystemExit('missing '+marker)
          scripts=re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I)
          if not scripts: raise SystemExit('no script blocks')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Show reserved stock as unavailable'
          git push origin HEAD:main
