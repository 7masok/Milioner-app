name: Apply warehouse core upgrade

on:
  push:
    branches: [main]
    paths:
      - 'tools/warehouse_core_upgrade.py'
      - '.github/workflows/apply-warehouse-core.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded upgrade
        run: python tools/warehouse_core_upgrade.py

      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Verify warehouse core markers
        run: |
          grep -q 'id="pcost"' index.html
          grep -q 'id="ecost"' index.html
          grep -q 'function financialSales()' index.html
          grep -q 'id="sfee"' index.html
          if grep -q 'recalcCostAfterLoss' index.html; then
            echo 'Legacy writeoff cost recalculation remains' >&2
            exit 1
          fi

      - name: Commit upgraded app
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make warehouse costing and profit usable'
          git push origin main
