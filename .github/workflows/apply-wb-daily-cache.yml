name: Apply WB daily cache
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-wb-daily-cache.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/millioner-api/src/fixed.js')
          s=p.read_text(encoding='utf-8')
          imp="import { wbDashboardBuyoutsEndpoint as wbDashboardBuyoutsCachedEndpoint, syncWbDashboardDailyCache } from './wb-daily-cache.js';\n"
          if imp not in s:
              s=s.replace("import base from './index.js';\n", "import base from './index.js';\n"+imp, 1)
          s=s.replace("return wbDashboardBuyoutsEndpoint(request,env,url);", "return wbDashboardBuyoutsCachedEndpoint(request,env,url);", 1)
          old="""          try { await syncWbRealizedTracker(env, market); }
          catch (e) { console.warn('WB realized status tracker', market, String(e?.message || e)); }"""
          if 'syncWbDashboardDailyCache(env, market);' not in s:
              s=s.replace(old, old+"""
          try { await syncWbDashboardDailyCache(env, market); }
          catch (e) { console.warn('WB dashboard daily cache', market, String(e?.message || e)); }""", 1)
          p.write_text(s,encoding='utf-8')
          h=Path('index.html')
          t=h.read_text(encoding='utf-8').replace('if(dashboard?.ok&&dashboard?.available){','if(dashboard?.ok){',1)
          t=t.replace("source:'WB Analytics · выкупы по дням'","source:'WB Analytics · дневной кэш D1'",1)
          h.write_text(t,encoding='utf-8')
          PY
          node --check cloudflare/millioner-api/src/wb-daily-cache.js
          node --check cloudflare/millioner-api/src/fixed.js
          git diff --check
      - name: Commit
        run: |
          git config user.name millioner-maintenance
          git config user.email actions@users.noreply.github.com
          git add cloudflare/millioner-api/src/fixed.js index.html
          git commit -m 'Read WB periods from daily D1 cache'
          git push origin HEAD:main
