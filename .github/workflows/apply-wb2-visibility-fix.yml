name: Apply WB2 visibility fix
on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_wb2_visibility.py'
      - '.github/workflows/apply-wb2-visibility-fix.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Limit patch to WB2 status and order visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/fix_wb2_visibility.py')
          s=p.read_text(encoding='utf-8')
          marker='# Product WB2 linkage must be editable and searchable.'
          if marker in s:
              s=s.split(marker,1)[0]+"\np.write_text(s,encoding='utf-8')\n"
          p.write_text(s,encoding='utf-8')
          PY
      - name: Patch current index
        run: python tools/fix_wb2_visibility.py
      - name: Validate browser code and WB2 UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          for marker in ['Wildberries 1 API','Wildberries 2 API','id="wb2ApiBadge"','id="wb2ApiStatus"','id="dotWb2"',"checkMarketStatus('WB2')","refreshWbFromServer('WB2')",'function renderWbIntegration(']:
              if marker not in html: raise SystemExit('missing '+marker)
          PY
          node --check /tmp/app.js
          git diff --check
      - name: Commit index only
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Show and diagnose second Wildberries account'
          git push origin HEAD:main
