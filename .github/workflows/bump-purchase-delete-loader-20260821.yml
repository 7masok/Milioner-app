name: Bump purchase delete loader
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-purchase-delete-loader-20260821.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader and remove one-time workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./kaspi-ads-v2.js?v=20260815b'
          new='./kaspi-ads-v2.js?v=20260821-purchase-delete'
          if old not in s and new not in s:
              raise SystemExit('expected kaspi-ads loader not found')
          if old in s:
              p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/bump-purchase-delete-loader-20260821.yml
          git config user.name 'millioner-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git commit -m 'Reload purchase deletion controls'
          git push origin HEAD:main
