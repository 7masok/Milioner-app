name: Reload permanent stock alert dismiss
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-stock-alert-dismiss-20260821.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump stock-alert loader cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          import re
          ns,n=re.subn(r'kaspi-ads-v2\.js\?v=[^"\']+', 'kaspi-ads-v2.js?v=20260821-0142', s, count=1)
          if n!=1:
              raise SystemExit('kaspi-ads-v2 loader not found')
          p.write_text(ns)
          PY
      - name: Commit cache bust
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Reload permanent stock alert dismiss'
          git push
