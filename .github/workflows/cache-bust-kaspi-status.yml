name: One-time Kaspi status cache refresh

on:
  push:
    paths:
      - '.github/workflows/cache-bust-kaspi-status.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh loader and remove one-time workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./kaspi-ads-v2.js?v=20260821-1124'
          new='./kaspi-ads-v2.js?v=20260821-1545'
          if old not in s:
              raise SystemExit('expected loader version not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/cache-bust-kaspi-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/cache-bust-kaspi-status.yml
          git commit -m 'Reload Kaspi status fixes'
          git push
