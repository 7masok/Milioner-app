name: Check WB daily cache
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-wb-daily-cache.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 60
      - run: curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-dashboard-buyouts?market=WB&days=-1'
