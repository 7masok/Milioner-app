name: Check WB live sales
on:
  push:
    paths: ['.github/workflows/check-wb-sales-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 yesterday raw
        run: |
          curl -sS -D /tmp/headers 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=-1' -o /tmp/body || true
          cat /tmp/headers
          echo BODY
          cat /tmp/body
