name: Check WB live sales
on:
  push:
    paths: ['.github/workflows/check-wb-sales-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Market status
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/market-status' | jq .
      - name: WB1 realized-sales cache today
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=1' | jq .
      - name: WB1 realized-sales cache yesterday
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=-1' | jq .
      - name: WB2 realized-sales cache today
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB2&days=1' | jq .
      - name: WB2 realized-sales cache yesterday
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB2&days=-1' | jq .
