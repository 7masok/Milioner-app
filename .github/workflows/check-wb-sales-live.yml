name: Check WB live sales
on:
  push:
    paths: ['.github/workflows/check-wb-sales-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 90
      - name: WB1 refresh dashboard buyouts once
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB&days=1&refresh=1' | jq '{ok,available,market,status,period,buyoutCount,buyoutSum,itemCount,updatedAt,lastError,products:(.products|length),sample:(.products[:5])}'
      - run: sleep 25
      - name: WB2 refresh dashboard buyouts once
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB2&days=1&refresh=1' | jq '{ok,available,market,status,period,buyoutCount,buyoutSum,itemCount,updatedAt,lastError,products:(.products|length),sample:(.products[:5])}'
