name: Check WB live sales
on:
  push:
    paths: ['.github/workflows/check-wb-sales-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Market status
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/market-status' | jq '{markets:[.markets[]|select(.market=="WB" or .market=="WB2")|{market,ok:.latest.ok,items:.latest.items,error:.latest.error,lastSuccessAt,orderLines}]}'
      - name: WB1 yesterday final
        run: curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=-1' | jq '{ok,error,source,currency,sales,returns,netQty,buyoutCount,buyoutSum,forPay,pricedRows,products:(.products|length),sumProductQty:([.products[].qty]|add // 0),sample:(.products[:8]|map({vendorCode,productId,qty,buyoutSum,forPay,priceLinked}))}'
      - name: WB1 today final
        run: curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=1' | jq '{ok,error,source,currency,sales,returns,netQty,buyoutCount,buyoutSum,forPay,pricedRows,products:(.products|length),sumProductQty:([.products[].qty]|add // 0)}'
