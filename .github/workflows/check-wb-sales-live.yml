name: Check WB live sales
on:
  push:
    paths: ['.github/workflows/check-wb-sales-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 yesterday values
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=-1' | jq '{sales,returns,netQty,buyoutSum,forPay,products:(.products[:12] | map({vendorCode,nmId,productId,qty,finishedPrice,priceWithDisc,forPay,buyoutSum}))}'
      - name: WB1 today values
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=1' | jq '{sales,returns,netQty,buyoutSum,forPay,products:(.products[:12] | map({vendorCode,nmId,productId,qty,finishedPrice,priceWithDisc,forPay,buyoutSum}))}'
