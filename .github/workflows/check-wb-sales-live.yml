name: Check WB live sales
on:
  push:
    paths: ['.github/workflows/check-wb-sales-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 20
      - name: WB1 today
        run: curl -fsSL --retry 5 --retry-delay 3 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=1' | jq .
      - name: WB2 today
        run: curl -fsSL --retry 5 --retry-delay 3 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB2&days=1' | jq .
