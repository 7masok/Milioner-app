name: Check WB live sales
on:
  push:
    paths: ['.github/workflows/check-wb-sales-live.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 cache today
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB&days=1' | jq .
      - name: WB1 cache yesterday
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB&days=-1' | jq .
      - name: WB2 cache today
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB2&days=1' | jq .
      - name: WB2 cache yesterday
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB2&days=-1' | jq .
