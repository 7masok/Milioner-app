name: Clarify product card
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clarify-product-card.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Read full current index and clarify product card
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if not (s.startswith('<!doctype html>') and s.rstrip().endswith('</html>')):
              raise SystemExit('full current index.html read failed')
          old="""function openProduct(pid){let p=prod(pid),r=reserved(p),profit=profitForProduct(p),value=(Number(p.stock)||0)*(Number(p.cost)||0);let s=`<h3>${esc(p.name)}</h3><div class=\"item\"><div class=\"row\"><div class=\"grow\"><b>Остаток</b><div class=\"muted\">Резерв: ${r} · Свободно: ${p.stock-r}</div></div><b>${p.stock} шт.</b></div><div class=\"muted\" style=\"margin-top:7px\">Себестоимость: ${fmt(p.cost)} / шт. · Стоимость остатка: ${fmt(value)} · Прибыль 30д: ${fmt(profit)}</div></div><div class=\"item\" style=\"margin-top:8px\"><b>Артикулы</b><div class=\"muted\">Kaspi: ${esc(p.kaspi||'—')} · WB1: ${esc(p.wb||'—')} · WB2: ${esc(p.wb2||'—')} · Ozon: ${esc(p.ozon||'—')}</div></div><button class=\"btn dark full\" onclick=\"closeModal();openModal('edit','${pid}')\">Редактировать товар</button><button class=\"btn full\" onclick=\"closeModal();openModal('writeoff','${pid}')\">Списать</button><button class=\"btn full\" onclick=\"closeModal();openModal('inventory','${pid}')\">Инвентаризация</button>`;showSheet(s)}"""
          new="""function openProduct(pid){let p=prod(pid),r=reserved(p),free=Math.max(0,(Number(p.stock)||0)-r),profit=profitForProduct(p),value=(Number(p.stock)||0)*(Number(p.cost)||0);let s=`<h3>${esc(p.name)}</h3><div class=\"item\"><b>Остаток товара</b><div class=\"kpi\" style=\"margin-top:10px\"><div><div class=\"label\">Всего на складе</div><div class=\"num\">${p.stock} шт.</div></div><div><div class=\"label\">Доступно к продаже</div><div class=\"num\">${free} шт.</div></div></div>${r?`<div class=\"link-note\" style=\"margin-top:10px\"><b>В резерве: ${r} шт.</b><br>Эти товары уже заняты активными заказами и не считаются свободными.</div>`:''}<div style=\"margin-top:12px\"><div class=\"muted\">Себестоимость 1 шт.</div><b>${fmt(p.cost)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">Стоимость всего остатка</div><b>${fmt(value)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">Прибыль за 30 дней</div><b>${fmt(profit)}</b></div></div><div class=\"item\" style=\"margin-top:8px\"><b>Артикулы маркетплейсов</b><div style=\"margin-top:9px;line-height:1.8\"><div><span class=\"muted\">Kaspi:</span> ${esc(p.kaspi||'—')}</div><div><span class=\"muted\">WB 1:</span> ${esc(p.wb||'—')}</div><div><span class=\"muted\">WB 2:</span> ${esc(p.wb2||'—')}</div><div><span class=\"muted\">Ozon:</span> ${esc(p.ozon||'—')}</div></div></div><button class=\"btn dark full\" onclick=\"closeModal();openModal('edit','${pid}')\">Редактировать товар</button><button class=\"btn full\" onclick=\"closeModal();openModal('writeoff','${pid}')\">Списать</button><button class=\"btn full\" onclick=\"closeModal();openModal('inventory','${pid}')\">Инвентаризация</button>`;showSheet(s)}"""
          n=s.count(old)
          if n!=1: raise SystemExit(f'openProduct exact match expected 1, got {n}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          for marker in ['Всего на складе','Доступно к продаже','В резерве: ${r} шт.','Артикулы маркетплейсов','WB 1:','WB 2:']:
              if marker not in h: raise SystemExit('missing '+marker)
          scripts=re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Clarify product stock and marketplace SKUs'
          git push origin HEAD:main
