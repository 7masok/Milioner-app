name: Compact marketplace status UI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compact-market-status-ui.yml'

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch compact marketplace indicators
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          old = '<div class="sync"><span id="dotKaspi" class="dot warn"></span>Kaspi · последняя синхронизация: <span id="lastSync">—</span> · облако: <span id="cloudStatus">подключение…</span> · WB: <span id="wbStockStatus">—</span></div>'
          new = '''<div class="sync sync-compact" id="marketSyncCompact">
    <div class="cloud-compact"><span class="cloud-label">Облако</span><span id="cloudStatus">…</span></div>
    <div class="market-sync-stack">
      <button class="market-sync-row" id="kaspiStatusRow" type="button"><span id="dotKaspi" class="dot warn"></span><b>Kaspi</b><span id="lastSync" class="market-sync-time">—</span></button>
      <button class="market-sync-row" id="wb1StatusRow" type="button"><span id="dotWB1" class="dot off"></span><b>WB1</b><span id="wb1Sync" class="market-sync-time">—</span></button>
      <button class="market-sync-row" id="wb2StatusRow" type="button"><span id="dotWB2" class="dot off"></span><b>WB2</b><span id="wb2Sync" class="market-sync-time">—</span></button>
    </div>
    <span id="dotWB" class="dot off" style="display:none"></span><span id="wbStockStatus" style="display:none">—</span>
  </div>'''
          if old in html:
              html = html.replace(old, new, 1)
          elif 'id="marketSyncCompact"' not in html:
              raise SystemExit('Expected legacy sync header was not found')

          style = '''
.sync-compact{margin-top:7px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.cloud-compact{display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0;padding-top:2px}.cloud-label{color:var(--muted)}#cloudStatus{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:135px}
.market-sync-stack{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:128px}.market-sync-row{appearance:none;border:0;background:transparent;padding:1px 0;color:var(--muted);display:grid;grid-template-columns:11px 38px auto;align-items:center;gap:3px;font-size:11px;line-height:1.35;text-align:left;white-space:nowrap}.market-sync-row b{color:var(--text);font-size:11px}.market-sync-time{font-variant-numeric:tabular-nums;color:var(--muted)}.market-sync-row .dot{margin:0;width:7px;height:7px}.market-sync-row:active{opacity:.65}
@media(max-width:380px){.sync-compact{gap:7px}.cloud-compact{font-size:11px}#cloudStatus{max-width:105px}.market-sync-stack{min-width:116px}.market-sync-row{grid-template-columns:10px 34px auto;font-size:10px}.market-sync-row b{font-size:10px}}
'''
          if '.market-sync-stack{' not in html:
              html = html.replace('</style>', style + '\n</style>', 1)

          html = re.sub(r'src=["\']cloud-sync-v3\.js(?:\?[^"\']*)?["\']', 'src="cloud-sync-v3.js?v=20260820-1022"', html)
          index.write_text(html, encoding='utf-8')

          js_path = Path('cloud-sync-v3.js')
          js = js_path.read_text(encoding='utf-8')
          marker = '/* compact-market-status-ui-v1 */'
          addon = r'''

/* compact-market-status-ui-v1 */
(function(){
'use strict';
function fmtSync(ts){
  const value=Number(ts)||0;if(!value)return '—';
  const d=new Date(value),now=new Date(),time=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const same=d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
  const y=new Date(now);y.setDate(now.getDate()-1);
  const yesterday=d.getFullYear()===y.getFullYear()&&d.getMonth()===y.getMonth()&&d.getDate()===y.getDate();
  return same?time:(yesterday?'вчера '+time:d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+time);
}
function oneHealth(name){
  const item=state?.settings?.serverMarketStatus?.[name]||{},last=Number(item.lastSuccessAt||0),latest=item.latest||null,age=last?Date.now()-last:Infinity;
  const failed=latest&&Number(latest.ok)!==1&&Number(latest.finished_at||0)>0&&Number(latest.started_at||0)>=last;
  if(failed)return {cls:'bad',label:'ошибка',last,latest};
  if(age<=10*60*1000)return {cls:'',label:'есть связь',last,latest};
  if(age<=30*60*1000)return {cls:'warn',label:'задержка',last,latest};
  if(last)return {cls:'bad',label:'нет свежей связи',last,latest};
  return {cls:'off',label:'нет данных',last,latest};
}
function paint(name,dotId,timeId){
  const h=oneHealth(name),dot=document.getElementById(dotId),time=document.getElementById(timeId);
  if(dot){dot.className='dot'+(h.cls?' '+h.cls:'');dot.title=(name==='WB'?'WB1':name)+': '+h.label;}
  if(time)time.textContent=fmtSync(h.last);
  return h;
}
function compactCloud(){
  const el=document.getElementById('cloudStatus');if(!el)return;
  const raw=String(el.textContent||'').trim().toLowerCase();let short='';
  if(/сохраня|отправля/.test(raw))short='сохранение…';
  else if(/подключ|сохранено|обновлено|сервер подключён/.test(raw))short='онлайн';
  else if(/загружа|проверя|подключение/.test(raw))short='…';
  else if(/ошиб|нет связи|недоступ/.test(raw))short='ошибка';
  if(short&&el.textContent!==short)el.textContent=short;
}
function refreshCompactMarketStatus(){
  paint('Kaspi','dotKaspi','lastSync');paint('WB','dotWB1','wb1Sync');paint('WB2','dotWB2','wb2Sync');compactCloud();
}
async function showWbOne(name){
  const label=name==='WB2'?'WB2':'WB1';let h=oneHealth(name),extra='';
  try{
    const r=await fetch(MILLIONER_API+'/api/wb-sync-status',{cache:'no-store',headers:{Accept:'application/json'}}),data=await r.json().catch(()=>({}));
    if(r.ok&&data?.ok){
      const latest=(data.latest||[]).find(x=>String(x.market)===name),newest=(data.newestOrders||[]).find(x=>String(x.market)===name);
      if(latest){h={...h,latest};extra+=`\nПоследняя попытка: ${Number(latest.ok)===1?'OK':'ОШИБКА'}`;if(latest.error)extra+=`\n${String(latest.error).slice(0,350)}`;}
      if(newest?.newest_order_at)extra+=`\nПоследний заказ: ${fmtSync(newest.newest_order_at)}`;
    }
  }catch(e){extra+='\nДиагностика недоступна';}
  alert(`${label}: ${h.label}\nПоследний успех: ${fmtSync(h.last)}${extra}`);
}
function bind(){
  const wb1=document.getElementById('wb1StatusRow'),wb2=document.getElementById('wb2StatusRow');
  if(wb1&&!wb1.dataset.bound){wb1.dataset.bound='1';wb1.addEventListener('click',()=>showWbOne('WB'));}
  if(wb2&&!wb2.dataset.bound){wb2.dataset.bound='1';wb2.addEventListener('click',()=>showWbOne('WB2'));}
  const cloud=document.getElementById('cloudStatus');if(cloud&&!cloud.dataset.compactObserver){cloud.dataset.compactObserver='1';new MutationObserver(()=>compactCloud()).observe(cloud,{childList:true,characterData:true,subtree:true});}
  refreshCompactMarketStatus();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();
window.addEventListener('load',()=>{bind();setTimeout(refreshCompactMarketStatus,500);setTimeout(refreshCompactMarketStatus,1800)});
setInterval(refreshCompactMarketStatus,15000);
})();
'''
          if marker not in js:
              js = js.rstrip() + addon + '\n'
              js_path.write_text(js, encoding='utf-8')
          PY

      - name: Commit patched UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cloud-sync-v3.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Compact marketplace sync indicators"
          git push origin HEAD:main
