name: Inspect WB dashboard buyouts response
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-wb-dashboard-buyouts-response.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Show response
        run: |
          curl -sS -D /tmp/h.txt 'https://millioner-api.7masok.workers.dev/api/wb-dashboard-buyouts?market=WB&days=-1' -o /tmp/b.txt || true
          cat /tmp/h.txt
          echo BODY
          cat /tmp/b.txt
