name: Trace WB dashboard buyout gap by order state
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-wb-dashboard-gap-orders.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect WB order API fields
        run: |
          set -euo pipefail
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/orders?market=WB&limit=1000' -o /tmp/orders.json
          python - <<'PY'
          import json,datetime
          d=json.load(open('/tmp/orders.json')); rows=d.get('orders') or []
          tz=datetime.timezone(datetime.timedelta(hours=5)); start=int(datetime.datetime(2026,8,12,tzinfo=tz).timestamp()*1000); end=int(datetime.datetime(2026,8,13,tzinfo=tz).timestamp()*1000)
          day=[x for x in rows if start<=int(x.get('creationDate') or 0)<end]
          print('TOP_KEYS',sorted(d.keys()))
          print('ROW_KEYS',sorted(day[0].keys()) if day else [])
          if day: print('FIRST_ROW',json.dumps(day[0],ensure_ascii=False,sort_keys=True))
          for key in ['raw','rawJson','raw_json','order','convertedPrice','convertedFinalPrice','finalPrice','price','currencyCode','convertedCurrencyCode']:
              vals=[x.get(key) for x in day if key in x]
              print('FIELD',key,'present',len(vals),'sample',vals[:2])
          PY
