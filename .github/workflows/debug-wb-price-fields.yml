name: Debug WB realized price fields
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-wb-price-fields.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check diagnostic endpoint
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/d.json -w '%{http_code}' 'https://millioner-api.7masok.workers.dev/api/wb-price-field-debug?market=WB&days=-1')
          echo HTTP=$code
          cat /tmp/d.json
          test "$code" = 200
