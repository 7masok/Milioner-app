name: Diagnose WB yesterday revenue gap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-wb-yesterday-gap.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sum sold orders created Aug 12
        run: |
          set -euo pipefail
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-sold-history-debug?market=WB' -o /tmp/sold.json
          python - <<'PY'
          import json,datetime
          d=json.load(open('/tmp/sold.json'))
          tz=datetime.timezone(datetime.timedelta(hours=5))
          start=datetime.datetime(2026,8,12,tzinfo=tz).timestamp()*1000
          end=datetime.datetime(2026,8,13,tzinfo=tz).timestamp()*1000
          rows=d.get('candidates') or []
          day=[]
          for x in rows:
              raw=x.get('createdAt') or ''
              try: t=datetime.datetime.fromisoformat(raw.replace('Z','+00:00')).timestamp()*1000
              except: t=0
              if start<=t<end: day.append(x)
          print('endpoint ok',d.get('ok'),'orders',d.get('orders'),'sold total',d.get('sold'),'candidate count',len(rows))
          print('AUG12_SOLD_COUNT',len(day))
          print('AUG12_SOLD_SUM',sum(float(x.get('price') or 0) for x in day))
          for x in day:
              print({k:x.get(k) for k in ['id','rid','article','nmId','createdAt','price']})
          PY
