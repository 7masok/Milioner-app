name: Diagnose WB yesterday revenue gap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-wb-yesterday-gap.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch live WB yesterday endpoints
        run: |
          set -euo pipefail
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=-1' -o /tmp/live.json
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-finance-summary?market=WB&days=-1' -o /tmp/finance.json || true
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-sales-direct?market=WB&days=-1&refresh=1' -o /tmp/direct.json || true
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-realized-status?market=WB&days=-1' -o /tmp/tracked.json || true
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB&days=-1&refresh=1' -o /tmp/analytics.json || true
          python - <<'PY'
          import json
          for name in ('live','finance','direct','tracked','analytics'):
              try:
                  d=json.load(open('/tmp/'+name+'.json'))
              except Exception as e:
                  print(name, 'ERROR', e); continue
              print('\n===',name,'===')
              for k in ['ok','available','market','days','sales','returns','netQty','buyoutCount','buyoutSum','forPay','retailAmount','rowCount','netBeforeCost','pricedRows','sourceRows','priceComplete','rawFinishedPriceSum','rawPriceWithDiscSum','rawForPaySum','updatedAt','lastSuccessAt','lastError','source','refreshOk','status']:
                  if k in d: print(k,':',d.get(k))
              if name=='live':
                  ps=d.get('products') or []
                  for f in ['finishedPriceRub','priceWithDiscRub','forPayRub','sellerGross','sellerForPay']:
                      print('sum '+f,':',sum(float(x.get(f) or 0) for x in ps))
          PY
