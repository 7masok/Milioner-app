name: Diagnose WB yesterday revenue gap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-wb-yesterday-gap.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect analytics cache
        run: |
          set -euo pipefail
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB&days=-1' -o /tmp/a.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/a.json'))
          for k in ['ok','available','market','days','period','buyoutCount','buyoutSum','itemCount','currency','source','updatedAt','lastError','refreshOk','status']:
              print(k,':',d.get(k))
          print('products_count:',len(d.get('products') or []))
          print('products:',json.dumps((d.get('products') or [])[:20],ensure_ascii=False))
          PY
