name: Deploy Millioner API

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/millioner-api/**'
      - '.github/workflows/deploy-millioner-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-millioner-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Worker syntax
        run: node --check cloudflare/millioner-api/src/index.js
      - name: Deploy Worker
        working-directory: cloudflare/millioner-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --keep-vars
