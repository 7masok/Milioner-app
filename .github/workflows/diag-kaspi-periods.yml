name: Diagnose Kaspi period totals
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-kaspi-periods.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Check public Millioner endpoints and Kaspi periods
        run: |
          set -e
          curl -fsSL --retry 4 --retry-delay 2 --max-time 25 'https://millioner-api.7masok.workers.dev/health' -o /tmp/health.json
          curl -fsSL --retry 4 --retry-delay 2 --max-time 25 'https://millioner-api.7masok.workers.dev/api/market-status' -o /tmp/market.json
          curl -fsSL --retry 4 --retry-delay 2 --max-time 25 'https://millioner-api.7masok.workers.dev/api/orders?market=Kaspi&limit=1000' -o /tmp/kaspi.json
          echo "HEALTH $(jq -c . /tmp/health.json)"
          echo "MARKET $(jq -c '[.markets[]|{market,configured,orderLines,lastSuccessAt,nextSyncAt,latest}]' /tmp/market.json)"
          python - <<'PY'
          import json, datetime, collections
          TZ=datetime.timezone(datetime.timedelta(hours=5))
          now=datetime.datetime.now(TZ)
          today=now.date()
          rows=(json.load(open('/tmp/kaspi.json',encoding='utf-8')).get('orders') or [])
          def ts(v):
              try:
                  x=float(v or 0)
                  if x<1e12: x*=1000
                  return datetime.datetime.fromtimestamp(x/1000,TZ)
              except: return None
          def stage(o):
              u=str(o.get('status') or '').upper(); st=str(o.get('state') or '').upper()
              if u in {'CANCELLED','CANCELLING','RETURNED','KASPI_DELIVERY_RETURN_REQUESTED'}: return 'cancelled'
              if u=='COMPLETED' or (u=='ACCEPTED_BY_MERCHANT' and st in {'KASPI_DELIVERY_TRANSIT','DELIVERY'}): return 'delivery'
              if u in {'ASSEMBLE','ACCEPTED_BY_MERCHANT'}: return 'transfer'
              return 'new'
          groups={}
          for o in rows:
              key=str(o.get('orderId') or o.get('code') or '')
              if not key: continue
              g=groups.setdefault(key,{'rows':[],'dt':None,'status':None,'state':None})
              d=ts(o.get('creationDate'))
              if d and (g['dt'] is None or d>=g['dt']):
                  g['dt']=d; g['status']=o.get('status'); g['state']=o.get('state')
              g['rows'].append(o)
          periods={'today':0,'yesterday':1,'week':6,'month':29}
          for name,days in periods.items():
              if name=='yesterday':
                  start=today-datetime.timedelta(days=1); end=today
              else:
                  start=today-datetime.timedelta(days=days); end=today+datetime.timedelta(days=1)
              chosen=[g for g in groups.values() if g['dt'] and start<=g['dt'].date()<end]
              qty=amt=0; qty_all=amt_all=0; stages=collections.Counter()
              for g in chosen:
                  s=stage({'status':g['status'],'state':g['state']}); stages[s]+=1
                  for o in g['rows']:
                      q=max(0,float(o.get('qty') or 0)); total=max(0,float(o.get('totalPrice') or 0)); unit=max(0,float(o.get('unitPrice') or 0))
                      qty_all+=q; amt_all+= total if total>0 else q*unit
                      if s!='cancelled':
                          qty+=q; amt+= total if total>0 else q*unit
              print(name,'orders',len(chosen),'stages',dict(stages),'qty_non_cancelled',qty,'amount_non_cancelled',round(amt,2),'qty_all',qty_all,'amount_all',round(amt_all,2))
          dts=[g['dt'] for g in groups.values() if g['dt']]
          print('rows',len(rows),'orders',len(groups),'min',min(dts).isoformat() if dts else None,'max',max(dts).isoformat() if dts else None)
          PY
