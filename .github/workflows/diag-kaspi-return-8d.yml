name: Diagnose Kaspi return 8d
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-kaspi-return-8d.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect returned sync lines
        run: |
          python - <<'PY'
          import json, subprocess, urllib.parse
          base='https://fragrant-shadow-72ed.7masok.workers.dev'
          for batch in range(0,8):
              u=base+'/kaspi/sync?'+urllib.parse.urlencode({'days':'14','batch':str(batch),'size':'100'})
              p=subprocess.run(['curl','-sS','--max-time','60',u],capture_output=True,text=True)
              try:d=json.loads(p.stdout)
              except: print('BAD',batch,p.stdout[:1000]); continue
              print('BATCH',batch,'hasMore',d.get('hasMore'),'next',d.get('nextBatch'),'orders',len(d.get('orders') or []))
              for o in d.get('orders') or []:
                  if str(o.get('code') or '')=='1008824537' or str(o.get('status') or '').upper()=='RETURNED':
                      print('RETURN_SYNC',json.dumps(o,ensure_ascii=False))
              if not d.get('hasMore'): break
          PY
