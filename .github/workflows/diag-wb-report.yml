name: Diagnose WB report revenue
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-wb-report.yml']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect safe D1 order feeds
        run: |
          set -e
          curl -fsSL --retry 4 --retry-delay 2 --max-time 25 'https://millioner-api.7masok.workers.dev/api/orders?market=WB&limit=1000' -o /tmp/wb.json
          curl -fsSL --retry 4 --retry-delay 2 --max-time 25 'https://millioner-api.7masok.workers.dev/api/orders?market=WB2&limit=1000' -o /tmp/wb2.json
          python - <<'PY'
          import json, datetime
          TZ=datetime.timezone(datetime.timedelta(hours=5))
          today=datetime.datetime.now(TZ).date()
          def stage(o):
              u=str(o.get('status') or '').upper(); st=str(o.get('state') or '').upper()
              if st in {'CANCELED','CANCELLED','CANCELED_BY_CLIENT','DECLINED_BY_CLIENT','DEFECT'} or u in {'CANCEL','CANCELLED'}: return 'cancelled'
              if st in {'SORTED','ACCEPTED_BY_CARRIER','SENT_TO_CARRIER','READY_FOR_PICKUP','SOLD'}: return 'delivery'
              if u in {'CONFIRM','COMPLETE'} or (st=='WAITING' and u!='NEW'): return 'transfer'
              return 'new'
          for market,path in [('WB','/tmp/wb.json'),('WB2','/tmp/wb2.json')]:
              data=json.load(open(path,encoding='utf-8')); rows=data.get('orders') or []
              chosen=[]
              for o in rows:
                  ms=o.get('creationDate') or 0
                  try: dt=datetime.datetime.fromtimestamp(float(ms)/1000,TZ)
                  except: continue
                  if dt.date()!=today or stage(o)!='delivery': continue
                  q=float(o.get('qty') or 0); p=float(o.get('unitPrice') or 0); total=float(o.get('totalPrice') or 0) or q*p
                  chosen.append((total,q,p,o.get('orderId'),o.get('sku'),o.get('status'),o.get('state'),dt.isoformat()))
              print('\n',market,'today delivery rows',len(chosen),'qty',sum(x[1] for x in chosen),'amount',sum(x[0] for x in chosen))
              for x in sorted(chosen,reverse=True)[:30]: print(x)
          PY
