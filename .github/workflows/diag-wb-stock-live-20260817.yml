name: Diagnose live WB stock synchronization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-wb-stock-live-20260817.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read live stock sync status
        run: |
          set -e
          curl -fsSL --max-time 30 'https://millioner-api.7masok.workers.dev/api/stock-sync-status' -o /tmp/status.json
          echo '=== STOCK SYNC STATUS ==='
          jq . /tmp/status.json
      - name: Read warehouse state for Angel Heart
        run: |
          set -e
          curl -fsSL --max-time 30 -H 'Origin: https://7masok.github.io' 'https://millioner-api.7masok.workers.dev/api/warehouse-state' -o /tmp/warehouse.json
          echo '=== PRODUCT MATCHES ==='
          jq '.state.products[] | select(((.name // "")|ascii_downcase|contains("сердце ангела")) or ((.wb // "")|ascii_downcase|contains("сердце ангела")) or ((.wb2 // "")|ascii_downcase|contains("сердце ангела"))) | {id,name,stock,wb,wb2}' /tmp/warehouse.json
