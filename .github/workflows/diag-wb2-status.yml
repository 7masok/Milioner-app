name: Temporary WB2 central status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-wb2-status.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Safe public central API checks
        run: |
          set -e
          echo 'HEALTH'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/health' | jq .
          echo 'MARKET STATUS'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/market-status' | jq .
          echo 'SYNC STATUS'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/sync-status' | jq .
          echo 'WB2 D1'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/orders?market=WB2&limit=1000' | jq '{ok, count:(.orders|length), sample:(.orders[:3])}'
