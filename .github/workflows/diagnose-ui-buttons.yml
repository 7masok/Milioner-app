name: Diagnose UI buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ui-buttons.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Browser diagnostics
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright-core@latest >/dev/null 2>&1
          cat > /tmp/diag.mjs <<'JS'
          import { chromium } from 'playwright-core';
          import { execSync } from 'node:child_process';
          let exe='';
          for (const c of ['google-chrome','chromium','chromium-browser']) {
            try { exe=execSync('which '+c).toString().trim(); if(exe) break; } catch {}
          }
          if(!exe) throw new Error('No Chromium/Chrome on runner');
          const browser=await chromium.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push('PAGEERROR '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('CONSOLE '+m.text())});
          page.on('requestfailed',r=>errors.push('REQFAIL '+r.url()+' '+(r.failure()?.errorText||'')));
          await page.goto('https://7masok.github.io/Milioner-app/',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(12000);
          console.log('ACTIVE_INIT',await page.locator('.view.active').getAttribute('id'));
          console.log('CLOUD',await page.locator('#cloudStatus').textContent());
          console.log('KASPI_QTY',await page.locator('#koTotal').textContent());
          console.log('ERRORS_BEFORE',JSON.stringify(errors.slice(-20)));
          async function clickCheck(name,selector,expect){
            try{
              const loc=page.locator(selector).first();
              console.log(name+'_VISIBLE',await loc.isVisible());
              const box=await loc.boundingBox();
              if(box){const el=await page.evaluate(({x,y})=>{const e=document.elementFromPoint(x,y);return e?e.tagName+'#'+e.id+'.'+e.className:''},{x:box.x+box.width/2,y:box.y+box.height/2});console.log(name+'_TOP',el)}
              await loc.click({timeout:5000});
              await page.waitForTimeout(500);
              console.log(name+'_RESULT',await page.evaluate(expect));
            }catch(e){console.log(name+'_CLICK_ERROR',e.message)}
          }
          await clickCheck('YESTERDAY','[data-order-period="yesterday"]',()=>({mode:window.orderPeriodMode,active:document.querySelector('[data-order-period="yesterday"]')?.classList.contains('active')}));
          await clickCheck('PRODUCTS','nav button[data-view="products"]',()=>({active:document.querySelector('.view.active')?.id,nav:document.querySelector('nav button.active')?.dataset.view}));
          await clickCheck('REPORTS','nav button[data-view="reports"]',()=>({active:document.querySelector('.view.active')?.id,nav:document.querySelector('nav button.active')?.dataset.view}));
          console.log('ERRORS_AFTER',JSON.stringify(errors.slice(-30)));
          await browser.close();
          JS
          node /tmp/diag.mjs
