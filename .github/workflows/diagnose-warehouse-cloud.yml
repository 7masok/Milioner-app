name: Diagnose warehouse cloud browser access
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-warehouse-cloud.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live warehouse read and save latency
        run: |
          python - <<'PY'
          import json, subprocess, time, tempfile, os
          base='https://millioner-api.7masok.workers.dev/api/warehouse-state'
          headers=['-H','Origin: https://7masok.github.io']
          t=time.time(); raw=subprocess.check_output(['curl','-fSs','--max-time','60',*headers,base],text=True); read_s=time.time()-t
          d=json.loads(raw); state=d.get('state') or {}; rev=int(d.get('revision') or 0)
          body=json.dumps({'baseRevision':rev,'state':state},ensure_ascii=False,separators=(',',':'))
          f=tempfile.NamedTemporaryFile('w',delete=False,encoding='utf-8');f.write(body);f.close()
          t=time.time(); p=subprocess.run(['curl','-fSs','--max-time','45','-X','PUT',*headers,'-H','Content-Type: application/json','--data-binary','@'+f.name,base],capture_output=True,text=True); save_s=time.time()-t
          os.unlink(f.name)
          if p.returncode: raise SystemExit('PUT failed: '+p.stderr)
          out=json.loads(p.stdout)
          meta=json.loads(subprocess.check_output(['curl','-fSs','--max-time','30',*headers,base+'?meta=1'],text=True))
          print('READ seconds',round(read_s,3),'bytes',len(raw.encode()),'revision',rev)
          print('PUT seconds',round(save_s,3),'response',out)
          print('META bytes',len(json.dumps(meta,separators=(',',':')).encode()),'revision',meta.get('revision'))
          if not out.get('ok'): raise SystemExit('PUT did not return ok')
          if int(out.get('revision') or 0) != rev+1: raise SystemExit('revision did not advance by 1')
          if save_s>20: raise SystemExit('warehouse PUT is still too slow: '+str(save_s))
          PY
