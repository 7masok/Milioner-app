name: Diagnose warehouse cloud browser access
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-warehouse-cloud.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Measure live warehouse reads
        run: |
          python - <<'PY'
          import json, subprocess, time
          base='https://millioner-api.7masok.workers.dev/api/warehouse-state'
          headers=['-H','Origin: https://7masok.github.io']
          def get(url,limit):
              t=time.time()
              raw=subprocess.check_output(['curl','-fSs','--max-time',str(limit),*headers,url],text=True)
              return raw,time.time()-t
          meta,mt=get(base+'?meta=1',30)
          full,ft=get(base,90)
          md=json.loads(meta); fd=json.loads(full)
          print('META seconds',round(mt,3),'bytes',len(meta.encode()),'revision',md.get('revision'))
          print('FULL seconds',round(ft,3),'bytes',len(full.encode()),'revision',fd.get('revision'))
          if not md.get('ok') or not fd.get('ok'): raise SystemExit('warehouse read failed')
          if mt>5: raise SystemExit('meta is still too slow: '+str(mt))
          PY
