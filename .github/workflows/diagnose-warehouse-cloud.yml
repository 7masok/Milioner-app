name: Diagnose warehouse cloud browser access
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-warehouse-cloud.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Measure warehouse payload
        run: |
          python - <<'PY'
          import json, subprocess
          url='https://millioner-api.7masok.workers.dev/api/warehouse-state'
          raw=subprocess.check_output(['curl','-fSs','--max-time','60','-H','Origin: https://7masok.github.io',url],text=True)
          d=json.loads(raw); state=d.get('state') or {}
          print('total bytes',len(raw.encode()))
          for k,v in state.items():
              b=len(json.dumps(v,ensure_ascii=False,separators=(',',':')).encode())
              n=len(v) if isinstance(v,(list,dict)) else 1
              print(k,'bytes',b,'items',n)
          PY
