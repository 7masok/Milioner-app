name: Diagnose WB finance live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wb-finance-live.yml'

permissions:
  contents: read
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check WB1 access
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-access-check?market=WB' -o wb1-access.json
          jq . wb1-access.json
      - name: Check WB2 access
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-access-check?market=WB2' -o wb2-access.json
          jq . wb2-access.json
      - name: Check WB1 finance status
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-finance-status?market=WB' -o wb1-finance.json
          jq . wb1-finance.json
      - name: Check WB2 finance status
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-finance-status?market=WB2' -o wb2-finance.json
          jq . wb2-finance.json
      - name: Upload WB finance diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: wb-finance-live-diagnostic
          path: |
            wb1-access.json
            wb2-access.json
            wb1-finance.json
            wb2-finance.json
          retention-days: 1
