name: Diagnose live WB finance operations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wb-finance-operations-live.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - run: sleep 20
      - name: WB1 operation groups
        run: curl -fsSL --retry 5 --retry-delay 5 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-finance-operation-debug?market=WB&days=30' | jq .
      - name: WB2 operation groups
        run: curl -fsSL --retry 5 --retry-delay 5 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-finance-operation-debug?market=WB2&days=30' | jq .
