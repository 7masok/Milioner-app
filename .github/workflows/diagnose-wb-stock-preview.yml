name: Diagnose WB stock preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wb-stock-preview.yml'

permissions:
  contents: read
  actions: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read WB2 preview through central millioner-api
        run: |
          code=$(curl -sS --max-time 60 -o wb2-preview.json -w '%{http_code}' 'https://millioner-api.7masok.workers.dev/api/stock-sync-preview?market=WB2' || true)
          printf '%s\n' "$code" > wb2-http.txt
          test -s wb2-preview.json || printf '%s\n' '{"error":"empty response"}' > wb2-preview.json
      - name: Read central stock-sync status after preview
        run: |
          curl -fsSL --retry 3 --retry-delay 2 --max-time 25 'https://millioner-api.7masok.workers.dev/api/stock-sync-status' -o stock-sync-status.json
          jq -e '.ok==true and .mode=="preview"' stock-sync-status.json
      - name: Upload diagnostic status
        uses: actions/upload-artifact@v4
        with:
          name: wb2-stock-preview-diagnostic
          path: |
            wb2-http.txt
            wb2-preview.json
            stock-sync-status.json
          retention-days: 1
