name: Edit received purchase safely

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_edit_received_purchase.py'
      - '.github/workflows/edit-received-purchase.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply correction editor patch
        run: python tools/patch_edit_received_purchase.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          grep -q 'openCorrectReceivedPurchaseShipment' index.html
          grep -q 'saveCorrectReceivedPurchaseShipment' index.html
          git diff --check
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Allow safe correction of received purchases'
          git push origin HEAD:main
