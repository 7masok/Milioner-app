name: Enable resilient D1 cloud sync v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-cloud-sync-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v3 patch
        run: |
          python .github/scripts/enable_cloud_sync_v3.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          assert './cloud-sync-v3.js?v=20260814a' in html
          assert 'setTimeout(()=>bootstrapWarehouseD1()' in html
          assert "const metaOnly = url.searchParams.get('meta') === '1';" in Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check cloud-sync-v3.js
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit code
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix D1 cloud sync reliability on mobile'
          git push origin HEAD:main
