name: Enable live D1 warehouse sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-live-cloud-sync.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply live cloud sync patch
        run: |
          python .github/scripts/enable_live_cloud_sync.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          assert 'id="cloudStatus"' in html
          assert 'setInterval(()=>pullWarehouseFromD1(),15000)' in html
          assert "document.addEventListener('visibilitychange'" in html
          assert "window.addEventListener('focus'" in html
          assert 'mergeWarehouseSnapshots' in html
          assert 'revision-conflict' not in html[html.index('let warehouseRemoteReady='):html.index('const id=()=>')]
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('static cloud sync checks passed')
          PY
          node --check /tmp/index-inline.js
      - name: Verify D1 warehouse endpoint
        run: |
          python - <<'PY'
          import json, subprocess
          url='https://millioner-api.7masok.workers.dev/api/warehouse-state'
          p=subprocess.run(['curl','-fSs','--max-time','45','-H','Origin: https://7masok.github.io',url],capture_output=True,text=True)
          if p.returncode:
              raise SystemExit('warehouse endpoint failed: '+p.stderr)
          d=json.loads(p.stdout)
          if not d.get('ok'):
              raise SystemExit('warehouse endpoint returned error: '+str(d))
          state=d.get('state') or {}
          print('D1 exists=',d.get('exists'),'revision=',d.get('revision'),'products=',len(state.get('products') or []),'purchases=',len(state.get('purchases') or []),'movements=',len(state.get('movements') or []))
          PY
      - name: Commit
        run: |
          git config user.name millioner-maintenance
          git config user.email actions@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Make D1 the live warehouse source across devices'
          git push origin HEAD:main
