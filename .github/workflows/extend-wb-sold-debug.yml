name: Extend WB sold debug
on:
  push:
    paths: ['.github/workflows/extend-wb-sold-debug.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/extend_wb_sold_debug.py
      - run: node --check cloudflare/millioner-api/src/fixed.js
      - name: Commit
        run: |
          git config user.name 7masok
          git config user.email 7masok@gmail.com
          git add cloudflare/millioner-api/src/fixed.js
          git diff --cached --quiet && exit 0
          git commit -m 'Extend WB sold diagnostic with current candidates'
          git push
      - run: echo rerun-current-main
