name: Fast mobile warehouse v4b
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-warehouse-mobile-v4b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python tools/patch_fast_mobile_v4.py
          node --check cloud-sync-v3.js
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          git config user.name millioner-maintenance
          git config user.email actions@users.noreply.github.com
          git add cloud-sync-v3.js index.html cloudflare/millioner-api/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix mobile D1 connection timeout'
          git push origin HEAD:main
