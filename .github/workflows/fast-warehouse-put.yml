name: Speed up D1 warehouse saves
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fast-warehouse-put.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make product table refresh asynchronous
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/millioner-api/src/index.js')
          s=p.read_text(encoding='utf-8')
          old="        await importProducts(env.DB, warehouse.products || []);\n        return json({ ok: true, revision: nextRevision, updatedAt: now, products: (warehouse.products || []).length }, 200, cors);"
          new="        ctx.waitUntil(importProducts(env.DB, warehouse.products || []).catch(e=>console.error('warehouse product mirror',e)));\n        return json({ ok: true, revision: nextRevision, updatedAt: now, products: (warehouse.products || []).length }, 200, cors);"
          if old in s:
              s=s.replace(old,new,1)
          elif "ctx.waitUntil(importProducts(env.DB, warehouse.products || [])" not in s:
              raise SystemExit('warehouse import marker missing')
          p.write_text(s,encoding='utf-8')
          PY
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email actions@users.noreply.github.com
          git add cloudflare/millioner-api/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Return warehouse saves before product mirror refresh'
          git push origin HEAD:main
