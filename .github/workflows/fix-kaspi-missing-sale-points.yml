name: Fix Kaspi missing sale points

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_kaspi_missing_sale_points.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch Kaspi XML feed
        run: python3 .github/scripts/fix_kaspi_missing_sale_points.py
      - name: Commit patched feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Fix Kaspi missing sale points in XML feed'
            git push
          fi
