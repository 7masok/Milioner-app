name: Fix Kaspi profit with pending orders
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-kaspi-profit-pending-v1.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Kaspi profit display
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('kaspi-report-v2.js')
          s=p.read_text(encoding='utf-8')

          marker='function fallbackModel(days){'
          helper="""function reportProfitView(model){if(!(model?.unknownRevenue>0))return{value:Number(model?.profit)||0,estimated:false,missingCost:0,costRate:0};const rows=Array.isArray(model?.rows)?model.rows:[],knownRevenue=rows.reduce((n,x)=>n+(!x.unknownCost&&Number(x.revenue)>0?Number(x.revenue):0),0),knownCost=rows.reduce((n,x)=>n+(!x.unknownCost&&Number(x.revenue)>0?Math.max(0,Number(x.cost)||0):0),0),unresolvedRevenue=rows.reduce((n,x)=>n+(x.unknownCost&&Number(x.revenue)>0?Number(x.revenue):0),0),costRate=knownRevenue>0?Math.max(0,Math.min(1,knownCost/knownRevenue)):0,missingCost=unresolvedRevenue*costRate;return{value:(Number(model?.profit)||0)-missingCost,estimated:true,missingCost,costRate}}\n"""
          if 'function reportProfitView(model)' not in s:
              if marker not in s: raise SystemExit('fallback marker missing')
              s=s.replace(marker,helper+marker,1)

          old="function renderKpis(model){const set=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value};set('rRevenue',fmt(model.revenue));set('rCost',fmt(model.cost));set('rFees',fmt(model.fees));set('rAds',fmt(model.ads));set('rProfit',model.unknownRevenue>0?'—':fmt(model.profit));const box=document.getElementById('mpReport');if(box){const note=model.unknownRevenue>0?' · '+model.unknownOrders+' заказ(а) ждут состав':'',profit=model.unknownRevenue>0?'—':fmt(model.profit);box.innerHTML=`<div class=\"item row\" role=\"button\" tabindex=\"0\" style=\"cursor:pointer\" onclick=\"openMarketplaceReport('Kaspi',${reportPeriod})\"><div class=\"grow\"><b>Kaspi</b><div class=\"muted\">${model.qty} шт. · прибыль ${profit}${note}</div></div><b>${fmt(model.revenue)}</b></div>`}}"
          new="function renderKpis(model){const set=(id,value)=>{const el=document.getElementById(id);if(el)el.textContent=value},pv=reportProfitView(model);set('rRevenue',fmt(model.revenue));set('rCost',fmt(model.cost));set('rFees',fmt(model.fees));set('rAds',fmt(model.ads));set('rProfit',(pv.estimated?'≈ ':'')+fmt(pv.value));const box=document.getElementById('mpReport');if(box){const note=model.unknownRevenue>0?' · '+model.unknownOrders+' заказ(а) ждут состав':'',profit=(pv.estimated?'≈ ':'')+fmt(pv.value);box.innerHTML=`<div class=\"item row\" role=\"button\" tabindex=\"0\" style=\"cursor:pointer\" onclick=\"openMarketplaceReport('Kaspi',${reportPeriod})\"><div class=\"grow\"><b>Kaspi</b><div class=\"muted\">${model.qty} шт. · прибыль ${profit}${note}</div></div><b>${fmt(model.revenue)}</b></div>`}}"
          if old in s:
              s=s.replace(old,new,1)
          elif "set('rProfit',model.unknownRevenue>0?'—':fmt(model.profit))" in s:
              raise SystemExit('renderKpis shape changed')

          old="profitText=model.unknownRevenue>0?'—':money(model.profit)"
          new="pv=reportProfitView(model),profitText=(pv.estimated?'≈ ':'')+money(pv.value)"
          if old in s:
              s=s.replace(old,new,1)
          elif "pv=reportProfitView(model),profitText=" not in s:
              raise SystemExit('profitText marker missing')

          s=s.replace('поэтому их себестоимость и итоговая прибыль временно не показываются.','поэтому прибыль помечена знаком ≈ и оценена по средней доле себестоимости уже известных заказов. После загрузки состава она уточнится.',1)

          p.write_text(s,encoding='utf-8')
          PY
          node --check kaspi-report-v2.js
          grep -q 'function reportProfitView(model)' kaspi-report-v2.js
          grep -q "set('rProfit',(pv.estimated?'≈ ':'')+fmt(pv.value))" kaspi-report-v2.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add kaspi-report-v2.js
          git diff --cached --quiet && exit 0
          git commit -m 'Show estimated Kaspi profit while order composition is pending'
          git push origin HEAD:main
