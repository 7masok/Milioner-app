name: Fix Kaspi report exact totals and loading
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-kaspi-report-exact.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_kaspi_report_exact.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check kaspi-report-v2.js
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Kaspi report exact totals and loading'
          git push origin HEAD:main
