name: Fix marketplace product profit context
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-market-product-profit-context.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Read full current index and patch context
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if not (s.startswith('<!doctype html>') and s.rstrip().endswith('</html>')):
              raise SystemExit('full current index.html read failed')
          old="""function openMarketplaceReport(market){const rows=marketplaceProductStats(market),qty=rows.reduce((a,x)=>a+x.qty,0),revenue=rows.reduce((a,x)=>a+x.revenue,0),profit=rows.reduce((a,x)=>a+x.profit,0),period=selectedPeriod===1?'сегодня':selectedPeriod+' дней';const body=rows.length?rows.map((x,i)=>`<div class=\"item row\" style=\"margin-top:8px;${x.productId?'cursor:pointer':''}\" ${x.productId?`onclick=\"openProduct('${x.productId}')\"`:''}><div class=\"grow\"><div class=\"name\">${i+1}. ${esc(x.name)}</div><div class=\"muted\">${x.qty} шт. · себестоимость ${fmt(x.cost)} · расходы МП ${fmt(x.fees)} · прибыль ${fmt(x.profit)}</div></div><div class=\"right\"><b>${fmt(x.revenue)}</b><div class=\"muted\">выручка</div></div></div>`).join(''):'<div class=\"empty\">За выбранный период продаж нет</div>';showSheet(`<h3>${esc(market)} · товары</h3><div class=\"item\"><div class=\"row\"><div class=\"grow\"><b>${qty} шт.</b><div class=\"muted\">Период: ${period} · прибыль ${fmt(profit)}</div></div><div class=\"right\"><b>${fmt(revenue)}</b><div class=\"muted\">выручка</div></div></div></div>${body}`)}"""
          new="""function openMarketplaceReport(market){const rows=marketplaceProductStats(market),qty=rows.reduce((a,x)=>a+x.qty,0),revenue=rows.reduce((a,x)=>a+x.revenue,0),profit=rows.reduce((a,x)=>a+x.profit,0),period=selectedPeriod===1?'сегодня':selectedPeriod+' дней';const body=rows.length?rows.map((x,i)=>`<div class=\"item row\" style=\"margin-top:8px;${x.productId?'cursor:pointer':''}\" ${x.productId?`onclick=\"openProduct('${x.productId}','${market}',${selectedPeriod})\"`:''}><div class=\"grow\"><div class=\"name\">${i+1}. ${esc(x.name)}</div><div class=\"muted\">${x.qty} шт. · себестоимость ${fmt(x.cost)} · расходы МП ${fmt(x.fees)} · прибыль ${fmt(x.profit)}</div></div><div class=\"right\"><b>${fmt(x.revenue)}</b><div class=\"muted\">выручка</div></div></div>`).join(''):'<div class=\"empty\">За выбранный период продаж нет</div>';showSheet(`<h3>${esc(market)} · товары</h3><div class=\"item\"><div class=\"row\"><div class=\"grow\"><b>${qty} шт.</b><div class=\"muted\">Период: ${period} · прибыль ${fmt(profit)}</div></div><div class=\"right\"><b>${fmt(revenue)}</b><div class=\"muted\">выручка</div></div></div></div>${body}`)}"""
          if s.count(old)!=1: raise SystemExit('openMarketplaceReport exact match failed')
          s=s.replace(old,new,1)
          old2="""function openProduct(pid){let p=prod(pid),r=reserved(p),free=Math.max(0,(Number(p.stock)||0)-r),profit=profitForProduct(p),value=(Number(p.stock)||0)*(Number(p.cost)||0);let s=`<h3>${esc(p.name)}</h3><div class=\"item\"><b>Остаток товара</b><div class=\"kpi\" style=\"margin-top:10px\"><div><div class=\"label\">Всего на складе</div><div class=\"num\">${p.stock} шт.</div></div><div><div class=\"label\">Доступно к продаже</div><div class=\"num\">${free} шт.</div></div></div>${r?`<div class=\"link-note\" style=\"margin-top:10px\"><b>В резерве: ${r} шт.</b><br>Эти товары уже заняты активными заказами и не считаются свободными.</div>`:''}<div style=\"margin-top:12px\"><div class=\"muted\">Себестоимость 1 шт.</div><b>${fmt(p.cost)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">Стоимость всего остатка</div><b>${fmt(value)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">Прибыль за 30 дней</div><b>${fmt(profit)}</b></div></div><div class=\"item\" style=\"margin-top:8px\"><b>Артикулы маркетплейсов</b><div style=\"margin-top:9px;line-height:1.8\"><div><span class=\"muted\">Kaspi:</span> ${esc(p.kaspi||'—')}</div><div><span class=\"muted\">WB 1:</span> ${esc(p.wb||'—')}</div><div><span class=\"muted\">WB 2:</span> ${esc(p.wb2||'—')}</div><div><span class=\"muted\">Ozon:</span> ${esc(p.ozon||'—')}</div></div></div><button class=\"btn dark full\" onclick=\"closeModal();openModal('edit','${pid}')\">Редактировать товар</button><button class=\"btn full\" onclick=\"closeModal();openModal('writeoff','${pid}')\">Списать</button><button class=\"btn full\" onclick=\"closeModal();openModal('inventory','${pid}')\">Инвентаризация</button>`;showSheet(s)}"""
          new2="""function openProduct(pid,market='',days=30){let p=prod(pid),r=reserved(p),free=Math.max(0,(Number(p.stock)||0)-r),periodDays=Math.max(1,Number(days)||30),since=Date.now()-periodDays*86400000,profit=market?financialSales().filter(x=>x.productId===p.id&&x.channel===market&&x.date>=since).reduce((a,x)=>a+(Number(x.qty)||0)*((Number(x.price)||0)-(Number(x.cost)||0)-(Number(x.fee)||0)),0):profitForProduct(p),profitLabel=market?`Прибыль ${esc(market)} за ${periodDays===1?'сегодня':periodDays+' дней'}`:'Прибыль за 30 дней',value=(Number(p.stock)||0)*(Number(p.cost)||0);let s=`<h3>${esc(p.name)}</h3><div class=\"item\"><b>Остаток товара</b><div class=\"kpi\" style=\"margin-top:10px\"><div><div class=\"label\">Всего на складе</div><div class=\"num\">${p.stock} шт.</div></div><div><div class=\"label\">Доступно к продаже</div><div class=\"num\">${free} шт.</div></div></div>${r?`<div class=\"link-note\" style=\"margin-top:10px\"><b>В резерве: ${r} шт.</b><br>Эти товары уже заняты активными заказами и не считаются свободными.</div>`:''}<div style=\"margin-top:12px\"><div class=\"muted\">Себестоимость 1 шт.</div><b>${fmt(p.cost)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">Стоимость всего остатка</div><b>${fmt(value)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">${profitLabel}</div><b>${fmt(profit)}</b></div></div><div class=\"item\" style=\"margin-top:8px\"><b>Артикулы маркетплейсов</b><div style=\"margin-top:9px;line-height:1.8\"><div><span class=\"muted\">Kaspi:</span> ${esc(p.kaspi||'—')}</div><div><span class=\"muted\">WB 1:</span> ${esc(p.wb||'—')}</div><div><span class=\"muted\">WB 2:</span> ${esc(p.wb2||'—')}</div><div><span class=\"muted\">Ozon:</span> ${esc(p.ozon||'—')}</div></div></div><button class=\"btn dark full\" onclick=\"closeModal();openModal('edit','${pid}')\">Редактировать товар</button><button class=\"btn full\" onclick=\"closeModal();openModal('writeoff','${pid}')\">Списать</button><button class=\"btn full\" onclick=\"closeModal();openModal('inventory','${pid}')\">Инвентаризация</button>`;showSheet(s)}"""
          if s.count(old2)!=1: raise SystemExit('openProduct exact match failed')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          for marker in ["openProduct('${x.productId}','${market}',${selectedPeriod})","function openProduct(pid,market='',days=30)","x.channel===market","profitLabel=market?`Прибыль ${esc(market)}"]:
            if marker not in h: raise SystemExit('missing '+marker)
          scripts=re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep product profit scoped to selected marketplace'
          git push origin HEAD:main
