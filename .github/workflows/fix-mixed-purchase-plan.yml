name: Fix mixed purchase recommendations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-mixed-purchase-plan.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch purchase logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="function purchaseRecommendation(p){if(!p||isBundleProduct(p))return null;const demand=purchaseDemandQty(p),daily=demand/PURCHASE_COVER_DAYS,available=productAvailableStock(p),inbound=purchaseInboundQty(p.id),targetQty=Math.ceil(demand),days=daily>0?available/daily:Infinity;if(!(daily>0)||days>=PURCHASE_COVER_DAYS)return null;const qty=Math.max(0,targetQty-inbound),unitCost=purchaseLastUnitCost(p.id),estimatedCost=qty*unitCost;return qty>0?{productId:p.id,product:p,qty,demand,daily,available,inbound,days,unitCost,estimatedCost}:null}"
          new="function purchaseRecommendation(p){if(!p||isBundleProduct(p))return null;const demand=purchaseDemandQty(p),daily=demand/PURCHASE_COVER_DAYS,available=productAvailableStock(p),inbound=purchaseInboundQty(p.id),coverage=available+inbound,targetQty=Math.ceil(demand),days=daily>0?coverage/daily:Infinity;if(!(daily>0)||days>=PURCHASE_COVER_DAYS)return null;const qty=Math.max(0,targetQty-coverage),unitCost=purchaseLastUnitCost(p.id),estimatedCost=qty*unitCost;return qty>0?{productId:p.id,product:p,qty,demand,daily,available,inbound,days,unitCost,estimatedCost}:null}"
          if old not in s: raise SystemExit('purchaseRecommendation marker missing')
          s=s.replace(old,new,1)

          s=s.replace('<select class="purchase-product">${arrivalProductOptions(selected)}</select>','<select class="purchase-product" onchange="updatePurchaseOrderCalculator()">${arrivalProductOptions(selected)}</select>',1)
          s=s.replace('<select class="edit-purchase-product">${arrivalProductOptions(selected)}</select>','<select class="edit-purchase-product" onchange="updateEditPurchaseCalculator()">${arrivalProductOptions(selected)}</select>',1)

          old="function purchaseDraftRows(){return [...document.querySelectorAll('.purchase-item')].map(row=>({row,productId:row.querySelector('.purchase-product')?.value||'',qty:Math.max(0,Number(row.querySelector('.purchase-qty')?.value)||0)}))}"
          new="function purchaseDraftRows(){return [...document.querySelectorAll('.purchase-item')].map(row=>{const sel=row.querySelector('.purchase-product'),q=String(row.querySelector('.purchase-q')?.value||'').trim();return {row,query:q,productId:sel?.value||'',selectedName:String(sel?.selectedOptions?.[0]?.textContent||'').trim(),qty:Math.max(0,Number(row.querySelector('.purchase-qty')?.value)||0)}})}"
          if old not in s: raise SystemExit('purchaseDraftRows marker missing')
          s=s.replace(old,new,1)

          old="function editPurchaseDraftRows(){return [...document.querySelectorAll('.edit-purchase-item')].map(row=>({row,productId:row.querySelector('.edit-purchase-product')?.value||'',qty:Math.max(0,Number(row.querySelector('.edit-purchase-qty')?.value)||0)}))}"
          new="function editPurchaseDraftRows(){return [...document.querySelectorAll('.edit-purchase-item')].map(row=>{const sel=row.querySelector('.edit-purchase-product'),q=String(row.querySelector('.edit-purchase-q')?.value||'').trim();return {row,query:q,productId:sel?.value||'',selectedName:String(sel?.selectedOptions?.[0]?.textContent||'').trim(),qty:Math.max(0,Number(row.querySelector('.edit-purchase-qty')?.value)||0)}})}"
          if old not in s: raise SystemExit('editPurchaseDraftRows marker missing')
          s=s.replace(old,new,1)

          old_start=s.index('function createPurchaseOrder(){')
          old_end=s.index('\nfunction purchaseShipmentRows(',old_start)
          new_create=r'''function createPurchaseOrder(){const rows=purchaseDraftRows(),used=rows.filter(x=>x.qty>0||x.query),bad=used.find(x=>x.qty<=0||!x.productId||(x.query&&!normalizeName(x.selectedName).includes(normalizeName(x.query))));if(bad)return alert('Проверьте добавленный товар «'+(bad.query||bad.selectedName||'без названия')+'»: выберите товар из списка и укажите количество. Ни одна строка закупки не будет пропущена.');const draft=used.filter(x=>x.productId&&x.qty>0),orderedAt=localDateStart(document.getElementById('porDate')?.value),batch=(document.getElementById('porBatch')?.value||'').trim(),totalBuy=Math.max(0,Number(document.getElementById('porBuyTotal')?.value)||0),totalDelivery=Math.max(0,Number(document.getElementById('porDelivery')?.value)||0);if(!draft.length)return alert('Добавьте хотя бы один товар и количество');if(draft.some(x=>!prod(x.productId)))return alert('Проверьте выбранные товары');const ids=draft.map(x=>x.productId);if(new Set(ids).size!==ids.length)return alert('Один и тот же товар добавлен несколько раз. Объедините количество в одну строку.');const before=new Map(ids.map(pid=>[String(pid),purchaseInboundQty(pid)])),valid=purchaseDraftCosts(draft,totalBuy,totalDelivery),shipmentId='po-'+id(),label=batch||('Китай '+new Date(orderedAt).toLocaleDateString('ru-RU')),now=Date.now();for(const x of valid){state.purchases.unshift({id:id(),shipmentId,status:'to_forwarder',productId:x.productId,qty:x.qty,remainingQty:0,buyTotal:x.buyTotal,unitCost:x.unitCost,delivery:x.deliveryShare,landedUnitCost:0,batch:label,orderedAt,date:orderedAt,receivedAt:0,createdAt:now,shipmentPurchaseTotal:totalBuy,shipmentDeliveryTotal:totalDelivery})}const missed=valid.filter(x=>purchaseInboundQty(x.productId)<(before.get(String(x.productId))||0)+x.qty);if(missed.length)return alert('Ошибка сохранения закупки: не удалось учесть '+missed.map(x=>productNameById(x.productId,'товар')).join(', ')+'. Закупка не закрыта — сообщите об ошибке.');save();closeModal();render();alert(`Закупка создана: ${valid.length} поз. · ${valid.reduce((a,x)=>a+x.qty,0)} шт. Все добавленные товары уже учтены в «Надо купить». Товары оплачены: ${fmt(totalBuy)} · доставка при получении: ${fmt(totalDelivery)}.`)}'''
          s=s[:old_start]+new_create+s[old_end:]

          old_start=s.index('function savePurchaseShipmentEdit(encodedKey){')
          old_end=s.index('\nfunction advancePurchaseShipment(',old_start)
          new_edit=r'''function savePurchaseShipmentEdit(encodedKey){const oldRows=purchaseShipmentRows(encodedKey);if(!oldRows.length)return alert('Поставка не найдена');if(oldRows.some(x=>purchaseStatus(x)==='received'))return alert('Поставку в продаже редактировать нельзя.');const rows=editPurchaseDraftRows(),used=rows.filter(x=>x.qty>0||x.query),bad=used.find(x=>x.qty<=0||!x.productId||(x.query&&!normalizeName(x.selectedName).includes(normalizeName(x.query))));if(bad)return alert('Проверьте добавленный товар «'+(bad.query||bad.selectedName||'без названия')+'»: выберите товар из списка и укажите количество. Ни одна строка поставки не будет пропущена.');const draft=used.filter(x=>x.productId&&x.qty>0),orderedAt=localDateStart(document.getElementById('editPorDate')?.value),batch=(document.getElementById('editPorBatch')?.value||'').trim(),totalBuy=Math.max(0,Number(document.getElementById('editPorBuyTotal')?.value)||0),totalDelivery=Math.max(0,Number(document.getElementById('editPorDelivery')?.value)||0);if(!draft.length)return alert('Добавьте хотя бы один товар и количество');if(draft.some(x=>!prod(x.productId)))return alert('Проверьте выбранные товары');const ids=draft.map(x=>x.productId);if(new Set(ids).size!==ids.length)return alert('Один и тот же товар добавлен несколько раз. Объедините количество в одну строку.');const valid=purchaseDraftCosts(draft,totalBuy,totalDelivery),first=oldRows[0],shipmentId=String(first.shipmentId||first.id||''),status=purchaseStatus(first),forwarderReceivedAt=oldRows.reduce((a,x)=>Math.max(a,Number(x.forwarderReceivedAt)||0),0),warehouseReceivedAt=oldRows.reduce((a,x)=>Math.max(a,Number(x.warehouseReceivedAt)||0),0),label=batch||('Китай '+new Date(orderedAt).toLocaleDateString('ru-RU')),oldByProduct=new Map(oldRows.map(x=>[String(x.productId),x])),updated=valid.map(x=>{const old=oldByProduct.get(String(x.productId));return {...(old||{}),id:old?.id||id(),shipmentId,status,productId:x.productId,qty:x.qty,remainingQty:0,buyTotal:x.buyTotal,unitCost:x.unitCost,delivery:x.deliveryShare,landedUnitCost:status==='at_warehouse'?x.landedUnitCost:0,batch:label,orderedAt,date:orderedAt,receivedAt:0,warehouseReceivedAt:status==='at_warehouse'?warehouseReceivedAt:0,createdAt:Number(old?.createdAt)||Date.now(),forwarderReceivedAt:['to_me','at_warehouse'].includes(status)?forwarderReceivedAt:0,shipmentPurchaseTotal:totalBuy,shipmentDeliveryTotal:totalDelivery}}),oldIds=new Set(oldRows.map(x=>x.id));state.purchases=state.purchases.filter(x=>!oldIds.has(x.id));state.purchases.unshift(...updated);save();closeModal();render();alert('Поставка обновлена. Все позиции учтены в «Надо купить». Остаток склада не изменился.')}'''
          s=s[:old_start]+new_edit+s[old_end:]

          p.write_text(s,encoding='utf-8')
          PY
          node -e "const fs=require('fs'),s=fs.readFileSync('index.html','utf8'),m=s.match(/<script>([\s\S]*?)<\/script>/g)||[];fs.writeFileSync('/tmp/all.js',m.map(x=>x.replace(/^<script>|<\/script>$/g,'')).join('\n'))"
          node --check /tmp/all.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix mixed purchase recommendations'
          git push origin HEAD:main