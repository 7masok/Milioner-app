name: Fix order cards and 5-minute sync

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_order_cards_and_5min_sync.py'
      - '.github/workflows/fix-order-cards-and-5min-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded fix
        run: python tools/fix_order_cards_and_5min_sync.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check cloudflare/millioner-api/src/index.js

      - name: Verify grouping and cadence
        run: |
          grep -q 'function groupMarketplaceOrders(feed)' index.html
          grep -q "entryId||'')==='__pending__'" index.html
          grep -q '300000' index.html
          grep -q 'KASPI_SCHEDULE_MS = 5 \* 60 \* 1000' cloudflare/millioner-api/src/index.js
          grep -q '"crons": \["\*/5 \* \* \* \*"\]' cloudflare/millioner-api/wrangler.jsonc

      - name: Commit fixed app
        run: |
          if git diff --quiet -- index.html cloudflare/millioner-api/src/index.js cloudflare/millioner-api/wrangler.jsonc; then
            echo 'No app change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js cloudflare/millioner-api/wrangler.jsonc
          git commit -m 'Group marketplace order cards and sync Kaspi every 5 minutes'
          git push origin main
