name: Fix product sale stock semantics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-product-sale-semantics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_product_sale_semantics.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'В продаже: ${forSale} шт.' in html
          assert 'Не хватает: ${shortage} шт.' in html
          assert '<div class="muted">в продаже</div>' in html
          PY
          node --check /tmp/index-inline.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix product sale stock semantics'
          git push origin HEAD:main
