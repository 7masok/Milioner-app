name: Fix product stock display once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: !contains(github.event.head_commit.message, 'Apply product stock display fix')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const displayStock=productDisplayStock(p),displayCost=productLifetimeAverageCost(p),daily7=productAverageDailySales(p,7),dailyAll=productAverageDailySales(p,'all'),"
          new = "const physicalStock=Math.max(0,Number(p.stock)||0),displayReserve=Math.max(0,reserved(p)),displayStock=productAvailableStock(p),displayCost=productLifetimeAverageCost(p),daily7=productAverageDailySales(p,7),dailyAll=productAverageDailySales(p,'all'),"
          if old not in s:
              raise SystemExit('target 1 not found')
          s = s.replace(old, new, 1)
          old2 = "<div class=\"label\">Всего на складе</div><div class=\"num\">${displayStock} ${isBundleProduct(p)?'набор.':'шт.'}</div>"
          new2 = "<div class=\"label\">Доступно к продаже</div><div class=\"num\">${displayStock} ${isBundleProduct(p)?'набор.':'шт.'}</div><div class=\"muted\" style=\"margin-top:8px\">Физический остаток: ${physicalStock} шт. · В резерве: ${displayReserve} шт.</div>"
          if old2 not in s:
              raise SystemExit('target 2 not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-product-stock-display-once.yml
          git commit -m 'Apply product stock display fix'
          git rm .github/workflows/fix-product-stock-display-once.yml
          git commit -m 'Remove one-time stock display workflow'
          git push