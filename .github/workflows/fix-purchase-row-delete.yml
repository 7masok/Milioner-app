name: Fix purchase row deletion once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-purchase-row-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch purchase deletion persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="const WAREHOUSE_DIRTY_KEY=KEY+'_cloud_dirty_v2',WAREHOUSE_MIGRATION_KEY=KEY+'_cloud_sync_v2_migrated';\n"
          new=old+"const PURCHASE_DELETE_TOMBSTONES_KEY=KEY+'_purchase_delete_tombstones_v1';let warehouseDeletedPurchaseIds=new Set();try{warehouseDeletedPurchaseIds=new Set(JSON.parse(localStorage.getItem(PURCHASE_DELETE_TOMBSTONES_KEY)||'[]').map(String))}catch{}function rememberPurchaseDeletes(ids){for(const x of(ids||[]))if(x)warehouseDeletedPurchaseIds.add(String(x));try{localStorage.setItem(PURCHASE_DELETE_TOMBSTONES_KEY,JSON.stringify([...warehouseDeletedPurchaseIds]))}catch{}}function clearPurchaseDeleteTombstones(){warehouseDeletedPurchaseIds.clear();try{localStorage.removeItem(PURCHASE_DELETE_TOMBSTONES_KEY)}catch{}}\n"
          if old not in s: raise SystemExit('anchor 1 not found')
          s=s.replace(old,new,1)

          old="if(!l&&r){if(jsonSame(r,b))continue;out.push(r);continue}"
          new="if(!l&&r){if(field==='purchases'&&warehouseDeletedPurchaseIds.has(String(k)))continue;if(jsonSame(r,b))continue;out.push(r);continue}"
          if old not in s: raise SystemExit('anchor 2 not found')
          s=s.replace(old,new,1)

          old="oldIds=new Set(oldRows.map(x=>x.id));state.purchases=state.purchases.filter(x=>!oldIds.has(x.id));state.purchases.unshift(...updated);save();closeModal();render();alert('Поставка обновлена. Все позиции учтены в «Надо купить». Остаток склада не изменился.')"
          new="oldIds=new Set(oldRows.map(x=>x.id)),updatedIds=new Set(updated.map(x=>x.id)),removedIds=[...oldIds].filter(x=>!updatedIds.has(x));rememberPurchaseDeletes(removedIds);state.purchases=state.purchases.filter(x=>!oldIds.has(x.id));state.purchases.unshift(...updated);save();closeModal();render();alert('Поставка обновлена. Все позиции учтены в «Надо купить». Остаток склада не изменился.')"
          if old not in s: raise SystemExit('anchor 3 not found')
          s=s.replace(old,new,1)

          old="if(currentText===sentText){clearWarehouseDirty();cloudStatus('синхронизировано','ok');setTimeout(()=>triggerImmediateWbStockSync(),50)}"
          new="if(currentText===sentText){clearWarehouseDirty();clearPurchaseDeleteTombstones();cloudStatus('синхронизировано','ok');setTimeout(()=>triggerImmediateWbStockSync(),50)}"
          if old not in s: raise SystemExit('anchor 4 not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q "purchase_delete_tombstones_v1" index.html
          grep -q "rememberPurchaseDeletes(removedIds)" index.html
      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Make purchase item deletion survive cloud merge'
          git push origin HEAD:main
