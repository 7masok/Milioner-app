name: Fix report period button handlers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-report-chip-handlers.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch period handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{selectedPeriodPreset=Number(b.dataset.period);"
          new="document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{selectedPeriodPreset=Number(b.dataset.period);"
          if old not in s:
              raise SystemExit('old global chip handler not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          sm=Path('.github/workflows/smoke-test.yml')
          t=sm.read_text(encoding='utf-8')
          marker="'data-report-period=\"1\"','function setReportPeriod(days)'"
          replacement="'data-report-period=\"1\"',\"document.querySelectorAll('[data-period]')\",'function setReportPeriod(days)'"
          if marker not in t:
              raise SystemExit('smoke marker not found')
          t=t.replace(marker,replacement,1)
          guard="          if 'Обновить из D1' in html: raise SystemExit('Technical D1 refresh button is visible')\n"
          add=guard+"          if \"document.querySelectorAll('.chip').forEach(b=>b.onclick\" in html: raise SystemExit('Global chip handler overrides report buttons')\n"
          if guard not in t:
              raise SystemExit('smoke guard not found')
          t=t.replace(guard,add,1)
          sm.write_text(t,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          if "document.querySelectorAll('.chip').forEach(b=>b.onclick" in html:
              raise SystemExit('report buttons are still overridden')
          if "document.querySelectorAll('[data-period]').forEach" not in html:
              raise SystemExit('home period handler missing')
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/smoke-test.yml
          git commit -m 'Fix report period button handlers'
          git push origin HEAD:main
