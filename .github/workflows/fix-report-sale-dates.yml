name: Fix report sale dates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-report-sale-dates.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use marketplace order dates in reports
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function financialSales(){return [...(state.sales||[])]}"
          new="""function financialSales(){const dates=new Map();for(const o of(state.kaspiOrderFeed||[])){const legacy=String(o.orderId)+':'+String(o.entryId),scoped='Kaspi:'+legacy,ts=Number(o.creationDate)||0;if(ts){dates.set(legacy,ts);dates.set(scoped,ts)}}for(const o of(state.wbOrderFeed||[])){const market=String(o.market||'WB'),key=market+':'+String(o.orderId)+':'+String(o.entryId),ts=Number(o.creationDate)||0;if(ts)dates.set(key,ts)}for(const o of(state.ozonOrderFeed||[])){const key='Ozon:'+String(o.orderId)+':'+String(o.entryId),ts=Number(o.creationDate)||0;if(ts)dates.set(key,ts)}return (state.sales||[]).map(s=>{const ts=s.externalKey?dates.get(String(s.externalKey)):0;return ts?{...s,date:ts}:s})}"""
          if old not in s: raise SystemExit('financialSales marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix marketplace report period dates'
          git push
