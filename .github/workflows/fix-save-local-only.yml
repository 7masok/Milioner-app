name: Fix missing local save helper
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-save-local-only.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add missing helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'function saveLocalOnly()' not in s:
              marker="function cloudStatus(text,mode='')"
              if marker not in s:
                  raise SystemExit('cloudStatus marker missing')
              helper="function saveLocalOnly(){localStorage.setItem(KEY,JSON.stringify(state))}\n"
              s=s.replace(marker,helper+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          if 'function saveLocalOnly(){localStorage.setItem(KEY,JSON.stringify(state))}' not in h:
              raise SystemExit('saveLocalOnly helper missing')
          scripts=re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Restore local save helper for cloud sync'
          git push origin HEAD:main
