name: Fix startup orders and tabs v5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-startup-orders-v5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_startup_orders_v5.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert "cloud-sync-v3.js?v=20260814v5" in html
          assert "const startupView=localStorage.getItem(ACTIVE_VIEW_KEY)||'home'" in html
          assert "setTimeout(()=>loadSharedOrderCache({silent:true}),0)" in html
          PY
          node --check /tmp/index-inline.js
          node --check cloud-sync-v3.js
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email actions@users.noreply.github.com
          git add index.html cloud-sync-v3.js cloudflare/millioner-api/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix startup orders and device-local tab state'
          git push origin HEAD:main
