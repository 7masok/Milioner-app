name: Fix startup orders v6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-startup-orders-v6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_startup_orders_v6.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert "const statusPromise=apiJson(MILLIONER_API+'/api/market-status').then" in html
          assert "save();render();" in html
          PY
          node --check /tmp/index-inline.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email actions@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Render marketplace orders before status completes'
          git push origin HEAD:main
