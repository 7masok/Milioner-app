name: Fix WB all periods
on:
  push:
    paths: ['.github/workflows/fix-wb-all-periods.yml']
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_wb_all_periods.py
      - run: node --check cloudflare/millioner-api/src/index.js
      - run: grep -q "sale_date" cloudflare/millioner-api/src/index.js
      - run: grep -q "Продажи уже есть, финансовый отчёт WB ещё ожидается" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/millioner-api/src/index.js index.html
          git diff --cached --quiet || git commit -m "Fix WB finance periods and sale dates"
          git push
