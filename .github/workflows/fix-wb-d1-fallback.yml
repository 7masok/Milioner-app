name: Add WB D1-independent fallback
on:
  push:
    paths: ['.github/workflows/fix-wb-d1-fallback.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker and UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/millioner-api/src/fixed.js'); s=p.read_text()
          old="""  } catch(e) {\n    return json({ok:false,market,days,error:String(e?.message||e)},500,request,env);\n  }\n}\n\n// WB_BUYOUTS_ANALYTICS_V1"""
          new="""  } catch(e) {\n    // D1 can fail independently of WB. Fall back to direct Seller Analytics so\n    // current buyout count/sum never becomes a fake zero just because D1 is down.\n    return wbAnalyticsBuyouts(request,env,url);\n  }\n}\n\n// WB_BUYOUTS_ANALYTICS_V1"""
          if old not in s: raise SystemExit('buyout endpoint catch block not found')
          s=s.replace(old,new,1)
          old2="""  const links=await env.DB.prepare('SELECT sku,product_id AS productId FROM product_links WHERE market=?').bind(market).all();\n  const linkMap=new Map((links.results||[]).map(x=>[String(x.sku||'').trim(),String(x.productId||'')]));"""
          new2="""  let linkMap=new Map();\n  try {\n    const links=await env.DB.prepare('SELECT sku,product_id AS productId FROM product_links WHERE market=?').bind(market).all();\n    linkMap=new Map((links.results||[]).map(x=>[String(x.sku||'').trim(),String(x.productId||'')]));\n  } catch(_) { /* D1 fallback: productId can be resolved in the browser state */ }"""
          # There are two copies: cached fetch and direct analytics. Patch direct analytics only by replacing last occurrence.
          idx=s.rfind(old2)
          if idx<0: raise SystemExit('analytics product links block not found')
          s=s[:idx]+new2+s[idx+len(old2):]
          p.write_text(s)

          p=Path('index.html'); h=p.read_text()
          old3="""async function ensureWbLiveOverview(market,days){\n  const key=market+':'+days,old=wbLiveOverviewCache[key];\n  if(old&&Date.now()-Number(old.at||0)<60000)return old.data;\n  try{const data=await apiJson(MILLIONER_API+'/api/wb-sales-live?market='+encodeURIComponent(market)+'&days='+encodeURIComponent(days));wbLiveOverviewCache[key]={at:Date.now(),data};return data}catch(e){wbLiveOverviewCache[key]={at:Date.now(),data:old?.data||null,error:String(e.message||e)};return old?.data||null}\n}"""
          new3="""async function ensureWbLiveOverview(market,days){\n  const key=market+':'+days,old=wbLiveOverviewCache[key];\n  if(old&&Date.now()-Number(old.at||0)<60000)return old.data;\n  try{\n    const data=await apiJson(MILLIONER_API+'/api/wb-sales-live?market='+encodeURIComponent(market)+'&days='+encodeURIComponent(days));\n    if(!data?.ok)throw new Error(data?.error||'WB sales unavailable');\n    wbLiveOverviewCache[key]={at:Date.now(),data};return data;\n  }catch(primary){\n    try{\n      const fallback=await apiJson(MILLIONER_API+'/api/wb-buyouts-live?market='+encodeURIComponent(market)+'&days='+encodeURIComponent(days)+'&refresh=1');\n      const data={...fallback,available:true,analyticsOnly:true,source:'WB Seller Analytics · buyouts fallback'};\n      wbLiveOverviewCache[key]={at:Date.now(),data};return data;\n    }catch(e){wbLiveOverviewCache[key]={at:Date.now(),data:old?.data||null,error:String(e.message||primary.message||e)};return old?.data||null}\n  }\n}"""
          if old3 not in h: raise SystemExit('ensureWbLiveOverview block not found')
          h=h.replace(old3,new3,1)
          h=h.replace("apiJson(MILLIONER_API+'/api/wb-sales-live?market='+encodeURIComponent(market)+'&days='+encodeURIComponent(periodDays)),","ensureWbLiveOverview(market,periodDays),",1)
          old4="""      }else if(live?.available===true){\n        qty=Number(live.buyoutCount||0);channelRev=Number(live.buyoutSum||0);financeLabel=' · выкупы WB';ensureWbFinanceSummary(n,reportPeriod);"""
          new4="""      }else if(live?.available===true){\n        qty=Number(live.buyoutCount||0);channelRev=Number(live.buyoutSum||0);if(live.analyticsOnly)channelProfit=null;financeLabel=' · выкупы WB';ensureWbFinanceSummary(n,reportPeriod);"""
          if old4 not in h: raise SystemExit('renderReports live block not found')
          h=h.replace(old4,new4,1)
          old5="""      const f=financeByKey.get(String(x.vendorCode||'').trim())||financeByKey.get(String(x.nmId||'').trim())||null,pid=String(x.productId||f?.productId||''),cost=pid?wbRealizedFifoCost(pid,market,periodDays,Number(x.qty)||0):0;"""
          new5="""      const f=financeByKey.get(String(x.vendorCode||'').trim())||financeByKey.get(String(x.nmId||'').trim())||null,field=market==='WB2'?'wb2':'wb',localProduct=(state.products||[]).find(p=>[x.vendorCode,String(x.nmId||''),x.barcode].map(v=>String(v||'').trim()).filter(Boolean).includes(String(p?.[field]||'').trim())),pid=String(x.productId||f?.productId||localProduct?.id||''),cost=pid?wbRealizedFifoCost(pid,market,periodDays,Number(x.qty)||0):0;"""
          if old5 not in h: raise SystemExit('WB row product mapping line not found')
          h=h.replace(old5,new5,1)
          old6="""      const preliminaryPayout=Number(x.forPay||0)||0,profit=preliminaryPayout-cost;\n      return {...x,productId:pid,cost,profit,exact:false,wbCharges:null,forPay:preliminaryPayout};"""
          new6="""      const hasPayout=Number.isFinite(Number(x.forPay))&&Number(x.forPay)>0,preliminaryPayout=hasPayout?Number(x.forPay):null,profit=preliminaryPayout===null?null:preliminaryPayout-cost;\n      return {...x,productId:pid,cost,profit,exact:false,wbCharges:null,forPay:preliminaryPayout};"""
          if old6 not in h: raise SystemExit('preliminary payout block not found')
          h=h.replace(old6,new6,1)
          old7="""    const qty=rows.reduce((a,x)=>a+Number(x.qty||0),0),profit=rows.reduce((a,x)=>a+Number(x.profit||0),0),allExact=rows.length>0&&rows.every(x=>x.exact);\n    const head=`<div class=\"item\"><div class=\"row\"><div class=\"grow\"><div class=\"label\">${allExact?'Чистая прибыль · факт WB':'Прибыль · предварительно'}</div><div class=\"num\">${fmt(profit)}</div></div>"""
          new7="""    const qty=rows.reduce((a,x)=>a+Number(x.qty||0),0),profitKnown=rows.length>0&&rows.every(x=>x.profit!==null&&Number.isFinite(Number(x.profit))),profit=rows.reduce((a,x)=>a+Number(x.profit||0),0),allExact=profitKnown&&rows.length>0&&rows.every(x=>x.exact);\n    const head=`<div class=\"item\"><div class=\"row\"><div class=\"grow\"><div class=\"label\">${!profitKnown?'Прибыль · уточняется':allExact?'Чистая прибыль · факт WB':'Прибыль · предварительно'}</div><div class=\"num\">${profitKnown?fmt(profit):'—'}</div></div>"""
          if old7 not in h: raise SystemExit('WB report head block not found')
          h=h.replace(old7,new7,1)
          old8="""if(rows.length){body=rows.sort((a,b)=>b.profit-a.profit).map((x,i)=>{const p=x.productId?prod(String(x.productId)):null,name=p?.name||x.title||x.vendorCode||('WB '+x.nmId),unit=Number(x.qty)?Number(x.profit)/Math.abs(Number(x.qty)):0;return `<div class=\"item\""""
          new8="""if(rows.length){body=rows.sort((a,b)=>Number(b.profit||0)-Number(a.profit||0)).map((x,i)=>{const p=x.productId?prod(String(x.productId)):null,name=p?.name||x.title||x.vendorCode||('WB '+x.nmId),rowProfitKnown=x.profit!==null&&Number.isFinite(Number(x.profit)),unit=rowProfitKnown&&Number(x.qty)?Number(x.profit)/Math.abs(Number(x.qty)):null;return `<div class=\"item\""""
          if old8 not in h: raise SystemExit('WB report row mapper block not found')
          h=h.replace(old8,new8,1)
          h=h.replace("<b>${fmt(unit)}</b></div><div class=\"right\"><div class=\"label\">${x.exact?'Чистая прибыль':'Предв. прибыль'}</div><b>${fmt(x.profit)}</b>","<b>${rowProfitKnown?fmt(unit):'—'}</b></div><div class=\"right\"><div class=\"label\">${rowProfitKnown?(x.exact?'Чистая прибыль':'Предв. прибыль'):'Прибыль'}</div><b>${rowProfitKnown?fmt(x.profit):'—'}</b>",1)
          p.write_text(h)
          PY
      - run: node --check cloudflare/millioner-api/src/fixed.js
      - name: Check browser JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(); m=re.search(r'<script>([\s\S]*?)</script>',s)
          Path('/tmp/app.js').write_text(m.group(1) if m else '')
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name 7masok
          git config user.email 7masok@gmail.com
          git add cloudflare/millioner-api/src/fixed.js index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fallback to WB analytics when D1 is unavailable'
          git push
