name: Fix WB realized sales source
on:
  push:
    paths: ['.github/workflows/fix-wb-realized-sales-source.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_wb_realized_sales_source.py
      - run: node --check cloudflare/millioner-api/src/fixed.js
      - name: Check browser JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/app.js
      - run: grep -q "WB Statistics · supplier/sales" cloudflare/millioner-api/src/fixed.js
      - run: grep -q "/api/wb-sales-live" index.html
      - run: |
          if git diff --quiet -- cloudflare/millioner-api/src/fixed.js index.html; then exit 0; fi
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add cloudflare/millioner-api/src/fixed.js index.html
          git commit -m 'Use realized WB sales for reports and cache safely'
          git push
