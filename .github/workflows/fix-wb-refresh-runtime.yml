name: Fix WB realized refresh runtime
on:
  push:
    paths: ['.github/workflows/fix-wb-refresh-runtime.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/millioner-api/src/fixed.js')
          s=p.read_text()
          s=s.replace("const WB_SALES_REFRESH_MS = 31 * 60 * 1000;","const WB_SALES_REFRESH_MS = 29 * 60 * 1000;")
          old="""  await ensureWbSalesCache(env.DB);\n  try {\n    if (url.searchParams.get('refresh') === '1') await syncWbSalesCache(env, market, { force: false });\n    return json(await readWbSalesCache(env, market, days),200,request,env);\n  } catch (e) {\n    return json({ok:false,market,days,error:String(e?.message||e)},500,request,env);\n  }"""
          new="""  try {\n    await ensureWbSalesCache(env.DB);\n    if (url.searchParams.get('refresh') === '1') await syncWbSalesCache(env, market, { force: false });\n    return json(await readWbSalesCache(env, market, days),200,request,env);\n  } catch (e) {\n    return json({ok:false,market,days,error:String(e?.message||e)},500,request,env);\n  }"""
          if old not in s: raise SystemExit('wbSalesLiveCached block not found')
          s=s.replace(old,new)
          old2="""async function wbBuyoutsCachedEndpoint(request,env,url){\n  const market=normalizeMarket(url.searchParams.get('market'));if(!['WB','WB2'].includes(market))return json({ok:false,error:'market must be WB or WB2'},400,request,env);\n  const raw=Number(url.searchParams.get('days')||1),days=raw===-1?-1:Math.max(1,Math.min(365,raw||1));\n  const refresh=url.searchParams.get('refresh')==='1';\n  const data=refresh?await refreshWbBuyoutCache(env,market,days,{force:false}):await readWbBuyoutCache(env,market,days);\n  return json(data,200,request,env);\n}"""
          new2="""async function wbBuyoutsCachedEndpoint(request,env,url){\n  const market=normalizeMarket(url.searchParams.get('market'));if(!['WB','WB2'].includes(market))return json({ok:false,error:'market must be WB or WB2'},400,request,env);\n  const raw=Number(url.searchParams.get('days')||1),days=raw===-1?-1:Math.max(1,Math.min(365,raw||1));\n  try {\n    const refresh=url.searchParams.get('refresh')==='1';\n    const data=refresh?await refreshWbBuyoutCache(env,market,days,{force:false}):await readWbBuyoutCache(env,market,days);\n    return json(data,200,request,env);\n  } catch(e) {\n    return json({ok:false,market,days,error:String(e?.message||e)},500,request,env);\n  }\n}"""
          if old2 not in s: raise SystemExit('wbBuyoutsCachedEndpoint block not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          PY
      - run: node --check cloudflare/millioner-api/src/fixed.js
      - name: Commit
        run: |
          git config user.name 7masok
          git config user.email 7masok@gmail.com
          git add cloudflare/millioner-api/src/fixed.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix WB realized refresh runtime and cadence'
          git push
