name: Fix WB reservation lifecycle once
on:
  push:
    branches: [codex/railway-migration]
    paths:
      - '.github/workflows/fix-wb-reservation-absence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/railway-migration
          fetch-depth: 0
      - name: Patch WB reservation handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('railway/src/wb-sync.js')
          s=p.read_text()
          old="""    if (source.startsWith('Wildberries Marketplace API')) {
      await cleanRecentLegacyStatisticsRows(market);
      await reconcileWarehouseReservations(market, rows);
    }
"""
          new="""    if (source.startsWith('Wildberries Marketplace API')) {
      await cleanRecentLegacyStatisticsRows(market);
      // /api/v3/orders/new is not a lifecycle feed: an order can disappear from
      // this endpoint before it is handed to WB. Absence must never release stock.
      // Reservations are closed only by an explicit delivery/cancel state.
    }
"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check railway/src/wb-sync.js
      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add railway/src/wb-sync.js
          git commit -m 'Keep WB reserve until explicit delivery or cancel'
          git push origin HEAD:codex/railway-migration
