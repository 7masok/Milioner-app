name: Fix WB sales cache
on:
  push:
    paths: ['.github/workflows/fix-wb-sales-cache.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_wb_sales_cache.py
      - name: Check Worker JS
        run: node --check cloudflare/millioner-api/src/fixed.js
      - name: Check browser JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app.js
      - name: Commit changes
        run: |
          if git diff --quiet -- cloudflare/millioner-api/src/fixed.js index.html; then echo 'No changes'; else
            git config user.name '7masok'
            git config user.email '7masok@gmail.com'
            git add cloudflare/millioner-api/src/fixed.js index.html
            git commit -m 'Cache WB realizations and fix report totals'
            git push
          fi
      - name: Deploy millioner-api
        working-directory: cloudflare/millioner-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy
      - name: Wait and verify WB live cache
        run: |
          sleep 75
          echo '=== WB1 today ==='
          curl -fsSL --retry 4 --retry-delay 5 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=1' | jq '{ok,market,netQty,sales,returns,lastSuccessAt,lastError,stale,products:(.products|length)}'
          echo '=== WB2 today ==='
          curl -fsSL --retry 4 --retry-delay 5 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB2&days=1' | jq '{ok,market,netQty,sales,returns,lastSuccessAt,lastError,stale,products:(.products|length)}'
