name: Fix WB sales duplicates
on:
  push:
    paths: ['.github/workflows/fix-wb-sales-duplicates.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/fix_wb_sales_join_duplicates.py
      - run: node --check cloudflare/millioner-api/src/fixed.js
      - run: |
          if git diff --quiet -- cloudflare/millioner-api/src/fixed.js; then exit 0; fi
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add cloudflare/millioner-api/src/fixed.js
          git commit -m 'Prevent duplicate WB realized sales aggregation'
          git push
