name: Fix WB transient resilience
on:
  push:
    paths:
      - .github/workflows/fix-wb-transient-resilience.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch current index safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function isWbRateLimit(error){return /\\b429\\b|too many requests|global limiter|rate limit/i.test(String(error||''))}"
          new="function isWbRateLimit(error){return /\\b429\\b|too many requests|global limiter|rate limit/i.test(String(error||''))}\nfunction isWbTransient(error){return isWbRateLimit(error)||/\\b5\\d\\d\\b|returned non-JSON|вернул не JSON|timeout|timed out|fetch failed|network|tls|ssl/i.test(String(error||''))}"
          if old not in s: raise SystemExit('isWbRateLimit marker not found')
          s=s.replace(old,new,1)

          old="""  else if(w?.latest&&isWbRateLimit(w.latest.error)){setIntegrationBadge('wbApiBadge','Лимит WB','warn');setDot('dotWb','warn');if(ws)ws.textContent=`Статус: Wildberries временно ограничил запросы. Сервер не спамит API и повторит после ${shortClock(w.nextSyncAt)}`}\n  else if(w?.latest){setIntegrationBadge('wbApiBadge','Ошибка','bad');setDot('dotWb','bad');if(ws)ws.textContent='Статус: '+String(w.latest.error||'ошибка фоновой синхронизации').slice(0,180)}"""
          new="""  else if(w?.latest&&isWbRateLimit(w.latest.error)){setIntegrationBadge('wbApiBadge','Лимит WB','warn');setDot('dotWb','warn');if(ws)ws.textContent=`Статус: Wildberries временно ограничил запросы. Сервер не спамит API и повторит после ${shortClock(w.nextSyncAt)}`}\n  else if(w?.latest&&isWbTransient(w.latest.error)){const cached=Number(w.orderLines||0)>0||Number(w.lastSuccessAt||0)>0;setIntegrationBadge('wbApiBadge',cached?'Последняя копия':'WB недоступен','warn');setDot('dotWb','warn');if(ws)ws.textContent=cached?`Статус: WB временно не отвечает. Склад работает по последней серверной копии · ${w.orderLines||0} строк · успех ${shortClock(w.lastSuccessAt)}. Следующая попытка ${shortClock(w.nextSyncAt)}`:`Статус: WB временно не отвечает. Сервер повторит после ${shortClock(w.nextSyncAt)}`}\n  else if(w?.latest){setIntegrationBadge('wbApiBadge','Ошибка','bad');setDot('dotWb','bad');if(ws)ws.textContent='Статус: '+String(w.latest.error||'ошибка фоновой синхронизации').slice(0,180)}"""
          if old not in s: raise SystemExit('WB render marker not found')
          s=s.replace(old,new,1)

          start=s.index('async function loadSharedOrderCache({silent=true}={})')
          end=s.index('\nasync function checkMarketStatus(market)',start)
          newfn="""async function loadSharedOrderCache({silent=true}={}){try{const status=await apiJson(MILLIONER_API+'/api/market-status');state.settings.serverMarketStatus={};for(const x of(status.markets||[]))state.settings.serverMarketStatus[x.market]=x;const [kdResult,wdResult]=await Promise.allSettled([apiJson(MILLIONER_API+'/api/orders?market=Kaspi&limit=500'),apiJson(MILLIONER_API+'/api/orders?market=WB&limit=500')]);let k=[],w=[],warnings=[];if(kdResult.status==='fulfilled'){k=normalizeServerFeed(kdResult.value.orders,'Kaspi');if(k.length){state.kaspiOrderFeed=mergeOrderFeeds(state.kaspiOrderFeed,k);applyMarketplaceTransitions('Kaspi',state.kaspiOrderFeed)}}else warnings.push('Kaspi: '+String(kdResult.reason?.message||kdResult.reason));if(wdResult.status==='fulfilled'){w=normalizeServerFeed(wdResult.value.orders,'WB');if(w.length){state.wbOrderFeed=mergeOrderFeeds(state.wbOrderFeed,w);applyMarketplaceTransitions('WB',state.wbOrderFeed)}}else warnings.push('WB: '+String(wdResult.reason?.message||wdResult.reason));const success=(status.markets||[]).map(x=>Number(x.lastSuccessAt||0)).filter(Boolean);if(success.length)state.settings.lastSync=Math.max(Number(state.settings.lastSync||0),...success);save();render();if(warnings.length)console.warn('Shared cache partial update',warnings.join('; '));return {kaspi:k.length,wb:w.length,status,warnings}}catch(e){console.error('Shared cache error',e);if(!silent)alert('Ошибка общей базы:\\n'+String(e.message||e));return {kaspi:0,wb:0,error:e}}}"""
          s=s[:start]+newfn+s[end:]

          old="if(market==='WB'&&isWbRateLimit(s.latest?.error))return alert(`WB подключён, но Wildberries включил лимит запросов.\\nМы больше не дёргаем API из браузера.\\nСледующая серверная попытка: ${shortClock(s.nextSyncAt)}`);alert(`${market}: ошибка фоновой синхронизации\\n${String(s.latest?.error||'неизвестная ошибка').slice(0,500)}`)"
          new="if(market==='WB'&&isWbRateLimit(s.latest?.error))return alert(`WB подключён, но Wildberries включил лимит запросов.\\nМы больше не дёргаем API из браузера.\\nСледующая серверная попытка: ${shortClock(s.nextSyncAt)}`);if(market==='WB'&&isWbTransient(s.latest?.error))return alert(`WB временно не отвечает.\\nСклад продолжает работать по последней серверной копии: ${s.orderLines||0} строк.\\nСледующая попытка: ${shortClock(s.nextSyncAt)}`);alert(`${market}: ошибка фоновой синхронизации\\n${String(s.latest?.error||'неизвестная ошибка').slice(0,500)}`)"
          if old not in s: raise SystemExit('checkMarketStatus marker not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
          node --check <(python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          print('\n'.join(re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)))
          PY
          )
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git rm .github/workflows/fix-wb-transient-resilience.yml
          git commit -m 'Keep warehouse usable during transient WB outages'
          git push origin main
