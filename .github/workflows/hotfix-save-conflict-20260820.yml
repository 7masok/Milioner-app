name: Hotfix warehouse save conflicts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-save-conflict-20260820.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore safe three-way merge on 409
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('cloud-sync-v3.js')
          s=p.read_text()
          old="""    if(response.status===409){
      const remote=await fetchServer(false,3);warehouseRemoteRevision=Number(remote.revision||0);warehouseRemoteUpdatedAt=Number(remote.updatedAt||0);
      warehouseLastCloudSnapshot=serverSnapshot(remote.state);warehouseLastSyncedText=snapshotText(remote.state);applyWarehouseSnapshot(remote.state);
      clearWarehouseDirty();setReadOnlyCache(false);writeFastCache(remote.state,warehouseRemoteRevision,warehouseRemoteUpdatedAt);render();cloudStatus('обновлено с сервера','ok');return false;
    }
"""
          new="""    if(response.status===409){
      // Never discard a local edit on a revision race. Merge from the last
      // common server snapshot, the new remote snapshot and the current local
      // snapshot, then retry against the new server revision.
      const remote=await fetchServer(false,3);
      const remoteSnap=serverSnapshot(remote.state),localSnap=serverSnapshot(state),baseSnap=serverSnapshot(warehouseLastCloudSnapshot||{});
      const mergedSnap=typeof mergeWarehouseSnapshots==='function'
        ? mergeWarehouseSnapshots(baseSnap,remoteSnap,localSnap,Number(remote.updatedAt||0),Date.now())
        : localSnap;
      warehouseRemoteRevision=Number(remote.revision||0);warehouseRemoteUpdatedAt=Number(remote.updatedAt||0);
      warehouseLastCloudSnapshot=remoteSnap;warehouseLastSyncedText=JSON.stringify(remoteSnap);
      applyWarehouseSnapshot(mergedSnap);markWarehouseDirty();setReadOnlyCache(false);render();
      cloudStatus('конфликт объединён · сохраняю…','warn');scheduleWarehouseSave(80);return false;
    }
"""
          if old not in s:
              raise SystemExit('expected unsafe 409 block not found; refusing to patch')
          p.write_text(s.replace(old,new,1))

          idx=Path('index.html')
          x=idx.read_text()
          oldv='./cloud-sync-v3.js?v=20260820-report-period-v3'
          newv='./cloud-sync-v3.js?v=20260820-save-conflict-v4'
          if oldv not in x and newv not in x:
              raise SystemExit('cloud-sync script tag not found; refusing to patch')
          if oldv in x:
              x=x.replace(oldv,newv,1)
              idx.write_text(x)
          PY
      - name: Validate patch
        run: |
          set -euo pipefail
          node --check cloud-sync-v3.js
          git diff --check
          grep -F "conflict-v4" index.html
          grep -F "conflict merged" cloud-sync-v3.js >/dev/null 2>&1 || grep -F "конфликт объединён" cloud-sync-v3.js
      - name: Commit hotfix
        run: |
          set -euo pipefail
          git config user.name 'millioner-save-hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud-sync-v3.js index.html
          git commit -m 'Preserve local warehouse edits on revision conflict'
          git push origin HEAD:main
