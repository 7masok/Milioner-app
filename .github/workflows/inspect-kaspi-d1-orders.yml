name: Inspect Kaspi D1 order cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-kaspi-d1-orders.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show order cache code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          needle='marketplace_order_lines'
          pos=0
          i=0
          while True:
            p=s.find(needle,pos)
            if p<0: break
            i+=1
            a=max(0,p-1200); b=min(len(s),p+2200)
            print('\n--- MATCH',i,'---\n',s[a:b])
            pos=p+len(needle)
          PY
