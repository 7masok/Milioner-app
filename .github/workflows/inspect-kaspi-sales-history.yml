name: Inspect stored Kaspi sales history
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-kaspi-sales-history.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect warehouse sales
        run: |
          curl -fSs --max-time 30 -H 'Origin: https://7masok.github.io' 'https://millioner-api.7masok.workers.dev/api/warehouse-state' -o /tmp/state.json
          python - <<'PY'
          import json,datetime
          d=json.load(open('/tmp/state.json')); s=(d.get('state') or {}).get('sales') or []
          ks=[x for x in s if str(x.get('market') or '').lower()=='kaspi']
          print('all sales',len(s),'kaspi',len(ks))
          if ks:
            dates=[float(x.get('date') or 0) for x in ks]
            print('date range',min(dates),max(dates))
            print('keys',sorted(set().union(*(x.keys() for x in ks[:20]))))
            print('recent',json.dumps(sorted(ks,key=lambda x:float(x.get('date') or 0),reverse=True)[:20],ensure_ascii=False)[:12000])
            tz=datetime.timezone(datetime.timedelta(hours=5)); start=datetime.datetime(2026,8,8,tzinfo=tz).timestamp()*1000; end=datetime.datetime(2026,8,15,tzinfo=tz).timestamp()*1000
            rows=[x for x in ks if start<=float(x.get('date') or 0)<end]
            print('week rows',len(rows),'revenue qtyprice',sum(float(x.get('qty') or 0)*float(x.get('price') or 0) for x in rows),'price-only',sum(float(x.get('price') or 0) for x in rows))
          PY
