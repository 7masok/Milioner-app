name: Inspect sales market labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-sales-markets.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        run: |
          curl -fSs --max-time 30 -H 'Origin: https://7masok.github.io' 'https://millioner-api.7masok.workers.dev/api/warehouse-state' -o /tmp/state.json
          python - <<'PY'
          import json,collections
          d=json.load(open('/tmp/state.json')); s=(d.get('state') or {}).get('sales') or []
          print('markets',collections.Counter(str(x.get('market')) for x in s))
          print('sources',collections.Counter(str(x.get('source')) for x in s).most_common(20))
          print('sample',json.dumps(s[-10:],ensure_ascii=False)[:8000])
          PY
