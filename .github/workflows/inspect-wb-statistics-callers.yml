name: Inspect WB statistics callers
on:
  push:
    paths: ['.github/workflows/inspect-wb-statistics-callers.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo '--- supplier/sales ---'
          grep -RniE 'supplier/sales|statistics-api|WB_STATISTICS|WB_STATS_BASE' . --exclude-dir=.git --exclude='*.map' || true
          echo '--- wb sync refs ---'
          grep -RniE 'wb-sync|WB_WORKER|fetchWb\(|syncMarket\(env.*WB|statistics' cloudflare .github --exclude-dir=.git || true
