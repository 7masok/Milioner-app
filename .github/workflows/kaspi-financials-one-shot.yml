name: One-shot Kaspi financial costs
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kaspi-financials-one-shot.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch current API and full current index
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return s.replace(old,new,1)

          # API: persist exact seller delivery cost and any explicit commission fields Kaspi returns.
          p=Path('cloudflare/millioner-api/src/index.js')
          api=p.read_text(encoding='utf-8')

          api=once(api,
          """                 o.unit_price AS unitPrice,o.total_price AS totalPrice,l.product_id AS productId""",
          """                 o.unit_price AS unitPrice,o.total_price AS totalPrice,o.seller_delivery_cost AS sellerDeliveryCost,\n                 o.marketplace_fee AS marketplaceFee,o.fee_source AS feeSource,l.product_id AS productId""",
          'orders select financial fields')

          api=once(api,
          """    `CREATE TABLE IF NOT EXISTS marketplace_order_lines (id INTEGER PRIMARY KEY AUTOINCREMENT,market TEXT NOT NULL,order_id TEXT NOT NULL,code TEXT NOT NULL DEFAULT '',entry_id TEXT NOT NULL,status TEXT NOT NULL DEFAULT '',state TEXT NOT NULL DEFAULT '',creation_date INTEGER NOT NULL DEFAULT 0,sku TEXT NOT NULL DEFAULT '',product_name TEXT NOT NULL DEFAULT '',qty REAL NOT NULL DEFAULT 0,unit_price REAL NOT NULL DEFAULT 0,total_price REAL NOT NULL DEFAULT 0,raw_json TEXT NOT NULL DEFAULT '',first_seen_at INTEGER NOT NULL,updated_at INTEGER NOT NULL,UNIQUE(market,order_id,entry_id))`,""",
          """    `CREATE TABLE IF NOT EXISTS marketplace_order_lines (id INTEGER PRIMARY KEY AUTOINCREMENT,market TEXT NOT NULL,order_id TEXT NOT NULL,code TEXT NOT NULL DEFAULT '',entry_id TEXT NOT NULL,status TEXT NOT NULL DEFAULT '',state TEXT NOT NULL DEFAULT '',creation_date INTEGER NOT NULL DEFAULT 0,sku TEXT NOT NULL DEFAULT '',product_name TEXT NOT NULL DEFAULT '',qty REAL NOT NULL DEFAULT 0,unit_price REAL NOT NULL DEFAULT 0,total_price REAL NOT NULL DEFAULT 0,seller_delivery_cost REAL NOT NULL DEFAULT 0,marketplace_fee REAL NOT NULL DEFAULT 0,fee_source TEXT NOT NULL DEFAULT '',raw_json TEXT NOT NULL DEFAULT '',first_seen_at INTEGER NOT NULL,updated_at INTEGER NOT NULL,UNIQUE(market,order_id,entry_id))`,""",
          'order table financial columns')

          api=once(api,
          """  for (const sql of statements) await db.prepare(sql).run();\n}""",
          """  for (const sql of statements) await db.prepare(sql).run();\n  await ensureColumn(db, 'marketplace_order_lines', 'seller_delivery_cost', 'REAL NOT NULL DEFAULT 0');\n  await ensureColumn(db, 'marketplace_order_lines', 'marketplace_fee', 'REAL NOT NULL DEFAULT 0');\n  await ensureColumn(db, 'marketplace_order_lines', 'fee_source', \"TEXT NOT NULL DEFAULT ''\");\n}\n\nasync function ensureColumn(db, table, column, definition) {\n  const info = await db.prepare(`PRAGMA table_info(${table})`).all();\n  if ((info.results || []).some(x => String(x.name) === column)) return;\n  await db.prepare(`ALTER TABLE ${table} ADD COLUMN ${column} ${definition}`).run();\n}""",
          'schema migration helper')

          old_append="""function appendKaspiLines(result, order, lines) {\n  for (const line of lines || []) {\n    const qty = Math.max(0, Number(line?.quantity || 1));\n    const total = Number(line?.totalPrice || (Number(line?.basePrice || 0) * qty) || 0);\n    result.push({\n      orderId: String(order?.id || ''), code: String(order?.code || ''), entryId: String(line?.entryId || line?.id || ''),\n      status: String(order?.status || ''), state: String(order?.state || ''), creationDate: toTimestamp(order?.creationDate),\n      sku: String(line?.merchantCode || line?.sku || '').trim(), productName: String(line?.productName || line?.name || ''), qty,\n      unitPrice: qty ? total / qty : Number(line?.basePrice || 0), totalPrice: total, raw: { order, line }\n    });\n  }\n}"""
          new_append="""function firstMoney(obj, keys) {\n  for (const key of keys) {\n    const value = Number(obj?.[key]);\n    if (Number.isFinite(value) && value > 0) return value;\n  }\n  return 0;\n}\nfunction kaspiExplicitCommission(obj) {\n  return firstMoney(obj, ['commissionAmount','commissionForSeller','sellerCommission','marketplaceFee','serviceFee','serviceCostForSeller','commission']);\n}\nfunction appendKaspiLines(result, order, lines) {\n  const prepared=(lines||[]).map(line=>{const qty=Math.max(0,Number(line?.quantity||1));const total=Number(line?.totalPrice||(Number(line?.basePrice||0)*qty)||0);return {line,qty,total}});\n  const revenue=prepared.reduce((a,x)=>a+Math.max(0,x.total),0);\n  const orderDelivery=Math.max(0,Number(order?.deliveryCostForSeller)||0);\n  const orderCommission=kaspiExplicitCommission(order);\n  for (const x of prepared) {\n    const {line,qty,total}=x;\n    const weight=revenue>0?Math.max(0,total)/revenue:(prepared.length?1/prepared.length:0);\n    const lineCommission=kaspiExplicitCommission(line);\n    const sellerDeliveryCost=orderDelivery*weight;\n    const marketplaceFee=lineCommission||orderCommission*weight;\n    const sources=[];\n    if(sellerDeliveryCost>0)sources.push('Kaspi API доставка');\n    if(marketplaceFee>0)sources.push('Kaspi API комиссия');\n    result.push({\n      orderId: String(order?.id || ''), code: String(order?.code || ''), entryId: String(line?.entryId || line?.id || ''),\n      status: String(order?.status || ''), state: String(order?.state || ''), creationDate: toTimestamp(order?.creationDate),\n      sku: String(line?.merchantCode || line?.sku || '').trim(), productName: String(line?.productName || line?.name || ''), qty,\n      unitPrice: qty ? total / qty : Number(line?.basePrice || 0), totalPrice: total, sellerDeliveryCost, marketplaceFee,\n      feeSource:sources.join(' + '), raw: { order, line }\n    });\n  }\n}"""
          api=once(api,old_append,new_append,'Kaspi line financial allocation')

          api=once(api,
          """    await env.DB.prepare(`\n      UPDATE marketplace_order_lines\n      SET status=?,state=?,creation_date=?,updated_at=?\n      WHERE market='Kaspi' AND order_id=?\n    `).bind(String(order?.status || ''),String(order?.state || ''),toTimestamp(order?.creationDate),now,orderId).run();""",
          """    await env.DB.prepare(`\n      UPDATE marketplace_order_lines\n      SET status=?,state=?,creation_date=?,updated_at=?\n      WHERE market='Kaspi' AND order_id=?\n    `).bind(String(order?.status || ''),String(order?.state || ''),toTimestamp(order?.creationDate),now,orderId).run();\n    await updateKaspiOrderFinancials(env.DB, order);""",
          'refresh existing order financials')

          marker="""async function fetchKaspiWorkerFeed(base, params, serviceBinding = null) {"""
          helper="""async function updateKaspiOrderFinancials(db, order) {\n  const orderId=String(order?.id||'').trim();\n  if(!orderId)return;\n  const rows=await db.prepare(`SELECT id,total_price AS totalPrice FROM marketplace_order_lines WHERE market='Kaspi' AND order_id=? AND entry_id<>'__pending__'`).bind(orderId).all();\n  const items=rows.results||[];\n  if(!items.length)return;\n  const revenue=items.reduce((a,x)=>a+Math.max(0,Number(x.totalPrice)||0),0);\n  const delivery=Math.max(0,Number(order?.deliveryCostForSeller)||0);\n  const commission=kaspiExplicitCommission(order);\n  if(delivery<=0&&commission<=0)return;\n  const statements=items.map(x=>{const weight=revenue>0?Math.max(0,Number(x.totalPrice)||0)/revenue:1/items.length;const d=delivery*weight,c=commission*weight;const source=[d>0?'Kaspi API доставка':'',c>0?'Kaspi API комиссия':''].filter(Boolean).join(' + ');return db.prepare('UPDATE marketplace_order_lines SET seller_delivery_cost=?,marketplace_fee=?,fee_source=?,updated_at=? WHERE id=?').bind(d,c,source,Date.now(),x.id)});\n  await db.batch(statements);\n}\n\n"""
          if marker not in api: raise SystemExit('worker marker missing')
          api=api.replace(marker,helper+marker,1)

          api=once(api,
          """    totalPrice: Number(order?.totalPrice || 0),\n    raw: { order, pending: true }""",
          """    totalPrice: Number(order?.totalPrice || 0),\n    sellerDeliveryCost: Math.max(0,Number(order?.deliveryCostForSeller)||0),\n    marketplaceFee: kaspiExplicitCommission(order),\n    feeSource: Math.max(0,Number(order?.deliveryCostForSeller)||0)>0?'Kaspi API доставка':'',\n    raw: { order, pending: true }""",
          'placeholder financials')

          api=once(api,
          """      (market,order_id,code,entry_id,status,state,creation_date,sku,product_name,qty,unit_price,total_price,raw_json,first_seen_at,updated_at)\n    VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
          """      (market,order_id,code,entry_id,status,state,creation_date,sku,product_name,qty,unit_price,total_price,seller_delivery_cost,marketplace_fee,fee_source,raw_json,first_seen_at,updated_at)\n    VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)""",
          'batched insert financial columns')
          api=once(api,
          """      total_price=excluded.total_price,raw_json=excluded.raw_json,updated_at=excluded.updated_at""",
          """      total_price=excluded.total_price,seller_delivery_cost=excluded.seller_delivery_cost,marketplace_fee=excluded.marketplace_fee,\n      fee_source=excluded.fee_source,raw_json=excluded.raw_json,updated_at=excluded.updated_at""",
          'batched update financial columns')
          api=once(api,
          """  return db.prepare(sql).bind(market,o.orderId,o.code,o.entryId,o.status,o.state,o.creationDate,o.sku,o.productName,o.qty,o.unitPrice,o.totalPrice,JSON.stringify(o.raw || {}),now,now);""",
          """  return db.prepare(sql).bind(market,o.orderId,o.code,o.entryId,o.status,o.state,o.creationDate,o.sku,o.productName,o.qty,o.unitPrice,o.totalPrice,Number(o.sellerDeliveryCost)||0,Number(o.marketplaceFee)||0,String(o.feeSource||''),JSON.stringify(o.raw || {}),now,now);""",
          'batched bind financial fields')

          api=once(api,
          """      (market,order_id,code,entry_id,status,state,creation_date,sku,product_name,qty,unit_price,total_price,raw_json,first_seen_at,updated_at)\n    VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)\n    ON CONFLICT(market,order_id,entry_id) DO UPDATE SET\n      code=excluded.code,status=excluded.status,state=excluded.state,creation_date=excluded.creation_date,\n      sku=excluded.sku,product_name=excluded.product_name,qty=excluded.qty,unit_price=excluded.unit_price,\n      total_price=excluded.total_price,raw_json=excluded.raw_json,updated_at=excluded.updated_at\n  `).bind(market,o.orderId,o.code,o.entryId,o.status,o.state,o.creationDate,o.sku,o.productName,o.qty,o.unitPrice,o.totalPrice,JSON.stringify(o.raw || {}),now,now).run();""",
          """      (market,order_id,code,entry_id,status,state,creation_date,sku,product_name,qty,unit_price,total_price,seller_delivery_cost,marketplace_fee,fee_source,raw_json,first_seen_at,updated_at)\n    VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)\n    ON CONFLICT(market,order_id,entry_id) DO UPDATE SET\n      code=excluded.code,status=excluded.status,state=excluded.state,creation_date=excluded.creation_date,\n      sku=excluded.sku,product_name=excluded.product_name,qty=excluded.qty,unit_price=excluded.unit_price,\n      total_price=excluded.total_price,seller_delivery_cost=excluded.seller_delivery_cost,marketplace_fee=excluded.marketplace_fee,fee_source=excluded.fee_source,raw_json=excluded.raw_json,updated_at=excluded.updated_at\n  `).bind(market,o.orderId,o.code,o.entryId,o.status,o.state,o.creationDate,o.sku,o.productName,o.qty,o.unitPrice,o.totalPrice,Number(o.sellerDeliveryCost)||0,Number(o.marketplaceFee)||0,String(o.feeSource||''),JSON.stringify(o.raw || {}),now,now).run();""",
          'single upsert financial fields')

          p.write_text(api,encoding='utf-8')

          # Front-end: re-read the complete current file before applying financial accounting changes.
          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          if '<!doctype html>' not in html or '</html>' not in html:
              raise SystemExit('index.html full read sanity check failed')

          old="""const existingSale=state.sales.some(x=>x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy));const existingReservation=state.reservations.find(x=>x.active&&x.source===market&&(x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy)));"""
          new="""const existingSale=state.sales.find(x=>x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy));const existingReservation=state.reservations.find(x=>x.active&&x.source===market&&(x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy)));const apiFeeTotal=Math.max(0,Number(o.marketplaceFee)||0)+Math.max(0,Number(o.sellerDeliveryCost)||0),apiFeePerUnit=qty?apiFeeTotal/qty:0;if(existingSale&&market==='Kaspi'&&apiFeeTotal>0){existingSale.fee=apiFeePerUnit;existingSale.feeSource=o.feeSource||'Kaspi API'}"""
          html=once(html,old,new,'existing Kaspi sale fee refresh')
          html=once(html,"""fee:0,channel:market""","""fee:apiFeePerUnit,feeSource:o.feeSource||'',channel:market""",'new marketplace sale fee')

          html=once(html,
          """<div class=\"muted\">${x.qty} шт. · себестоимость ${fmt(x.cost)} · прибыль ${fmt(x.profit)}</div>""",
          """<div class=\"muted\">${x.qty} шт. · себестоимость ${fmt(x.cost)} · расходы МП ${fmt(x.fees)} · прибыль ${fmt(x.profit)}</div>""",
          'market report expense visibility')

          p.write_text(html,encoding='utf-8')
          PY
      - name: Validate syntax and accounting contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          api=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          required=[
            'seller_delivery_cost','marketplace_fee','fee_source','updateKaspiOrderFinancials',
            'deliveryCostForSeller','kaspiExplicitCommission','apiFeeTotal','fee:apiFeePerUnit',
            'расходы МП ${fmt(x.fees)}'
          ]
          for marker in required:
            if marker not in html and marker not in api: raise SystemExit('missing '+marker)
          PY
          node --check /tmp/app.js
          node --check cloudflare/millioner-api/src/index.js
          git diff --check
      - name: Commit validated changes
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js
          git commit -m 'Account for Kaspi seller delivery costs in profit'
          git push origin HEAD:main
