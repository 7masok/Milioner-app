name: Morning production QA probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/morning-qa-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect writeoff implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['Недостаточно свободного остатка','Нельзя списать больше остатка','списание','writeoff','openModal(\'writeoff\')']:
              print('===',needle,'===')
              pos=s.find(needle)
              print('POS',pos)
              if pos>=0: print(s[max(0,pos-1200):pos+1800])
          PY
