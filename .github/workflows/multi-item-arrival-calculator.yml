name: Multi-item arrival calculator
on:
  push:
    paths:
      - .github/workflows/multi-item-arrival-calculator.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch form
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function arrivalForm()')
          end=s.index('\nfunction saleForm()',start)
          new=base64.b64decode('').decode()
          s=s[:start]+new+s[end:]
          old="else if(type==='arrival')s=arrivalForm();"
          repl="else if(type==='arrival'){s=arrivalForm();setTimeout(()=>{if(!document.querySelector('.arrival-item'))addArrivalItem()},0);}"
          if old not in s: raise SystemExit('arrival marker not found')
          s=s.replace(old,repl,1)
          s=re.sub(r'function enhanceArrivalProductSearch\(\)\{.*?\}\nconst arrivalSearchObserver=.*?;\n','function enhanceArrivalProductSearch(){}\n',s,flags=re.S)
          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          Path('.github/workflows/multi-item-arrival-calculator.yml').unlink()
          PY
      - name: Check JS
        run: node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Support multi-item arrivals with landed-cost calculator"
          git push origin HEAD:main
