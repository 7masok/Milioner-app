name: One-shot FIFO lot accounting v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fifo-lots-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch FIFO
        run: |
          echo '' | base64 -d > /tmp/patch_fifo.py
          python /tmp/patch_fifo.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          for marker in ['id="ar" type="date"','function fifoConsume(productId,qty)','remainingQty:q','fifoLots:fifo.lots']:
              if marker not in html: raise SystemExit('missing '+marker)
          PY
          node --check /tmp/app.js
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Track purchase lots and FIFO cost by arrival date'
          git push origin HEAD:main
