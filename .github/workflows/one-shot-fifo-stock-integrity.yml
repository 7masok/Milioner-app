name: One-shot FIFO stock integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fifo-stock-integrity.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: python .github/scripts/patch_fifo_stock_integrity.py
      - name: Validate browser code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I)),encoding='utf-8')
          for marker in ["batch:'Начальный остаток'","const fifo=fifoConsume(p.id,q)","batch:'Инвентаризация +'","refreshProductAverageCost(p);log('списание'"]:
            if marker not in h: raise SystemExit('missing '+marker)
          PY
          node --check /tmp/app.js
      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Keep FIFO lots consistent with stock adjustments'
          git push origin main
