name: One-time fix Kaspi new stage
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-fix-kaspi-new-stage.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Kaspi lifecycle mapping and guard it
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="if(u==='COMPLETED'||(u==='ACCEPTED_BY_MERCHANT'&&['KASPI_DELIVERY_TRANSIT','DELIVERY'].includes(st)))return 'delivery';if(u==='ASSEMBLE'||u==='ACCEPTED_BY_MERCHANT')return 'transfer';return 'new'"
          new="if(u==='COMPLETED'||st==='KASPI_DELIVERY_TRANSIT')return 'delivery';if(u==='ASSEMBLE')return 'transfer';return 'new'"
          if s.count(old)!=1:
              raise SystemExit(f'Kaspi lifecycle marker count={s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/smoke-test.yml')
          s=p.read_text(encoding='utf-8')
          marker="            'function marketplaceLifecycleStage(',\n"
          guard="            \"if(u==='COMPLETED'||st==='KASPI_DELIVERY_TRANSIT')return 'delivery';if(u==='ASSEMBLE')return 'transfer';return 'new'\",\n"
          if guard not in s:
              if s.count(marker)!=1:
                  raise SystemExit(f'smoke marker count={s.count(marker)}')
              s=s.replace(marker,marker+guard,1)
          stale="          if 'price:Number(old?.price)||Number(o.unitPrice)||0' in html:\n              raise SystemExit('Marketplace reports prefer stale sale price over current D1 price')\n"
          old_guard="          old_kaspi=\"if(u==='COMPLETED'||(u==='ACCEPTED_BY_MERCHANT'&&['KASPI_DELIVERY_TRANSIT','DELIVERY'].includes(st)))return 'delivery';if(u==='ASSEMBLE'||u==='ACCEPTED_BY_MERCHANT')return 'transfer';return 'new'\"\n          if old_kaspi in html:\n              raise SystemExit('Kaspi ACCEPTED_BY_MERCHANT must stay New until ASSEMBLE')\n"
          if old_guard not in s:
              if s.count(stale)!=1:
                  raise SystemExit(f'smoke stale-price marker count={s.count(stale)}')
              s=s.replace(stale,stale+old_guard,1)
          pub="              && grep -q \"else if(stage==='delivery')\" /tmp/site.html \\\n"
          pub_guard="              && grep -Fq \"if(u==='ASSEMBLE')return 'transfer';return 'new'\" /tmp/site.html \\\n"
          if pub_guard not in s:
              if s.count(pub)!=1:
                  raise SystemExit(f'published-site marker count={s.count(pub)}')
              s=s.replace(pub,pub+pub_guard,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          old="if(u==='COMPLETED'||(u==='ACCEPTED_BY_MERCHANT'&&['KASPI_DELIVERY_TRANSIT','DELIVERY'].includes(st)))return 'delivery';if(u==='ASSEMBLE'||u==='ACCEPTED_BY_MERCHANT')return 'transfer';return 'new'"
          new="if(u==='COMPLETED'||st==='KASPI_DELIVERY_TRANSIT')return 'delivery';if(u==='ASSEMBLE')return 'transfer';return 'new'"
          assert new in s
          assert old not in s
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit fix
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html .github/workflows/smoke-test.yml
          git rm .github/workflows/one-shot-fix-kaspi-new-stage.yml
          git commit -m 'Fix Kaspi new and transfer status mapping'
          git push
