name: One-time WB report price repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-fix-wb-report-price.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch WB report price precedence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="price:Number(old?.price)||Number(o.unitPrice)||0"
          new="price:Number(o.unitPrice)||Number(old?.price)||0"
          if s.count(old)!=1: raise SystemExit(f'report price marker count={s.count(old)}')
          s=s.replace(old,new,1)
          old2="const apiFeeTotal=Math.max(0,Number(o.marketplaceFee)||0)+Math.max(0,Number(o.sellerDeliveryCost)||0),apiFeePerUnit=qty?apiFeeTotal/qty:0;if(existingSale&&market==='Kaspi'&&apiFeeTotal>0){existingSale.fee=apiFeePerUnit;existingSale.feeSource=o.feeSource||'Kaspi API'}"
          new2="const apiFeeTotal=Math.max(0,Number(o.marketplaceFee)||0)+Math.max(0,Number(o.sellerDeliveryCost)||0),apiFeePerUnit=qty?apiFeeTotal/qty:0;if(existingSale&&Number(o.unitPrice)>0)existingSale.price=Number(o.unitPrice);if(existingSale&&market==='Kaspi'&&apiFeeTotal>0){existingSale.fee=apiFeePerUnit;existingSale.feeSource=o.feeSource||'Kaspi API'}"
          if s.count(old2)!=1: raise SystemExit(f'sale heal marker count={s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'price:Number(o.unitPrice)||Number(old?.price)||0' in s
          assert 'if(existingSale&&Number(o.unitPrice)>0)existingSale.price=Number(o.unitPrice)' in s
          PY
          node --check /tmp/app.js
      - name: Commit repair
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Fix inflated WB report revenue'
          git push
