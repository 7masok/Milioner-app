name: One-shot Google Drive backup v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-google-drive-backup-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: python .github/scripts/patch_google_drive.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/app.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Google Drive warehouse backups'
          git push origin HEAD:main
