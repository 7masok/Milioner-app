name: One-shot Google Drive backup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-google-drive-backup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch Google Drive backup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='''<div class="setting"><span>Google Drive</span><button class="btn" onclick="alert('Подключение Google Drive добавим на следующем этапе')">Подключить</button></div>'''
          new='''<div class="setting" style="display:block">
  <div class="integration-title"><b>Google Drive · резервные копии</b><span id="driveBadge" class="badge">Не настроен</span></div>
  <div class="muted">Копия содержит товары, партии FIFO, остатки, движения, продажи, резервы, привязки маркетплейсов и настройки. Используется доступ только к файлам, созданным этим приложением.</div>
  <div class="field"><label>Google OAuth Client ID (это публичный идентификатор, не секрет)</label><input id="googleClientId" class="worker-url" placeholder="1234567890-....apps.googleusercontent.com" onchange="saveGoogleClientId()"></div>
  <div id="driveStatus" class="muted integration-status">Статус: укажите Client ID и подключите Google Drive.</div>
  <div class="integration-actions"><button class="btn" onclick="connectGoogleDrive(true)">Подключить</button><button class="btn dark" onclick="backupToGoogleDrive(true)">Копия сейчас</button></div>
  <button class="btn full" onclick="showGoogleDriveBackups()">Восстановить из Google Drive</button>
</div>'''
          if s.count(old)!=1: raise SystemExit('Google Drive setting marker count '+str(s.count(old)))
          s=s.replace(old,new,1)

          old="""function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sklad-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}"""
          new=r'''let googleDriveAccessToken='';let googleDriveTokenExpiresAt=0;let googleDriveTokenClient=null;let googleIdentityPromise=null;
function driveClientId(){return String(state.settings.googleClientId||'').trim()}
function saveGoogleClientId(){const el=document.getElementById('googleClientId');if(!el)return;state.settings.googleClientId=el.value.trim();state.settings.googleDriveFolderId='';googleDriveAccessToken='';googleDriveTokenExpiresAt=0;googleDriveTokenClient=null;save();renderDriveStatus()}
function loadGoogleIdentity(){if(window.google?.accounts?.oauth2)return Promise.resolve();if(googleIdentityPromise)return googleIdentityPromise;googleIdentityPromise=new Promise((resolve,reject)=>{const existing=document.querySelector('script[data-millioner-google-identity]');if(existing){existing.addEventListener('load',resolve,{once:true});existing.addEventListener('error',()=>reject(new Error('Не удалось загрузить Google Identity Services')),{once:true});return}const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;sc.defer=true;sc.dataset.millionerGoogleIdentity='1';sc.onload=resolve;sc.onerror=()=>reject(new Error('Не удалось загрузить Google Identity Services'));document.head.appendChild(sc)});return googleIdentityPromise}
function validGoogleDriveToken(){return !!googleDriveAccessToken&&Date.now()<googleDriveTokenExpiresAt-60000}
async function getGoogleDriveToken(interactive=true){if(validGoogleDriveToken())return googleDriveAccessToken;const clientId=driveClientId();if(!clientId){if(interactive)alert('Сначала укажите Google OAuth Client ID в настройках.');throw new Error('Google OAuth Client ID не настроен')}await loadGoogleIdentity();return new Promise((resolve,reject)=>{googleDriveTokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/drive.file',callback:(resp)=>{if(resp?.error){reject(new Error(resp.error_description||resp.error));return}googleDriveAccessToken=resp.access_token||'';googleDriveTokenExpiresAt=Date.now()+(Number(resp.expires_in)||3600)*1000;renderDriveStatus();resolve(googleDriveAccessToken)}});try{googleDriveTokenClient.requestAccessToken({prompt:interactive?'consent':''})}catch(e){reject(e)}})}
async function connectGoogleDrive(interactive=true){try{await getGoogleDriveToken(interactive);await ensureGoogleBackupFolder();renderDriveStatus();if(interactive)alert('Google Drive подключён. Резервные копии можно создавать.') ;return true}catch(e){renderDriveStatus(String(e.message||e));if(interactive)alert('Google Drive: '+String(e.message||e));return false}}
async function googleDriveFetch(url,options={}){const token=await getGoogleDriveToken(false);const r=await fetch(url,{...options,headers:{...(options.headers||{}),Authorization:'Bearer '+token}});let data=null;const text=await r.text();if(text){try{data=JSON.parse(text)}catch{data=text}}if(!r.ok)throw new Error((data&&data.error&&data.error.message)||('Google Drive HTTP '+r.status));return data}
async function ensureGoogleBackupFolder(){if(state.settings.googleDriveFolderId)return state.settings.googleDriveFolderId;const q=encodeURIComponent("name='Millioner Backups' and mimeType='application/vnd.google-apps.folder' and trashed=false");const found=await googleDriveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&fields=files(id,name)&pageSize=10');let id=found?.files?.[0]?.id||'';if(!id){const created=await googleDriveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Millioner Backups',mimeType:'application/vnd.google-apps.folder'})});id=created?.id||''}if(!id)throw new Error('Не удалось создать папку резервных копий');state.settings.googleDriveFolderId=id;save();return id}
function backupPayload(){return {format:'millioner-warehouse-backup',version:3,createdAt:Date.now(),createdAtIso:new Date().toISOString(),state}}
async function createGoogleDriveBackupFile(){const folderId=await ensureGoogleBackupFolder(),name='millioner-backup-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';const meta=await googleDriveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name,createdTime',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,mimeType:'application/json',parents:[folderId]})});if(!meta?.id)throw new Error('Google Drive не создал файл');const token=await getGoogleDriveToken(false),r=await fetch('https://www.googleapis.com/upload/drive/v3/files/'+encodeURIComponent(meta.id)+'?uploadType=media',{method:'PATCH',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(backupPayload())});if(!r.ok){let msg='HTTP '+r.status;try{const e=await r.json();msg=e?.error?.message||msg}catch{}throw new Error(msg)}state.settings.lastGoogleBackupAt=Date.now();state.settings.lastGoogleBackupFile=name;save();renderDriveStatus();return {...meta,name}}
async function backupToGoogleDrive(interactive=true){try{if(!validGoogleDriveToken()){const ok=await connectGoogleDrive(interactive);if(!ok)return false}const file=await createGoogleDriveBackupFile();if(interactive)alert('Резервная копия сохранена в Google Drive:\n'+file.name);return true}catch(e){renderDriveStatus(String(e.message||e));if(interactive)alert('Не удалось создать копию в Google Drive:\n'+String(e.message||e));return false}}
async function listGoogleDriveBackups(){const folderId=await ensureGoogleBackupFolder(),q=encodeURIComponent("'"+folderId+"' in parents and trashed=false and name contains 'millioner-backup-'");const data=await googleDriveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&orderBy=createdTime%20desc&pageSize=20&fields=files(id,name,createdTime,size)');return data?.files||[]}
async function showGoogleDriveBackups(){try{if(!validGoogleDriveToken()){const ok=await connectGoogleDrive(true);if(!ok)return}const files=await listGoogleDriveBackups();const body=files.length?files.map(f=>`<button class="suggestion" onclick="restoreGoogleDriveBackup('${esc(f.id)}')"><b>${esc(f.name)}</b><div class="muted">${f.createdTime?new Date(f.createdTime).toLocaleString('ru-RU'):'—'}${f.size?' · '+Math.max(1,Math.round(Number(f.size)/1024))+' КБ':''}</div></button>`).join(''):'<div class="empty">Копий в Google Drive пока нет</div>';showSheet(`<h3>Резервные копии Google Drive</h3><div class="suggestions">${body}</div>`)}catch(e){alert('Google Drive: '+String(e.message||e))}}
function normalizeRestoredState(restored){restored.products||=[];restored.movements||=[];restored.sales||=[];restored.purchases||=[];restored.reservations||=[];restored.settings||={};restored.kaspiOrders||={};restored.kaspiOrderFeed||=[];restored.wbOrderFeed||=[];restored.ozonOrderFeed||=[];restored.marketOrderState||={};restored.marketplaceLiveSince||={};return restored}
async function restoreGoogleDriveBackup(fileId){if(!confirm('Восстановить склад из этой копии? Текущие локальные данные будут заменены.'))return;try{const token=await getGoogleDriveToken(true),r=await fetch('https://www.googleapis.com/drive/v3/files/'+encodeURIComponent(fileId)+'?alt=media',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw new Error('Google Drive HTTP '+r.status);const payload=await r.json(),restored=normalizeRestoredState(payload?.state||payload);const keep={googleClientId:state.settings.googleClientId,googleDriveFolderId:state.settings.googleDriveFolderId,lastGoogleBackupAt:state.settings.lastGoogleBackupAt,lastGoogleBackupFile:state.settings.lastGoogleBackupFile};restored.settings={...restored.settings,...keep};state=restored;save();closeModal();render();alert('Склад восстановлен из Google Drive')}catch(e){alert('Не удалось восстановить копию:\n'+String(e.message||e))}}
function renderDriveStatus(error=''){const id=document.getElementById('googleClientId'),badge=document.getElementById('driveBadge'),status=document.getElementById('driveStatus');if(id&&id.value!==driveClientId())id.value=driveClientId();if(!badge||!status)return;if(error){badge.textContent='Ошибка';badge.className='badge bad';status.textContent='Статус: '+error;return}if(!driveClientId()){badge.textContent='Не настроен';badge.className='badge';status.textContent='Статус: укажите Google OAuth Client ID и нажмите «Подключить».';return}if(validGoogleDriveToken()){badge.textContent='Подключён';badge.className='badge ok'}else{badge.textContent='Настроен';badge.className='badge warn'}const last=Number(state.settings.lastGoogleBackupAt||0);status.textContent='Статус: '+(validGoogleDriveToken()?'Google Drive доступен':'нужно подключение Google')+(last?' · последняя копия '+new Date(last).toLocaleString('ru-RU'):' · копий ещё нет')}
async function maybeAutoGoogleBackup(){if(state.settings.autoBackup===false||!driveClientId())return;const last=Number(state.settings.lastGoogleBackupAt||0);if(Date.now()-last<24*60*60*1000)return;try{await getGoogleDriveToken(false);await createGoogleDriveBackupFile()}catch(e){console.info('Google Drive autobackup ждёт подключения:',String(e.message||e));renderDriveStatus()}}
function backup(){let blob=new Blob([JSON.stringify(backupPayload(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sklad-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}'''
          if s.count(old)!=1: raise SystemExit('backup function marker count '+str(s.count(old)))
          s=s.replace(old,new,1)

          old="""function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);state.products||=[];state.movements||=[];state.sales||=[];state.purchases||=[];state.reservations||=[];state.settings||={};state.kaspiOrders||={};state.kaspiOrderFeed||=[];state.wbOrderFeed||=[];state.ozonOrderFeed||=[];save();render();alert('Восстановлено')}catch(e){alert('Неверная копия')}};r.readAsText(i.files[0])};i.click()}"""
          new="""function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{const payload=JSON.parse(r.result),restored=normalizeRestoredState(payload?.state||payload),keep={googleClientId:state.settings.googleClientId,googleDriveFolderId:state.settings.googleDriveFolderId,lastGoogleBackupAt:state.settings.lastGoogleBackupAt,lastGoogleBackupFile:state.settings.lastGoogleBackupFile};restored.settings={...restored.settings,...keep};state=restored;save();render();alert('Восстановлено')}catch(e){alert('Неверная копия')}};r.readAsText(i.files[0])};i.click()}"""
          if s.count(old)!=1: raise SystemExit('restore function marker count '+str(s.count(old)))
          s=s.replace(old,new,1)

          old="""  renderIntegrationStatus();
}"""
          new="""  renderIntegrationStatus();renderDriveStatus();
}"""
          if s.count(old)!=1: raise SystemExit('renderIntegrationStatus marker count '+str(s.count(old)))
          s=s.replace(old,new,1)

          old="""document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>openView(b.dataset.view,true));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{selectedPeriodPreset=Number(b.dataset.period);if(selectedPeriodPreset===0){let d=prompt('Количество дней для своего периода',String(state.settings.selectedPeriod||14));selectedPeriod=Math.max(1,+d||1)}else selectedPeriod=selectedPeriodPreset;state.settings.selectedPeriodPreset=selectedPeriodPreset;state.settings.selectedPeriod=selectedPeriod;save();render()});document.getElementById('autoBackup').onchange=e=>{state.settings.autoBackup=e.target.checked;save()};openView(state.settings.activeView||'home',false);loadSharedOrderCache({silent:true});setInterval(()=>loadSharedOrderCache({silent:true}),300000);"""
          new="""document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>openView(b.dataset.view,true));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{selectedPeriodPreset=Number(b.dataset.period);if(selectedPeriodPreset===0){let d=prompt('Количество дней для своего периода',String(state.settings.selectedPeriod||14));selectedPeriod=Math.max(1,+d||1)}else selectedPeriod=selectedPeriodPreset;state.settings.selectedPeriodPreset=selectedPeriodPreset;state.settings.selectedPeriod=selectedPeriod;save();render()});document.getElementById('autoBackup').onchange=e=>{state.settings.autoBackup=e.target.checked;save();if(e.target.checked)maybeAutoGoogleBackup()};openView(state.settings.activeView||'home',false);loadSharedOrderCache({silent:true});setTimeout(()=>maybeAutoGoogleBackup(),2500);setInterval(()=>loadSharedOrderCache({silent:true}),300000);setInterval(()=>maybeAutoGoogleBackup(),60*60*1000);"""
          if s.count(old)!=1: raise SystemExit('startup marker count '+str(s.count(old)))
          s=s.replace(old,new,1)

          old='<button class="btn full" onclick="backup()">Создать резервную копию</button><button class="btn full" onclick="restore()">Восстановить из копии</button>'
          new='<button class="btn full" onclick="backup()">Скачать копию на устройство</button><button class="btn full" onclick="restore()">Восстановить из файла</button>'
          if s.count(old)!=1: raise SystemExit('local backup buttons marker count '+str(s.count(old)))
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript and Drive markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          markers=['Google Drive · резервные копии','https://www.googleapis.com/auth/drive.file','function backupToGoogleDrive(interactive=true)','function restoreGoogleDriveBackup(fileId)','function maybeAutoGoogleBackup()','lastGoogleBackupAt','Скачать копию на устройство']
          for marker in markers:
              if marker not in html: raise SystemExit('missing '+marker)
          if 'client_secret' in html.lower(): raise SystemExit('Google client secret must not be in client')
          PY
          node --check /tmp/app.js
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Google Drive warehouse backups'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
