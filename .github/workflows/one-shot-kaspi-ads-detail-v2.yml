name: One-shot safe bundle conversion
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-ads-detail-v2.yml'
      - 'tools/patch_bundle_conversion.py'
permissions:
  contents: write
  actions: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe bundle conversion patch
        run: python tools/patch_bundle_conversion.py

      - name: Validate automatic simple-to-bundle conversion
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=[
            'function convertSimpleProductToBundle(p)',
            'старый самостоятельный остаток при сохранении будет безопасно обнулён',
            'bundleConvertedAt',
            'bundleConvertedQty',
            'такую закупку нельзя безопасно разложить по компонентам набора',
            "if(kind==='bundle'&&!wasBundle)convertSimpleProductToBundle(p)",
            'История закупок и продаж сохранится',
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing safe bundle conversion markers: '+', '.join(missing))
          if 'Сначала обнулите остаток обычного товара и завершите его активные заказы/закупки' in html:
              raise SystemExit('Old manual-zero conversion blocker is still active')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          app='\n'.join(scripts)
          Path('/tmp/app.js').write_text(app,encoding='utf-8')
          a=app.index('function convertSimpleProductToBundle(p)')
          b=app.index('function saveProductEdit(pid)',a)
          helper=app[a:b]
          test=helper+r'''
          let state={
            purchases:[
              {id:'l1',productId:'p',status:'received',remainingQty:3},
              {id:'l2',productId:'p',status:'received',remainingQty:2}
            ],
            movements:[]
          };
          const isBundleProduct=()=>false;
          const fifoLots=productId=>state.purchases.filter(x=>x.productId===productId&&x.status==='received'&&Number(x.remainingQty)>0);
          const log=(type,productId,qty,extra)=>state.movements.push({type,productId,qty,extra});
          const p={id:'p',name:'M&M набор',kind:'simple',stock:5,cost:500};
          convertSimpleProductToBundle(p);
          if(p.stock!==0)throw new Error('Standalone stock was not zeroed automatically');
          if(state.purchases.some(x=>Number(x.remainingQty)!==0))throw new Error('Old FIFO remainder was not archived');
          if(!state.purchases.every(x=>x.bundleConvertedAt&&Number(x.bundleConvertedQty)>0))throw new Error('FIFO conversion audit metadata missing');
          if(state.movements.length!==1||state.movements[0].type!=='инвентаризация'||state.movements[0].qty!==-5)throw new Error('Conversion audit movement is wrong');
          console.log('Safe automatic bundle conversion regression OK');
          '''
          Path('/tmp/bundle-conversion-regression.js').write_text(test,encoding='utf-8')
          PY
          node --check /tmp/app.js
          node /tmp/bundle-conversion-regression.js

      - name: Commit safe bundle conversion
        id: commit
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Convert existing products to bundles safely'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke test for committed main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
