name: One-shot fix Kaspi ad spend column
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-ads-detail-v2.yml'
permissions:
  contents: write
  actions: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prefer explicit advertising-expense column
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const costKey=(normalized.find(([,n])=>n==='стоимость')||normalized.find(([,n])=>/^стоимость\\b/.test(n))||normalized.find(([,n])=>/расход.*реклам|затрат.*реклам|стоимост.*реклам/.test(n)))?.[0];"
          new="const adCostKey=(normalized.find(([,n])=>/расход.*реклам|реклам.*расход|затрат.*реклам|реклам.*затрат|стоимост.*реклам/.test(n)))?.[0]||'',costKey=adCostKey||(normalized.find(([,n])=>n==='стоимость')||normalized.find(([,n])=>/^стоимость\\b/.test(n)))?.[0];"
          if s.count(old)!=1:
              raise SystemExit('Kaspi cost-column anchor changed; refusing unsafe patch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          if "const adCostKey=(normalized.find(([,n])=>/расход.*реклам" not in html:
              raise SystemExit('Explicit Kaspi advertising-cost priority missing')
          old="const costKey=(normalized.find(([,n])=>n==='стоимость')||normalized.find(([,n])=>/^стоимость\\b/.test(n))||normalized.find(([,n])=>/расход.*реклам|затрат.*реклам|стоимост.*реклам/.test(n)))?.[0];"
          if old in html:
              raise SystemExit('Old ambiguous Kaspi cost-column priority remains')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit corrected advertising column selection
        id: commit
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Prefer explicit Kaspi ad-spend column'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke test for committed main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
