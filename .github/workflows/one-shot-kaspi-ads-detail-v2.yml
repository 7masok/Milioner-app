name: One-shot fix Kaspi ad product matching
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-ads-detail-v2.yml'
permissions:
  contents: write
  actions: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe Kaspi ad product matching fix
        run: python tools/patch_kaspi_ads_name_match.py

      - name: Validate before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=[
            'function kaspiAdsNameKey(value)',
            "nn.includes(x.key)||x.key.includes(nn)",
            "candidates.length===1||candidates.length>1&&candidates[0].key.length>candidates[1].key.length",
            'function kaspiAdsMatchProduct(line)',
            'function kaspiAdsBreakdown(days=reportPeriod)'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing Kaspi ad name-match markers: '+', '.join(missing))
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          app='\n'.join(scripts)
          Path('/tmp/app.js').write_text(app,encoding='utf-8')
          def cut(a,b):
              i=app.index(a); j=app.index(b,i); return app[i:j]
          test=(
              cut('function adsSkuEqual(','function reportPeriodEnd(')+'\n'+
              cut('function kaspiAdsNameKey(','function kaspiAdsBreakdown(')+'\n'+
              cut('function normalizeName(','function marketplaceField(')+r'''
          const state={products:[
            {id:'p1',name:'Стикмэн Одно на двоих',kaspi:'979606368'},
            {id:'p2',name:'Стикмэн Две половинки',kaspi:'979606369'}
          ]};
          const prod=id=>state.products.find(p=>p.id===id);
          const exact=kaspiAdsMatchProduct({sku:'979606368',name:''});
          if(exact?.id!=='p1')throw new Error('Exact Kaspi SKU matching regressed');
          const internal=kaspiAdsMatchProduct({sku:'166859382',name:'Брелок LuxAr Стикмэн Одно на двоих металл 2 шт'});
          if(internal?.id!=='p1')throw new Error('Kaspi internal product id did not map by unique contained product name');
          const other=kaspiAdsMatchProduct({sku:'166859005',name:'Брелок LuxAr Стикмэн Две половинки металл 2 шт'});
          if(other?.id!=='p2')throw new Error('Second Kaspi product mapped incorrectly');
          console.log('Kaspi ad product-name matching regression OK');
          '''
          )
          Path('/tmp/kaspi-ads-name-match.js').write_text(test,encoding='utf-8')
          PY
          node --check /tmp/app.js
          node /tmp/kaspi-ads-name-match.js

      - name: Commit Kaspi ad product matcher
        id: commit
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Match Kaspi ad rows to warehouse products by unique name'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke test for committed main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
