name: One-shot add Reports Yesterday
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-ads-detail-v2.yml'
permissions:
  contents: write
  actions: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Reports Yesterday patch
        run: python tools/patch_reports_yesterday.py

      - name: Validate before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=[
            'data-report-period="-1"',
            "onclick=\"setReportPeriod(-1)\">Вчера</button>",
            'function reportPeriodEnd(days=1)',
            'end=reportPeriodEnd(days)',
            'Number(s.date)<until',
            "days===-1?'active':''",
            "setMarketplaceReportPeriod(-1)",
            "periodDays===-1?'вчера'"
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing Yesterday report markers: '+', '.join(missing))
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          app='\n'.join(scripts)
          Path('/tmp/app.js').write_text(app,encoding='utf-8')
          def line(prefix):
              hits=[x for x in app.splitlines() if x.startswith(prefix)]
              if len(hits)!=1: raise SystemExit(f'Expected one {prefix}, got {len(hits)}')
              return hits[0]
          regression=line('function reportPeriodStart(days){')+'\n'+line('function reportPeriodEnd(days=1){')+r'''
          const start=reportPeriodStart(-1),end=reportPeriodEnd(-1),todayStart=reportPeriodStart(1);
          if(!(start<end && end===todayStart))throw new Error('Yesterday bounds are not exact');
          if(reportPeriodEnd(1)<=todayStart)throw new Error('Today end is invalid');
          console.log('Reports Yesterday bounds OK');
          '''
          Path('/tmp/yesterday-regression.js').write_text(regression,encoding='utf-8')
          PY
          node --check /tmp/app.js
          node /tmp/yesterday-regression.js

      - name: Commit Reports Yesterday
        id: commit
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Add Yesterday period to reports'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke test for committed main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
