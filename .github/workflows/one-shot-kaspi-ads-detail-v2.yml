name: One-shot validate Kaspi ads against overview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-ads-detail-v2.yml'
permissions:
  contents: write
  actions: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add overview reconciliation to Kaspi ads import
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start_marker='function openKaspiAdsImport()'
          end_marker='function removeKaspiAdsBatch('
          if s.count(start_marker)!=1 or s.count(end_marker)!=1:
              raise SystemExit('Kaspi ads import markers changed; refusing unsafe patch')
          start=s.index(start_marker)
          end=s.index(end_marker,start)
          new=r'''function openKaspiAdsImport(){const today=localDateInputValue();showSheet(`<h3>Реклама Kaspi · по товарам</h3><div class="link-note"><b>Теперь импорт сверяется с обзорным отчётом.</b> Первый файл — «Отчёт по товарам» для распределения рекламы по SKU. Второй файл — «Обзорный отчёт» за тот же период: он используется только как контроль общей суммы и не распределяет расход по товарам. Если суммы не сходятся, импорт будет остановлен.</div><div class="two"><div class="field"><label>Дата от</label><input id="kaspiAdsFrom" type="date" value="${today}"></div><div class="field"><label>Дата до</label><input id="kaspiAdsTo" type="date" value="${today}"></div></div><div class="field"><label>1. Отчёт по товарам Excel/CSV</label><input id="kaspiAdsFile" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"></div><div class="field"><label>2. Обзорный отчёт Excel/CSV для сверки</label><input id="kaspiAdsControlFile" type="file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"></div><div class="link-note">Обзорный файл обязателен: приложение само выберет в товарном отчёте колонку расходов, сумма которой совпадает с «Расходы на рекламу» в обзорном отчёте. Так цена товара или сумма заказов больше не сможет попасть в рекламу.</div><button class="btn dark full" onclick="importKaspiAdsFile()">Сверить и импортировать</button>`)}
async function kaspiAdsHash(buffer){try{if(!crypto?.subtle)return '';const digest=await crypto.subtle.digest('SHA-256',buffer.slice(0));return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return ''}}
async function kaspiAdsTextHash(text){try{const data=new TextEncoder().encode(String(text||''));return await kaspiAdsHash(data.buffer)}catch{return ''}}
async function kaspiAdsParseFile(file,XLSX){const buffer=await file.arrayBuffer(),workbook=XLSX.read(buffer,{type:'array',cellDates:true}),sheet=workbook.Sheets[workbook.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:true});if(!rows.length)throw new Error(`В файле «${file.name}» нет строк`);const headers=[...new Set(rows.flatMap(r=>Object.keys(r)))],normalized=headers.map(k=>[k,adsColumn(k)]);return {buffer,rows,headers,normalized}}
function kaspiAdsOverviewTotals(parsed){const dateKey=(parsed.normalized.find(([,n])=>n==='дата')||parsed.normalized.find(([,n])=>/^дата\b|^день\b|^date\b/.test(n)))?.[0]||'',costKey=(parsed.normalized.find(([,n])=>/^расход.*реклам|^реклам.*расход|затрат.*реклам|реклам.*затрат/.test(n)))?.[0]||'';if(!dateKey||!costKey)throw new Error('В обзорном отчёте нужны колонки «Дата» и «Расходы на рекламу».');const daily={};for(const row of parsed.rows){const date=kaspiAdsIsoDate(row[dateKey]),raw=String(row[costKey]??'').trim();if(!date||!raw)continue;daily[date]=(daily[date]||0)+adsMoney(row[costKey])}if(!Object.keys(daily).length)throw new Error('В обзорном отчёте не найден рекламный расход по датам.');return {daily,dateKey,costKey}}
function kaspiAdsPickCostColumn(rows,headers,normalized,{skuKey,nameKey,dateKey,campaignKey,controlDaily,fallbackFrom,fallbackTo}){const expectedDates=Object.keys(controlDaily||{}).filter(d=>d>=fallbackFrom&&d<=fallbackTo).sort();if(!expectedDates.length)throw new Error(`В обзорном отчёте нет данных за ${fallbackFrom}${fallbackTo!==fallbackFrom?' — '+fallbackTo:''}.`);const expectedTotal=expectedDates.reduce((n,d)=>n+(Number(controlDaily[d])||0),0),excluded=new Set([skuKey,nameKey,dateKey,campaignKey].filter(Boolean)),explicit=(normalized.find(([,n])=>/расход.*реклам|реклам.*расход|затрат.*реклам|реклам.*затрат|стоимост.*реклам/.test(n)))?.[0]||'',candidates=[];for(const [key,n] of normalized){if(excluded.has(key))continue;if(/заказ|выруч|продаж|оборот|цена товара|стоимость товара|средн.*стоим|ср.*стоим/.test(n))continue;if(/расход|затрат|стоим|cost|spend|сумм|бюджет/.test(n))candidates.push(key)}if(explicit&&!candidates.includes(explicit))candidates.unshift(explicit);if(!candidates.length)throw new Error('В отчёте по товарам не найдено ни одной подходящей колонки расходов.');let best=null;for(const key of candidates){const actual=Object.fromEntries(expectedDates.map(d=>[d,0]));let used=0;for(const row of rows){const rowText=headers.map(k=>String(row[k]??'')).join(' ').trim();if(/(^|\s)(итого|всего|total)(\s|$)/i.test(rowText))continue;const sku=skuKey?String(row[skuKey]??'').trim():'',name=nameKey?String(row[nameKey]??'').trim():'';if(!sku&&!name)continue;const raw=String(row[key]??'').trim();if(!raw)continue;let date=dateKey?kaspiAdsIsoDate(row[dateKey]):'';if(!date&&fallbackFrom===fallbackTo)date=fallbackFrom;if(!date||!Object.prototype.hasOwnProperty.call(actual,date))continue;actual[date]+=adsMoney(row[key]);used++}const score=expectedDates.reduce((n,d)=>n+Math.abs((actual[d]||0)-(Number(controlDaily[d])||0)),0),total=expectedDates.reduce((n,d)=>n+(actual[d]||0),0);if(!best||score<best.score)best={key,score,total,actual,used}}const tolerance=Math.max(2,expectedTotal*0.01);if(!best||best.score>tolerance){const found=best?`${best.key}: ${fmt(best.total)}`:'нет кандидата';throw new Error(`Сумма товарного отчёта не сходится с обзорным. Обзорный: ${fmt(expectedTotal)}. Лучшее совпадение: ${found}. Импорт остановлен.`)}return {...best,expectedTotal,tolerance}}
async function importKaspiAdsFile(){const input=document.getElementById('kaspiAdsFile'),file=input?.files?.[0],controlFile=document.getElementById('kaspiAdsControlFile')?.files?.[0]||null,fromDate=document.getElementById('kaspiAdsFrom')?.value||'',toDate=document.getElementById('kaspiAdsTo')?.value||'';if(!file)return alert('Выберите «Отчёт по товарам» Kaspi');if(!controlFile)return alert('Добавьте «Обзорный отчёт» за тот же период для контрольной суммы');const a=orderDayStart(fromDate),b=orderDayStart(toDate);if(a===null||b===null)return alert('Укажите дату отчёта');const fallbackFrom=a<=b?fromDate:toDate,fallbackTo=a<=b?toDate:fromDate;try{const XLSX=await loadXlsxLibrary(),parsed=await kaspiAdsParseFile(file,XLSX),controlParsed=await kaspiAdsParseFile(controlFile,XLSX),control=kaspiAdsOverviewTotals(controlParsed),rows=parsed.rows,headers=parsed.headers,normalized=parsed.normalized;const skuKey=(normalized.find(([,n])=>n==='sku'||n==='артикул')||normalized.find(([,n])=>/\bsku\b|артикул|код товара/.test(n)))?.[0]||'',nameKey=(normalized.find(([,n])=>/^наименование товара$|^название товара$|^товар$/.test(n))||normalized.find(([,n])=>/наименован.*товар|назван.*товар/.test(n)))?.[0]||'',dateKey=(normalized.find(([,n])=>n==='дата')||normalized.find(([,n])=>/^дата\b|^день\b|^date\b/.test(n)))?.[0]||'',campaignKey=(normalized.find(([,n])=>/кампан/.test(n)))?.[0]||'';if(!skuKey&&!nameKey)throw new Error('Первый файл не похож на «Отчёт по товарам»: нет SKU/артикула или названия товара.');if(!dateKey&&fallbackFrom!==fallbackTo)throw new Error('В отчёте по товарам нет даты по строкам. Для такого файла импортируйте один день за раз.');const picked=kaspiAdsPickCostColumn(rows,headers,normalized,{skuKey,nameKey,dateKey,campaignKey,controlDaily:control.daily,fallbackFrom,fallbackTo}),costKey=picked.key,sourceKey=kaspiAdsSourceKey(file.name),detail=[];let unidentified=0,used=0;for(const row of rows){const rowText=headers.map(k=>String(row[k]??'')).join(' ').trim();if(/(^|\s)(итого|всего|total)(\s|$)/i.test(rowText))continue;const amount=adsMoney(row[costKey]);if(!(amount>0))continue;const sku=skuKey?String(row[skuKey]??'').trim():'',name=nameKey?String(row[nameKey]??'').trim():'',campaign=campaignKey?String(row[campaignKey]??'').trim():'';if(!sku&&!name){unidentified+=amount;continue}let date=dateKey?kaspiAdsIsoDate(row[dateKey]):'';if(!date){if(fallbackFrom===fallbackTo)date=fallbackFrom;else throw new Error('Есть строки расхода без корректной даты. Выгрузите один день либо файл с колонкой «Дата».')}const p=kaspiAdsMatchProduct({sku,name});detail.push({date,productId:p?.id||null,sku,name:p?.name||name,campaign,source:campaign||sourceKey,amount});used++}if(unidentified>0)throw new Error(`Есть рекламный расход ${fmt(unidentified)} без товара/SKU. Такой файл нельзя надёжно распределить по товарам.`);if(!detail.length)throw new Error('Не найдено строк с рекламным расходом по товарам');const grouped=new Map();for(const line of detail){const key=[line.date,line.source,String(line.sku||'').toLowerCase(),normalizeName(line.name),String(line.productId||'')].join('|');const old=grouped.get(key);if(old)old.amount+=line.amount;else grouped.set(key,{...line})}const lines=[...grouped.values()].sort((x,y)=>String(x.date).localeCompare(String(y.date))||String(x.source).localeCompare(String(y.source))||String(x.sku).localeCompare(String(y.sku))||String(x.name).localeCompare(String(y.name))),total=lines.reduce((n,x)=>n+(Number(x.amount)||0),0),dates=lines.map(x=>x.date).filter(Boolean).sort(),actualFrom=dates[0]||fallbackFrom,actualTo=dates[dates.length-1]||fallbackTo,controlTotal=Object.keys(control.daily).filter(d=>d>=actualFrom&&d<=actualTo).reduce((n,d)=>n+(Number(control.daily[d])||0),0),controlTolerance=Math.max(2,controlTotal*0.01);if(Math.abs(total-controlTotal)>controlTolerance)throw new Error(`После разбора сумма не сошлась: товары ${fmt(total)}, обзорный отчёт ${fmt(controlTotal)}. Импорт остановлен.`);const canonical=lines.map(x=>[x.date,x.source,String(x.sku||'').trim().toLowerCase(),normalizeName(x.name),Math.round((Number(x.amount)||0)*100)/100]),detailHash=await kaspiAdsTextHash(JSON.stringify(canonical)),hash=await kaspiAdsHash(parsed.buffer),controlHash=await kaspiAdsHash(controlParsed.buffer);if((state.kaspiAdExpenses||[]).some(x=>(detailHash&&x.detailHash===detailHash)||(hash&&x.hash===hash&&x.parserVersion==='overview-reconciled-v1')))return alert('Этот сверенный детальный отчёт уже импортирован. Повторный импорт заблокирован.');const perProductMap=new Map();let unmatchedAmount=0;for(const line of lines){const p=kaspiAdsMatchProduct(line);if(p){line.productId=p.id;const old=perProductMap.get(p.id)||{productId:p.id,sku:line.sku,name:p.name,amount:0};old.amount+=line.amount;perProductMap.set(p.id,old)}else unmatchedAmount+=line.amount}const batch={id:'ads-'+id(),market:'Kaspi',source:'Kaspi Marketing detail',sourceKey,fileName:file.name,hash,detailHash,controlFileName:controlFile.name,controlHash,controlTotal,costColumn:costKey,parserVersion:'overview-reconciled-v1',fromDate:actualFrom,toDate:actualTo,amount:total,rowsCount:used,lines,perProduct:[...perProductMap.values()],unmatchedAmount,importedAt:Date.now()};state.kaspiAdExpenses.push(batch);save();closeModal();renderReports();alert(`Реклама Kaspi сверена и импортирована.\nПериод: ${actualFrom} — ${actualTo}\nРасход: ${fmt(total)}\nКонтроль обзорного: ${fmt(controlTotal)}\nКолонка расходов: ${costKey}\nСтрок по товарам: ${lines.length}\nПривязано: ${fmt(total-unmatchedAmount)}${unmatchedAmount>0?'\nБез привязки: '+fmt(unmatchedAmount):''}`)}catch(e){alert('Не удалось импортировать рекламу Kaspi:\n'+String(e.message||e))}}
'''
          s=s[:start]+new+s[end:]
          old_hist="<div class=\"muted\">Без привязки при импорте: ${fmt(x.unmatchedAmount||0)}</div>"
          new_hist="<div class=\"muted\">Без привязки при импорте: ${fmt(x.unmatchedAmount||0)}</div>${x.costColumn?`<div class=\"muted\">Колонка расходов: ${esc(x.costColumn)}${x.controlTotal!=null?' · сверка '+fmt(x.controlTotal):''}</div>`:''}"
          if s.count(old_hist)!=1:
              raise SystemExit('Kaspi ads history anchor changed; refusing unsafe patch')
          s=s.replace(old_hist,new_hist,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=[
            'kaspiAdsControlFile',
            'function kaspiAdsOverviewTotals(',
            'function kaspiAdsPickCostColumn(',
            "parserVersion:'overview-reconciled-v1'",
            'Сумма товарного отчёта не сходится с обзорным',
            'Контроль обзорного:',
            'Колонка расходов:'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing overview-reconciliation markers: '+', '.join(missing))
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit overview-reconciled advertising import
        id: commit
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Reconcile Kaspi ad detail with overview total'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke test for committed main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
