name: One-shot fix Kaspi ad cost header
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-ads-detail-v2.yml'
permissions:
  contents: write
  actions: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Kaspi ad cost-header fix
        run: python tools/patch_kaspi_ads_cost_header.py

      - name: Validate before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=[
            'function kaspiAdsParseDelimitedText(',
            "new TextDecoder('utf-8').decode(buffer)",
            "n==='рекламируемый товар'",
            "parserVersion:'kaspi-product-csv-v2'",
            '^расход.*реклам|^реклам.*расход|затрат.*реклам|реклам.*затрат|стоимост.*реклам',
            'Расходы на рекламу',
            'Рекламируемый товар'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing Kaspi product-CSV markers: '+', '.join(missing))
          old='^расход.*реклам$|^реклам.*расход$|затрат.*реклам|реклам.*затрат|стоимост.*реклам'
          if old in html: raise SystemExit('Old strict Kaspi ad cost-header matcher remains')
          forbidden=['kaspiAdsControlFile','function kaspiAdsOverviewTotals(','function kaspiAdsPickCostColumn(']
          present=[x for x in forbidden if x in html]
          if present: raise SystemExit('Old overview-reconciliation code remains: '+', '.join(present))
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          app='\n'.join(scripts)
          Path('/tmp/app.js').write_text(app,encoding='utf-8')
          def cut(a,b):
              i=app.index(a); j=app.index(b,i); return app[i:j]
          regression=cut('function adsMoney(','function adsSkuEqual(')+"\n"+cut('function kaspiAdsParseDelimitedText(','async function kaspiAdsParseFile(')+r'''
          const sample='\uFEFFРекламируемый товар;Товар;Расходы на рекламу\r\n166859382;Товар 1;164,69\r\n166859005;Товар 2;166,06\r\n';
          const rows=kaspiAdsParseDelimitedText(sample);
          if(rows.length!==2)throw new Error('CSV row count mismatch');
          if(rows[0]['Рекламируемый товар']!=='166859382')throw new Error('Kaspi product id lost');
          if(rows[0]['Расходы на рекламу']!=='164,69')throw new Error('Decimal comma was mutated');
          const normalized=Object.keys(rows[0]).map(k=>[k,adsColumn(k)]);
          const hit=normalized.find(([,n])=>/^расход.*реклам|^реклам.*расход|затрат.*реклам|реклам.*затрат|стоимост.*реклам/.test(n));
          const adCostKey=hit?.[0]||'';
          if(adCostKey!=='Расходы на рекламу')throw new Error('Advertising cost header was not detected: '+adCostKey);
          const total=rows.reduce((n,r)=>n+adsMoney(r[adCostKey]),0);
          if(Math.abs(total-330.75)>1e-9)throw new Error('Advertising total mismatch: '+total);
          console.log('Kaspi ad header + decimal-comma regression OK:',adCostKey,total);
          '''
          Path('/tmp/kaspi-ads-regression.js').write_text(regression,encoding='utf-8')
          PY
          node --check /tmp/app.js
          node /tmp/kaspi-ads-regression.js

      - name: Commit corrected Kaspi ad header matcher
        id: commit
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Accept Kaspi ad expense header endings'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke test for committed main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
