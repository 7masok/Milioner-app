name: One-shot reusable product categories
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-ads-detail-v2.yml'
      - 'tools/patch_category_picker.py'
permissions:
  contents: write
  actions: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reusable category picker patch
        run: python tools/patch_category_picker.py

      - name: Validate category reuse behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          required=[
            "function knownCategories(selected='')",
            "function categoryPickerHtml(selectId,inputId,selected='')",
            'function rememberCategory(value)',
            "categoryPickerHtml('pc','pcnew')",
            "categoryPickerHtml('ec','ecnew',p.category||'')",
            "readCategoryPicker('pc','pcnew')",
            "readCategoryPicker('ec','ecnew')",
            '＋ Новая категория',
            'Без категории'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing category-picker markers: '+', '.join(missing))
          if '<label>Категория</label><input id="pc">' in html or '<label>Категория</label><input id="ec"' in html:
              raise SystemExit('Old free-text category field is still active')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          app='\n'.join(scripts)
          Path('/tmp/app.js').write_text(app,encoding='utf-8')
          i=app.index("function knownCategories(selected='')")
          j=app.index('function stockTotal()',i)
          helpers=app[i:j]
          test=helpers+r'''
          let state={settings:{categories:['Брелоки']},products:[{category:'Авто'},{category:'брелоки'},{category:''}]};
          const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
          let cats=knownCategories();
          if(cats.length!==2||!cats.includes('Брелоки')||!cats.includes('Авто'))throw new Error('Existing categories were not collected/deduplicated');
          rememberCategory('Ножи'); rememberCategory('ножи');
          if(state.settings.categories.filter(x=>x.toLowerCase()==='ножи').length!==1)throw new Error('Remembered category duplicated');
          const opts=categoryOptions('Брелоки');
          if(!opts.includes('Брелоки')||!opts.includes('selected')||!opts.includes('＋ Новая категория'))throw new Error('Category options are incomplete');
          console.log('Reusable category regression OK');
          '''
          Path('/tmp/category-regression.js').write_text(test,encoding='utf-8')
          PY
          node --check /tmp/app.js
          node /tmp/category-regression.js

      - name: Commit reusable categories
        id: commit
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Reuse saved product categories'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke test for committed main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
