name: One-shot exact Kaspi ads detail import
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-ads-detail-v2.yml'
permissions:
  contents: write
  actions: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrow Kaspi ads patch
        run: python tools/patch_kaspi_ads_detail_v2.py

      - name: Validate before commit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          required=[
            'function kaspiAdsIsoDate(',
            'function kaspiAdsMatchProduct(',
            'Array.isArray(batch.lines)',
            'Обзорный отчёт не подходит',
            'Многодневный расход без дат не распределяется между днями',
            'detailHash',
            "if((state.kaspiAdExpenses||[]).some(x=>(hash&&x.hash===hash)||(detailHash&&x.detailHash===detailHash)))",
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing exact Kaspi ads markers: '+', '.join(missing))
          banned=['factor=Math.min(1,overlap/span)','расход распределится по дням этого периода равномерно']
          bad=[x for x in banned if x in html]
          if bad: raise SystemExit('Old proportional ads logic remains: '+', '.join(bad))
          PY
          node --check /tmp/app.js

      - name: Commit exact product/date advertising import
        id: commit
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html .github/workflows/smoke-test.yml
          git commit -m 'Use exact Kaspi ad spend by product and date'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke test for committed main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
