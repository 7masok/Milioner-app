name: One-shot Kaspi commission fallback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-kaspi-commission-fallback.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - name: Patch Kaspi commission fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          anchor="function reportSaleUnitCost(productId,old){const recorded=Math.max(0,Number(old?.cost)||0);if(recorded>0)return recorded;const p=productId?prod(productId):null;return p?Math.max(0,productDisplayCost(p)):0}\n"
          add=anchor+"function kaspiCommissionPct(productId){const map=state.settings?.kaspiCommissionPctByProduct||{},raw=Number(map[String(productId||'')]),fallback=Number(state.settings?.kaspiDefaultCommissionPct||12.5);return raw>0&&raw<50?raw:(fallback>0&&fallback<50?fallback:12.5)}\nfunction setKaspiCommissionPct(productId,days){const current=kaspiCommissionPct(productId),x=prompt('Комиссия Kaspi с НДС, %',String(current).replace('.',','));if(x===null)return;const v=Number(String(x).replace(',','.'));if(!(v>0&&v<50))return alert('Укажите процент от 0 до 50');state.settings.kaspiCommissionPctByProduct||={};state.settings.kaspiCommissionPctByProduct[String(productId)]=v;save();renderMarketplaceReportSheet()}\n"
          if 'function kaspiCommissionPct(productId)' not in s:
              if anchor not in s: raise SystemExit('commission helper anchor not found')
              s=s.replace(anchor,add,1)

          new_report=r'''function reportMarketplaceSales(){const saved=new Map();for(const s of(state.sales||[])){if(!s.externalKey)continue;saved.set(String(s.externalKey),s);if(s.channel==='Kaspi'&&String(s.externalKey).startsWith('Kaspi:'))saved.set(String(s.externalKey).slice(6),s)}const out=[];const feeds=[[state.kaspiOrderFeed||[],'Kaspi'],[state.wbOrderFeed||[],'WB'],[state.ozonOrderFeed||[],'Ozon']];for(const [feed,fallbackMarket] of feeds){for(const o of feed){const market=String(o.market||fallbackMarket),creationDate=Number(o.creationDate)||0;if(!creationDate||!isMarketplaceSaleOrder(market,o.status,o.state))continue;const legacy=String(o.orderId)+':'+String(o.entryId),key=market+':'+legacy,old=saved.get(key)||(market==='Kaspi'?saved.get(legacy):null),qty=Math.max(0,Number(o.qty)||Number(old?.qty)||0);if(!qty)continue;const commissionTotal=Math.max(0,Number(o.marketplaceFee)||0),deliveryTotal=Math.max(0,Number(o.sellerDeliveryCost)||0),productId=o.productId||old?.productId||null,recordedCost=Math.max(0,Number(old?.cost)||0),unitCost=reportSaleUnitCost(productId,old),unitPrice=Number(o.unitPrice)||Number(old?.price)||0,delivery=deliveryTotal>0?deliveryTotal/qty:Math.max(0,Number(old?.delivery)||0),oldFee=Math.max(0,Number(old?.fee)||0),oldCommission=Math.max(0,Number(old?.commission)||0),pct=market==='Kaspi'?kaspiCommissionPct(productId):0;let commission=commissionTotal>0?commissionTotal/qty:oldCommission,commissionEstimated=false;if(market==='Kaspi'&&commission<=0&&oldFee<=0&&unitPrice>0){commission=unitPrice*pct/100;commissionEstimated=true}const fee=commissionTotal>0||deliveryTotal>0?(commission+delivery):(oldFee>0?oldFee:(market==='Kaspi'?commission+delivery:0)),source=String(o.feeSource||old?.feeSource||'')||(commissionEstimated?('Расчёт комиссии '+pct+'% с НДС'):'');out.push({...old,id:old?.id||('report-'+key),productId,qty,price:unitPrice,cost:unitCost,fee,commission,delivery,commissionPct:pct,commissionEstimated,costSource:recordedCost>0?'FIFO продажи':'Текущая себестоимость',feeSource:source,channel:market,date:creationDate,externalKey:key})}}return out}'''
          pat=re.compile(r"function reportMarketplaceSales\(\)\{.*?\}\nfunction financialSales",re.S)
          if len(pat.findall(s))!=1: raise SystemExit('reportMarketplaceSales match failed')
          s=pat.sub(new_report+'\nfunction financialSales',s,count=1)

          new_stats=r'''function marketplaceProductStats(market,days=reportPeriod){const since=reportPeriodStart(days),until=reportPeriodEnd(days),rows=financialSales().filter(s=>Number(s.date)>=since&&Number(s.date)<until&&s.channel===market),map=new Map();for(const sale of rows){const key=String(sale.productId||'unknown'),qty=Math.max(0,Number(sale.qty)||0),revenue=qty*Math.max(0,Number(sale.price)||0),cost=qty*Math.max(0,Number(sale.cost)||0),feePerUnit=Math.max(0,Number(sale.fee)||0),deliveryPerUnit=market==='Kaspi'?Math.max(0,Number(sale.delivery)||0):0,commissionPerUnit=market==='Kaspi'?Math.max(0,Number(sale.commission)||Math.max(0,feePerUnit-deliveryPerUnit)):feePerUnit,delivery=qty*deliveryPerUnit,commission=qty*commissionPerUnit,fees=market==='Kaspi'?commission+delivery:qty*feePerUnit;let x=map.get(key);if(!x){x={productId:sale.productId,name:productNameById(sale.productId,'Неизвестный товар'),qty:0,revenue:0,cost:0,commission:0,delivery:0,fees:0,ads:0,profit:0,costEstimatedQty:0,commissionEstimated:0,commissionPct:0};map.set(key,x)}x.qty+=qty;x.revenue+=revenue;x.cost+=cost;x.commission+=commission;x.delivery+=delivery;x.fees+=fees;x.profit+=revenue-cost-fees;if(market==='Kaspi'&&sale.costSource==='Текущая себестоимость')x.costEstimatedQty+=qty;if(market==='Kaspi'&&sale.commissionEstimated){x.commissionEstimated+=commission;x.commissionPct=Number(sale.commissionPct)||kaspiCommissionPct(sale.productId)}}if(market==='Kaspi'){const ads=kaspiAdsBreakdown(days);for(const [productId,amount] of ads.byProduct){let x=map.get(String(productId));if(!x){x={productId:String(productId),name:productNameById(productId,'Реклама Kaspi'),qty:0,revenue:0,cost:0,commission:0,delivery:0,fees:0,ads:0,profit:0,costEstimatedQty:0,commissionEstimated:0,commissionPct:kaspiCommissionPct(productId)};map.set(String(productId),x)}x.ads+=amount;x.profit-=amount}if(ads.unmatched>0){map.set('__kaspi_ads_unmatched__',{productId:null,name:'Реклама Kaspi без привязки',qty:0,revenue:0,cost:0,commission:0,delivery:0,fees:0,ads:ads.unmatched,profit:-ads.unmatched,costEstimatedQty:0,commissionEstimated:0,commissionPct:0})}}return [...map.values()].sort((a,b)=>b.profit-a.profit)}'''
          pat=re.compile(r"function marketplaceProductStats\(market,days=reportPeriod\)\{.*?\}\nasync function openWbFinanceReport",re.S)
          if len(pat.findall(s))!=1: raise SystemExit('marketplaceProductStats match failed')
          s=pat.sub(new_stats+'\nasync function openWbFinanceReport',s,count=1)

          old="<td>${fmt(x.commission)}</td><td>${fmt(x.delivery)}</td>"
          new="<td>${fmt(x.commission)}${Number(x.commissionEstimated||0)>0&&x.productId?`<div><button class=\"btn\" style=\"padding:3px 6px;margin-top:4px;font-size:10px\" onclick=\"event.stopPropagation();setKaspiCommissionPct('${x.productId}',${days})\">расч. ${Number(x.commissionPct||kaspiCommissionPct(x.productId)).toFixed(1)}%</button></div>`:''}</td><td>${fmt(x.delivery)}</td>"
          if old not in s: raise SystemExit('commission cell anchor not found')
          s=s.replace(old,new,1)

          old_note="Если Kaspi API не прислал отдельную комиссию или доставку, здесь будет 0 — ставка не додумывается."
          new_note="Kaspi API заказов не передаёт отдельную комиссию. Если точной суммы нет в сохранённой продаже, комиссия рассчитывается по настроенному проценту с НДС; по умолчанию 12,5%. Нажмите на процент в строке товара, чтобы задать его точную ставку из кабинета Kaspi. Доставка по-прежнему берётся из Kaspi API."
          if old_note not in s: raise SystemExit('note anchor not found')
          s=s.replace(old_note,new_note,1)

          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          git diff --check
          grep -q 'function kaspiCommissionPct' index.html
          grep -q 'расч. ' index.html
      - name: Commit and clean workflow
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/one-shot-kaspi-commission-fallback.yml
          git add index.html
          git commit -m 'Calculate Kaspi commission when API omits it'
          git push origin HEAD:main
