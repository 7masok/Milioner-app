name: One-shot Kaspi delivery diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-delivery-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Kaspi Worker pagination controls
        run: |
          set -e
          base='https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/sync?days=7&status=ACCEPTED_BY_MERCHANT&state=KASPI_DELIVERY&batch=0'
          for extra in '' '&pageSize=30' '&limit=30' '&size=30' '&page%5Bsize%5D=30'; do
            echo "=== EXTRA ${extra:-default} ==="
            body=$(curl -fsSL --retry 2 --retry-delay 2 --max-time 60 "${base}${extra}")
            echo "$body" | jq '{ok,totalOrders,hasMore,nextBatch,orders:(.orders|length),withLines:([.orders[]|select((.lines|length)>0)]|length),lineErrors:([.orders[]|select(.lineError!=null)]|length)}'
          done

      - name: Inspect live Millioner status
        run: |
          set -e
          curl -fsSL --retry 3 --retry-delay 2 --max-time 30 'https://millioner-api.7masok.workers.dev/api/market-status' | jq .
          body=$(curl -fsSL --retry 3 --retry-delay 2 --max-time 30 'https://millioner-api.7masok.workers.dev/api/orders?market=Kaspi&limit=1000')
          echo "D1_KASPI_LINES=$(echo "$body" | jq '.orders|length')"
          for id in 1028072690 1028169317 1028174494 1027863523 1027066063 1027161866; do
            echo -n "$id="
            echo "$body" | jq --arg id "$id" '[.orders[]|select((.code|tostring)==$id or (.orderId|tostring)==$id)]|length'
          done
