name: One-shot Kaspi delivery diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-delivery-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live Millioner Kaspi states after cron
        run: |
          set -e
          status=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 30 'https://millioner-api.7masok.workers.dev/api/market-status')
          echo "$status" | jq .
          body=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 30 'https://millioner-api.7masok.workers.dev/api/orders?market=Kaspi&limit=1000')
          echo "D1_KASPI_LINES=$(echo "$body" | jq '.orders|length')"
          for id in 1028072690 1028169317 1028174494 1027863523 1027066063 1027161866; do
            echo "=== $id ==="
            echo "$body" | jq --arg id "$id" '[.orders[]|select((.code|tostring)==$id or (.orderId|tostring)==$id)|{code,status,state,productName,qty,totalPrice}]'
          done
          for id in 1028072690 1028169317 1028174494; do
            test "$(echo "$body" | jq --arg id "$id" '[.orders[]|select((.code|tostring)==$id or (.orderId|tostring)==$id)]|length')" -gt 0
          done
