name: One-shot Kaspi delivery fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-delivery-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Kaspi delivery ingestion
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate patched code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          api=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert "KASPI_DELIVERY_TRANSIT')return 'В доставке'" in html
          assert 'courierTransmissionDate' in api
          assert 'fetchKaspiOrdersDirect' in api
          assert "entryId: '__pending__'" in api
          assert "entry_id='__pending__'" in api
          PY
          node --check /tmp/app.js
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js
          git commit -m 'Show and retain Kaspi orders already in delivery'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
