name: One-shot Kaspi delivery fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-delivery-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch safe Kaspi worker pagination
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate
        run: |
          node --check cloudflare/millioner-api/src/index.js
          python - <<'PY'
          from pathlib import Path
          api=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          smoke=Path('.github/workflows/smoke-test.yml').read_text(encoding='utf-8')
          assert "days: '7'" in api
          assert "size: '12'" in api
          assert 'deliveryCostForSeller || 0' in api
          assert 'KASPI_DELIVERY_TRANSIT' in api
          assert 'Kaspi safe worker page size' in smoke
          PY
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js .github/workflows/smoke-test.yml
          git commit -m 'Load full Kaspi delivery feed within subrequest limits'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
