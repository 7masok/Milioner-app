name: One-shot Kaspi delivery fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-delivery-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch backend only
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate
        run: |
          node --check cloudflare/millioner-api/src/index.js
          grep -q "size: '12'" cloudflare/millioner-api/src/index.js
          grep -q "deliveryCostForSeller || 0" cloudflare/millioner-api/src/index.js
          grep -q "KASPI_DELIVERY_TRANSIT" cloudflare/millioner-api/src/index.js
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Load full Kaspi delivery feed within subrequest limits'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
