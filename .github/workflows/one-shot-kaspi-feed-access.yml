name: One-shot Kaspi XML access tracking

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-feed-access.yml'
      - 'tools/patch_kaspi_feed_access.py'

permissions:
  contents: write
  actions: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check current app and safe central APIs
        run: |
          set -e
          test -s index.html
          node --check cloudflare/millioner-api/src/index.js
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/health' | jq -e '.ok==true and .d1==true'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/market-status' | jq -e '.ok==true'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/sync-status' | jq -e '.ok==true'

      - name: Apply Kaspi feed access tracking
        run: python tools/patch_kaspi_feed_access.py

      - name: Validate access tracking patch
        run: |
          set -e
          grep -q 'kaspi_price_feed_access' cloudflare/millioner-api/src/index.js
          grep -q 'recordKaspiPriceFeedFetch' cloudflare/millioner-api/src/index.js
          grep -q "url.searchParams.get('check') !== '1'" cloudflare/millioner-api/src/index.js
          grep -q "fetchTracking: 'kaspi-xml-access-v1'" cloudflare/millioner-api/src/index.js
          grep -q 'Последнее обращение Kaspi к XML' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check cloudflare/millioner-api/src/index.js
          git diff --check

      - name: Commit app and Worker change
        id: commit
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js
          git commit -m 'Track Kaspi XML feed downloads'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy millioner-api
        working-directory: cloudflare/millioner-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'No repository Cloudflare credentials; waiting for configured Worker Builds/Git deployment.'
            exit 0
          fi
          npx --yes wrangler@4 deploy

      - name: Verify live tracking without creating a fake download
        run: |
          set -e
          live=''
          for attempt in $(seq 1 48); do
            code=$(curl -sS -H 'Origin: https://7masok.github.io' -o /tmp/status.json -w '%{http_code}' --max-time 20 'https://millioner-api.7masok.workers.dev/api/kaspi-stock-feed-status' || true)
            if [ "$code" = '200' ] && jq -e '.ok==true and .fetchTracking=="kaspi-xml-access-v1" and (.fetchCount|type=="number") and (.lastFetchedAt|type=="number")' /tmp/status.json >/dev/null 2>&1; then
              live=1
              break
            fi
            sleep 5
          done
          test -n "$live"
          before=$(jq -r '.fetchCount' /tmp/status.json)
          feed=$(jq -r '.feedUrl // empty' /tmp/status.json)
          if [ -n "$feed" ]; then
            sep='?'; case "$feed" in *\?*) sep='&';; esac
            code=$(curl -sS --max-time 25 -o /tmp/feed.xml -w '%{http_code}' "${feed}${sep}check=1")
            test "$code" = 200
            grep -qi '<kaspi_catalog' /tmp/feed.xml
            after=$(curl -fsSL -H 'Origin: https://7masok.github.io' --max-time 25 'https://millioner-api.7masok.workers.dev/api/kaspi-stock-feed-status' | jq -r '.fetchCount')
            test "$before" = "$after"
          fi
          jq '{configured,ready,lastFetchedAt,fetchCount,linked,matched}' /tmp/status.json

      - name: Wait for GitHub Pages UI
        run: |
          set -e
          for attempt in $(seq 1 48); do
            curl -fsSL --max-time 20 'https://7masok.github.io/Milioner-app/' -o /tmp/site.html || true
            if grep -q 'Последнее обращение Kaspi к XML' /tmp/site.html 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Dispatch exact smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -e
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 50 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
