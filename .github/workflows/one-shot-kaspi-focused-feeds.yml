name: One-shot Kaspi focused feeds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-focused-feeds.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: python .github/scripts/patch_kaspi_focused_feeds.py
      - name: Validate
        run: |
          node --check cloudflare/millioner-api/src/index.js
          grep -q "state: 'KASPI_DELIVERY_TRANSIT'" cloudflare/millioner-api/src/index.js
          grep -A6 "activeFeed = await fetchKaspiWorkerFeed" cloudflare/millioner-api/src/index.js | grep -q "days: '1'"
      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git diff --cached --quiet || git commit -m 'Focus Kaspi sync on packing and transit feeds'
          git push origin main
