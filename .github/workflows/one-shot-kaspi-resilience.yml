name: One-shot Kaspi resilience patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-resilience.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: python .github/scripts/patch_kaspi_resilience.py
      - name: Validate
        run: |
          node --check cloudflare/millioner-api/src/index.js
          grep -q "}, env.KASPI_WORKER);" cloudflare/millioner-api/src/index.js
          grep -q "size: '6'" cloudflare/millioner-api/src/index.js
          grep -q "serviceBinding.fetch" cloudflare/millioner-api/src/index.js
          grep -Eq '"binding"[[:space:]]*:[[:space:]]*"KASPI_WORKER"' cloudflare/millioner-api/wrangler.jsonc
          grep -Eq '"service"[[:space:]]*:[[:space:]]*"fragrant-shadow-72ed"' cloudflare/millioner-api/wrangler.jsonc
      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js cloudflare/millioner-api/wrangler.jsonc
          git diff --cached --quiet || git commit -m 'Keep Kaspi sync inside Worker CPU budget'
          git push origin main
# trigger 2026-08-10 kaspi-page-size-6
