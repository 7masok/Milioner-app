name: One-shot Kaspi resilience patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-resilience.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: python .github/scripts/patch_kaspi_resilience.py
      - name: Validate
        run: |
          node --check cloudflare/millioner-api/src/index.js
          grep -q "Kaspi active feed failed" cloudflare/millioner-api/src/index.js
          grep -q "const transient = new Set(\[429, 500, 502, 503, 504\])" cloudflare/millioner-api/src/index.js
      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git diff --cached --quiet || git commit -m 'Make Kaspi sync tolerate transient Worker failures'
          git push origin main
