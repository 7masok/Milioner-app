name: One-shot Kaspi seller SKU repair

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_kaspi_seller_sku.py'
      - '.github/workflows/one-shot-kaspi-seller-sku.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check current app and central API
        run: |
          set -e
          test -s index.html
          node --check cloudflare/millioner-api/src/index.js
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/health' | jq -e '.ok==true and .d1==true'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/market-status' | jq -e '.ok==true'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/sync-status' | jq -e '.ok==true'

      - name: Apply seller SKU repair
        run: python tools/patch_kaspi_seller_sku.py

      - name: Validate repair contract
        run: |
          set -e
          grep -q 'async function repairLegacyKaspiSkus' cloudflare/millioner-api/src/index.js
          grep -q 'normalizeKaspiLineSkusAgainstTemplate' cloudflare/millioner-api/src/index.js
          grep -q "masterproducts/\${encodeURIComponent(oldSku)}/merchantProduct" cloudflare/millioner-api/src/index.js
          grep -q 'merchantCode,' cloudflare/millioner-api/src/index.js
          if grep -q 'merchantCode: merchantCode || masterProductId' cloudflare/millioner-api/src/index.js; then
            echo 'Unsafe masterProductId fallback remains' >&2
            exit 1
          fi
          node --check cloudflare/millioner-api/src/index.js
          git diff --check

      - name: Commit Worker fix
        id: commit
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Use Kaspi seller SKU for product links'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy millioner-api when credentials exist
        working-directory: cloudflare/millioner-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'No repository Cloudflare credentials; waiting for configured Worker Builds/Git deployment.'
            exit 0
          fi
          npx --yes wrangler@4 deploy

      - name: Wait for public Worker deployment
        run: |
          set -e
          # A successful safe central sync after the commit proves the deployed Worker is healthy.
          live=''
          for attempt in $(seq 1 60); do
            health=$(curl -sS --max-time 20 'https://millioner-api.7masok.workers.dev/health' || true)
            status=$(curl -sS --max-time 20 'https://millioner-api.7masok.workers.dev/api/market-status' || true)
            if echo "$health" | jq -e '.ok==true and .d1==true' >/dev/null 2>&1 && echo "$status" | jq -e '.ok==true' >/dev/null 2>&1; then
              live=1
              break
            fi
            sleep 5
          done
          test -n "$live"

      - name: Dispatch exact smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -e
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 50 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
