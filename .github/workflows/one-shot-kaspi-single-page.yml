name: One-shot Kaspi single-page feed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-single-page.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: python .github/scripts/patch_kaspi_single_page.py
      - name: Validate
        run: |
          node --check cloudflare/millioner-api/src/index.js
          python - <<'PY'
          from pathlib import Path
          s=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          start=s.index('activeFeed = await fetchKaspiWorkerFeed')
          end=s.index('} catch (e)', start)
          block=s[start:end]
          assert "days: '1'" in block
          assert "state: 'KASPI_DELIVERY'" in block
          assert "size: '100'" in block
          assert "broadFeed = await fetchKaspiWorkerFeed" not in s
          PY
      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git diff --cached --quiet || git commit -m 'Use one focused Kaspi packing feed per sync'
          git push origin main
