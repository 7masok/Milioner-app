name: One-shot Kaspi stage fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-kaspi-stage-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Kaspi stage labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=base64.b64decode('').decode()
          new=base64.b64decode('').decode()
          if s.count(old)!=1:
              raise SystemExit(f'status function marker count={s.count(old)}')
          s=s.replace(old,new,1)
          old_call='${esc(marketplaceStatusLabel(market,o.status))}'
          new_call='${esc(marketplaceStatusLabel(market,o.status,o.state))}'
          if s.count(old_call)!=1:
              raise SystemExit(f'status render marker count={s.count(old_call)}')
          s=s.replace(old_call,new_call,1)
          old_state='<span class="badge">${esc(o.state||\'—\')}</span>'
          new_state='<span class="badge">${esc(marketplaceStateLabel(market,o.state))}</span>'
          if s.count(old_state)!=1:
              raise SystemExit(f'state render marker count={s.count(old_state)}')
          s=s.replace(old_state,new_state,1)
          p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/smoke-test.yml')
          s=p.read_text(encoding='utf-8')
          anchor='              \'sync in-progress UI\': "\'Синхронизация\',\'warn\'",\n'
          addition=(
              '              \'Kaspi packaging stage\': "if(u===\'ACCEPTED_BY_MERCHANT\'){if(st===\'KASPI_DELIVERY\')return \'Упаковка\'",\n'
              '              \'Kaspi handoff stage\': "if(u===\'ASSEMBLE\')return \'Передача\'",\n'
              '              \'Kaspi delivery label\': "KASPI_DELIVERY:\'Kaspi Доставка\'",\n'
          )
          if 'Kaspi packaging stage' not in s:
              if s.count(anchor)!=1:
                  raise SystemExit(f'smoke anchor count={s.count(anchor)}')
              s=s.replace(anchor,anchor+addition,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert "if(u==='ACCEPTED_BY_MERCHANT'){if(st==='KASPI_DELIVERY')return 'Упаковка'" in html
          assert "if(u==='ASSEMBLE')return 'Передача'" in html
          assert "KASPI_DELIVERY:'Kaspi Доставка'" in html
          assert 'marketplaceStatusLabel(market,o.status,o.state)' in html
          assert 'marketplaceStateLabel(market,o.state)' in html
          PY
          node --check /tmp/app.js

      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/smoke-test.yml
          git commit -m 'Show Kaspi packaging and handoff stages correctly'
          git push origin HEAD:main
