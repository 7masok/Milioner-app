name: Verify product metrics deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-list-pagination.yml'

permissions:
  contents: read
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Validate current product metrics
        run: |
          set -e
          test -f .nojekyll
          grep -q 'function productLifetimeAverageCost' index.html
          grep -q 'function productAverageDailySales' index.html
          grep -q 'Среднесуточные продажи · 7 дней' index.html
          grep -q 'Среднесуточные продажи · всё время' index.html
          grep -q 'Средняя себестоимость' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r"function openProduct\(pid,market='',days=30\)\{.*?\}\nfunction deleteProduct",s,flags=re.S)
          if not m: raise SystemExit('openProduct region missing')
          detail=m.group(0)
          if 'deliveryLabel' in detail or 'kaspiDelivery' in detail or 'Расход на доставку Kaspi' in detail:
              raise SystemExit('Kaspi delivery row still present')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Wait for published product metrics
        run: |
          set -e
          live=''
          for attempt in $(seq 1 60); do
            curl -fsSL --max-time 20 'https://7masok.github.io/Milioner-app/' -o /tmp/site.html || true
            if grep -q 'productLifetimeAverageCost' /tmp/site.html 2>/dev/null && grep -q 'Среднесуточные продажи · 7 дней' /tmp/site.html 2>/dev/null; then
              live=1
              break
            fi
            sleep 5
          done
          test -n "$live"

      - name: Check safe public central API endpoints
        run: |
          set -e
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/health' | jq -e '.ok==true and .d1==true'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/market-status' | jq -e '.ok==true and (.markets|type=="array")'
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/sync-status' | jq -e '.ok==true and (.markets|type=="array")'
          for market in Kaspi WB WB2; do
            body=$(curl -fsSL --max-time 25 "https://millioner-api.7masok.workers.dev/api/orders?market=${market}&limit=1000")
            echo "$body" | jq -e '.ok==true and (.orders|type=="array")'
          done

      - name: Dispatch smoke test for current head
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 40 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
