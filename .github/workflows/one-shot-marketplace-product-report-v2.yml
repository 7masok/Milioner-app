name: One-shot marketplace product report v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-marketplace-product-report-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch report
        run: python .github/scripts/patch-marketplace-product-report.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('script missing')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          for marker in ['function marketplaceProductStats(market)','function openMarketplaceReport(market)']:
              if marker not in html: raise SystemExit('missing '+marker)
          PY
          node --check /tmp/app.js
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Open marketplace reports by product'
          git push origin HEAD:main
