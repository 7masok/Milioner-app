name: One-shot marketplace product report
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-marketplace-product-report.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch report
        run: |
          echo '
_RgNC40LHRi9C70YwgJHtmbXQoeC5wcm9maXQpfTwvZGl2PjwvZGl2PjxkaXYgY2xhc3M9InJpZ2h0Ij48Yj4ke2ZtdCh4LnJldmVudWUpfTwvYj48ZGl2IGNsYXNzPSJtdXRlZCI+0LLRi9GA0YPRh9C60LA8L2Rpdj48L2Rpdj48L2Rpdj5gKS5qb2luKCcnKTonPGRpdiBjbGFzcz0iZW1wdHkiPtCX0LAg0LLRi9Cx0YDQsNC90L3Ri9C5INC_0LXRgNC40L7QtCDQv9GA0L7QtNCw0LYg0L3QtdGCPC9kaXY+JztzaG93U2hlZXQoYDxIMz4ke2VzYyhtYXJrZXQpfSDCtyDRgtC+0LLQsNGA0YsKMhM2kPC9IMz48ZGl2IGNsYXNzPSJpdGVtIj48ZGl2IGNsYXNzPSJyb3ciPjxkaXYgY2xhc3M9Imdyb3ciPjxiPiR7cXR5fSDRiNGC LjwvYj48ZGl2IGNsYXNzPSJtdXRlZCI+0J_QtdGA0LjQvtC0OiAke3BlcmlvZH0gwrcg0L_RgNC40LHRi9C70YwgJHtmbXQocHJvZml0KX08L2Rpdj48L2Rpdj48ZGl2IGNsYXNzPSJyaWdodCI+PGI+JHtmbXQocmV2ZW51ZSl9PC9iPjxkaXYgY2xhc3M9Im11dGVkIj7QstGL0YDRg9GH0LrQsDwvZGl2PjwvZGl2PjwvZGl2PjwvZGl2PiR7Ym9keX1gKX0iIiIKcz1zWzpzdGFydF0rbmV3K3NbZW5kOl0KcC53cml0ZV90ZXh0KHMsZW5jb2Rpbmc9InV0Zi04IikK' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('script missing')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          for marker in ['function marketplaceProductStats(market)','function openMarketplaceReport(market)']:
            if marker not in html: raise SystemExit('missing '+marker)
          PY
          node --check /tmp/app.js
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Open marketplace reports by product'
          git push origin HEAD:main
