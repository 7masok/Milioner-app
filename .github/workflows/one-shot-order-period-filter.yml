name: One-time order period filter patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-order-period-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add order period controls and filtering
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              s=s.replace(old,new,1)

          old_css=".order-totals{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 10px}.order-totals .card{padding:12px}.order-totals .num{font-size:20px}.order-list{display:flex;flex-direction:column;gap:8px}"
          new_css=old_css+"\n.order-period{display:flex;gap:7px;margin:10px 0 14px;overflow:auto}.order-period-btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:12px;white-space:nowrap;flex:none}.order-period-btn.active{background:#111;color:#fff;border-color:#111}.order-custom-range{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-6px 0 14px}.order-custom-range label{display:block;font-size:10px;color:var(--muted);margin:0 0 4px 2px}.order-custom-range input{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;font-size:12px}"
          once(old_css,new_css,'order period css')

          old_home='''  <div class="metrics"><div class="card"><div class="label">Остаток склада</div><div class="num" id="mStock">0</div><div class="small">шт.</div></div><div class="card"><div class="label">Заказано, шт.</div><div class="num" id="koQty">0 шт.</div></div><div class="card"><div class="label">Заказано на сумму</div><div class="num" id="koAmount">0 ₸</div></div></div>\n  <h2>Заказы</h2>'''
          new_home='''  <div class="metrics"><div class="card"><div class="label">Остаток склада</div><div class="num" id="mStock">0</div><div class="small">шт.</div></div><div class="card"><div class="label">Заказано, шт.</div><div class="num" id="koQty">0 шт.</div></div><div class="card"><div class="label">Заказано на сумму</div><div class="num" id="koAmount">0 ₸</div></div></div>\n  <div id="orderPeriod" class="order-period"><button class="order-period-btn" data-order-period="today" onclick="setOrderPeriod('today')">Сегодня</button><button class="order-period-btn" data-order-period="yesterday" onclick="setOrderPeriod('yesterday')">Вчера</button><button class="order-period-btn" data-order-period="week" onclick="setOrderPeriod('week')">Неделя</button><button class="order-period-btn" data-order-period="month" onclick="setOrderPeriod('month')">Месяц</button><button class="order-period-btn" data-order-period="custom" onclick="setOrderPeriod('custom')">Свой период</button></div>\n  <div id="orderCustomRange" class="order-custom-range" style="display:none"><div><label for="orderDateFrom">От</label><input id="orderDateFrom" type="date" onchange="setOrderCustomDate('from',this.value)"></div><div><label for="orderDateTo">До</label><input id="orderDateTo" type="date" onchange="setOrderCustomDate('to',this.value)"></div></div>\n  <h2>Заказы</h2>'''
          once(old_home,new_home,'home period controls')

          old_state="let selectedPeriodPreset=[0,1,7,30].includes(Number(state.settings.selectedPeriodPreset))?Number(state.settings.selectedPeriodPreset):1;let selectedPeriod=selectedPeriodPreset===0?Math.max(1,Number(state.settings.selectedPeriod)||14):selectedPeriodPreset;let reportPeriodPreset=[0,1,7,30].includes(Number(state.settings.reportPeriodPreset))?Number(state.settings.reportPeriodPreset):1;let reportPeriod=reportPeriodPreset===0?Math.max(1,Number(state.settings.reportPeriod)||14):reportPeriodPreset;let marketplaceReportContext=null;let selectedOrderMarket=['Kaspi','WB','Ozon'].includes(state.settings.selectedOrderMarket)?state.settings.selectedOrderMarket:'Kaspi';let selectedWbAccount=['all','WB','WB2'].includes(state.settings.selectedWbAccount)?state.settings.selectedWbAccount:'all';let unmatchedOrderFilter=state.settings.unmatchedOrderFilter===true;"
          new_state=old_state+"\nlet orderPeriodMode=['today','yesterday','week','month','custom'].includes(String(state.settings.orderPeriodMode||''))?String(state.settings.orderPeriodMode):'today';let orderCustomFrom=String(state.settings.orderCustomFrom||'');let orderCustomTo=String(state.settings.orderCustomTo||'');"
          once(old_state,new_state,'order period state')

          old_render="  renderMarketplaceOrders();renderAttention();renderRecent();renderProducts();renderMovement();renderPurchases();renderReports();"
          new_render="  renderOrderPeriodControls();renderMarketplaceOrders();renderAttention();renderRecent();renderProducts();renderMovement();renderPurchases();renderReports();"
          once(old_render,new_render,'render controls')

          old_toggle="function toggleUnmatchedOrderFilter(){unmatchedOrderFilter=!unmatchedOrderFilter;state.settings.unmatchedOrderFilter=unmatchedOrderFilter;save();renderMarketplaceOrders()}"
          new_toggle=old_toggle+'''\nfunction orderDateValue(ts=Date.now()){const d=new Date(Number(ts)||Date.now()),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}\nfunction orderDayStart(value){if(!value)return null;const [y,m,d]=String(value).split('-').map(Number);if(!y||!m||!d)return null;return new Date(y,m-1,d,0,0,0,0).getTime()}\nfunction orderPeriodBounds(){const today=new Date();today.setHours(0,0,0,0);const todayStart=today.getTime(),tomorrow=todayStart+86400000;if(orderPeriodMode==='yesterday')return {start:todayStart-86400000,end:todayStart};if(orderPeriodMode==='week')return {start:todayStart-6*86400000,end:tomorrow};if(orderPeriodMode==='month')return {start:todayStart-29*86400000,end:tomorrow};if(orderPeriodMode==='custom'){const fallback=orderDateValue(),from=orderCustomFrom||fallback,to=orderCustomTo||from,a=orderDayStart(from),b=orderDayStart(to);if(a===null||b===null)return {start:todayStart,end:tomorrow};return a<=b?{start:a,end:b+86400000}:{start:b,end:a+86400000}}return {start:todayStart,end:tomorrow}}\nfunction filterMarketplaceOrdersByPeriod(orders){const {start,end}=orderPeriodBounds();return (orders||[]).filter(g=>{const t=Number(g?.creationDate)||0;return t>=start&&t<end})}\nfunction renderOrderPeriodControls(){document.querySelectorAll('[data-order-period]').forEach(b=>b.classList.toggle('active',b.dataset.orderPeriod===orderPeriodMode));const box=document.getElementById('orderCustomRange'),from=document.getElementById('orderDateFrom'),to=document.getElementById('orderDateTo');if(!orderCustomFrom)orderCustomFrom=orderDateValue();if(!orderCustomTo)orderCustomTo=orderCustomFrom;if(from&&from.value!==orderCustomFrom)from.value=orderCustomFrom;if(to&&to.value!==orderCustomTo)to.value=orderCustomTo;if(box)box.style.display=orderPeriodMode==='custom'?'grid':'none'}\nfunction setOrderPeriod(mode){if(!['today','yesterday','week','month','custom'].includes(mode))return;orderPeriodMode=mode;if(mode==='custom'){orderCustomFrom=orderCustomFrom||orderDateValue();orderCustomTo=orderCustomTo||orderCustomFrom;state.settings.orderCustomFrom=orderCustomFrom;state.settings.orderCustomTo=orderCustomTo}state.settings.orderPeriodMode=orderPeriodMode;save();renderOrderPeriodControls();renderMarketplaceOrders()}\nfunction setOrderCustomDate(which,value){if(!value)return;if(which==='from')orderCustomFrom=value;else orderCustomTo=value;state.settings.orderCustomFrom=orderCustomFrom;state.settings.orderCustomTo=orderCustomTo;state.settings.orderPeriodMode='custom';orderPeriodMode='custom';save();renderOrderPeriodControls();renderMarketplaceOrders()}'''
          once(old_toggle,new_toggle,'period functions')

          old_orders="const orders=groupMarketplaceOrders(feed);const total=orders.length,unmatchedOrders=orders.filter(orderHasUnmatchedLine),unmatched=unmatchedOrders.length,matched=total-unmatched,orderTotals=marketplaceOrderTotals(orders);"
          new_orders="const allOrders=groupMarketplaceOrders(feed),orders=filterMarketplaceOrdersByPeriod(allOrders);const total=orders.length,unmatchedOrders=orders.filter(orderHasUnmatchedLine),unmatched=unmatchedOrders.length,matched=total-unmatched,orderTotals=marketplaceOrderTotals(orders);"
          once(old_orders,new_orders,'filter grouped orders')

          old_empty="if(!orders.length){if(market==='Kaspi')list.innerHTML='<div class=\"empty\">Нажмите ↻ сверху, чтобы загрузить заказы Kaspi</div>';"
          new_empty="if(!orders.length){if(allOrders.length){list.innerHTML='<div class=\"empty\">За выбранный период заказов нет</div>';return}if(market==='Kaspi')list.innerHTML='<div class=\"empty\">Нажмите ↻ сверху, чтобы загрузить заказы Kaspi</div>';"
          once(old_empty,new_empty,'period empty state')

          p.write_text(s,encoding='utf-8')

          smoke=Path('.github/workflows/smoke-test.yml')
          t=smoke.read_text(encoding='utf-8')
          marker="'id=\"koQty\"','id=\"koAmount\"','function marketplaceOrderTotals('"
          replacement="'id=\"koQty\"','id=\"koAmount\"','id=\"orderPeriod\"','data-order-period=\"yesterday\"','data-order-period=\"week\"','data-order-period=\"month\"','id=\"orderCustomRange\"','function orderPeriodBounds()','function filterMarketplaceOrdersByPeriod(','function marketplaceOrderTotals('"
          if marker not in t:
              raise SystemExit('smoke marker insertion point not found')
          t=t.replace(marker,replacement,1)
          live="grep -q 'id=\"koAmount\"' /tmp/site.html\n"
          live_new=live+"          grep -q 'id=\"orderPeriod\"' /tmp/site.html\n          grep -q 'data-order-period=\"yesterday\"' /tmp/site.html\n          grep -q 'data-order-period=\"week\"' /tmp/site.html\n          grep -q 'data-order-period=\"month\"' /tmp/site.html\n          grep -q 'id=\"orderCustomRange\"' /tmp/site.html\n          grep -q 'function filterMarketplaceOrdersByPeriod(' /tmp/site.html\n"
          if live not in t:
              raise SystemExit('live smoke insertion point not found')
          t=t.replace(live,live_new,1)
          smoke.write_text(t,encoding='utf-8')
          PY
      - name: Validate syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit patch
        run: |
          rm .github/workflows/one-shot-order-period-filter.yml
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html .github/workflows/smoke-test.yml .github/workflows/one-shot-order-period-filter.yml
          git commit -m 'Add order date period filter'
          git push
