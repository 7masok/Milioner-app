name: One-shot add order totals
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-order-totals.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add ordered quantity and amount to home orders
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css_old='.order-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.order-summary .card{padding:10px}.order-summary .num{font-size:17px}.order-summary .filter-card{cursor:pointer;user-select:none}.order-summary .filter-card.active{border-color:#111;box-shadow:0 0 0 1px #111 inset}.order-list{display:flex;flex-direction:column;gap:8px}'
          css_new='.order-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.order-summary .card{padding:10px}.order-summary .num{font-size:17px}.order-summary .filter-card{cursor:pointer;user-select:none}.order-summary .filter-card.active{border-color:#111;box-shadow:0 0 0 1px #111 inset}.order-totals{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 0 10px}.order-totals .card{padding:12px}.order-totals .num{font-size:20px}.order-list{display:flex;flex-direction:column;gap:8px}'
          if css_old not in s: raise SystemExit('order summary CSS marker missing')
          s=s.replace(css_old,css_new,1)

          html_old='  <div class="order-summary"><div class="card"><div class="label">Получено</div><div class="num" id="koTotal">0</div></div><div class="card"><div class="label">Привязано</div><div class="num" id="koMatched">0</div></div><div id="koUnmatchedCard" class="card filter-card" role="button" tabindex="0" onclick="toggleUnmatchedOrderFilter()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleUnmatchedOrderFilter()}"><div class="label">Не привязано</div><div class="num" id="koUnmatched">0</div></div></div>\n  <div id="kaspiOrderList" class="order-list"></div>'
          html_new='  <div class="order-summary"><div class="card"><div class="label">Получено</div><div class="num" id="koTotal">0</div></div><div class="card"><div class="label">Привязано</div><div class="num" id="koMatched">0</div></div><div id="koUnmatchedCard" class="card filter-card" role="button" tabindex="0" onclick="toggleUnmatchedOrderFilter()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleUnmatchedOrderFilter()}"><div class="label">Не привязано</div><div class="num" id="koUnmatched">0</div></div></div>\n  <div class="order-totals"><div class="card"><div class="label">Заказано, шт.</div><div class="num" id="koQty">0 шт.</div></div><div class="card"><div class="label">Заказано на сумму</div><div class="num" id="koAmount">0 ₸</div></div></div>\n  <div id="kaspiOrderList" class="order-list"></div>'
          if html_old not in s: raise SystemExit('orders HTML marker missing')
          s=s.replace(html_old,html_new,1)

          group_marker="function groupMarketplaceOrders(feed){const groups=new Map();for(const row of(feed||[])){const orderKey=marketplaceOrderKey(row);if(!orderKey)continue;const key=String(row.market||'')+'|'+orderKey;let g=groups.get(key);if(!g){g={key,market:row.market||'',orderId:row.orderId,code:row.code,creationDate:Number(row.creationDate)||0,status:row.status,state:row.state,lines:[]};groups.set(key,g)}if((Number(row.creationDate)||0)>=g.creationDate){g.creationDate=Number(row.creationDate)||g.creationDate;g.status=row.status||g.status;g.state=row.state||g.state;g.code=row.code||g.code}g.lines.push(row)}for(const g of groups.values()){const real=g.lines.filter(x=>!isPendingMarketplaceLine(x));if(real.length)g.lines=real}return [...groups.values()].sort((a,b)=>(Number(b.creationDate)||0)-(Number(a.creationDate)||0))}\n"
          helpers="function marketplaceOrderCancelled(g){const market=String(g?.market||selectedOrderMarket),status=String(g?.status||'').toUpperCase(),st=String(g?.state||'').toUpperCase();if(isWbMarket(market))return ['CANCELED','CANCELLED','CANCELED_BY_CLIENT','DECLINED_BY_CLIENT','DEFECT'].includes(st)||['CANCEL','CANCELLED'].includes(status);return ['CANCELLED','CANCELLING','RETURNED'].includes(status)}\nfunction marketplaceOrderTotals(orders){let qty=0,amount=0;for(const g of(orders||[])){if(marketplaceOrderCancelled(g))continue;for(const o of(g.lines||[])){if(isPendingMarketplaceLine(o))continue;const q=Math.max(0,Number(o.qty)||0),lineTotal=Math.max(0,Number(o.totalPrice)||0),unit=Math.max(0,Number(o.unitPrice)||0);qty+=q;amount+=lineTotal>0?lineTotal:q*unit}}return {qty,amount}}\n"
          if group_marker not in s: raise SystemExit('groupMarketplaceOrders marker missing')
          s=s.replace(group_marker,group_marker+helpers,1)

          old="const orders=groupMarketplaceOrders(feed);const total=orders.length,unmatchedOrders=orders.filter(orderHasUnmatchedLine),unmatched=unmatchedOrders.length,matched=total-unmatched;const eTotal=document.getElementById('koTotal'),eMatched=document.getElementById('koMatched'),eUnmatched=document.getElementById('koUnmatched'),filterCard=document.getElementById('koUnmatchedCard');if(eTotal)eTotal.textContent=total;if(eMatched)eMatched.textContent=matched;if(eUnmatched)eUnmatched.textContent=unmatched;if(filterCard){"
          new="const orders=groupMarketplaceOrders(feed);const total=orders.length,unmatchedOrders=orders.filter(orderHasUnmatchedLine),unmatched=unmatchedOrders.length,matched=total-unmatched,orderTotals=marketplaceOrderTotals(orders);const eTotal=document.getElementById('koTotal'),eMatched=document.getElementById('koMatched'),eUnmatched=document.getElementById('koUnmatched'),eQty=document.getElementById('koQty'),eAmount=document.getElementById('koAmount'),filterCard=document.getElementById('koUnmatchedCard');if(eTotal)eTotal.textContent=total;if(eMatched)eMatched.textContent=matched;if(eUnmatched)eUnmatched.textContent=unmatched;if(eQty)eQty.textContent=orderTotals.qty.toLocaleString('ru-RU')+' шт.';if(eAmount)eAmount.textContent=fmt(orderTotals.amount);if(filterCard){"
          if old not in s: raise SystemExit('renderMarketplaceOrders summary marker missing')
          s=s.replace(old,new,1)

          for marker in ['id="koQty"','id="koAmount"','function marketplaceOrderTotals(orders)','Заказано на сумму']:
              if marker not in s: raise SystemExit('missing final marker '+marker)
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY' > /tmp/app.js
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          print('\n'.join(re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)))
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show ordered quantity and amount on home'
          git push
