name: One-time shipment card detail and search patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-purchase-pipeline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shipment card detail and search patch
        run: python tools/patch_purchase_pipeline.py
      - name: Validate JavaScript and shipment UI markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          if 'id="purchaseSearch"' not in s: raise SystemExit('purchase search missing')
          if 'function openPurchaseShipment(' not in s: raise SystemExit('shipment detail opener missing')
          if 'onclick="openPurchaseShipment(' not in s: raise SystemExit('shipment cards are not clickable')
          if 'Поиск поставки по трек-коду' not in s: raise SystemExit('tracking search placeholder missing')
          if "${status!=='received'?`<button class=\"btn full\" onclick=\"openEditPurchaseShipment" in s: raise SystemExit('old inline edit button remains in purchase cards')
          PY
          node --check /tmp/app.js
      - name: Commit shipment UI patch
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Open purchase shipments as detail cards and add tracking search'
          git push
