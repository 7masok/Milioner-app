name: One-time selected marketplace order totals patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-purchase-pipeline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply selected marketplace totals patch
        run: python tools/patch_purchase_pipeline.py
      - name: Validate JavaScript and selected marketplace totals
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          required=[
            '<div class="label">Заказано, шт.</div><div class="num" id="koTotal">0 шт.</div>',
            '<div class="label">Заказано на сумму</div><div class="num" id="koMatched">0 ₸</div>',
            'selectedOrderTotals=marketplaceOrderTotals(orders)',
            "eTotal.textContent=selectedOrderTotals.qty.toLocaleString('ru-RU')+' шт.'",
            'eMatched.textContent=fmt(selectedOrderTotals.amount)',
            'eUnmatched.textContent=unmatched',
            "eQty.textContent=allOrderTotals.qty.toLocaleString('ru-RU')+' шт.'",
            'eAmount.textContent=fmt(allOrderTotals.amount)',
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing selected marketplace totals markers: '+', '.join(missing))
          PY
          node --check /tmp/app.js
      - name: Commit selected marketplace totals
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Show selected marketplace quantity and amount in order summary'
          git push
