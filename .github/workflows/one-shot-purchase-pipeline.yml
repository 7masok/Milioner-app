name: One-time purchase totals patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-purchase-pipeline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply purchase totals patch
        run: python tools/patch_purchase_pipeline.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          grep -q 'id="porBuyTotal"' index.html
          grep -q 'id="porDelivery"' index.html
          grep -q 'Всего оплачено' index.html
          grep -q 'deliveryValue=Math.round(t.delivery' index.html
          ! grep -q 'class="purchase-buy"' index.html
      - name: Commit purchase totals UX
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Add total purchase and delivery inputs'
          git push
