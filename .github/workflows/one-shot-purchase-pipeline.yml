name: One-time purchase transit pipeline
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-purchase-pipeline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply purchase pipeline patch
        run: python tools/patch_purchase_pipeline.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          grep -q 'function createPurchaseOrder()' index.html
          grep -q 'function advancePurchaseShipment(' index.html
          grep -q 'function receivePurchaseShipment(' index.html
          grep -q 'В пути, вложено' index.html
      - name: Commit purchase pipeline
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html .github/workflows/smoke-test.yml
          git commit -m 'Add purchase transit pipeline'
          git push
