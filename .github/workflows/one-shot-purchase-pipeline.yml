name: One-time purchase shipment editor patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-purchase-pipeline.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply purchase shipment editor patch
        run: python tools/patch_purchase_pipeline.py
      - name: Validate JavaScript and editor markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          grep -q 'function openEditPurchaseShipment(' index.html
          grep -q 'function savePurchaseShipmentEdit(' index.html
          grep -q 'Редактировать поставку' index.html
          grep -q 'Полученную поставку редактировать нельзя' index.html
      - name: Commit purchase shipment editor
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Add purchase shipment editing'
          git push
