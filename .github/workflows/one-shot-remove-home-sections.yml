name: One-shot simplify home metrics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-remove-home-sections.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove sales and profit from home
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}'
          new_css = '.metrics{display:grid;grid-template-columns:1fr;gap:8px}'
          if old_css not in s:
              raise SystemExit('metrics CSS marker missing')
          s = s.replace(old_css, new_css, 1)
          old_home = '  <div class="metrics"><div class="card"><div class="label">Остаток склада</div><div class="num" id="mStock">0</div><div class="small">шт.</div></div><div class="card"><div class="label">Продажи</div><div class="num" id="mSales">0 ₸</div><div class="small" id="periodLabel">сегодня</div></div><div class="card"><div class="label">Прибыль</div><div class="num" id="mProfit">0 ₸</div><div class="small">сегодня</div></div></div>\n  <div class="period"><button class="chip active" data-period="1">Сегодня</button><button class="chip" data-period="7">7 дней</button><button class="chip" data-period="30">30 дней</button><button class="chip" data-period="0">Свой период</button></div>\n'
          new_home = '  <div class="metrics"><div class="card"><div class="label">Остаток склада</div><div class="num" id="mStock">0</div><div class="small">шт.</div></div></div>\n'
          if old_home not in s:
              raise SystemExit('home metric block marker missing')
          s = s.replace(old_home, new_home, 1)
          old_render = "  let since=Date.now()-selectedPeriod*86400000;\n  let ss=financialSales().filter(s=>s.date>=since);\n  let rev=ss.reduce((a,s)=>a+s.qty*s.price,0);\n  let pr=ss.reduce((a,s)=>a+s.qty*(s.price-s.cost-s.fee),0);\n  document.getElementById('mSales').textContent=fmt(rev);\n  document.getElementById('mProfit').textContent=fmt(pr);\n  document.getElementById('periodLabel').textContent=selectedPeriod===1?'сегодня':selectedPeriod+' дней';\n"
          if old_render not in s:
              raise SystemExit('home render block marker missing')
          s = s.replace(old_render, '', 1)
          for marker in ['id="mSales"','id="mProfit"','id="periodLabel"','data-period="1"']:
              if marker in s:
                  raise SystemExit('home sales/profit marker still present: '+marker)
          if "document.getElementById('mSales')" in s or "document.getElementById('mProfit')" in s:
              raise SystemExit('removed home metric still referenced')
          p.write_text(s, encoding='utf-8')
          PY
          python - <<'PY' > /tmp/app.js
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          print('\n'.join(re.findall(r'<script>(.*?)</script>', s, flags=re.S|re.I)))
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove sales and profit from home'
          git push