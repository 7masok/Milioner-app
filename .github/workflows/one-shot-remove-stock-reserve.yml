name: One-time remove stock reserve

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-stock-reserve.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stock reserve feature
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              c=s.count(old)
              if c!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {c}')
              s=s.replace(old,new,1)

          once('<option value="zero">Нет в наличии</option><option value="reserve">В резерве</option><option value="buy">На закупку</option>', '<option value="zero">Нет в наличии</option><option value="buy">На закупку</option>', 'product reserve filter')
          once('<option value="инвентаризация">Инвентаризация</option><option value="резерв">Резерв</option><option value="отмена резерва">Отмена резерва</option>', '<option value="инвентаризация">Инвентаризация</option>', 'movement reserve filters')
          once('движения, продажи, резервы, привязки маркетплейсов', 'движения, продажи, привязки маркетплейсов', 'backup reserve wording')

          once("let state=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[],movements:[],sales:[],purchases:[],reservations:[],settings:{autoBackup:true,lastSync:null}};", "let state=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[],movements:[],sales:[],purchases:[],settings:{autoBackup:true,lastSync:null}};", 'default state')
          once("state.products ||= [];state.movements ||= [];state.sales ||= [];state.purchases ||= [];state.reservations ||= [];state.settings ||= {};", "state.products ||= [];state.movements ||= [];state.sales ||= [];state.purchases ||= [];state.settings ||= {};delete state.reservations;state.movements=state.movements.filter(m=>!['резерв','отмена резерва'].includes(String(m?.type||'')));", 'state reserve cleanup')

          once("function warehouseSnapshot(){const settings={...(state.settings||{})};delete settings.serverMarketStatus;return {products:state.products||[],movements:state.movements||[],sales:state.sales||[],purchases:state.purchases||[],reservations:state.reservations||[],settings,marketOrderState:state.marketOrderState||{},marketplaceLiveSince:state.marketplaceLiveSince||{},kaspiBaselineAt:state.kaspiBaselineAt||null}}", "function warehouseSnapshot(){const settings={...(state.settings||{})};delete settings.serverMarketStatus;return {products:state.products||[],movements:state.movements||[],sales:state.sales||[],purchases:state.purchases||[],settings,marketOrderState:state.marketOrderState||{},marketplaceLiveSince:state.marketplaceLiveSince||{},kaspiBaselineAt:state.kaspiBaselineAt||null}}", 'warehouse snapshot')
          once("function normalizeWarehouseSnapshot(x){x=x&&typeof x==='object'?x:{};return {products:Array.isArray(x.products)?x.products:[],movements:Array.isArray(x.movements)?x.movements:[],sales:Array.isArray(x.sales)?x.sales:[],purchases:Array.isArray(x.purchases)?x.purchases:[],reservations:Array.isArray(x.reservations)?x.reservations:[],settings:x.settings&&typeof x.settings==='object'?x.settings:{},marketOrderState:x.marketOrderState&&typeof x.marketOrderState==='object'?x.marketOrderState:{},marketplaceLiveSince:x.marketplaceLiveSince&&typeof x.marketplaceLiveSince==='object'?x.marketplaceLiveSince:{},kaspiBaselineAt:x.kaspiBaselineAt||null}}", "function normalizeWarehouseSnapshot(x){x=x&&typeof x==='object'?x:{};return {products:Array.isArray(x.products)?x.products:[],movements:Array.isArray(x.movements)?x.movements.filter(m=>!['резерв','отмена резерва'].includes(String(m?.type||''))):[],sales:Array.isArray(x.sales)?x.sales:[],purchases:Array.isArray(x.purchases)?x.purchases:[],settings:x.settings&&typeof x.settings==='object'?x.settings:{},marketOrderState:x.marketOrderState&&typeof x.marketOrderState==='object'?x.marketOrderState:{},marketplaceLiveSince:x.marketplaceLiveSince&&typeof x.marketplaceLiveSince==='object'?x.marketplaceLiveSince:{},kaspiBaselineAt:x.kaspiBaselineAt||null}}", 'normalize snapshot')
          once("function hasWarehouseData(x){return !!((x?.products?.length||0)+(x?.purchases?.length||0)+(x?.sales?.length||0)+(x?.movements?.length||0)+(x?.reservations?.length||0))}", "function hasWarehouseData(x){return !!((x?.products?.length||0)+(x?.purchases?.length||0)+(x?.sales?.length||0)+(x?.movements?.length||0))}", 'warehouse data detection')
          once("state={...state,...snap,...feeds};state.settings={...localSettings,...snap.settings};state.purchases.forEach", "state={...state,...snap,...feeds};delete state.reservations;state.settings={...localSettings,...snap.settings};state.purchases.forEach", 'remote reserve cleanup')
          once("function reserved(p){return state.reservations.filter(r=>r.productId===p.id&&r.active).reduce((a,r)=>a+(Number(r.qty)||0),0)}\n", "", 'reserved helper')

          old_render_products="function renderProducts(){let q=(document.getElementById('q')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'all',s=document.getElementById('sort')?.value||'name';let a=state.products.filter(p=>[p.name,p.kaspi,p.wb,p.wb2,p.ozon].join(' ').toLowerCase().includes(q));a=a.filter(p=>f==='all'||f==='low'&&p.stock<=p.min&&p.stock>0||f==='zero'&&p.stock<=0||f==='reserve'&&reserved(p)>0||f==='buy'&&(p.stock<=p.min||p.stock<0));a.sort((x,y)=>s==='name'?x.name.localeCompare(y.name):s==='stock'?y.stock-x.stock:s==='sales'?salesDays(y)-salesDays(x):s==='profit'?profitForProduct(y)-profitForProduct(x):salesDays(x)?x.stock/salesDays(x)-y.stock/salesDays(y):0);document.getElementById('productList').innerHTML=a.length?a.map(productCard).join(''):'<div class=\"empty\">Товаров не найдено</div>'}"
          new_render_products="function renderProducts(){let q=(document.getElementById('q')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'all',s=document.getElementById('sort')?.value||'name';let a=state.products.filter(p=>[p.name,p.kaspi,p.wb,p.wb2,p.ozon].join(' ').toLowerCase().includes(q));a=a.filter(p=>f==='all'||f==='low'&&p.stock<=p.min&&p.stock>0||f==='zero'&&p.stock<=0||f==='buy'&&(p.stock<=p.min||p.stock<0));a.sort((x,y)=>s==='name'?x.name.localeCompare(y.name):s==='stock'?y.stock-x.stock:s==='sales'?salesDays(y)-salesDays(x):s==='profit'?profitForProduct(y)-profitForProduct(x):salesDays(x)?x.stock/salesDays(x)-y.stock/salesDays(y):0);document.getElementById('productList').innerHTML=a.length?a.map(productCard).join(''):'<div class=\"empty\">Товаров не найдено</div>'}"
          once(old_render_products,new_render_products,'render products')

          old_card="function productCard(p){let r=reserved(p),d=salesDays(p),profit=profitForProduct(p);return `<div class=\"item row\" onclick=\"openProduct('${p.id}')\">${p.photo?`<img class=\"thumb\" src=\"${p.photo}\">`:'<div class=\"thumb\">Фото</div>'}<div class=\"grow\"><div class=\"name\">${esc(p.name)}</div><div class=\"muted\">${esc(p.category||'Без категории')}</div><div class=\"muted\">Продажи/день: ${d.toFixed(1)} · Запас: ${d?(p.stock/d).toFixed(1):'∞'} дн.</div><div class=\"muted\">Себестоимость: ${fmt(p.cost)} · Прибыль 30д: ${fmt(profit)}</div></div><div class=\"right\"><b>${p.stock}</b><div class=\"muted\">шт.</div>${r?`<div class=\"badge\">резерв ${r}</div>`:''}</div></div>`}"
          new_card="function productCard(p){let d=salesDays(p),profit=profitForProduct(p);return `<div class=\"item row\" onclick=\"openProduct('${p.id}')\">${p.photo?`<img class=\"thumb\" src=\"${p.photo}\">`:'<div class=\"thumb\">Фото</div>'}<div class=\"grow\"><div class=\"name\">${esc(p.name)}</div><div class=\"muted\">${esc(p.category||'Без категории')}</div><div class=\"muted\">Продажи/день: ${d.toFixed(1)} · Запас: ${d?(p.stock/d).toFixed(1):'∞'} дн.</div><div class=\"muted\">Себестоимость: ${fmt(p.cost)} · Прибыль 30д: ${fmt(profit)}</div></div><div class=\"right\"><b>${p.stock}</b><div class=\"muted\">шт.</div></div></div>`}"
          once(old_card,new_card,'product card')

          old_open="function openProduct(pid,market='',days=30){let p=prod(pid);if(!p)return;let r=reserved(p),free=Math.max(0,(Number(p.stock)||0)-r),periodDays=Math.max(1,Number(days)||30),since=reportPeriodStart(periodDays),profit=market?financialSales().filter(x=>x.productId===p.id&&x.channel===market&&Number(x.date)>=since).reduce((a,x)=>a+(Number(x.qty)||0)*((Number(x.price)||0)-(Number(x.cost)||0)-(Number(x.fee)||0)),0):profitForProduct(p),profitLabel=market?`Прибыль ${esc(market)} за ${periodDays===1?'сегодня':periodDays+' дней'}`:'Прибыль за 30 дней',deliveryDays=market==='Kaspi'?periodDays:30,kaspiDelivery=productKaspiDelivery(p,deliveryDays),deliveryLabel=`Расход на доставку Kaspi за ${deliveryDays===1?'сегодня':deliveryDays+' дней'}`;let s=`<h3>${esc(p.name)}</h3><div class=\"item\"><b>Остаток товара</b><div class=\"kpi\" style=\"margin-top:10px\"><div><div class=\"label\">Всего на складе</div><div class=\"num\">${p.stock} шт.</div></div><div><div class=\"label\">Доступно к продаже</div><div class=\"num\">${free} шт.</div></div></div><div style=\"margin-top:12px\"><div class=\"muted\">Себестоимость 1 шт.</div><b>${fmt(p.cost)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">${deliveryLabel}</div><b>${fmt(kaspiDelivery)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">${profitLabel}</div><b>${fmt(profit)}</b></div></div><div class=\"item\" style=\"margin-top:8px\"><b>Артикулы маркетплейсов</b><div style=\"margin-top:9px;line-height:1.8\"><div><span class=\"muted\">Kaspi:</span> ${esc(p.kaspi||'—')}</div><div><span class=\"muted\">WB 1:</span> ${esc(p.wb||'—')}</div><div><span class=\"muted\">WB 2:</span> ${esc(p.wb2||'—')}</div><div><span class=\"muted\">Ozon:</span> ${esc(p.ozon||'—')}</div></div></div><button class=\"btn dark full\" onclick=\"closeModal();openModal('edit','${pid}')\">Редактировать товар</button><button class=\"btn full\" onclick=\"closeModal();openModal('writeoff','${pid}')\">Списать</button><button class=\"btn full\" onclick=\"closeModal();openModal('inventory','${pid}')\">Инвентаризация</button>`;showSheet(s)}"
          new_open="function openProduct(pid,market='',days=30){let p=prod(pid);if(!p)return;let periodDays=Math.max(1,Number(days)||30),since=reportPeriodStart(periodDays),profit=market?financialSales().filter(x=>x.productId===p.id&&x.channel===market&&Number(x.date)>=since).reduce((a,x)=>a+(Number(x.qty)||0)*((Number(x.price)||0)-(Number(x.cost)||0)-(Number(x.fee)||0)),0):profitForProduct(p),profitLabel=market?`Прибыль ${esc(market)} за ${periodDays===1?'сегодня':periodDays+' дней'}`:'Прибыль за 30 дней',deliveryDays=market==='Kaspi'?periodDays:30,kaspiDelivery=productKaspiDelivery(p,deliveryDays),deliveryLabel=`Расход на доставку Kaspi за ${deliveryDays===1?'сегодня':deliveryDays+' дней'}`;let s=`<h3>${esc(p.name)}</h3><div class=\"item\"><b>Остаток товара</b><div style=\"margin-top:10px\"><div class=\"label\">Всего на складе</div><div class=\"num\">${p.stock} шт.</div></div><div style=\"margin-top:12px\"><div class=\"muted\">Себестоимость 1 шт.</div><b>${fmt(p.cost)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">${deliveryLabel}</div><b>${fmt(kaspiDelivery)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">${profitLabel}</div><b>${fmt(profit)}</b></div></div><div class=\"item\" style=\"margin-top:8px\"><b>Артикулы маркетплейсов</b><div style=\"margin-top:9px;line-height:1.8\"><div><span class=\"muted\">Kaspi:</span> ${esc(p.kaspi||'—')}</div><div><span class=\"muted\">WB 1:</span> ${esc(p.wb||'—')}</div><div><span class=\"muted\">WB 2:</span> ${esc(p.wb2||'—')}</div><div><span class=\"muted\">Ozon:</span> ${esc(p.ozon||'—')}</div></div></div><button class=\"btn dark full\" onclick=\"closeModal();openModal('edit','${pid}')\">Редактировать товар</button><button class=\"btn full\" onclick=\"closeModal();openModal('writeoff','${pid}')\">Списать</button><button class=\"btn full\" onclick=\"closeModal();openModal('inventory','${pid}')\">Инвентаризация</button>`;showSheet(s)}"
          once(old_open,new_open,'product details')

          old_sale="function createSale(){let p=prod(document.getElementById('sp').value),q=+document.getElementById('sq').value||0,price=Math.max(0,+document.getElementById('sprice').value||0),fee=Math.max(0,+document.getElementById('sfee').value||0);if(!p||q<=0)return alert('Проверьте данные');const available=Math.max(0,(Number(p.stock)||0)-reserved(p));if(q>available)return alert('Недостаточно свободного остатка. Доступно: '+available+' шт.');const fifo=fifoConsume(p.id,q);p.stock=(Number(p.stock)||0)-q;let c=fifo.unitCost;state.sales.push({id:id(),productId:p.id,qty:q,price,cost:c,fee,channel:'Ручная',date:Date.now(),fifoLots:fifo.lots});p.totalProfit=(p.totalProfit||0)+q*(price-c-fee);refreshProductAverageCost(p);log('продажа',p.id,-q,'FIFO');save();closeModal();render()}"
          new_sale="function createSale(){let p=prod(document.getElementById('sp').value),q=+document.getElementById('sq').value||0,price=Math.max(0,+document.getElementById('sprice').value||0),fee=Math.max(0,+document.getElementById('sfee').value||0);if(!p||q<=0)return alert('Проверьте данные');const available=Math.max(0,Number(p.stock)||0);if(q>available)return alert('Недостаточно остатка. Доступно: '+available+' шт.');const fifo=fifoConsume(p.id,q);p.stock=(Number(p.stock)||0)-q;let c=fifo.unitCost;state.sales.push({id:id(),productId:p.id,qty:q,price,cost:c,fee,channel:'Ручная',date:Date.now(),fifoLots:fifo.lots});p.totalProfit=(p.totalProfit||0)+q*(price-c-fee);refreshProductAverageCost(p);log('продажа',p.id,-q,'FIFO');save();closeModal();render()}"
          once(old_sale,new_sale,'manual sale')

          old_write="function createWriteoff(){let p=prod(document.getElementById('wp').value),q=+document.getElementById('wq').value||0,r=document.getElementById('wr').value;if(!p||q<=0)return alert('Проверьте данные');const activeReserved=reserved(p),available=Math.max(0,(Number(p.stock)||0)-activeReserved);if(q>available)return alert('Нельзя списать зарезервированный товар. Свободно: '+available+' шт. · в резерве: '+activeReserved+' шт.');const fifo=fifoConsume(p.id,q);p.stock=(Number(p.stock)||0)-q;refreshProductAverageCost(p);log('списание',p.id,-q,r+' · FIFO '+fmt(fifo.totalCost));save();closeModal();render()}"
          new_write="function createWriteoff(){let p=prod(document.getElementById('wp').value),q=+document.getElementById('wq').value||0,r=document.getElementById('wr').value;if(!p||q<=0)return alert('Проверьте данные');const available=Math.max(0,Number(p.stock)||0);if(q>available)return alert('Недостаточно остатка. Доступно: '+available+' шт.');const fifo=fifoConsume(p.id,q);p.stock=(Number(p.stock)||0)-q;refreshProductAverageCost(p);log('списание',p.id,-q,r+' · FIFO '+fmt(fifo.totalCost));save();closeModal();render()}"
          once(old_write,new_write,'writeoff')

          old_inventory="function doInventory(){let p=prod(document.getElementById('ip').value);if(!p)return;let actual=+document.getElementById('iq').value||0;if(actual<0)return alert('Фактический остаток не может быть отрицательным');const activeReserved=reserved(p);if(actual<activeReserved)return alert('Остаток не может быть ниже активного резерва: '+activeReserved+' шт. Сначала отмените или обработайте резерв.');let old=Number(p.stock)||0,delta=actual-old;"
          new_inventory="function doInventory(){let p=prod(document.getElementById('ip').value);if(!p)return;let actual=+document.getElementById('iq').value||0;if(actual<0)return alert('Фактический остаток не может быть отрицательным');let old=Number(p.stock)||0,delta=actual-old;"
          once(old_inventory,new_inventory,'inventory')

          old_trans="function applyMarketplaceTransitions(market,feed){state.marketOrderState||={};state.marketplaceLiveSince||={};const bucket=state.marketOrderState[market]||(market==='Kaspi'?{...(state.kaspiOrders||{})}:{});state.marketOrderState[market]=bucket;if(!state.marketplaceLiveSince[market])state.marketplaceLiveSince[market]=Date.now();const liveSince=Number(state.marketplaceLiveSince[market])||Date.now();let reservedCount=0,soldCount=0,cancelledCount=0;for(const o of(feed||[])){if(!o?.productId)continue;const p=prod(o.productId);if(!p)continue;const qty=Math.max(0,Number(o.qty)||0);if(!qty)continue;const legacy=String(o.orderId)+':'+String(o.entryId),scoped=market+':'+legacy,prev=bucket[legacy]||bucket[scoped]||null,status=String(o.status||'').toUpperCase(),cancelled=['CANCELLED','CANCELLING','CANCEL'].includes(status),completed=isCompletedOrder(market,status,o.state),saleState=isMarketplaceSaleOrder(market,status,o.state),active=!saleState&&!cancelled&&String(o.state||'').toUpperCase()!=='ARCHIVE';const existingSale=state.sales.find(x=>x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy));const existingReservation=state.reservations.find(x=>x.active&&x.source===market&&(x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy)));const apiFeeTotal=Math.max(0,Number(o.marketplaceFee)||0)+Math.max(0,Number(o.sellerDeliveryCost)||0),apiFeePerUnit=qty?apiFeeTotal/qty:0;if(existingSale&&market==='Kaspi'&&apiFeeTotal>0){existingSale.fee=apiFeePerUnit;existingSale.feeSource=o.feeSource||'Kaspi API'}if(active&&!existingSale&&!existingReservation){state.reservations.push({id:id(),productId:p.id,qty,active:true,source:market,externalKey:scoped,date:Date.now()});log('резерв',p.id,-qty,market+' '+(o.code||''));reservedCount+=qty}else if(saleState){if(existingReservation)existingReservation.active=false;if(!existingSale&&(prev?.active||marketplaceSaleTimestamp(market,o)>=liveSince)){const stockBefore=Math.max(0,Number(p.stock)||0),fifo=fifoConsume(p.id,qty),shortage=Math.max(0,qty-stockBefore);p.stock=Math.max(0,stockBefore-qty);state.sales.push({id:id(),productId:p.id,qty,price:Number(o.unitPrice)||0,cost:fifo.unitCost,fee:apiFeePerUnit,feeSource:o.feeSource||'',channel:market,date:marketplaceSaleTimestamp(market,o),externalKey:scoped,fifoLots:fifo.lots,stockShortage:shortage});refreshProductAverageCost(p);log('продажа',p.id,-Math.min(qty,stockBefore),market+' '+(o.code||'')+(shortage?' · нехватка '+shortage+' шт.':''));soldCount+=qty}}else if(!active&&existingReservation){existingReservation.active=false;log('отмена резерва',p.id,existingReservation.qty,market+' '+(o.code||''));cancelledCount+=Number(existingReservation.qty)||0}bucket[legacy]={status:o.status,state:o.state,active,qty,sku:o.sku,updatedAt:Date.now()}}if(market==='Kaspi')state.kaspiOrders=bucket;return {reserved:reservedCount,sold:soldCount,cancelled:cancelledCount}}"
          new_trans="function applyMarketplaceTransitions(market,feed){state.marketOrderState||={};state.marketplaceLiveSince||={};const bucket=state.marketOrderState[market]||(market==='Kaspi'?{...(state.kaspiOrders||{})}:{});state.marketOrderState[market]=bucket;if(!state.marketplaceLiveSince[market])state.marketplaceLiveSince[market]=Date.now();const liveSince=Number(state.marketplaceLiveSince[market])||Date.now();let soldCount=0,cancelledCount=0;for(const o of(feed||[])){if(!o?.productId)continue;const p=prod(o.productId);if(!p)continue;const qty=Math.max(0,Number(o.qty)||0);if(!qty)continue;const legacy=String(o.orderId)+':'+String(o.entryId),scoped=market+':'+legacy,prev=bucket[legacy]||bucket[scoped]||null,status=String(o.status||'').toUpperCase(),cancelled=['CANCELLED','CANCELLING','CANCEL'].includes(status),saleState=isMarketplaceSaleOrder(market,status,o.state),active=!saleState&&!cancelled&&String(o.state||'').toUpperCase()!=='ARCHIVE';const existingSale=state.sales.find(x=>x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy));const apiFeeTotal=Math.max(0,Number(o.marketplaceFee)||0)+Math.max(0,Number(o.sellerDeliveryCost)||0),apiFeePerUnit=qty?apiFeeTotal/qty:0;if(existingSale&&market==='Kaspi'&&apiFeeTotal>0){existingSale.fee=apiFeePerUnit;existingSale.feeSource=o.feeSource||'Kaspi API'}if(saleState){if(!existingSale&&(prev?.active||marketplaceSaleTimestamp(market,o)>=liveSince)){const stockBefore=Math.max(0,Number(p.stock)||0),fifo=fifoConsume(p.id,qty),shortage=Math.max(0,qty-stockBefore);p.stock=Math.max(0,stockBefore-qty);state.sales.push({id:id(),productId:p.id,qty,price:Number(o.unitPrice)||0,cost:fifo.unitCost,fee:apiFeePerUnit,feeSource:o.feeSource||'',channel:market,date:marketplaceSaleTimestamp(market,o),externalKey:scoped,fifoLots:fifo.lots,stockShortage:shortage});refreshProductAverageCost(p);log('продажа',p.id,-Math.min(qty,stockBefore),market+' '+(o.code||'')+(shortage?' · нехватка '+shortage+' шт.':''));soldCount+=qty}}else if(cancelled&&prev?.active){cancelledCount+=qty}bucket[legacy]={status:o.status,state:o.state,active,qty,sku:o.sku,updatedAt:Date.now()}}if(market==='Kaspi')state.kaspiOrders=bucket;return {sold:soldCount,cancelled:cancelledCount}}"
          once(old_trans,new_trans,'market transitions')

          old_restore="function normalizeRestoredState(restored){restored.products||=[];restored.movements||=[];restored.sales||=[];restored.purchases||=[];restored.reservations||=[];restored.settings||={};restored.kaspiOrders||={};restored.kaspiOrderFeed||=[];restored.wbOrderFeed||=[];restored.ozonOrderFeed||=[];restored.marketOrderState||={};restored.marketplaceLiveSince||={};return restored}"
          new_restore="function normalizeRestoredState(restored){restored.products||=[];restored.movements=(restored.movements||[]).filter(m=>!['резерв','отмена резерва'].includes(String(m?.type||'')));restored.sales||=[];restored.purchases||=[];delete restored.reservations;restored.settings||={};restored.kaspiOrders||={};restored.kaspiOrderFeed||=[];restored.wbOrderFeed||=[];restored.ozonOrderFeed||=[];restored.marketOrderState||={};restored.marketplaceLiveSince||={};return restored}"
          once(old_restore,new_restore,'restore cleanup')
          once("function backupPayload(){return {format:'millioner-warehouse-backup',version:3,createdAt:Date.now(),createdAtIso:new Date().toISOString(),state}}", "function backupPayload(){return {format:'millioner-warehouse-backup',version:4,createdAt:Date.now(),createdAtIso:new Date().toISOString(),state}}", 'backup version')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
