name: One-shot marketplace report cost fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-report-cost-fallback.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch marketplace report cost fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor='function reportMarketplaceSales(){'
          helper="function reportSaleUnitCost(productId,old){const recorded=Math.max(0,Number(old?.cost)||0);if(recorded>0)return recorded;const p=productId?prod(productId):null;return p?Math.max(0,productDisplayCost(p)):0}\n"
          if helper.strip() not in s:
              if s.count(anchor)!=1:
                  raise SystemExit('reportMarketplaceSales anchor mismatch')
              s=s.replace(anchor,helper+anchor,1)
          old="const apiFeeTotal=Math.max(0,Number(o.marketplaceFee)||0)+Math.max(0,Number(o.sellerDeliveryCost)||0),apiFee=qty?apiFeeTotal/qty:0;out.push({...old,id:old?.id||('report-'+key),productId:o.productId||old?.productId||null,qty,price:Number(o.unitPrice)||Number(old?.price)||0,cost:Number(old?.cost)||0,fee:"
          new="const apiFeeTotal=Math.max(0,Number(o.marketplaceFee)||0)+Math.max(0,Number(o.sellerDeliveryCost)||0),apiFee=qty?apiFeeTotal/qty:0,productId=o.productId||old?.productId||null,unitCost=reportSaleUnitCost(productId,old);out.push({...old,id:old?.id||('report-'+key),productId,qty,price:Number(o.unitPrice)||Number(old?.price)||0,cost:unitCost,fee:"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('marketplace report cost expression mismatch')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate report cost regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          required=[
            'function reportSaleUnitCost(productId,old)',
            'unitCost=reportSaleUnitCost(productId,old)',
            'cost:unitCost',
            'function fifoConsume(productId,qty)',
            'function productDisplayCost(p)'
          ]
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing report cost markers: '+', '.join(missing))
          if "productId:o.productId||old?.productId||null,qty,price:Number(o.unitPrice)||Number(old?.price)||0,cost:Number(old?.cost)||0" in html:
              raise SystemExit('Old zero-cost marketplace report fallback remains')
          PY
          node --check /tmp/app.js
          node - <<'NODE'
          function prod(id){return id==='p1'?{id:'p1',cost:150}:id==='p2'?{id:'p2',cost:0}:null}
          function productDisplayCost(p){return Number(p?.cost)||0}
          function reportSaleUnitCost(productId,old){const recorded=Math.max(0,Number(old?.cost)||0);if(recorded>0)return recorded;const p=productId?prod(productId):null;return p?Math.max(0,productDisplayCost(p)):0}
          if(reportSaleUnitCost('p1',{cost:0})!==150)throw new Error('Current product cost was not used as historical fallback')
          if(reportSaleUnitCost('p1',{cost:80})!==80)throw new Error('Recorded FIFO cost must have priority')
          if(reportSaleUnitCost('p2',{cost:0})!==0)throw new Error('Zero-cost product fallback mismatch')
          console.log('Marketplace report cost fallback regression OK')
          NODE
          git diff --check

      - name: Commit report cost fix
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Deduct product cost in marketplace reports'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch smoke test
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 40 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
