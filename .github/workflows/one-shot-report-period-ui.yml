name: One-shot report period UI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-report-period-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch product detail delivery UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker="function profitForProduct(p,days=30){let since=Date.now()-days*86400000;return financialSales().filter(s=>s.productId===p.id&&s.date>=since).reduce((a,s)=>a+(Number(s.qty)||0)*((Number(s.price)||0)-(Number(s.cost)||0)-(Number(s.fee)||0)),0)}\n"
          helper="function productKaspiDelivery(p,days=30){const since=reportPeriodStart(days);return (state.kaspiOrderFeed||[]).filter(o=>o.productId===p.id&&Number(o.creationDate)>=since&&isMarketplaceSaleOrder('Kaspi',o.status,o.state)).reduce((a,o)=>a+Math.max(0,Number(o.sellerDeliveryCost)||0),0)}\n"
          if 'function productKaspiDelivery(' not in s:
              if marker not in s:
                  raise SystemExit('profit marker missing')
              s=s.replace(marker,marker+helper,1)
          start=s.index("function openProduct(pid,market='',days=30){")
          end=s.index('function openModal(',start)
          replacement="""function openProduct(pid,market='',days=30){let p=prod(pid);if(!p)return;let r=reserved(p),free=Math.max(0,(Number(p.stock)||0)-r),periodDays=Math.max(1,Number(days)||30),since=reportPeriodStart(periodDays),profit=market?financialSales().filter(x=>x.productId===p.id&&x.channel===market&&Number(x.date)>=since).reduce((a,x)=>a+(Number(x.qty)||0)*((Number(x.price)||0)-(Number(x.cost)||0)-(Number(x.fee)||0)),0):profitForProduct(p),profitLabel=market?`Прибыль ${esc(market)} за ${periodDays===1?'сегодня':periodDays+' дней'}`:'Прибыль за 30 дней',deliveryDays=market==='Kaspi'?periodDays:30,kaspiDelivery=productKaspiDelivery(p,deliveryDays),deliveryLabel=`Расход на доставку Kaspi за ${deliveryDays===1?'сегодня':deliveryDays+' дней'}`;let s=`<h3>${esc(p.name)}</h3><div class=\"item\"><b>Остаток товара</b><div class=\"kpi\" style=\"margin-top:10px\"><div><div class=\"label\">Всего на складе</div><div class=\"num\">${p.stock} шт.</div></div><div><div class=\"label\">Доступно к продаже</div><div class=\"num\">${free} шт.</div></div></div><div style=\"margin-top:12px\"><div class=\"muted\">Себестоимость 1 шт.</div><b>${fmt(p.cost)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">${deliveryLabel}</div><b>${fmt(kaspiDelivery)}</b></div><div style=\"margin-top:8px\"><div class=\"muted\">${profitLabel}</div><b>${fmt(profit)}</b></div></div><div class=\"item\" style=\"margin-top:8px\"><b>Артикулы маркетплейсов</b><div style=\"margin-top:9px;line-height:1.8\"><div><span class=\"muted\">Kaspi:</span> ${esc(p.kaspi||'—')}</div><div><span class=\"muted\">WB 1:</span> ${esc(p.wb||'—')}</div><div><span class=\"muted\">WB 2:</span> ${esc(p.wb2||'—')}</div><div><span class=\"muted\">Ozon:</span> ${esc(p.ozon||'—')}</div></div></div><button class=\"btn dark full\" onclick=\"closeModal();openModal('edit','${pid}')\">Редактировать товар</button><button class=\"btn full\" onclick=\"closeModal();openModal('writeoff','${pid}')\">Списать</button><button class=\"btn full\" onclick=\"closeModal();openModal('inventory','${pid}')\">Инвентаризация</button>`;showSheet(s)}\n"""
          s=s[:start]+replacement+s[end:]
          block=s[s.index("function openProduct(pid,market='',days=30){"):s.index('function openModal(',s.index("function openProduct(pid,market='',days=30){"))]
          if 'Стоимость всего остатка' in block:
              raise SystemExit('stock value still visible')
          if 'В резерве:' in block:
              raise SystemExit('reserve callout still visible')
          if 'Расход на доставку Kaspi' not in block:
              raise SystemExit('delivery label missing')
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY' > /tmp/app.js
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          print('\n'.join(re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)))
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show Kaspi delivery expense in product details'
          git push
