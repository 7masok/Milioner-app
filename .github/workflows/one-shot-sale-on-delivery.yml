name: One-shot Kaspi sale on delivery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-sale-on-delivery.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch sale transition
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function isCompletedOrder(market,status){const s=String(status||'').toUpperCase();return market==='WB'?['COMPLETE','COMPLETED'].includes(s):s==='COMPLETED'}"
          new="function isCompletedOrder(market,status){const s=String(status||'').toUpperCase();return market==='WB'?['COMPLETE','COMPLETED'].includes(s):s==='COMPLETED'}\nfunction isMarketplaceSaleOrder(market,status,state=''){const s=String(status||'').toUpperCase(),st=String(state||'').toUpperCase();if(market==='Kaspi')return s==='COMPLETED'||(s==='ACCEPTED_BY_MERCHANT'&&st==='KASPI_DELIVERY_TRANSIT');return isCompletedOrder(market,s)}\nfunction marketplaceSaleTimestamp(market,o){if(market==='Kaspi'&&String(o?.state||'').toUpperCase()==='KASPI_DELIVERY_TRANSIT')return toTimestamp(o?.courierTransmissionDate||o?.deliveryStartDate||o?.updatedAt||Date.now());return toTimestamp(o?.creationDate)}"
          if s.count(old)!=1: raise SystemExit('isCompletedOrder marker count '+str(s.count(old)))
          s=s.replace(old,new,1)
          old="if(!isCompletedOrder(market,o.status)||!o.productId)continue;"
          new="if(!isMarketplaceSaleOrder(market,o.status,o.state)||!o.productId)continue;"
          if s.count(old)!=1: raise SystemExit('financialSales marker count '+str(s.count(old)))
          s=s.replace(old,new,1)
          old="result.push({id:'virtual-'+market+'-'+legacy,productId:p.id,qty,price,cost:Number(p.cost)||0,fee:0,channel:market,date:toTimestamp(o.creationDate),externalKey:key,virtual:true});"
          new="result.push({id:'virtual-'+market+'-'+legacy,productId:p.id,qty,price,cost:Number(p.cost)||0,fee:0,channel:market,date:marketplaceSaleTimestamp(market,o),externalKey:key,virtual:true});"
          if s.count(old)!=1: raise SystemExit('virtual sale date marker count '+str(s.count(old)))
          s=s.replace(old,new,1)
          old="completed=isCompletedOrder(market,status),active=!completed&&!cancelled&&String(o.state||'').toUpperCase()!=='ARCHIVE';"
          new="completed=isCompletedOrder(market,status),saleState=isMarketplaceSaleOrder(market,status,o.state),active=!saleState&&!cancelled&&String(o.state||'').toUpperCase()!=='ARCHIVE';"
          if s.count(old)!=1: raise SystemExit('transition state marker count '+str(s.count(old)))
          s=s.replace(old,new,1)
          old="}else if(completed){if(existingReservation)existingReservation.active=false;if(!existingSale&&(prev?.active||toTimestamp(o.creationDate)>=liveSince)){"
          new="}else if(saleState){if(existingReservation)existingReservation.active=false;if(!existingSale&&(prev?.active||marketplaceSaleTimestamp(market,o)>=liveSince)){"
          if s.count(old)!=1: raise SystemExit('sale transition marker count '+str(s.count(old)))
          s=s.replace(old,new,1)
          old="channel:market,date:toTimestamp(o.creationDate),externalKey:scoped,fifoLots:fifo.lots"
          new="channel:market,date:marketplaceSaleTimestamp(market,o),externalKey:scoped,fifoLots:fifo.lots"
          if s.count(old)!=1: raise SystemExit('stored sale date marker count '+str(s.count(old)))
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript and behavior markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          for marker in ["function isMarketplaceSaleOrder(market,status,state='')","st==='KASPI_DELIVERY_TRANSIT'","saleState=isMarketplaceSaleOrder(market,status,o.state)","}else if(saleState){","date:marketplaceSaleTimestamp(market,o)"]:
              if marker not in html: raise SystemExit('missing '+marker)
          PY
          node --check /tmp/app.js
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Count Kaspi sale when order enters delivery'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
