name: One-shot secure warehouse API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-secure-warehouse-api.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --rebase origin main
      - run: python .github/scripts/secure_warehouse_api.py
      - run: node --check cloudflare/millioner-api/src/index.js
      - run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Restrict warehouse state API to app origin'
          git push origin HEAD:main
