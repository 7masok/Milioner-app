name: One-time standard order lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-standard-order-lifecycle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply standard lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              c=s.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1, got {c}')
              s=s.replace(old,new,1)
          def between(start,end,new,label):
              global s
              i=s.find(start); j=s.find(end,i if i>=0 else 0)
              if i<0 or j<0: raise SystemExit(f'{label}: markers not found')
              s=s[:i]+new+s[j:]
          once("let state=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[],movements:[],sales:[],purchases:[],settings:{autoBackup:true,lastSync:null}};","let state=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[],movements:[],sales:[],purchases:[],reservations:[],settings:{autoBackup:true,lastSync:null}};",'default state')
          once("state.products ||= [];state.movements ||= [];state.sales ||= [];state.purchases ||= [];state.settings ||= {};delete state.reservations;state.movements=state.movements.filter(m=>!['резерв','отмена резерва'].includes(String(m?.type||'')));","state.products ||= [];state.movements ||= [];state.sales ||= [];state.purchases ||= [];state.reservations ||= [];state.settings ||= {};state.movements=state.movements.filter(m=>!['резерв','отмена резерва'].includes(String(m?.type||'')));",'state init')
          once("function warehouseSnapshot(){const settings={...(state.settings||{})};delete settings.serverMarketStatus;return {products:state.products||[],movements:state.movements||[],sales:state.sales||[],purchases:state.purchases||[],settings,marketOrderState:state.marketOrderState||{},marketplaceLiveSince:state.marketplaceLiveSince||{},kaspiBaselineAt:state.kaspiBaselineAt||null}}","function warehouseSnapshot(){const settings={...(state.settings||{})};delete settings.serverMarketStatus;return {products:state.products||[],movements:state.movements||[],sales:state.sales||[],purchases:state.purchases||[],reservations:state.reservations||[],settings,marketOrderState:state.marketOrderState||{},marketplaceLiveSince:state.marketplaceLiveSince||{},kaspiBaselineAt:state.kaspiBaselineAt||null}}",'warehouse snapshot')
          once("function normalizeWarehouseSnapshot(x){x=x&&typeof x==='object'?x:{};return {products:Array.isArray(x.products)?x.products:[],movements:Array.isArray(x.movements)?x.movements.filter(m=>!['резерв','отмена резерва'].includes(String(m?.type||''))):[],sales:Array.isArray(x.sales)?x.sales:[],purchases:Array.isArray(x.purchases)?x.purchases:[],settings:x.settings&&typeof x.settings==='object'?x.settings:{},marketOrderState:x.marketOrderState&&typeof x.marketOrderState==='object'?x.marketOrderState:{},marketplaceLiveSince:x.marketplaceLiveSince&&typeof x.marketplaceLiveSince==='object'?x.marketplaceLiveSince:{},kaspiBaselineAt:x.kaspiBaselineAt||null}}","function normalizeWarehouseSnapshot(x){x=x&&typeof x==='object'?x:{};return {products:Array.isArray(x.products)?x.products:[],movements:Array.isArray(x.movements)?x.movements.filter(m=>!['резерв','отмена резерва'].includes(String(m?.type||''))):[],sales:Array.isArray(x.sales)?x.sales:[],purchases:Array.isArray(x.purchases)?x.purchases:[],reservations:Array.isArray(x.reservations)?x.reservations:[],settings:x.settings&&typeof x.settings==='object'?x.settings:{},marketOrderState:x.marketOrderState&&typeof x.marketOrderState==='object'?x.marketOrderState:{},marketplaceLiveSince:x.marketplaceLiveSince&&typeof x.marketplaceLiveSince==='object'?x.marketplaceLiveSince:{},kaspiBaselineAt:x.kaspiBaselineAt||null}}",'normalize snapshot')
          once("function hasWarehouseData(x){return !!((x?.products?.length||0)+(x?.purchases?.length||0)+(x?.sales?.length||0)+(x?.movements?.length||0))}","function hasWarehouseData(x){return !!((x?.products?.length||0)+(x?.purchases?.length||0)+(x?.sales?.length||0)+(x?.movements?.length||0)+(x?.reservations?.length||0))}",'data detection')
          once("state={...state,...snap,...feeds};delete state.reservations;state.settings={...localSettings,...snap.settings};state.purchases.forEach","state={...state,...snap,...feeds};state.reservations=Array.isArray(state.reservations)?state.reservations:[];state.settings={...localSettings,...snap.settings};state.purchases.forEach",'apply remote')
          once("function stockTotal(){return state.products.reduce((a,p)=>a+(Number(p.stock)||0),0)}\n","function stockTotal(){return state.products.reduce((a,p)=>a+(Number(p.stock)||0),0)}\nfunction reserved(p){return (state.reservations||[]).filter(r=>r.productId===p.id&&r.active).reduce((a,r)=>a+(Number(r.qty)||0),0)}\n",'reserved helper')
          lifecycle="function isCompletedOrder(market,status,state=''){return marketplaceLifecycleStage(market,status,state)==='delivery'}\nfunction marketplaceLifecycleStage(market,status,state=''){const u=String(status||'').toUpperCase(),st=String(state||'').toUpperCase();if(isWbMarket(market)){if(['CANCELED','CANCELLED','CANCELED_BY_CLIENT','DECLINED_BY_CLIENT','DEFECT'].includes(st)||['CANCEL','CANCELLED'].includes(u))return 'cancelled';if(['SORTED','ACCEPTED_BY_CARRIER','SENT_TO_CARRIER','READY_FOR_PICKUP','SOLD'].includes(st))return 'delivery';if(u==='CONFIRM'||u==='COMPLETE'||(st==='WAITING'&&u!=='NEW'))return 'transfer';return 'new'}if(market==='Kaspi'){if(['CANCELLED','CANCELLING','RETURNED','KASPI_DELIVERY_RETURN_REQUESTED'].includes(u))return 'cancelled';if(u==='COMPLETED'||(u==='ACCEPTED_BY_MERCHANT'&&['KASPI_DELIVERY_TRANSIT','DELIVERY'].includes(st)))return 'delivery';if(u==='ASSEMBLE'||u==='ACCEPTED_BY_MERCHANT')return 'transfer';return 'new'}if(['CANCELLED','CANCELLING','RETURNED'].includes(u))return 'cancelled';if(u==='COMPLETED'||u==='DELIVERY')return 'delivery';if(u==='ASSEMBLE'||u==='ACCEPTED_BY_MERCHANT')return 'transfer';return 'new'}\nfunction isMarketplaceSaleOrder(market,status,state=''){return marketplaceLifecycleStage(market,status,state)==='delivery'}\n"
          between("function isCompletedOrder(market,status,state='')","function marketplaceSaleTimestamp",lifecycle,'lifecycle')
          between("function marketplaceStatusLabel(market,status,state='')","function marketplaceStateLabel","function marketplaceStatusLabel(market,status,state=''){const stage=marketplaceLifecycleStage(market,status,state);return stage==='new'?'Новый':stage==='transfer'?'Передача':stage==='delivery'?'Доставка':'Отменён'}\n",'status label')
          between("function marketplaceStateLabel(market,state)","function kaspiStatusLabel","function marketplaceStateLabel(market,state,status=''){return marketplaceStatusLabel(market,status,state)}\n",'state label')
          totals="function marketplaceOrderCancelled(g){return marketplaceLifecycleStage(String(g?.market||selectedOrderMarket),g?.status,g?.state)==='cancelled'}\nfunction marketplaceOrderTotals(orders){let qty=0,amount=0;for(const g of(orders||[])){const stage=marketplaceLifecycleStage(String(g?.market||selectedOrderMarket),g?.status,g?.state);if(!['new','transfer'].includes(stage))continue;for(const o of(g.lines||[])){if(isPendingMarketplaceLine(o))continue;const q=Math.max(0,Number(o.qty)||0),lineTotal=Math.max(0,Number(o.totalPrice)||0),unit=Math.max(0,Number(o.unitPrice)||0);qty+=q;amount+=lineTotal>0?lineTotal:q*unit}}return {qty,amount}}\n"
          between("function marketplaceOrderCancelled(g)","function renderMarketplaceOrders",totals,'order totals')
          once("const gm=g.market||market,wb=isWbMarket(gm),statusClass=(wb&&['CANCELED','CANCELLED','CANCELED_BY_CLIENT','DECLINED_BY_CLIENT','DEFECT'].includes(stateUpper))||['CANCELLED','CANCELLING','CANCEL'].includes(statusUpper)?'bad':(wb?stateUpper==='SOLD':['COMPLETED'].includes(statusUpper))?'ok':'warn';","const gm=g.market||market,stage=marketplaceLifecycleStage(gm,g.status,g.state),statusClass=stage==='cancelled'?'bad':stage==='delivery'?'ok':'warn';",'status class')
          once("${gm==='WB2'?'<span class=\"badge\">WB 2</span>':gm==='WB'?'<span class=\"badge\">WB 1</span>':''}<span class=\"badge\">${esc(marketplaceStateLabel(gm,g.state))}</span>","${gm==='WB2'?'<span class=\"badge\">WB 2</span>':gm==='WB'?'<span class=\"badge\">WB 1</span>':''}",'native badge')
          transitions="function applyMarketplaceTransitions(market,feed){state.marketOrderState||={};state.marketplaceLiveSince||={};state.reservations||=[];const bucket=state.marketOrderState[market]||(market==='Kaspi'?{...(state.kaspiOrders||{})}:{});state.marketOrderState[market]=bucket;if(!state.marketplaceLiveSince[market])state.marketplaceLiveSince[market]=Date.now();const liveSince=Number(state.marketplaceLiveSince[market])||Date.now();let reservedCount=0,soldCount=0,cancelledCount=0;for(const o of(feed||[])){if(!o?.productId)continue;const p=prod(o.productId);if(!p)continue;const qty=Math.max(0,Number(o.qty)||0);if(!qty)continue;const legacy=String(o.orderId)+':'+String(o.entryId),scoped=market+':'+legacy,prev=bucket[legacy]||bucket[scoped]||null,stage=marketplaceLifecycleStage(market,o.status,o.state),active=stage==='new'||stage==='transfer';const existingSale=state.sales.find(x=>x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy));const existingReservation=state.reservations.find(x=>x.active&&x.source===market&&(x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy)));const apiFeeTotal=Math.max(0,Number(o.marketplaceFee)||0)+Math.max(0,Number(o.sellerDeliveryCost)||0),apiFeePerUnit=qty?apiFeeTotal/qty:0;if(existingSale&&market==='Kaspi'&&apiFeeTotal>0){existingSale.fee=apiFeePerUnit;existingSale.feeSource=o.feeSource||'Kaspi API'}if(active&&!existingSale){if(existingReservation){existingReservation.productId=p.id;existingReservation.qty=qty;existingReservation.stage=stage;existingReservation.updatedAt=Date.now()}else{state.reservations.push({id:id(),productId:p.id,qty,active:true,source:market,externalKey:scoped,stage,date:Date.now(),updatedAt:Date.now()});reservedCount+=qty}}else if(stage==='delivery'){if(existingReservation)existingReservation.active=false;if(!existingSale&&(prev?.active||['new','transfer'].includes(String(prev?.stage||''))||marketplaceSaleTimestamp(market,o)>=liveSince)){const stockBefore=Math.max(0,Number(p.stock)||0),fifo=fifoConsume(p.id,qty),shortage=Math.max(0,qty-stockBefore);p.stock=Math.max(0,stockBefore-qty);state.sales.push({id:id(),productId:p.id,qty,price:Number(o.unitPrice)||0,cost:fifo.unitCost,fee:apiFeePerUnit,feeSource:o.feeSource||'',channel:market,date:marketplaceSaleTimestamp(market,o),externalKey:scoped,fifoLots:fifo.lots,stockShortage:shortage});refreshProductAverageCost(p);log('продажа',p.id,-Math.min(qty,stockBefore),market+' '+(o.code||'')+(shortage?' · нехватка '+shortage+' шт.':''));soldCount+=qty}}else if(stage==='cancelled'){if(existingReservation){existingReservation.active=false;cancelledCount+=Number(existingReservation.qty)||0}}bucket[legacy]={status:o.status,state:o.state,active,stage,qty,sku:o.sku,updatedAt:Date.now()}}if(market==='Kaspi')state.kaspiOrders=bucket;return {reserved:reservedCount,sold:soldCount,cancelled:cancelledCount}}\n"
          between("function applyMarketplaceTransitions(market,feed)","async function apiJson",transitions,'transitions')
          once("const available=Math.max(0,Number(p.stock)||0);if(q>available)return alert('Недостаточно остатка. Доступно: '+available+' шт.');const fifo=fifoConsume(p.id,q);","const available=Math.max(0,(Number(p.stock)||0)-reserved(p));if(q>available)return alert('Недостаточно свободного остатка. Доступно: '+available+' шт.');const fifo=fifoConsume(p.id,q);",'manual sale')
          once("const available=Math.max(0,Number(p.stock)||0);if(q>available)return alert('Недостаточно остатка. Доступно: '+available+' шт.');const fifo=fifoConsume(p.id,q);","const available=Math.max(0,(Number(p.stock)||0)-reserved(p));if(q>available)return alert('Недостаточно свободного остатка. Доступно: '+available+' шт.');const fifo=fifoConsume(p.id,q);",'writeoff')
          once("function doInventory(){let p=prod(document.getElementById('ip').value);if(!p)return;let actual=+document.getElementById('iq').value||0;if(actual<0)return alert('Фактический остаток не может быть отрицательным');let old=Number(p.stock)||0,delta=actual-old;","function doInventory(){let p=prod(document.getElementById('ip').value);if(!p)return;let actual=+document.getElementById('iq').value||0;if(actual<0)return alert('Фактический остаток не может быть отрицательным');const ordered=reserved(p);if(actual<ordered)return alert('Остаток не может быть ниже количества в активных заказах: '+ordered+' шт.');let old=Number(p.stock)||0,delta=actual-old;",'inventory')
          once("function normalizeRestoredState(restored){restored.products||=[];restored.movements=(restored.movements||[]).filter(m=>!['резерв','отмена резерва'].includes(String(m?.type||'')));restored.sales||=[];restored.purchases||=[];delete restored.reservations;restored.settings||={};restored.kaspiOrders||={};restored.kaspiOrderFeed||=[];restored.wbOrderFeed||=[];restored.ozonOrderFeed||=[];restored.marketOrderState||={};restored.marketplaceLiveSince||={};return restored}","function normalizeRestoredState(restored){restored.products||=[];restored.movements=(restored.movements||[]).filter(m=>!['резерв','отмена резерва'].includes(String(m?.type||'')));restored.sales||=[];restored.purchases||=[];restored.reservations||=[];restored.settings||={};restored.kaspiOrders||={};restored.kaspiOrderFeed||=[];restored.wbOrderFeed||=[];restored.ozonOrderFeed||=[];restored.marketOrderState||={};restored.marketplaceLiveSince||={};return restored}",'restore')
          if "log('резерв'" in s or "log('отмена резерва'" in s: raise SystemExit('reserve movement logs returned')
          for marker in ['function marketplaceLifecycleStage(','function reserved(p)','state.reservations.push',"stage==='delivery'","['new','transfer'].includes(stage)"]:
              if marker not in s: raise SystemExit('missing '+marker)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit index
        run: |
          git config user.name '7masok'
          git config user.email '7masok@gmail.com'
          git add index.html
          git commit -m 'Standardize Kaspi and WB order lifecycle'
          git push
