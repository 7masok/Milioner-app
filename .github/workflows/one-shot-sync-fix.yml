name: One-shot marketplace sync fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-sync-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch sync status and Kaspi runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """  if(k?.latest?.ok){setIntegrationBadge('kaspiApiBadge','Работает','ok');setDot('dotKaspi','');if(ks)ks.textContent=`Статус: фоновая синхронизация работает · ${k.orderLines||0} строк · успешно ${shortClock(k.lastSuccessAt)}`}\n  else if(k?.latest){setIntegrationBadge('kaspiApiBadge','Ошибка','bad');setDot('dotKaspi','bad');if(ks)ks.textContent='Статус: '+String(k.latest.error||'ошибка фоновой синхронизации').slice(0,180)}\n  else{setIntegrationBadge('kaspiApiBadge','Проверяем','warn');setDot('dotKaspi','warn');if(ks)ks.textContent='Статус: ждём первый фоновый запуск'}\n"""
          new = """  const kRunning=!!(k?.latest&&!k.latest.finished_at&&!k.latest.error);\n  if(kRunning){setIntegrationBadge('kaspiApiBadge','Синхронизация','warn');setDot('dotKaspi','warn');if(ks)ks.textContent=`Статус: идёт фоновая синхронизация · старт ${shortClock(k.latest.started_at)}`}\n  else if(k?.latest?.ok){setIntegrationBadge('kaspiApiBadge','Работает','ok');setDot('dotKaspi','');if(ks)ks.textContent=`Статус: фоновая синхронизация работает · ${k.orderLines||0} строк · успешно ${shortClock(k.lastSuccessAt)}`}\n  else if(k?.latest){setIntegrationBadge('kaspiApiBadge','Ошибка','bad');setDot('dotKaspi','bad');if(ks)ks.textContent='Статус: '+String(k.latest.error||'ошибка фоновой синхронизации').slice(0,180)}\n  else{setIntegrationBadge('kaspiApiBadge','Проверяем','warn');setDot('dotKaspi','warn');if(ks)ks.textContent='Статус: ждём первый фоновый запуск'}\n"""
          s = replace_once(s, old, new, 'Kaspi running UI')
          p.write_text(s, encoding='utf-8')

          p = Path('cloudflare/millioner-api/src/index.js')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              "const KASPI_SCHEDULE_MS = 10 * 60 * 1000;\n",
              "const KASPI_SCHEDULE_MS = 10 * 60 * 1000;\nconst KASPI_MAX_BATCHES = 4;\n",
              'Kaspi max batches constant',
          )
          s = replace_once(
              s,
              "    for (const line of lines) await upsertOrderLine(env.DB, market, line);\n",
              "    await upsertOrderLines(env.DB, market, lines);\n",
              'batched upsert call',
          )
          s = replace_once(
              s,
              "  for (let safety = 0; safety < 40; safety++) {\n",
              "  for (let safety = 0; safety < KASPI_MAX_BATCHES; safety++) {\n",
              'Kaspi pagination cap',
          )
          marker = "async function upsertOrderLine(db, market, o) {\n"
          if marker not in s:
              raise SystemExit('upsert marker missing')
          helper = """async function upsertOrderLines(db, market, lines) {\n  if (!lines.length) return;\n  const sql = `\n    INSERT INTO marketplace_order_lines\n      (market,order_id,code,entry_id,status,state,creation_date,sku,product_name,qty,unit_price,total_price,raw_json,first_seen_at,updated_at)\n    VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)\n    ON CONFLICT(market,order_id,entry_id) DO UPDATE SET\n      code=excluded.code,status=excluded.status,state=excluded.state,creation_date=excluded.creation_date,\n      sku=excluded.sku,product_name=excluded.product_name,qty=excluded.qty,unit_price=excluded.unit_price,\n      total_price=excluded.total_price,raw_json=excluded.raw_json,updated_at=excluded.updated_at\n  `;\n  for (let i = 0; i < lines.length; i += 50) {\n    const now = Date.now();\n    const batch = lines.slice(i, i + 50).map(o => envlessOrderStatement(db, sql, market, o, now));\n    await db.batch(batch);\n  }\n}\n\nfunction envlessOrderStatement(db, sql, market, o, now) {\n  return db.prepare(sql).bind(market,o.orderId,o.code,o.entryId,o.status,o.state,o.creationDate,o.sku,o.productName,o.qty,o.unitPrice,o.totalPrice,JSON.stringify(o.raw || {}),now,now);\n}\n\n"""
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate patched code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert "'Синхронизация','warn'" in html
          api=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          assert 'const KASPI_MAX_BATCHES = 4;' in api
          assert 'await upsertOrderLines(env.DB, market, lines);' in api
          PY
          node --check /tmp/app.js
          node --check cloudflare/millioner-api/src/index.js

      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js
          git commit -m 'Fix marketplace sync status and bound Kaspi cron' || exit 0
          git push origin HEAD:main
