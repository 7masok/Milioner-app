name: One-shot unmatched order filter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-unmatched-order-filter.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Add unmatched-order filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          once(
            '.order-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.order-summary .card{padding:10px}.order-summary .num{font-size:17px}.order-list{display:flex;flex-direction:column;gap:8px}',
            '.order-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.order-summary .card{padding:10px}.order-summary .num{font-size:17px}.order-summary .filter-card{cursor:pointer;user-select:none}.order-summary .filter-card.active{border-color:#111;box-shadow:0 0 0 1px #111 inset}.order-list{display:flex;flex-direction:column;gap:8px}',
            'filter card css')

          once(
            '<div class="order-summary"><div class="card"><div class="label">Получено</div><div class="num" id="koTotal">0</div></div><div class="card"><div class="label">Привязано</div><div class="num" id="koMatched">0</div></div><div class="card"><div class="label">Не привязано</div><div class="num" id="koUnmatched">0</div></div></div>',
            '<div class="order-summary"><div class="card"><div class="label">Получено</div><div class="num" id="koTotal">0</div></div><div class="card"><div class="label">Привязано</div><div class="num" id="koMatched">0</div></div><div id="koUnmatchedCard" class="card filter-card" role="button" tabindex="0" onclick="toggleUnmatchedOrderFilter()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleUnmatchedOrderFilter()}"><div class="label">Не привязано</div><div class="num" id="koUnmatched">0</div></div></div>',
            'unmatched card button')

          once(
            "let selectedPeriodPreset=[0,1,7,30].includes(Number(state.settings.selectedPeriodPreset))?Number(state.settings.selectedPeriodPreset):1;let selectedPeriod=selectedPeriodPreset===0?Math.max(1,Number(state.settings.selectedPeriod)||14):selectedPeriodPreset;let selectedOrderMarket=['Kaspi','WB','Ozon'].includes(state.settings.selectedOrderMarket)?state.settings.selectedOrderMarket:'Kaspi';",
            "let selectedPeriodPreset=[0,1,7,30].includes(Number(state.settings.selectedPeriodPreset))?Number(state.settings.selectedPeriodPreset):1;let selectedPeriod=selectedPeriodPreset===0?Math.max(1,Number(state.settings.selectedPeriod)||14):selectedPeriodPreset;let selectedOrderMarket=['Kaspi','WB','Ozon'].includes(state.settings.selectedOrderMarket)?state.settings.selectedOrderMarket:'Kaspi';let unmatchedOrderFilter=state.settings.unmatchedOrderFilter===true;",
            'filter state')

          once(
            "function selectOrderMarket(market){selectedOrderMarket=market;state.settings.selectedOrderMarket=market;save();renderMarketplaceOrders();document.querySelectorAll('.market-tab').forEach(b=>b.classList.toggle('active',b.dataset.market===market))}",
            "function selectOrderMarket(market){selectedOrderMarket=market;state.settings.selectedOrderMarket=market;save();renderMarketplaceOrders();document.querySelectorAll('.market-tab').forEach(b=>b.classList.toggle('active',b.dataset.market===market))}\nfunction toggleUnmatchedOrderFilter(){unmatchedOrderFilter=!unmatchedOrderFilter;state.settings.unmatchedOrderFilter=unmatchedOrderFilter;save();renderMarketplaceOrders()}\nfunction orderHasUnmatchedLine(g){return (g?.lines||[]).some(x=>!x.productId&&!isPendingMarketplaceLine(x))}",
            'filter functions')

          old="function renderMarketplaceOrders(){const list=document.getElementById('kaspiOrderList');if(!list)return;const market=selectedOrderMarket;const feed=market==='Kaspi'?state.kaspiOrderFeed:market==='WB'?state.wbOrderFeed:state.ozonOrderFeed;const orders=groupMarketplaceOrders(feed);const total=orders.length,matched=orders.filter(g=>g.lines.length&&g.lines.every(x=>x.productId||isPendingMarketplaceLine(x))).length,unmatched=total-matched;const eTotal=document.getElementById('koTotal'),eMatched=document.getElementById('koMatched'),eUnmatched=document.getElementById('koUnmatched');if(eTotal)eTotal.textContent=total;if(eMatched)eMatched.textContent=matched;if(eUnmatched)eUnmatched.textContent=unmatched;if(!orders.length){if(market==='Kaspi')list.innerHTML='<div class=\"empty\">Нажмите ↻ сверху, чтобы загрузить заказы Kaspi</div>';else if(market==='WB')list.innerHTML='<div class=\"empty\">Заказы WB ещё не загружены.<button class=\"btn dark full\" onclick=\"syncWbNow()\">Получить заказы WB</button></div>';else list.innerHTML='<div class=\"empty\">Ozon пока не подключён. После подключения здесь будут его заказы.</div>';return}list.innerHTML=orders.slice(0,100).map(g=>{"
          new="function renderMarketplaceOrders(){const list=document.getElementById('kaspiOrderList');if(!list)return;const market=selectedOrderMarket;const feed=market==='Kaspi'?state.kaspiOrderFeed:market==='WB'?state.wbOrderFeed:state.ozonOrderFeed;const orders=groupMarketplaceOrders(feed);const total=orders.length,unmatchedOrders=orders.filter(orderHasUnmatchedLine),unmatched=unmatchedOrders.length,matched=total-unmatched;const eTotal=document.getElementById('koTotal'),eMatched=document.getElementById('koMatched'),eUnmatched=document.getElementById('koUnmatched'),filterCard=document.getElementById('koUnmatchedCard');if(eTotal)eTotal.textContent=total;if(eMatched)eMatched.textContent=matched;if(eUnmatched)eUnmatched.textContent=unmatched;if(filterCard){filterCard.classList.toggle('active',unmatchedOrderFilter);filterCard.setAttribute('aria-pressed',unmatchedOrderFilter?'true':'false')}if(!orders.length){if(market==='Kaspi')list.innerHTML='<div class=\"empty\">Нажмите ↻ сверху, чтобы загрузить заказы Kaspi</div>';else if(market==='WB')list.innerHTML='<div class=\"empty\">Заказы WB ещё не загружены.<button class=\"btn dark full\" onclick=\"syncWbNow()\">Получить заказы WB</button></div>';else list.innerHTML='<div class=\"empty\">Ozon пока не подключён. После подключения здесь будут его заказы.</div>';return}const visibleOrders=unmatchedOrderFilter?unmatchedOrders:orders;if(!visibleOrders.length){list.innerHTML='<div class=\"empty\">Все заказы привязаны. Нажмите «Не привязано» ещё раз, чтобы показать все заказы.</div>';return}list.innerHTML=visibleOrders.slice(0,100).map(g=>{"
          once(old,new,'render filter')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate browser JavaScript and markers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          required=['id="koUnmatchedCard"','function toggleUnmatchedOrderFilter()','function orderHasUnmatchedLine(g)','const visibleOrders=unmatchedOrderFilter?unmatchedOrders:orders']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing filter markers: '+', '.join(missing))
          PY
          node --check /tmp/app.js
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Make unlinked order count a filter button'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
