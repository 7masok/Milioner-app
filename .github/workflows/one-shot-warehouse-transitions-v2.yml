name: One-shot warehouse transitions v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-warehouse-transitions-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch marketplace inventory transitions and stock guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          once(
            "state.products ||= [];state.movements ||= [];state.sales ||= [];state.purchases ||= [];state.reservations ||= [];state.settings ||= {};state.settings.wbWorkerUrl ||= WB_WORKER;state.kaspiOrders ||= {};state.kaspiOrderFeed ||= [];state.wbOrderFeed ||= [];state.ozonOrderFeed ||= [];state.kaspiBaselineAt ||= null;",
            "state.products ||= [];state.movements ||= [];state.sales ||= [];state.purchases ||= [];state.reservations ||= [];state.settings ||= {};state.settings.wbWorkerUrl ||= WB_WORKER;state.kaspiOrders ||= {};state.marketOrderState ||= {};state.marketplaceLiveSince ||= {};state.kaspiOrderFeed ||= [];state.wbOrderFeed ||= [];state.ozonOrderFeed ||= [];state.kaspiBaselineAt ||= null;",
            'state migration'
          )

          once(
            "function financialSales(){const result=[...(state.sales||[])],seen=new Set(result.map(s=>s.externalKey).filter(Boolean));for(const [market,feed] of [['Kaspi',state.kaspiOrderFeed],['WB',state.wbOrderFeed],['Ozon',state.ozonOrderFeed]]){for(const o of(feed||[])){if(!isCompletedOrder(market,o.status)||!o.productId)continue;const key=String(o.orderId)+':'+String(o.entryId);if(seen.has(key))continue;const p=prod(o.productId);if(!p)continue;const qty=Math.max(0,Number(o.qty)||0);if(!qty)continue;const total=Number(o.totalPrice)||0;const price=Number(o.unitPrice)||(total/qty)||0;result.push({id:'virtual-'+market+'-'+key,productId:p.id,qty,price,cost:Number(p.cost)||0,fee:0,channel:market,date:toTimestamp(o.creationDate),externalKey:key,virtual:true});seen.add(key)}}return result}",
            "function financialSales(){const result=[...(state.sales||[])],seen=new Set(result.map(s=>s.externalKey).filter(Boolean));for(const [market,feed] of [['Kaspi',state.kaspiOrderFeed],['WB',state.wbOrderFeed],['Ozon',state.ozonOrderFeed]]){for(const o of(feed||[])){if(!isCompletedOrder(market,o.status)||!o.productId)continue;const legacy=String(o.orderId)+':'+String(o.entryId),key=market+':'+legacy;if(seen.has(key)||seen.has(legacy))continue;const p=prod(o.productId);if(!p)continue;const qty=Math.max(0,Number(o.qty)||0);if(!qty)continue;const total=Number(o.totalPrice)||0;const price=Number(o.unitPrice)||(total/qty)||0;result.push({id:'virtual-'+market+'-'+legacy,productId:p.id,qty,price,cost:Number(p.cost)||0,fee:0,channel:market,date:toTimestamp(o.creationDate),externalKey:key,virtual:true});seen.add(key)}}return result}",
            'financial sales dedupe'
          )

          once(
            "function attachMarketplaceSku(p,market,sku,feedKey=''){const field=marketplaceField(market);if(!field)return alert('Неизвестный маркетплейс');const old=String(p[field]||'').trim();if(old&&old!==String(sku||'').trim()){const ok=confirm(`У товара «${p.name}» уже указан ${market} артикул ${old}. Заменить его на ${sku}?`);if(!ok)return false}p[field]=String(sku||'').trim();const feed=market==='Kaspi'?state.kaspiOrderFeed:market==='WB'?state.wbOrderFeed:state.ozonOrderFeed;(feed||[]).forEach(o=>{if(String(o.sku||'').trim()===p[field])o.productId=p.id});save();return true}",
            "function attachMarketplaceSku(p,market,sku,feedKey=''){const field=marketplaceField(market);if(!field)return alert('Неизвестный маркетплейс');const old=String(p[field]||'').trim();if(old&&old!==String(sku||'').trim()){const ok=confirm(`У товара «${p.name}» уже указан ${market} артикул ${old}. Заменить его на ${sku}?`);if(!ok)return false}p[field]=String(sku||'').trim();const feed=market==='Kaspi'?state.kaspiOrderFeed:market==='WB'?state.wbOrderFeed:state.ozonOrderFeed;(feed||[]).forEach(o=>{if(String(o.sku||'').trim()===p[field])o.productId=p.id});applyMarketplaceTransitions(market,feed||[]);save();return true}",
            'link transition application'
          )

          once(
            "function createSale(){let p=prod(document.getElementById('sp').value),q=+document.getElementById('sq').value||0,price=Math.max(0,+document.getElementById('sprice').value||0),fee=Math.max(0,+document.getElementById('sfee').value||0);if(!p||q<=0)return alert('Проверьте данные');p.stock=(Number(p.stock)||0)-q;let c=Number(p.cost)||0;state.sales.push({id:id(),productId:p.id,qty:q,price,cost:c,fee,channel:'Ручная',date:Date.now()});p.totalProfit=(p.totalProfit||0)+q*(price-c-fee);log('продажа',p.id,-q);save();closeModal();render()}",
            "function createSale(){let p=prod(document.getElementById('sp').value),q=+document.getElementById('sq').value||0,price=Math.max(0,+document.getElementById('sprice').value||0),fee=Math.max(0,+document.getElementById('sfee').value||0);if(!p||q<=0)return alert('Проверьте данные');const available=Math.max(0,(Number(p.stock)||0)-reserved(p));if(q>available)return alert('Недостаточно свободного остатка. Доступно: '+available+' шт.');p.stock=(Number(p.stock)||0)-q;let c=Number(p.cost)||0;state.sales.push({id:id(),productId:p.id,qty:q,price,cost:c,fee,channel:'Ручная',date:Date.now()});p.totalProfit=(p.totalProfit||0)+q*(price-c-fee);log('продажа',p.id,-q);save();closeModal();render()}",
            'manual sale stock guard'
          )

          once(
            "function createWriteoff(){let p=prod(document.getElementById('wp').value),q=+document.getElementById('wq').value||0,r=document.getElementById('wr').value;if(!p||q<=0)return alert('Проверьте данные');p.stock=(Number(p.stock)||0)-q;log('списание',p.id,-q,r);save();closeModal();render()}",
            "function createWriteoff(){let p=prod(document.getElementById('wp').value),q=+document.getElementById('wq').value||0,r=document.getElementById('wr').value;if(!p||q<=0)return alert('Проверьте данные');const available=Math.max(0,Number(p.stock)||0);if(q>available)return alert('Нельзя списать больше остатка. На складе: '+available+' шт.');p.stock=(Number(p.stock)||0)-q;log('списание',p.id,-q,r);save();closeModal();render()}",
            'writeoff stock guard'
          )

          once(
            "function doInventory(){let p=prod(document.getElementById('ip').value);if(!p)return;let actual=+document.getElementById('iq').value||0,old=Number(p.stock)||0,delta=actual-old;p.stock=actual;log('инвентаризация',p.id,delta,`было ${old}, стало ${actual}`);save();closeModal();render()}",
            "function doInventory(){let p=prod(document.getElementById('ip').value);if(!p)return;let actual=+document.getElementById('iq').value||0;if(actual<0)return alert('Фактический остаток не может быть отрицательным');let old=Number(p.stock)||0,delta=actual-old;p.stock=actual;log('инвентаризация',p.id,delta,`было ${old}, стало ${actual}`);save();closeModal();render()}",
            'inventory stock guard'
          )

          marker="function mergeOrderFeeds(local,remote){const map=new Map();for(const o of(local||[]))map.set(String(o.orderId)+':'+String(o.entryId),o);for(const o of(remote||[])){const key=String(o.orderId)+':'+String(o.entryId),prev=map.get(key)||{};map.set(key,{...prev,...o,productId:o.productId||prev.productId||null})}return [...map.values()].sort((a,b)=>(Number(b.creationDate)||0)-(Number(a.creationDate)||0)).slice(0,500)}\n"
          helper="""function applyMarketplaceTransitions(market,feed){state.marketOrderState||={};state.marketplaceLiveSince||={};const bucket=state.marketOrderState[market]||(market==='Kaspi'?{...(state.kaspiOrders||{})}:{});state.marketOrderState[market]=bucket;if(!state.marketplaceLiveSince[market])state.marketplaceLiveSince[market]=Date.now();const liveSince=Number(state.marketplaceLiveSince[market])||Date.now();let reservedCount=0,soldCount=0,cancelledCount=0;for(const o of(feed||[])){if(!o?.productId)continue;const p=prod(o.productId);if(!p)continue;const qty=Math.max(0,Number(o.qty)||0);if(!qty)continue;const legacy=String(o.orderId)+':'+String(o.entryId),scoped=market+':'+legacy,prev=bucket[legacy]||bucket[scoped]||null,status=String(o.status||'').toUpperCase(),cancelled=['CANCELLED','CANCELLING','CANCEL'].includes(status),completed=isCompletedOrder(market,status),active=!completed&&!cancelled&&String(o.state||'').toUpperCase()!=='ARCHIVE';const existingSale=state.sales.some(x=>x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy));const existingReservation=state.reservations.find(x=>x.active&&x.source===market&&(x.externalKey===scoped||(market==='Kaspi'&&x.externalKey===legacy)));if(!prev){if(active&&!existingReservation){state.reservations.push({id:id(),productId:p.id,qty,active:true,source:market,externalKey:scoped,date:Date.now()});log('резерв',p.id,-qty,market+' '+(o.code||''));reservedCount+=qty}else if(completed&&toTimestamp(o.creationDate)>=liveSince&&!existingSale){p.stock=(Number(p.stock)||0)-qty;state.sales.push({id:id(),productId:p.id,qty,price:Number(o.unitPrice)||0,cost:Number(p.cost)||0,fee:0,channel:market,date:toTimestamp(o.creationDate),externalKey:scoped});log('продажа',p.id,-qty,market+' '+(o.code||''));soldCount+=qty}}else{if(prev.active&&completed){if(existingReservation)existingReservation.active=false;if(!existingSale){p.stock=(Number(p.stock)||0)-qty;state.sales.push({id:id(),productId:p.id,qty,price:Number(o.unitPrice)||0,cost:Number(p.cost)||0,fee:0,channel:market,date:toTimestamp(o.creationDate),externalKey:scoped});log('продажа',p.id,-qty,market+' '+(o.code||''));soldCount+=qty}}if(prev.active&&cancelled&&existingReservation){existingReservation.active=false;log('отмена резерва',p.id,existingReservation.qty,market+' '+(o.code||''));cancelledCount+=Number(existingReservation.qty)||0}}bucket[legacy]={status:o.status,state:o.state,active,qty,sku:o.sku,updatedAt:Date.now()}}if(market==='Kaspi')state.kaspiOrders=bucket;return {reserved:reservedCount,sold:soldCount,cancelled:cancelledCount}}\n"""
          if marker not in s: raise SystemExit('mergeOrderFeeds marker missing')
          s=s.replace(marker,marker+helper,1)

          once(
            "async function loadSharedOrderCache({silent=true}={}){try{const [status,kd,wd]=await Promise.all([apiJson(MILLIONER_API+'/api/market-status'),apiJson(MILLIONER_API+'/api/orders?market=Kaspi&limit=500'),apiJson(MILLIONER_API+'/api/orders?market=WB&limit=500')]);state.settings.serverMarketStatus={};for(const s of(status.markets||[]))state.settings.serverMarketStatus[s.market]=s;const k=normalizeServerFeed(kd.orders,'Kaspi'),w=normalizeServerFeed(wd.orders,'WB');if(k.length)state.kaspiOrderFeed=mergeOrderFeeds(state.kaspiOrderFeed,k);if(w.length)state.wbOrderFeed=mergeOrderFeeds(state.wbOrderFeed,w);const success=(status.markets||[]).map(x=>Number(x.lastSuccessAt||0)).filter(Boolean);if(success.length)state.settings.lastSync=Math.max(Number(state.settings.lastSync||0),...success);save();render();return {kaspi:k.length,wb:w.length,status}}catch(e){console.error('Shared cache error',e);if(!silent)alert('Ошибка общей базы:\\n'+String(e.message||e));return {kaspi:0,wb:0,error:e}}}",
            "async function loadSharedOrderCache({silent=true}={}){try{const [status,kd,wd]=await Promise.all([apiJson(MILLIONER_API+'/api/market-status'),apiJson(MILLIONER_API+'/api/orders?market=Kaspi&limit=500'),apiJson(MILLIONER_API+'/api/orders?market=WB&limit=500')]);state.settings.serverMarketStatus={};for(const s of(status.markets||[]))state.settings.serverMarketStatus[s.market]=s;const k=normalizeServerFeed(kd.orders,'Kaspi'),w=normalizeServerFeed(wd.orders,'WB');if(k.length){state.kaspiOrderFeed=mergeOrderFeeds(state.kaspiOrderFeed,k);applyMarketplaceTransitions('Kaspi',state.kaspiOrderFeed)}if(w.length){state.wbOrderFeed=mergeOrderFeeds(state.wbOrderFeed,w);applyMarketplaceTransitions('WB',state.wbOrderFeed)}const success=(status.markets||[]).map(x=>Number(x.lastSuccessAt||0)).filter(Boolean);if(success.length)state.settings.lastSync=Math.max(Number(state.settings.lastSync||0),...success);save();render();return {kaspi:k.length,wb:w.length,status}}catch(e){console.error('Shared cache error',e);if(!silent)alert('Ошибка общей базы:\\n'+String(e.message||e));return {kaspi:0,wb:0,error:e}}}",
            'shared cache stock transitions'
          )

          pattern=r"async function syncNow\(\)\{.*?\}\nfunction backup\(\)"
          replacement="""async function syncNow(){const btn=document.querySelector('header .btn');const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='…'}try{const result=await loadSharedOrderCache({silent:false});const count=(state.kaspiOrderFeed||[]).length,s=marketServerStatus('Kaspi');if(result.error)throw result.error;if(s?.latest?.ok)alert('Kaspi обновлён из общей базы.\\nСтрок заказов: '+count+'\\nПоследний успех: '+shortClock(s.lastSuccessAt));else if(s?.latest&&!s.latest.finished_at)alert('Kaspi: сервер сейчас синхронизирует заказы. Показана последняя доступная копия: '+count+' строк.');else alert('Kaspi: показана последняя серверная копия. Строк: '+count)}catch(e){alert('Ошибка обновления Kaspi:\\n'+String(e.message||e))}finally{if(btn){btn.disabled=false;btn.textContent=old||'↻'}}}\nfunction backup()"""
          s2,n=re.subn(pattern,lambda m:replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'syncNow replacement: expected 1, got {n}')
          s=s2

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate patched app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          required=['function applyMarketplaceTransitions(market,feed)',"applyMarketplaceTransitions('Kaspi',state.kaspiOrderFeed)","applyMarketplaceTransitions('WB',state.wbOrderFeed)",'Недостаточно свободного остатка','Нельзя списать больше остатка','Фактический остаток не может быть отрицательным','Kaspi обновлён из общей базы']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing patched contracts: '+', '.join(missing))
          sync=re.search(r'async function syncNow\(\)\{.*?\}\nfunction backup',html,re.S)
          if not sync: raise SystemExit('syncNow missing')
          if 'KASPI_WORKER' in sync.group(0): raise SystemExit('syncNow still directly calls Kaspi Worker')
          PY
          node --check /tmp/app.js

      - name: Commit patch
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Drive marketplace stock from server cache' || exit 0
          git push origin HEAD:main
