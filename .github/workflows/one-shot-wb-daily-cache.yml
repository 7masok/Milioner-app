name: Deploy Millioner Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/millioner-api/src/**'
      - 'cloudflare/millioner-api/wrangler.jsonc'
      - '.github/workflows/one-shot-wb-daily-cache.yml'

permissions:
  contents: read

concurrency:
  group: deploy-millioner-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare/millioner-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate JavaScript
        run: |
          node --check src/wb-daily-cache.js
          node --check src/fixed.js
      - name: Verify Wrangler and dry run
        run: |
          npx --yes wrangler@4 --version
          npx --yes wrangler@4 deploy --dry-run --keep-vars
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --keep-vars
