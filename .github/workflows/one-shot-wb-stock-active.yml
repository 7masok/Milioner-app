name: One-shot active WB stock synchronization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-wb-stock-active.yml'
      - 'tools/patch_wb_stock_sync_active.py'

permissions:
  contents: write
  actions: write

jobs:
  patch-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded active WB stock patch
        run: python tools/patch_wb_stock_sync_active.py

      - name: Validate active stock safety contract
        run: |
          node --check cloudflare/millioner-api/src/index.js
          python - <<'PY'
          from pathlib import Path
          s=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          required=[
            'async function syncWbStockMarket(',
            "WB_MARKETPLACE_BASE + '/api/v3/stocks/'",
            "method:'PUT'",
            "reason:'warehouse-empty-safety'",
            "reason:'partial-mapping-safety'",
            "reason:'empty-payload-safety'",
            "reason:'unchanged'",
            'async function stockPayloadHash(',
            'CREATE TABLE IF NOT EXISTS wb_stock_state',
            "mode:'active'" if False else "mode: 'active'",
            "syncWbStockMarket(env, market, { force: false })"
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing active WB stock markers: '+', '.join(missing))
          if 'wb-sync.7masok.workers.dev' in s: raise SystemExit('Direct WB Worker call introduced')
          if "if (!(warehouse.products || []).length)" not in s: raise SystemExit('Empty D1 warehouse safety gate missing')
          if "mapped.some(x => !x.chrtId) || mapped.length !== linked.length" not in s: raise SystemExit('Partial chrtId mapping safety gate missing')
          print('Active WB stock safety contract OK')
          PY
          git diff --check

      - name: Commit active stock Worker
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Synchronize shared stock to WB1 and WB2'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy millioner-api when Cloudflare credentials are available
        working-directory: cloudflare/millioner-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'No repository Cloudflare credentials; waiting for configured Worker Builds/Git deployment.'
            exit 0
          fi
          npx --yes wrangler@4 deploy

      - name: Wait for active stock code on public Worker
        run: |
          set -e
          live=''
          for attempt in $(seq 1 36); do
            code=$(curl -sS -o /tmp/stock-status.json -w '%{http_code}' --max-time 20 'https://millioner-api.7masok.workers.dev/api/stock-sync-status' || true)
            if [ "$code" = '200' ] && jq -e '.ok==true and .mode=="active"' /tmp/stock-status.json >/dev/null 2>&1; then
              live=1
              break
            fi
            sleep 5
          done
          test -n "$live"

      - name: Wait for first automatic WB1 and WB2 stock writes
        run: |
          set -e
          done_flag=''
          for attempt in $(seq 1 72); do
            curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/stock-sync-status' -o /tmp/stock-status.json
            if jq -e '.markets | ([.[]|select(.market=="WB" and .active==true and .lastWrite.ok==1)]|length)==1 and ([.[]|select(.market=="WB2" and .active==true and .lastWrite.ok==1)]|length)==1' /tmp/stock-status.json >/dev/null; then
              done_flag=1
              jq '{mode,markets:[.markets[]|{market,ready,active,lastWrite,state}]}' /tmp/stock-status.json
              break
            fi
            sleep 5
          done
          if [ -z "$done_flag" ]; then
            jq '{mode,markets:[.markets[]|{market,ready,active,lastWrite,state}]}' /tmp/stock-status.json || true
            echo 'Automatic WB stock writes did not complete within the verification window.' >&2
            exit 1
          fi

      - name: Dispatch smoke test for active stock commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
