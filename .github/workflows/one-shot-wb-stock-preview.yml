name: One-shot WB stock sync preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-wb-stock-preview.yml'
      - 'tools/patch_wb_stock_sync_preview.py'

permissions:
  contents: write
  actions: write

jobs:
  patch-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read full current Worker and apply guarded preview patch
        run: python tools/patch_wb_stock_sync_preview.py

      - name: Validate Worker syntax and read-only stock preview
        run: |
          node --check cloudflare/millioner-api/src/index.js
          python - <<'PY'
          from pathlib import Path
          s=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          required=[
            "const WB_CONTENT_BASE = 'https://content-api.wildberries.ru';",
            "'/api/stock-sync-status'",
            "'/api/stock-sync-preview'",
            'async function previewWbStockMarket(',
            'async function resolveWbChrtMap(',
            'async function resolveWbWarehouseId(',
            'function computeSharedAvailableStocks(',
            'CREATE TABLE IF NOT EXISTS stock_sync_runs',
            'CREATE TABLE IF NOT EXISTS wb_stock_links',
            "WB_WAREHOUSE_ID_2",
            "raw?.order?.chrtId",
            "raw?.order?.warehouseId"
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing WB preview markers: '+', '.join(missing))
          forbidden=[
            '/api/v3/stocks/',
            "method: 'PUT'",
            'WB_WORKER_URL +',
            'wb-sync.7masok.workers.dev'
          ]
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('Preview must not write WB stock or call WB Worker directly: '+', '.join(bad))
          print('WB preview is read-only and central-worker-only')
          PY

      - name: Validate shared-stock calculation with bundle reservations
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          a=s.index('function stockLifecycleStage(')
          b=s.index("async function fetchWb(env",a)
          helpers=s[a:b]
          test=helpers+r'''
          const warehouse={
            products:[
              {id:'g',name:'Зелёный',stock:10,kaspi:'kg',wb:'wg'},
              {id:'y',name:'Жёлтый',stock:8,kaspi:'ky',wb:'wy'},
              {id:'r',name:'Красный',stock:12,kaspi:'kr',wb:'wr'},
              {id:'b',name:'Синий',stock:6,kaspi:'kb',wb:'wb'},
              {id:'set',name:'Набор',kind:'bundle',stock:0,kaspi:'kset',wb:'wset',components:[
                {productId:'g',qty:1},{productId:'y',qty:1},{productId:'r',qty:1},{productId:'b',qty:1}
              ]}
            ],
            reservations:[{id:'x',productId:'set',qty:2,active:true,source:'Kaspi',externalKey:'Kaspi:o:e'}],
            sales:[],marketplaceLiveSince:{Kaspi:1},marketOrderState:{Kaspi:{}}
          };
          const rows=[{market:'Kaspi',orderId:'o',entryId:'e',status:'ACCEPTED_BY_MERCHANT',state:'KASPI_DELIVERY',creationDate:Date.now(),sku:'kset',qty:2}];
          let a1=computeSharedAvailableStocks(warehouse,rows);
          if(a1.get('g')!==8||a1.get('y')!==6||a1.get('r')!==10||a1.get('b')!==4)throw new Error('Bundle reserve did not commit every component');
          if(a1.get('set')!==4)throw new Error('Bundle available stock must be 4 after reserving 2 sets');
          rows[0].status='CANCELLED';
          let a2=computeSharedAvailableStocks(warehouse,rows);
          if(a2.get('g')!==10||a2.get('b')!==6||a2.get('set')!==6)throw new Error('Cancellation did not release bundle component stock');
          console.log('Shared stock bundle regression OK');
          '''
          Path('/tmp/wb-stock-preview-regression.js').write_text(test,encoding='utf-8')
          PY
          node /tmp/wb-stock-preview-regression.js
          git diff --check

      - name: Commit preview Worker source
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Add read-only WB stock synchronization preview'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy millioner-api when Cloudflare credentials are available
        id: deploy
        working-directory: cloudflare/millioner-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Cloudflare repository credentials are not available to this workflow; waiting for Worker Builds/Git deployment if configured.'
            echo 'deployed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes wrangler@4 deploy
          echo 'deployed=true' >> "$GITHUB_OUTPUT"

      - name: Verify public preview endpoint became live
        run: |
          set -e
          live=''
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/stock-status.json -w '%{http_code}' --max-time 20 'https://millioner-api.7masok.workers.dev/api/stock-sync-status' || true)
            if [ "$code" = '200' ] && jq -e '.ok==true and .mode=="preview" and (.markets|type=="array")' /tmp/stock-status.json >/dev/null 2>&1; then
              live=1
              cat /tmp/stock-status.json | jq '{ok,mode,markets}'
              break
            fi
            sleep 5
          done
          if [ -z "$live" ]; then
            echo 'Preview source is committed, but the public Cloudflare Worker has not deployed this revision.' >&2
            exit 1
          fi

      - name: Run safe WB1/WB2 previews through central millioner-api
        run: |
          set -e
          for market in WB WB2; do
            body=$(curl -fsSL --retry 3 --retry-delay 3 --max-time 60 "https://millioner-api.7masok.workers.dev/api/stock-sync-preview?market=${market}")
            echo "$body" | jq -e '.ok==true and .result.market=="'"$market"'"'
            echo "$body" | jq '{market:.result.market,ready:.result.ready,warehouseId:.result.warehouseId,warehouseSource:.result.warehouseSource,linked:.result.linked,mapped:.result.mapped,missing:.result.missing,warnings:.result.warnings}'
          done

      - name: Dispatch smoke test on committed main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run smoke-test.yml --ref main
          run_id=''
          for attempt in $(seq 1 24); do
            run_id=$(gh run list --workflow smoke-test.yml --branch main --event workflow_dispatch --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          test -n "$run_id"
          echo "Smoke run: $run_id"
          gh run watch "$run_id" --exit-status
