name: One-shot WB2 integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-wb2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch current files
        run: python tools/add_wb2.py
      - name: Finish safe WB2 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad_literal="alert('Ошибка общей базы:\n'+String(e.message||e))".replace('\\n','\n')
          good="alert('Ошибка общей базы:\\n'+String(e.message||e))"
          if bad_literal in s:
              s=s.replace(bad_literal,good,1)
          old="const feed=market==='Kaspi'?state.kaspiOrderFeed:isWbMarket(market)?state.wbOrderFeed:state.ozonOrderFeed;(feed||[]).forEach(o=>{if(String(o.sku||'').trim()===p[field])o.productId=p.id});applyMarketplaceTransitions(market,feed||[]);"
          new="const allFeed=market==='Kaspi'?state.kaspiOrderFeed:isWbMarket(market)?state.wbOrderFeed:state.ozonOrderFeed,feed=isWbMarket(market)?(allFeed||[]).filter(o=>String(o.market||'WB')===market):allFeed;(feed||[]).forEach(o=>{if(String(o.sku||'').trim()===p[field])o.productId=p.id});applyMarketplaceTransitions(market,feed||[]);"
          if old not in s: raise SystemExit('account-safe attach marker not found')
          s=s.replace(old,new,1)
          s=s.replace("let names=['Kaspi','WB','Ozon','Ручная'];","let names=['Kaspi','WB','WB2','Ozon','Ручная'];",1)
          p.write_text(s,encoding='utf-8')
          PY
          git checkout -- .github/workflows/smoke-test.yml
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          for marker in ['id="wbAccountTabs"','market=WB2&limit=500','function selectWbAccount(account)',"filter(o=>String(o.market||'WB')===market)","'WB2'"]:
              if marker not in html: raise SystemExit('missing '+marker)
          api=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          for marker in ['WB_TOKEN_2',"'WB2'",'fetchWb(env, market)']:
              if marker not in api: raise SystemExit('missing '+marker)
          PY
          node --check /tmp/app.js
          node --check cloudflare/millioner-api/src/index.js
          git diff --check
      - name: Commit app and API only
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js
          git commit -m 'Add second Wildberries account to shared warehouse'
          git push origin HEAD:main
