name: One-shot WB2 integration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-wb2.yml'
      - 'tools/add_wb2.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch current files
        run: python tools/add_wb2.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          for marker in ['id="wbAccountTabs"','market=WB2&limit=500','function selectWbAccount(account)']:
              if marker not in html: raise SystemExit('missing '+marker)
          api=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          for marker in ['WB_TOKEN_2',"'WB2'",'fetchWb(env, market)']:
              if marker not in api: raise SystemExit('missing '+marker)
          PY
          node --check /tmp/app.js
          node --check cloudflare/millioner-api/src/index.js
          git diff --check
      - name: Commit safely
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js .github/workflows/smoke-test.yml
          git rm .github/workflows/one-shot-wb2.yml tools/add_wb2.py
          git commit -m 'Add second Wildberries account to shared warehouse'
          git push origin HEAD:main
