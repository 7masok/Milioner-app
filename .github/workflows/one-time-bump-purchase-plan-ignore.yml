name: One-time purchase plan ignore cache bust
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-bump-purchase-plan-ignore.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump loader and remove one-time workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./kaspi-ads-v2.js?v=20260821-0142'
          new='./kaspi-ads-v2.js?v=20260821-1037'
          if old not in s:
              raise SystemExit('expected loader version not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/one-time-bump-purchase-plan-ignore.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/one-time-bump-purchase-plan-ignore.yml
          git commit -m 'Reload purchase plan ignore controls'
          git push
