name: Optimize products render

on:
  push:
    branches: [main]
    paths:
      - 'tools/optimize_products_render.py'
      - '.github/workflows/optimize-products-render.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded products optimization
        run: python tools/optimize_products_render.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Verify optimization
        run: |
          grep -q 'function buildProductRenderStats()' index.html
          grep -q "const ads=kaspiAdsBreakdown('all');" index.html
          grep -q 'loading="lazy" decoding="async"' index.html
      - name: Commit optimized products
        run: |
          if git diff --quiet -- index.html; then
            echo 'No app change needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Speed up products tab calculations'
          git push origin main
