name: Overnight marketplace UI upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/overnight-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair guarded patch typo in working copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/overnight_upgrade.py')
          s=p.read_text(encoding='utf-8')
          old="for(const o of(remote||[]){"
          new="for(const o of(remote||[])){"
          if old not in s:
              raise SystemExit('Expected patch typo marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Apply guarded index upgrade
        run: python tools/overnight_upgrade.py

      - name: Validate browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Validate central Worker JavaScript
        run: node --check cloudflare/millioner-api/src/index.js

      - name: Validate diff
        run: |
          git diff --check
          git diff -- index.html

      - name: Commit only validated index
        run: |
          git config user.name 'Millioner QA'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Unify marketplace integrations and use safe WB cache'
          git push origin HEAD:main
