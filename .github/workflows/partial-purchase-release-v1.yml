name: Partial purchase release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/partial-purchase-release-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply partial release patch
        run: python .github/scripts/partial_purchase_release.py
      - name: Validate page JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'openReleasePurchaseShipment' in html
          assert 'releaseSelectedPurchaseRows' in html
          assert 'Частично в продаже' in html
          PY
          node --check /tmp/index-inline.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Allow partial release of purchase items'
          git push origin HEAD:main
