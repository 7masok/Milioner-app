name: Patch WB finance nmId link

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_wb_finance_link_nm.py'
      - '.github/workflows/patch-wb-finance-link-nm.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_wb_finance_link_nm.py
      - run: node --check cloudflare/millioner-api/src/index.js
      - run: grep -q "l.sku=f.vendor_code OR l.sku=f.nm_id" cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          if git diff --quiet -- cloudflare/millioner-api/src/index.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Match WB finance rows by vendor code or nmId'
          git push origin main
