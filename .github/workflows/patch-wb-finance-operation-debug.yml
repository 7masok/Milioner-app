name: Patch WB finance operation debug
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-wb-finance-operation-debug.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_wb_finance_operation_debug.py
      - run: node --check cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          if git diff --quiet -- cloudflare/millioner-api/src/index.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Add WB finance operation diagnostic'
          git push
