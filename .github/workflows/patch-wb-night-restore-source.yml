name: Patch WB night restore source

on:
  push:
    branches:
      - fix/wb-night-restore-source

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wb-night-restore-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch scheduler source and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          prices = Path('railway/src/prices.js')
          s = prices.read_text()

          old = "if (schedule.phase === 'error' && schedule.lastError && !isWbGradualReductionError(schedule.lastError)) continue;"
          new = "if (schedule.phase === 'error' && schedule.lastError && !isWbGradualReductionError(schedule.lastError) && !(Number(schedule.basePrice) > 0)) continue;"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('night error guard anchor not found')

          anchor = """    const confirmedPrice = number(row.price);\n    const window = wbNightWindowState(schedule.startMinute, schedule.endMinute, now);\n    let queueRow = queueByNm.get(schedule.nmId);\n\n    if (schedule.enabled && window.inWindow) {"""
          replacement = """    const confirmedPrice = number(row.price);\n    const window = wbNightWindowState(schedule.startMinute, schedule.endMinute, now);\n    let queueRow = queueByNm.get(schedule.nmId);\n\n    // Never start a new night window while the previous night's base price is still\n    // waiting to be restored. Otherwise the temporary raised WB price can become\n    // the next window's baseline after downtime or a failed restore.\n    const savedBasePrice = Number(schedule.basePrice);\n    if (schedule.enabled && window.inWindow && savedBasePrice > 0 && schedule.windowKey !== window.windowKey) {\n      if (queueRow?.source === 'manual') continue;\n      if (Math.abs(confirmedPrice - savedBasePrice) < 0.000001) {\n        await pool.query(`DELETE FROM wb_price_update_queue WHERE market=$1 AND nm_id=$2 AND source='schedule'`, [market, schedule.nmId]);\n        await pool.query(`UPDATE wb_price_schedules SET base_price=NULL,window_key='',manual_override_window='',\n          phase='idle',last_error='',updated_at=$3 WHERE market=$1 AND nm_id=$2`,\n          [market, schedule.nmId, now]);\n        changed += 1;\n        continue;\n      }\n      const previousRestoreTarget = wbSafeReturnPrice(confirmedPrice, savedBasePrice);\n      const alreadyRestoring = queueRow?.source === 'schedule'\n        && Number(queueRow.desiredPrice) === previousRestoreTarget\n        && ['pending','sent','checking'].includes(queueRow.status);\n      if (!alreadyRestoring && await queueSchedulePrice(market, schedule.nmId, previousRestoreTarget)) {\n        changed += 1;\n      }\n      await pool.query(`UPDATE wb_price_schedules SET phase='restoring',last_error='',updated_at=$3\n        WHERE market=$1 AND nm_id=$2`, [market, schedule.nmId, now]);\n      continue;\n    }\n\n    if (schedule.enabled && window.inWindow) {"""
          if anchor in s:
              s = s.replace(anchor, replacement, 1)
          elif 'const previousRestoreTarget = wbSafeReturnPrice(confirmedPrice, savedBasePrice);' not in s:
              raise SystemExit('previous-window restore anchor not found')

          old_verify = """          await client.query(`UPDATE wb_price_schedules SET phase=$3,last_error=$4,updated_at=$5\n            WHERE market=$1 AND nm_id=$2`,\n            [market, queued.nmId, isWbGradualReductionError(errorText) ? 'restoring' : 'error', errorText.slice(0, 500), now]);"""
          new_verify = """          await client.query(`UPDATE wb_price_schedules\n            SET phase=CASE WHEN base_price IS NOT NULL AND base_price > 0 THEN 'restoring' ELSE $3 END,\n              last_error=$4,updated_at=$5\n            WHERE market=$1 AND nm_id=$2`,\n            [market, queued.nmId, isWbGradualReductionError(errorText) ? 'restoring' : 'error', errorText.slice(0, 500), now]);"""
          if old_verify in s:
              s = s.replace(old_verify, new_verify, 1)
          elif new_verify not in s:
              raise SystemExit('upload verification schedule error anchor not found')

          prices.write_text(s)

          migration = Path('railway/migrations/138_wb_night_restore_source_guard.sql')
          migration.write_text("""-- Source-level night restore is the primary guard. This trigger is a second line\n-- of defence so an unfinished baseline can never be overwritten by a later window.\nCREATE OR REPLACE FUNCTION guard_wb_night_schedule_restore()\nRETURNS trigger\nLANGUAGE plpgsql\nAS $$\nBEGIN\n  IF OLD.base_price IS NOT NULL AND OLD.base_price > 0 THEN\n    IF NEW.phase = 'error' THEN\n      NEW.phase := 'restoring';\n    END IF;\n\n    IF NEW.phase = 'raising'\n       AND NEW.window_key IS DISTINCT FROM OLD.window_key\n       AND NEW.base_price IS DISTINCT FROM OLD.base_price THEN\n      NEW.base_price := OLD.base_price;\n    END IF;\n  END IF;\n  RETURN NEW;\nEND;\n$$;\n\nDROP TRIGGER IF EXISTS trg_wb_night_schedule_restore_guard ON wb_price_schedules;\nCREATE TRIGGER trg_wb_night_schedule_restore_guard\nBEFORE UPDATE ON wb_price_schedules\nFOR EACH ROW\nEXECUTE FUNCTION guard_wb_night_schedule_restore();\n\n-- Anything that still has a remembered baseline must keep restoring rather than\n-- remaining terminally errored. The scheduler decides whether the current minute\n-- is inside a valid night window before sending any new raise.\nUPDATE wb_price_schedules\nSET phase='restoring', updated_at=(extract(epoch from now()) * 1000)::bigint\nWHERE base_price IS NOT NULL\n  AND base_price > 0\n  AND phase='error';\n""")

          test = Path('railway/test/wb-price-controls.test.mjs')
          t = test.read_text()
          sentinel = "test('night scheduler source restores the previous window before any new raise'"
          if sentinel not in t:
              t += """\n\ntest('night scheduler source restores the previous window before any new raise',()=>{\n  const prices=read('../src/prices.js');\n  const sql=read('../migrations/138_wb_night_restore_source_guard.sql');\n  assert.match(prices,/savedBasePrice > 0 && schedule\\.windowKey !== window\\.windowKey/);\n  assert.match(prices,/const previousRestoreTarget = wbSafeReturnPrice\\(confirmedPrice, savedBasePrice\\)/);\n  assert.match(prices,/queueSchedulePrice\\(market, schedule\\.nmId, previousRestoreTarget\\)/);\n  assert.match(prices,/phase='restoring',last_error='',updated_at=\\$3/);\n  assert.match(prices,/schedule\\.phase === 'error'[\\s\\S]*Number\\(schedule\\.basePrice\\) > 0/);\n  assert.match(prices,/CASE WHEN base_price IS NOT NULL AND base_price > 0 THEN 'restoring' ELSE \\$3 END/);\n  assert.match(sql,/NEW\\.phase = 'raising'[\\s\\S]*NEW\\.window_key IS DISTINCT FROM OLD\\.window_key/);\n  assert.match(sql,/NEW\\.base_price := OLD\\.base_price/);\n});\n"""
              test.write_text(t)

          passport = Path('docs/SITE-PASSPORT.md')
          d = passport.read_text()
          d2, n = re.subn(r"^- \*\*PRICE-22\.\*\*.*$", "- **PRICE-22.** Ночная цена WB обязана восстановить сохранённый `base_price` до начала нового ночного цикла. Пока предыдущий возврат не подтверждён фактическим снимком WB, новый `window_key` не может перезаписать базу и планировщик сначала ставит безопасный ступенчатый возврат через `wbSafeReturnPrice`. Любая ошибка загрузки/проверки при наличии `base_price` оставляет расписание в `restoring`, а не в терминальном `error`. Если защита цены включена во время ночной цены, используется тот же сохранённый baseline и временная цена не становится новой базой.", d, flags=re.M)
          if n != 1:
              raise SystemExit(f'PRICE-22 replacement count={n}')
          passport.write_text(d2)
          PY
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No patch changes left to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add railway/src/prices.js railway/migrations/138_wb_night_restore_source_guard.sql railway/test/wb-price-controls.test.mjs docs/SITE-PASSPORT.md
          git commit -m 'Fix WB night restore in scheduler source'
          git push origin HEAD:fix/wb-night-restore-source
