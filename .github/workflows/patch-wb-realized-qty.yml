name: Patch WB realized quantity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-wb-realized-qty.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/patch_wb_realized_qty.py
      - run: node --check cloudflare/millioner-api/src/index.js
      - run: grep -q "lower(trim(f.doc_type))='продажа'" cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          if git diff --quiet -- cloudflare/millioner-api/src/index.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Count only realized WB quantity for FIFO'
          git push
