name: Patch WB true profit

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch_wb_true_profit.py'
      - '.github/workflows/patch-wb-true-profit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded WB true profit patch
        run: python tools/patch_wb_true_profit.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check cloudflare/millioner-api/src/index.js
      - name: Verify WB finance markers
        run: |
          grep -q '/api/wb-finance-products' cloudflare/millioner-api/src/index.js
          grep -q 'function openWbFinanceReport' index.html
          grep -q 'accountAdvertising' index.html
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html cloudflare/millioner-api/src/index.js; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cloudflare/millioner-api/src/index.js
          git commit -m 'Use WB finance API for true profit reports'
          git push origin main
