name: Probe Kaspi focused feeds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-kaspi-focused-feeds.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live central and worker
        run: |
          set -euo pipefail
          echo CENTRAL
          curl -fsSL --max-time 25 'https://millioner-api.7masok.workers.dev/api/market-status' | jq .
          spec='days=1&status=ACCEPTED_BY_MERCHANT&state=KASPI_DELIVERY&size=100&batch=0'
          echo "WORKER $spec"
          code=$(curl -sS -o /tmp/w.json -w '%{http_code}' --max-time 90 "https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/sync?$spec")
          echo "HTTP=$code"
          jq '{ok,totalOrders,totalOrdersOnPage,detailedOrders,pageCount,hasMore,nextBatch}' /tmp/w.json
          test "$code" = 200
          jq -e '.ok==true and .hasMore==false' /tmp/w.json
          for id in 1028072690 1028169317 1028174494; do
            jq -e --arg id "$id" '[.orders[]|select((.code|tostring)==$id)]|length>0' /tmp/w.json
          done
