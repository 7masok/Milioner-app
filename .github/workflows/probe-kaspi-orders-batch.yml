name: Probe Kaspi orders batch pagination
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-kaspi-orders-batch.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe order list batches
        run: |
          python - <<'PY'
          import subprocess,json,urllib.parse
          base='https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/orders'
          variants=[
            ('b0s100',{'days':'7','state':'ARCHIVE','batch':'0','size':'100'}),
            ('b1s100',{'days':'7','state':'ARCHIVE','batch':'1','size':'100'}),
            ('b2s100',{'days':'7','state':'ARCHIVE','batch':'2','size':'100'}),
            ('b100s100',{'days':'7','state':'ARCHIVE','batch':'100','size':'100'}),
            ('offset100',{'days':'7','state':'ARCHIVE','offset':'100','size':'100'}),
          ]
          for name,pms in variants:
            u=base+'?'+urllib.parse.urlencode(pms)
            p=subprocess.run(['curl','-fSs','--max-time','30',u],capture_output=True,text=True)
            print('\n',name,'rc',p.returncode)
            if p.returncode: print(p.stderr[-300:]); continue
            d=json.loads(p.stdout); rows=d.get('data') or []
            print('count',len(rows),'meta',d.get('meta'))
            print('first',[(x.get('attributes',{}).get('code'),x.get('attributes',{}).get('completionDate')) for x in rows[:3]])
            print('last',[(x.get('attributes',{}).get('code'),x.get('attributes',{}).get('completionDate')) for x in rows[-3:]])
          PY
