name: Probe Kaspi order history windows
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-kaspi-orders-history-window.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe day windows
        run: |
          python - <<'PY'
          import subprocess,json,urllib.parse,datetime
          base='https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/orders'
          for days in [7,14,30,60,90]:
            u=base+'?'+urllib.parse.urlencode({'days':str(days),'state':'ARCHIVE','batch':'0','size':'100'})
            p=subprocess.run(['curl','-fSs','--max-time','30',u],capture_output=True,text=True)
            print('\ndays',days,'rc',p.returncode)
            if p.returncode: print(p.stderr[-300:]); continue
            d=json.loads(p.stdout); rows=d.get('data') or []; meta=d.get('meta') or {}
            vals=[int((x.get('attributes') or {}).get('completionDate') or 0) for x in rows if int((x.get('attributes') or {}).get('completionDate') or 0)>0]
            print('meta',meta,'rows',len(rows),'first completion',min(vals) if vals else None,'last completion',max(vals) if vals else None)
          PY
