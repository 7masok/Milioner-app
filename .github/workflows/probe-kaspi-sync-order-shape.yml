name: Probe Kaspi sync order shape
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-kaspi-sync-order-shape.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect one order
        run: |
          python - <<'PY'
          import urllib.request,json
          u='https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/sync?days=7&state=ARCHIVE&status=COMPLETED&batch=20&size=1'
          with urllib.request.urlopen(u,timeout=30) as r:d=json.load(r)
          print('meta', {k:d.get(k) for k in ['totalOrders','pageCount','hasMore','nextBatch','batch','pageSize']})
          o=(d.get('orders') or [{}])[0]
          print('keys',sorted(o.keys()))
          print(json.dumps(o,ensure_ascii=False)[:12000])
          PY
