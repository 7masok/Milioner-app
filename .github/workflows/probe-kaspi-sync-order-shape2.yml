name: Probe Kaspi sync order shape 2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-kaspi-sync-order-shape2.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect one order
        run: |
          python - <<'PY'
          import subprocess,json
          u='https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/sync?days=7&state=ARCHIVE&status=COMPLETED&batch=0&size=1'
          p=subprocess.run(['curl','-fSs','--max-time','30',u],capture_output=True,text=True)
          print('rc',p.returncode,p.stderr[-300:])
          d=json.loads(p.stdout)
          print('meta', {k:d.get(k) for k in ['totalOrders','pageCount','hasMore','nextBatch','batch','pageSize']})
          o=(d.get('orders') or [{}])[0]
          print('keys',sorted(o.keys()))
          print(json.dumps(o,ensure_ascii=False)[:12000])
          PY
