name: Probe full Kaspi batched report source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-kaspi-sync-report.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch batched Kaspi sync and calculate period
        run: |
          python - <<'PY'
          import subprocess,json,urllib.parse,datetime
          base='https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/sync'
          all_orders=[]
          batch=0
          for i in range(10):
            url=base+'?'+urllib.parse.urlencode({'days':'14','batch':str(batch)})
            p=subprocess.run(['curl','-fSs','--max-time','45',url],capture_output=True,text=True,timeout=50)
            if p.returncode:
              print('curl error',batch,p.stderr[-500:]); raise SystemExit(2)
            d=json.loads(p.stdout)
            rows=d.get('orders') or []
            all_orders.extend(rows)
            print('batch',batch,'orders',len(rows),'hasMore',d.get('hasMore'),'next',d.get('nextBatch'))
            if not d.get('hasMore'): break
            nxt=d.get('nextBatch')
            if nxt is None: break
            batch=int(nxt)
          print('TOTAL SOURCE ORDERS',len(all_orders))
          tz=datetime.timezone(datetime.timedelta(hours=5))
          start=datetime.datetime(2026,8,8,0,0,tzinfo=tz).timestamp()*1000
          end=datetime.datetime(2026,8,14,9,12,59,tzinfo=tz).timestamp()*1000+999
          def ms(v):
            if v is None:return 0
            if isinstance(v,(int,float)):return float(v)
            s=str(v).strip()
            try:return float(s)
            except:pass
            try:return datetime.datetime.fromisoformat(s.replace('Z','+00:00')).timestamp()*1000
            except:return 0
          by={}
          for o in all_orders:
            key=str(o.get('id') or o.get('code') or '')
            if key: by[key]=o
          rows=[]
          for o in by.values():
            t=ms(o.get('completionDate'))
            if start<=t<end:
              rows.append(o)
          from collections import Counter
          c=Counter(str(o.get('status') or '').upper() for o in rows)
          sums={}
          for st in c:
            sums[st]=sum(float(o.get('totalPrice') or 0) for o in rows if str(o.get('status') or '').upper()==st)
          print('period orders',len(rows),'statuses',dict(c),'sums',sums)
          print('COMPLETED TOTAL',sum(float(o.get('totalPrice') or 0) for o in rows if str(o.get('status') or '').upper()=='COMPLETED'))
          print('ALL completionDate TOTAL',sum(float(o.get('totalPrice') or 0) for o in rows))
          print('sample keys',sorted(set().union(*(o.keys() for o in rows[:5]))) if rows else [])
          PY
