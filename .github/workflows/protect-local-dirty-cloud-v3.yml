name: Protect unsynced phone data during D1 recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protect-local-dirty-cloud-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prefer dirty local values on first recovery
        run: |
          python .github/scripts/protect_local_dirty_cloud_v3.py
          node --check cloud-sync-v3.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email actions@users.noreply.github.com
          git add cloud-sync-v3.js
          git diff --cached --quiet && exit 0
          git commit -m 'Preserve unsynced local warehouse values on recovery'
          git push origin HEAD:main
