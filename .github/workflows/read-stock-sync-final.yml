name: One-time final stock sync verification

on:
  push:
    paths:
      - '.github/workflows/read-stock-sync-final.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify live stock sync
        run: |
          sleep 40
          curl --fail --silent --show-error --max-time 30 'https://milioner-app-staging.up.railway.app/health' > /tmp/health.json
          curl --fail --silent --show-error --max-time 30 'https://milioner-app-staging.up.railway.app/api/stock-sync-status' > /tmp/status.json
          curl --fail --silent --show-error --max-time 60 -H 'Origin: https://7masok.github.io' 'https://milioner-app-staging.up.railway.app/api/stock-sync-preview' > /tmp/preview.json || echo '{"ok":false,"error":"preview request failed"}' > /tmp/preview.json
          python3 - <<'PY'
          import json
          out={k:json.load(open('/tmp/'+k+'.json')) for k in ('health','status','preview')}
          with open('tmp-stock-sync-final.json','w') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
          rm .github/workflows/read-stock-sync-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-stock-sync-final.json .github/workflows/read-stock-sync-final.yml
          git commit -m 'Capture final stock sync verification'
          git push
