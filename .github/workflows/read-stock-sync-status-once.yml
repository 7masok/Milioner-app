name: One-time stock sync status check

on:
  push:
    paths:
      - '.github/workflows/read-stock-sync-status-once.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Read live stock status
        run: |
          sleep 35
          curl --fail --silent --show-error --max-time 30 \
            'https://milioner-app-staging.up.railway.app/api/stock-sync-status' > /tmp/status.json
          curl --fail --silent --show-error --max-time 60 \
            -H 'Origin: https://7masok.github.io' \
            'https://milioner-app-staging.up.railway.app/api/stock-sync-preview' > /tmp/preview.json || echo '{"ok":false,"error":"preview request failed"}' > /tmp/preview.json
          python3 - <<'PY'
          import json
          status=json.load(open('/tmp/status.json'))
          preview=json.load(open('/tmp/preview.json'))
          out={'status':status,'preview':preview}
          with open('tmp-stock-sync-status.json','w') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
          rm .github/workflows/read-stock-sync-status-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-stock-sync-status.json .github/workflows/read-stock-sync-status-once.yml
          git commit -m 'Capture one-time stock sync status'
          git push
