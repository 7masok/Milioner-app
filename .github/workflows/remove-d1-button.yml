name: Remove WB D1 button
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-d1-button.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: git pull --rebase origin main
      - name: Remove technical button only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='${detail}<button class="btn dark full" onclick="syncWbNow()">Обновить из D1</button>'
          new='${detail}'
          if old not in s: raise SystemExit('target button not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          ! grep -q 'Обновить из D1' index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Hide technical D1 refresh from WB orders'
          git push origin HEAD:main
