name: Revert adaptive purchase velocity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revert-adaptive-purchase-velocity.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert adaptive purchase logic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 8069cc5698190a284789f8bbc26f3d18de0931e2
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app.js
      - name: Push rollback
        run: git push origin HEAD:main
