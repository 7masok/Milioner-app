name: Millioner smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cloudflare/**'
      - '.github/workflows/smoke-test.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check cloudflare/millioner-api/src/index.js

      - name: Check warehouse core contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          api = Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          wrangler = Path('cloudflare/millioner-api/wrangler.jsonc').read_text(encoding='utf-8')
          required = {
              'product cost input': 'id="pcost"',
              'product cost edit': 'id="ecost"',
              'initial stock input': 'id="pstock"',
              'manual sale expenses': 'id="sfee"',
              'marketplace financial sales': 'function financialSales()',
              'computed product profit': 'function profitForProduct(',
              'profit on product card': 'Прибыль 30д',
              'arrival weighted cost': 'newPositiveQty=oldQty+q',
              'sync in-progress UI': "'Синхронизация','warn'",
              'marketplace stock transitions': 'function applyMarketplaceTransitions(market,feed)',
              'late marketplace link reconciliation': 'if(active&&!existingSale&&!existingReservation)',
              'Kaspi cache transition': "applyMarketplaceTransitions('Kaspi',state.kaspiOrderFeed)",
              'WB cache transition': "applyMarketplaceTransitions('WB',state.wbOrderFeed)",
              'manual sale stock guard': 'Недостаточно свободного остатка',
              'writeoff stock guard': 'Нельзя списать больше остатка',
              'inventory stock guard': 'Фактический остаток не может быть отрицательным',
              'Kaspi in-delivery label': "KASPI_DELIVERY_TRANSIT')return 'В доставке'",
              'Kaspi courier handoff marker': 'courierTransmissionDate',
              'Kaspi direct delivery feed': 'fetchKaspiOrdersDirect',
              'Kaspi pending order retention': "entryId: '__pending__'",
              'grouped marketplace order cards': 'function groupMarketplaceOrders(feed)',
              'pending line compaction': 'realOrders=new Set',
              'five-minute browser cache refresh': 'setInterval(()=>loadSharedOrderCache({silent:true}),300000)',
              'five-minute Kaspi status cadence': 'const KASPI_SCHEDULE_MS = 5 * 60 * 1000;',
              'unmatched filter card': 'id="koUnmatchedCard"',
              'unmatched filter toggle': 'function toggleUnmatchedOrderFilter()',
              'unmatched filter predicate': 'function orderHasUnmatchedLine(g)',
              'unmatched filtered orders': 'const visibleOrders=unmatchedOrderFilter?unmatchedOrders:orders',
          }
          missing = [name for name, marker in required.items() if marker not in html and marker not in api]
          if missing:
              raise SystemExit('Missing warehouse features: ' + ', '.join(missing))
          if '"crons": ["*/5 * * * *"]' not in wrangler:
              raise SystemExit('millioner-api cron is not five minutes')
          if 'recalcCostAfterLoss' in html:
              raise SystemExit('Legacy incorrect writeoff cost recalculation is still present')
          sync = re.search(r'async function syncNow\(\)\{.*?\}\nfunction backup', html, flags=re.S)
          if not sync:
              raise SystemExit('syncNow function missing')
          if 'KASPI_WORKER' in sync.group(0):
              raise SystemExit('Browser syncNow still calls Kaspi Worker directly')
          page_cap = re.search(r'const KASPI_MAX_BATCHES = (\d+);', api)
          if not page_cap or not (1 <= int(page_cap.group(1)) <= 10):
              raise SystemExit('Kaspi background pagination is not safely bounded')
          if 'await upsertOrderLines(env.DB, market, lines);' not in api:
              raise SystemExit('D1 marketplace upserts are not batched')
          print('Warehouse and sync contract OK')
          PY

      - name: Check published site
        run: |
          set -e
          curl -fsSL --retry 6 --retry-delay 5 --max-time 25 'https://7masok.github.io/Milioner-app/' -o /tmp/site.html
          grep -q 'Склад' /tmp/site.html
          grep -q 'function applyMarketplaceTransitions' /tmp/site.html
          grep -q 'if(active&&!existingSale&&!existingReservation)' /tmp/site.html
          grep -q 'function groupMarketplaceOrders(feed)' /tmp/site.html
          grep -q 'id="koUnmatchedCard"' /tmp/site.html
          grep -q 'function toggleUnmatchedOrderFilter()' /tmp/site.html
          grep -q '300000' /tmp/site.html

      - name: Check Millioner API health
        run: |
          set -e
          body=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 25 'https://millioner-api.7masok.workers.dev/health')
          echo "$body" | jq -e '.ok == true and .d1 == true'

      - name: Check marketplace status endpoint
        run: |
          set -e
          body=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 25 'https://millioner-api.7masok.workers.dev/api/market-status')
          echo "$body" | jq .
          echo "$body" | jq -e '[.markets[] | select(.market=="Kaspi")][0] as $k | ($k.nextSyncAt - $k.latest.started_at) <= 310000'

      - name: Inspect background sync status
        run: |
          set -e
          curl -fsSL --retry 4 --retry-delay 3 --max-time 25 'https://millioner-api.7masok.workers.dev/api/sync-status' | jq .

      - name: Inspect D1 exact Kaspi orders
        run: |
          set -e
          body=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 25 'https://millioner-api.7masok.workers.dev/api/orders?market=Kaspi&limit=1000')
          echo "Kaspi D1 lines: $(echo "$body" | jq '.orders | length')"
          for id in 1028072690 1028169317 1028174494 1027863523 1027066063 1027161866; do
            matches=$(echo "$body" | jq --arg id "$id" '[.orders[] | select((.code|tostring)==$id or (.orderId|tostring)==$id)]')
            count=$(echo "$matches" | jq 'length')
            echo "KASPI_EXACT_${id}=$count"
            test "$count" -gt 0
            echo "$matches" | jq '[.[] | {code,status,state,productName,qty,totalPrice}]'
          done

      - name: Probe active Kaspi Worker filter
        run: |
          set -e
          body=$(curl -fsSL --max-time 60 'https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/sync?days=1&status=ACCEPTED_BY_MERCHANT&state=KASPI_DELIVERY&batch=0')
          echo "FILTERED_WORKER=$(echo "$body" | jq '{ok,totalOrders,hasMore,nextBatch,orders:(.orders|length)}')"
          for id in 1028072690 1028169317 1028174494; do
            row=$(echo "$body" | jq --arg id "$id" '[.orders[] | select((.code|tostring)==$id)]')
            echo "WORKER_EXACT_${id}=$(echo "$row" | jq 'length')"
            echo "$row" | jq '[.[] | {code,status,state,lines:(.lines|length),lineError}]'
          done

      - name: Check Kaspi Worker
        run: |
          set -e
          body=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 25 'https://fragrant-shadow-72ed.7masok.workers.dev/health')
          echo "$body" | jq -e '.ok == true'

      - name: Avoid unnecessary WB calls
        run: echo 'WB marketplace orders are synchronized server-side.'
