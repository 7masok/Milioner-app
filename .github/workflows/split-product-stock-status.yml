name: Split product stock status
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-product-stock-status.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/split_product_stock_status.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Split in-transit and warehouse product stock'
          git push origin HEAD:main
