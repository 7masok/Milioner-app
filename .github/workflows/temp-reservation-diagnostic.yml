# rerun: target marketplace rows
name: Temporary reservation diagnostic
on:
  push:
    branches: [codex/railway-migration]
    paths:
      - '.github/workflows/temp-reservation-diagnostic.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch read-only diagnostic
        run: |
          set -euo pipefail
          URL='https://milioner-app-staging.up.railway.app/api/reservation-diagnostic?key=rdiag-76f4d17c0e834db4a225&name=%D0%BB%D1%83%D0%BD%D0%B0'
          curl --fail --silent --show-error "$URL" | python -m json.tool > reservation-diagnostic-result.json
          cat reservation-diagnostic-result.json
      - name: Commit diagnostic result
        run: |
          set -euo pipefail
          git config user.name 'millioner-diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git add reservation-diagnostic-result.json
          git commit -m 'Store temporary reservation diagnostic result'
          git push origin HEAD:codex/railway-migration
