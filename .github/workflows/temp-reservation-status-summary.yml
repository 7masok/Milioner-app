name: Temporary reservation status summary
on:
  push:
    branches: [codex/railway-migration]
    paths:
      - '.github/workflows/temp-reservation-status-summary.yml'
permissions:
  contents: write
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and compare read-only data
        run: |
          set -euo pipefail
          BASE='https://milioner-app-staging.up.railway.app/api'
          curl --fail --silent --show-error "$BASE/reservation-diagnostic?key=rdiag-76f4d17c0e834db4a225&name=%D0%BB%D1%83%D0%BD%D0%B0" > /tmp/diag.json
          curl --fail --silent --show-error "$BASE/orders?market=Kaspi&limit=5000" > /tmp/orders.json
          python - <<'PY'
          import json,time
          d=json.load(open('/tmp/diag.json'))
          o=json.load(open('/tmp/orders.json'))
          rows={f"Kaspi:{x.get('orderId','')}:{x.get('entryId','')}":x for x in o.get('orders',[])}
          now=int(time.time()*1000)
          counts={}; fresh=0; matched=0; unmatched=0; terminal=0; active=0
          examples=[]
          for r in d.get('allActiveReservations',[]):
            if r.get('source')!='Kaspi': continue
            row=rows.get(r.get('externalKey',''))
            if not row:
              unmatched+=1; continue
            matched+=1
            status=str(row.get('status','')).upper(); state=str(row.get('state','')).upper()
            key=f'{status}|{state}'
            counts[key]=counts.get(key,0)+1
            ua=int(row.get('updatedAt') or 0)
            if ua and now-ua <= 15*60*1000: fresh+=1
            is_terminal=status in {'COMPLETED','CANCELLED','CANCELLING','RETURNED'} or state=='KASPI_DELIVERY_TRANSIT'
            if is_terminal: terminal+=1
            else: active+=1
            if len(examples)<20: examples.append({'key':r.get('externalKey'),'status':status,'state':state,'updatedAt':ua})
          out={'activeReservationQty':d.get('allActiveReservationQty'), 'matched':matched,'unmatched':unmatched,'freshWithin15m':fresh,'terminalRows':terminal,'nonTerminalRows':active,'counts':counts,'examples':examples}
          open('reservation-status-summary.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit summary
        run: |
          git config user.name 'millioner-diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git add reservation-status-summary.json
          git commit -m 'Store temporary reservation status summary'
          git push origin HEAD:codex/railway-migration
