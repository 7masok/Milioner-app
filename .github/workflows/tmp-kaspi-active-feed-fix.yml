name: Patch Kaspi active feed

on:
  push:
    branches: [tmp-kaspi-active-feed-fix]
    paths:
      - '.github/workflows/tmp-kaspi-active-feed-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-kaspi-active-feed-fix
          fetch-depth: 0
      - name: Patch backend
        run: python .github/scripts/patch_kaspi_active_feed.py
      - name: Validate
        run: |
          node --check cloudflare/millioner-api/src/index.js
          grep -q "status: 'ACCEPTED_BY_MERCHANT'" cloudflare/millioner-api/src/index.js
          grep -q "state: 'KASPI_DELIVERY'" cloudflare/millioner-api/src/index.js
          grep -q "fetchKaspiWorkerFeed" cloudflare/millioner-api/src/index.js
      - name: Commit backend fix
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Prioritize active Kaspi packing orders'
          git push origin HEAD:tmp-kaspi-active-feed-fix
