name: Stage Kaspi missing-line recovery

on:
  push:
    branches: [tmp-kaspi-line-recovery]
    paths:
      - '.github/workflows/tmp-kaspi-line-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-kaspi-line-recovery
          fetch-depth: 0
      - name: Patch
        run: python .github/scripts/kaspi_recovery_patch.py
      - name: Validate
        run: |
          node --check cloudflare/millioner-api/src/index.js
          grep -q "const KASPI_MAX_BATCHES = 10;" cloudflare/millioner-api/src/index.js
          grep -q "fetchKaspiOrderLinesDirect" cloudflare/millioner-api/src/index.js
          grep -q "masterproducts/.*merchantProduct" cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Recover Kaspi order lines after Worker subrequest limit'
          git push origin HEAD:tmp-kaspi-line-recovery
