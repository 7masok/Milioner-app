name: Expose safe Kaspi recovery readiness flag

on:
  push:
    branches: [tmp-kaspi-recovery-flag]
    paths:
      - '.github/workflows/tmp-kaspi-recovery-flag.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-kaspi-recovery-flag
          fetch-depth: 0
      - name: Patch market status
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare/millioner-api/src/index.js')
          s=p.read_text(encoding='utf-8')
          old="      mode: market === 'WB' ? (env.WB_TOKEN ? 'marketplace-api' : 'missing-token') : market === 'Kaspi' ? 'worker' : 'off',\n      latest: latest || null,"
          new="      mode: market === 'WB' ? (env.WB_TOKEN ? 'marketplace-api' : 'missing-token') : market === 'Kaspi' ? (env.KASPI_TOKEN ? 'worker+direct-recovery' : 'worker-only') : 'off',\n      directRecoveryConfigured: market === 'Kaspi' ? Boolean(env.KASPI_TOKEN) : null,\n      latest: latest || null,"
          if s.count(old)!=1:
              raise SystemExit(f'marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check cloudflare/millioner-api/src/index.js
      - name: Commit
        run: |
          git config user.name 'millioner-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js
          git commit -m 'Report Kaspi direct recovery readiness'
          git push origin HEAD:tmp-kaspi-recovery-flag
