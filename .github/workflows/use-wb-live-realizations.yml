name: Use WB live realizations
on:
  push:
    paths:
      - 'tools/use_wb_live_realizations.py'
      - '.github/workflows/use-wb-live-realizations.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python tools/use_wb_live_realizations.py
      - name: Check worker JS
        run: node --check cloudflare/millioner-api/src/index.js
      - name: Check browser JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app.js
      - run: |
          grep -q '/api/wb-sales-live' cloudflare/millioner-api/src/index.js
          grep -q 'Количество — фактические продажи/возвраты' index.html
      - name: Commit
        run: |
          if git diff --quiet -- cloudflare/millioner-api/src/index.js index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare/millioner-api/src/index.js index.html
          git commit -m 'Use WB operational buyouts for realized quantity'
          git push origin main
