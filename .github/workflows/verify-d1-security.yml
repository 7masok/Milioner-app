name: Verify D1 warehouse security
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-d1-security.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare Git deploy
        run: sleep 8
      - name: Check warehouse API origin guard
        run: |
          set -e
          code=$(curl -sS -o /tmp/no-origin.json -w '%{http_code}' --max-time 25 'https://millioner-api.7masok.workers.dev/api/warehouse-state')
          cat /tmp/no-origin.json
          test "$code" = "403"
          body=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 25 -H 'Origin: https://7masok.github.io' 'https://millioner-api.7masok.workers.dev/api/warehouse-state')
          echo "$body" | jq .
          echo "$body" | jq -e '.ok == true and (.exists == true or .exists == false)'
      - name: Check published client and Kaspi controls
        run: |
          curl -fsSL --retry 5 --retry-delay 4 --max-time 25 'https://7masok.github.io/Milioner-app/' -o /tmp/site.html
          grep -q 'async function bootstrapWarehouseD1()' /tmp/site.html
          body=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 25 'https://millioner-api.7masok.workers.dev/api/orders?market=Kaspi&limit=1000')
          for id in 1028072690 1028169317 1028174494; do
            echo "$body" | jq -e --arg id "$id" '[.orders[] | select((.code|tostring)==$id or (.orderId|tostring)==$id)] | length > 0'
          done
