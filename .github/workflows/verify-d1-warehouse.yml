name: Verify D1 warehouse
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-d1-warehouse.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate code
        run: |
          node --check cloudflare/millioner-api/src/index.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I))
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          required=['async function bootstrapWarehouseD1()','async function pushWarehouseToD1()',"KEY+'_pre_d1'",'/api/warehouse-state']
          for marker in required:
            if marker not in h: raise SystemExit('missing client marker '+marker)
          api=Path('cloudflare/millioner-api/src/index.js').read_text(encoding='utf-8')
          for marker in ['CREATE TABLE IF NOT EXISTS warehouse_state',"url.pathname === '/api/warehouse-state'",'await importProducts(env.DB, warehouse.products || [])']:
            if marker not in api: raise SystemExit('missing API marker '+marker)
          PY
          node --check /tmp/app.js
      - name: Check published site
        run: |
          curl -fsSL --retry 6 --retry-delay 5 --max-time 25 'https://7masok.github.io/Milioner-app/' -o /tmp/site.html
          grep -q 'async function bootstrapWarehouseD1()' /tmp/site.html
          grep -q "KEY+'_pre_d1'" /tmp/site.html
      - name: Check live warehouse API
        run: |
          body=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 25 'https://millioner-api.7masok.workers.dev/api/warehouse-state')
          echo "$body" | jq .
          echo "$body" | jq -e '.ok == true and (.exists == true or .exists == false)'
      - name: Check live Kaspi controls
        run: |
          body=$(curl -fsSL --retry 4 --retry-delay 3 --max-time 25 'https://millioner-api.7masok.workers.dev/api/orders?market=Kaspi&limit=1000')
          for id in 1028072690 1028169317 1028174494; do
            echo "$body" | jq -e --arg id "$id" '[.orders[] | select((.code|tostring)==$id or (.orderId|tostring)==$id)] | length > 0'
          done
