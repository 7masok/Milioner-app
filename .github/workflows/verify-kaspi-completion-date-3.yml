name: Verify Kaspi completion date v3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-kaspi-completion-date-3.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        run: |
          curl -fSs -A 'Mozilla/5.0' -H 'Accept: application/json' 'https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/orders?days=7' -o /tmp/kaspi.json
      - name: Compare
        run: |
          python - <<'PY'
          import json,datetime
          d=json.load(open('/tmp/kaspi.json'))
          o=d.get('data') or []
          tz=datetime.timezone(datetime.timedelta(hours=5)); target=datetime.date(2026,8,13)
          day=lambda x: datetime.datetime.fromtimestamp(float(x)/1000,tz).date() if x else None
          for field in ['creationDate','completionDate','approvedByBankDate']:
              rows=[x.get('attributes') or {} for x in o]
              rows=[a for a in rows if a.get('status')=='COMPLETED' and day(a.get(field))==target]
              print(field,len(rows),sum(float(a.get('totalPrice') or 0) for a in rows))
          print('completion coverage',sum(bool((x.get('attributes') or {}).get('completionDate')) for x in o),'of',len(o))
          print('keys',sorted({k for x in o for k in (x.get('attributes') or {}).keys()}))
          PY
