name: Verify Kaspi completion date
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-kaspi-completion-date.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Kaspi dates
        run: |
          python - <<'PY'
          import json, urllib.request, datetime
          url='https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/orders?days=7'
          with urllib.request.urlopen(url, timeout=60) as r:
              data=json.load(r)
          orders=data.get('data') or []
          tz=datetime.timezone(datetime.timedelta(hours=5))
          target=datetime.date(2026,8,13)
          def day(ms):
              if not ms:return None
              return datetime.datetime.fromtimestamp(float(ms)/1000,tz).date()
          sums={'creation':0,'completion':0,'approved':0}
          counts={'creation':0,'completion':0,'approved':0}
          coverage=0
          keys=set()
          matched=[]
          for item in orders:
              a=item.get('attributes') or {}
              keys.update(a.keys())
              if a.get('completionDate'): coverage+=1
              for k,field in [('creation','creationDate'),('completion','completionDate'),('approved','approvedByBankDate')]:
                  if day(a.get(field))==target and str(a.get('status'))=='COMPLETED':
                      sums[k]+=float(a.get('totalPrice') or 0); counts[k]+=1
                      if k=='completion': matched.append((a.get('code'),a.get('totalPrice'),a.get('completionDate')))
          print('orders',len(orders))
          print('completionDate coverage',coverage)
          print('keys',sorted(keys))
          print('counts',counts)
          print('sums',sums)
          print('completion matched',matched)
          PY
