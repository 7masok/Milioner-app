name: Verify Kaspi return events
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-kaspi-return-events.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify net revenue with return event
        run: |
          python - <<'PY'
          import json, subprocess, time, urllib.parse, datetime
          base='https://millioner-api.7masok.workers.dev/api/kaspi-report-orders'
          tz=datetime.timezone(datetime.timedelta(hours=5))
          ms=lambda dt:int(dt.timestamp()*1000)
          start=ms(datetime.datetime(2026,8,7,0,0,tzinfo=tz))
          end=ms(datetime.datetime(2026,8,14,9,56,0,tzinfo=tz))
          u=base+'?'+urllib.parse.urlencode({'days':'8','from':start,'to':end})
          d={}
          for i in range(15):
              p=subprocess.run(['curl','-sS','--max-time','90',u],capture_output=True,text=True)
              try:d=json.loads(p.stdout)
              except Exception:d={}
              print('TRY',i+1,'ok',d.get('ok'),'returns',d.get('returns'),'error',d.get('error'))
              if d.get('ok') and sum(float(x.get('amount') or 0) for x in d.get('returns',[]))>=790: break
              time.sleep(20)
          if not d.get('ok'): raise SystemExit('endpoint failed: '+str(d))
          completed=[x for x in d.get('orders',[]) if str(x.get('status','')).upper()=='COMPLETED']
          gross=sum(float(x.get('totalPrice') or 0) for x in completed)
          returns=sum(float(x.get('amount') or 0) for x in d.get('returns',[]))
          net=gross-returns
          print('8D gross',gross,'returns',returns,'net',net,'return rows',json.dumps(d.get('returns',[]),ensure_ascii=False))
          if round(gross,2)!=220870.00: raise SystemExit(f'gross expected 220870 got {gross}')
          if round(returns,2)!=790.00: raise SystemExit(f'returns expected 790 got {returns}')
          if round(net,2)!=220080.00: raise SystemExit(f'net expected 220080 got {net}')
          y0=ms(datetime.datetime(2026,8,13,0,0,tzinfo=tz)); y1=ms(datetime.datetime(2026,8,14,0,0,tzinfo=tz))
          yu=base+'?'+urllib.parse.urlencode({'days':'-1','from':y0,'to':y1})
          yd=json.loads(subprocess.check_output(['curl','-fSs','--max-time','90',yu],text=True))
          yr=sum(float(x.get('amount') or 0) for x in yd.get('returns',[]))
          print('YESTERDAY returns',yr)
          if round(yr,2)!=0: raise SystemExit(f'yesterday must have 0 returns, got {yr}')
          PY
