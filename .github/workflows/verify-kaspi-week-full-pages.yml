name: Verify full paged Kaspi week
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-kaspi-week-full-pages.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate PDF period from all archive pages
        run: |
          python - <<'PY'
          import subprocess,json,urllib.parse,datetime
          base='https://fragrant-shadow-72ed.7masok.workers.dev/kaspi/orders'
          allrows=[]
          for batch in range(10):
            u=base+'?'+urllib.parse.urlencode({'days':'7','state':'ARCHIVE','batch':str(batch),'size':'100'})
            p=subprocess.run(['curl','-fSs','--max-time','30',u],capture_output=True,text=True)
            if p.returncode: raise SystemExit(p.stderr)
            d=json.loads(p.stdout); rows=d.get('data') or []; allrows += rows
            meta=d.get('meta') or {}; print('batch',batch,'rows',len(rows),'meta',meta)
            if len(rows)<100 or batch+1>=int(meta.get('pageCount') or 0): break
          tz=datetime.timezone(datetime.timedelta(hours=5))
          start=int(datetime.datetime(2026,8,8,0,0,tzinfo=tz).timestamp()*1000)
          end=int(datetime.datetime(2026,8,14,9,12,59,999000,tzinfo=tz).timestamp()*1000)+1
          vals=[]
          for item in allrows:
            a=item.get('attributes') or {}; t=int(a.get('completionDate') or 0); st=str(a.get('status') or '').upper(); price=float(a.get('totalPrice') or 0)
            if start<=t<end: vals.append((a.get('code'),st,price,t))
          from collections import Counter,defaultdict
          c=Counter(x[1] for x in vals); sums=defaultdict(float)
          for _,st,p,_ in vals:sums[st]+=p
          print('period rows',len(vals),'statuses',dict(c),'sums',dict(sums))
          print('COMPLETED',sum(x[2] for x in vals if x[1]=='COMPLETED'))
          print('ALL',sum(x[2] for x in vals))
          print('noncompleted',[x for x in vals if x[1]!='COMPLETED'])
          PY
