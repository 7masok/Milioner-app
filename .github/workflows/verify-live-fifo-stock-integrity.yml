name: Verify live FIFO stock integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-fifo-stock-integrity.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for GitHub Pages
        run: sleep 35
      - name: Check published warehouse logic
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 4 --max-time 25 'https://7masok.github.io/Milioner-app/' -o /tmp/site.html
          grep -q "batch:'Начальный остаток'" /tmp/site.html
          grep -q "const fifo=fifoConsume(p.id,q);p.stock" /tmp/site.html
          grep -q "batch:'Инвентаризация +'" /tmp/site.html
          grep -q "refreshProductAverageCost(p);log('списание'" /tmp/site.html
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/site.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script>(.*?)</script>',h,flags=re.S|re.I))
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
