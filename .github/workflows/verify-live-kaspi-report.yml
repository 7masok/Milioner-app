name: Verify live Kaspi report
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-kaspi-report.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live report API
        run: |
          curl -fSs --max-time 60 'https://millioner-api.7masok.workers.dev/api/kaspi-report-orders?days=-1' -o /tmp/report.json
      - name: Check 13 August total
        run: |
          python - <<'PY'
          import json,datetime
          d=json.load(open('/tmp/report.json'))
          print('source',d.get('source'),'lookback',d.get('lookback'),'requests',d.get('requests'))
          o=d.get('orders') or []
          tz=datetime.timezone(datetime.timedelta(hours=5)); target=datetime.date(2026,8,13)
          def day(ms):
              return datetime.datetime.fromtimestamp(float(ms)/1000,tz).date() if ms else None
          rows=[x for x in o if day(x.get('completionDate'))==target and str(x.get('status')).upper()=='COMPLETED']
          total=sum(float(x.get('totalPrice') or 0) for x in rows)
          print('matched_orders',len(rows))
          print('total',total)
          print('codes',[(x.get('code'),x.get('totalPrice'),x.get('completionDate')) for x in rows])
          if round(total,2)!=59520.00:
              raise SystemExit('EXPECTED 59520.00, GOT %.2f' % total)
          PY
