name: Verify live Kaspi resilience
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-kaspi-resilience.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare Git deploy and scheduled sync
        run: sleep 45
      - name: Verify live site and API
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 3 --max-time 25 'https://7masok.github.io/Milioner-app/' -o /tmp/site.html
          grep -q 'Склад' /tmp/site.html
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -fsSL --retry 3 --retry-delay 2 --max-time 25 'https://millioner-api.7masok.workers.dev/api/market-status')
            echo "$status" | jq .
            kaspi_ok=$(echo "$status" | jq -r '[.markets[]|select(.market=="Kaspi")][0].latest.ok // 0')
            if [ "$kaspi_ok" = "1" ]; then break; fi
            sleep 35
          done
          test "$kaspi_ok" = "1"
          orders=$(curl -fsSL --retry 3 --retry-delay 2 --max-time 25 'https://millioner-api.7masok.workers.dev/api/orders?market=Kaspi&limit=1000')
          for id in 1028072690 1028169317 1028174494; do
            echo "$orders" | jq -e --arg id "$id" '[.orders[]|select((.code|tostring)==$id or (.orderId|tostring)==$id)]|length>0'
          done
          wb=$(echo "$status" | jq -r '[.markets[]|select(.market=="WB")][0].mode')
          echo "WB_MODE=$wb"
