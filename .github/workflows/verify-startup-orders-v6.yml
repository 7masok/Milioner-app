name: Verify startup orders v6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-startup-orders-v6.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live API and published client
        run: |
          python - <<'PY'
          import json, subprocess, time
          origin=['-H','Origin: https://7masok.github.io']
          def get(url, timeout=30):
              t=time.time(); raw=subprocess.check_output(['curl','-fSs','--max-time',str(timeout),*origin,url],text=True); return raw,time.time()-t
          orders_raw,ot=get('https://millioner-api.7masok.workers.dev/api/orders?market=Kaspi&limit=500')
          meta_raw,mt=get('https://millioner-api.7masok.workers.dev/api/warehouse-state?meta=1')
          page,pt=get('https://7masok.github.io/Milioner-app/',30)
          orders=json.loads(orders_raw); meta=json.loads(meta_raw); n=len(orders.get('orders') or [])
          print('KASPI_ROWS',n,'ORDERS_SECONDS',round(ot,3))
          print('D1_REVISION',meta.get('revision'),'META_SECONDS',round(mt,3))
          print('PAGE_SECONDS',round(pt,3))
          if not orders.get('ok') or n<=0: raise SystemExit('Kaspi order cache empty')
          if not meta.get('ok'): raise SystemExit('D1 meta failed')
          checks=[
            "const ACTIVE_VIEW_KEY=KEY+'_active_view_device'",
            "const startupView=localStorage.getItem(ACTIVE_VIEW_KEY)||'home'",
            "setTimeout(()=>loadSharedOrderCache({silent:true}),0)",
            "const statusPromise=apiJson(MILLIONER_API+'/api/market-status').then",
            "cloud-sync-v3.js?v=20260814v5"
          ]
          for x in checks:
              if x not in page: raise SystemExit('Published page missing: '+x)
          PY
