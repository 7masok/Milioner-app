name: Verify live WB true profit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-wb-true-profit-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Worker deploy
        run: sleep 20
      - name: Read WB1 summary
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-finance-summary?market=WB&days=30' -o wb1-summary.json
          jq . wb1-summary.json
          jq -e '.ok==true and (.netBeforeCost|type)=="number"' wb1-summary.json
      - name: Read WB2 summary
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-finance-summary?market=WB2&days=30' -o wb2-summary.json
          jq . wb2-summary.json
          jq -e '.ok==true and (.netBeforeCost|type)=="number"' wb2-summary.json
      - name: Read WB1 products
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-finance-products?market=WB&days=30' -o wb1-products.json
          jq '{ok,market,days,count:(.products|length),linked:([.products[]|select(.productId!=null)]|length),unlinked:([.products[]|select(.productId==null)]|length),advertising,accountAdvertising}' wb1-products.json
          jq -e '.ok==true and (.products|type)=="array"' wb1-products.json
      - name: Read WB2 products
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --max-time 30 'https://millioner-api.7masok.workers.dev/api/wb-finance-products?market=WB2&days=30' -o wb2-products.json
          jq '{ok,market,days,count:(.products|length),linked:([.products[]|select(.productId!=null)]|length),unlinked:([.products[]|select(.productId==null)]|length),advertising,accountAdvertising}' wb2-products.json
          jq -e '.ok==true and (.products|type)=="array"' wb2-products.json
      # rerun after nmId fallback
