name: WB debug now
on:
  push:
    paths: ['.github/workflows/wb-debug-now.yml']
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect fresh WB frontend logic
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for term in ['function marketplaceProductStats','function financialSales','async function openMarketReport']:
              i=s.find(term)
              print('\n###',term,'at',i)
              print(s[i:i+8000] if i>=0 else 'NOT FOUND')
          PY
