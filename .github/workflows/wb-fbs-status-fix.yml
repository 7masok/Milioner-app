name: Fix WB FBS statuses
on:
  push:
    paths:
      - .github/workflows/wb-fbs-status-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch WB FBS status semantics
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Check JavaScript syntax
        run: node --check /tmp/app.js
      - name: Verify WB rules
        run: |
          grep -q "if(market==='WB')return st==='SOLD'" index.html
          grep -q "if(u==='COMPLETE')return 'В доставке'" index.html
          grep -q "if(st==='SOLD')return 'Завершён'" index.html
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix WB FBS order status semantics"
          git push origin HEAD:main
