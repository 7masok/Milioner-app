name: WB finance hotfix
on:
  push:
    paths:
      - '.github/workflows/wb-finance-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch WB price units and client finance safety
        shell: python
        run: |
          from pathlib import Path

          worker = Path('cloudflare/millioner-api/src/index.js')
          s = worker.read_text()
          old = "const price = Number(order?.convertedFinalPrice ?? order?.finalPrice ?? order?.convertedPrice ?? order?.price ?? 0) || 0;"
          new = "const priceMinor = Number(order?.convertedFinalPrice ?? order?.finalPrice ?? order?.convertedPrice ?? order?.price ?? 0) || 0;\n    const price = priceMinor / 100; // WB Marketplace API monetary fields are minor currency units"
          if old not in s:
              raise SystemExit('worker price pattern not found')
          s = s.replace(old, new, 1)
          worker.write_text(s)

          page = Path('index.html')
          s = page.read_text()
          start = s.index('function financialSales(){')
          end = s.index('\nfunction salesDays(', start)
          replacement = "function financialSales(){return [...(state.sales||[])]}"
          s = s[:start] + replacement + s[end:]

          marker = "state.products ||= [];state.movements ||= [];state.sales ||= [];state.purchases ||= [];state.reservations ||= [];state.settings ||= {};"
          repair = marker + "if(!state.settings.negativeStockRepairV1){for(const p of state.products){if(Number(p.stock)<0){state.movements.unshift({id:'repair-'+String(p.id),date:Date.now(),type:'инвентаризация',productId:p.id,qty:-Number(p.stock),extra:'Автокоррекция отрицательного остатка после старой WB-синхронизации'});p.stock=0}}state.settings.negativeStockRepairV1=true;}"
          if marker not in s:
              raise SystemExit('client init pattern not found')
          s = s.replace(marker, repair, 1)
          page.write_text(s)

          # The workflow is intentionally one-shot.
          Path('.github/workflows/wb-finance-hotfix.yml').unlink()
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix WB monetary units and historical finance leakage"
          git push origin HEAD:main
