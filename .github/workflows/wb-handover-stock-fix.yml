name: Fix WB stock handover transition
on:
  push:
    paths:
      - .github/workflows/wb-handover-stock-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Deduct WB stock only after handover
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function isMarketplaceSaleOrder(market,status,state=''){const s=String(status||'').toUpperCase(),st=String(state||'').toUpperCase();if(market==='Kaspi')return s==='COMPLETED'||(s==='ACCEPTED_BY_MERCHANT'&&st==='KASPI_DELIVERY_TRANSIT');if(market==='WB')return st==='SOLD';return isCompletedOrder(market,s,st)}"
          new="function isMarketplaceSaleOrder(market,status,state=''){const s=String(status||'').toUpperCase(),st=String(state||'').toUpperCase();if(market==='Kaspi')return s==='COMPLETED'||(s==='ACCEPTED_BY_MERCHANT'&&st==='KASPI_DELIVERY_TRANSIT');if(market==='WB')return ['SORTED','ACCEPTED_BY_CARRIER','SENT_TO_CARRIER','READY_FOR_PICKUP','SOLD'].includes(st);return isCompletedOrder(market,s,st)}"
          if old not in s: raise SystemExit('isMarketplaceSaleOrder marker not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          Path('.github/workflows/wb-handover-stock-fix.yml').unlink()
      - name: Check JS
        run: node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Deduct WB stock after marketplace handover"
          git push origin HEAD:main
