name: Refresh WB realized sales now
on:
  push:
    paths: ['.github/workflows/wb-refresh-now.yml']
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 cached state
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=1' | jq '{ok,available,sales,returns,buyoutCount,buyoutSum,lastSuccessAt,lastError,nextSyncAt,stale}'
      - name: WB2 cached state
        run: curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB2&days=1' | jq '{ok,available,sales,returns,buyoutCount,buyoutSum,lastSuccessAt,lastError,nextSyncAt,stale}'
