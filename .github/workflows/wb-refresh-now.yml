name: Refresh WB realized sales now
on:
  push:
    paths: ['.github/workflows/wb-refresh-now.yml']
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 sold status history
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sold-history-debug?market=WB' | jq '{ok,market,orders,sold,historyStatus,historyCount,sample:[.sample[]|{id,rid,article,nmId,createdAt,price,status,history}]}'
