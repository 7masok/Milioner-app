name: Refresh WB realized sales now
on:
  push:
    paths: ['.github/workflows/wb-refresh-now.yml']
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 direct buyouts fallback
        run: |
          curl -sS -D /tmp/h 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB&days=1&refresh=1' -o /tmp/b || true
          cat /tmp/h
          echo BODY
          cat /tmp/b
      - name: WB2 direct buyouts fallback
        run: |
          curl -sS -D /tmp/h2 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB2&days=1&refresh=1' -o /tmp/b2 || true
          cat /tmp/h2
          echo BODY
          cat /tmp/b2
