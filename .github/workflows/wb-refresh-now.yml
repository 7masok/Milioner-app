name: Refresh WB realized sales now
on:
  push:
    paths: ['.github/workflows/wb-refresh-now.yml']
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 direct KZT final
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sales-direct?market=WB&days=1' | jq '{ok,available,source,currency,sales,returns,buyoutCount,buyoutSum,forPay,pricedRows,sourceRows,priceComplete,marketplacePages,marketplaceError,products:(.products|map({vendorCode,qty,buyoutSum,forPay,priceLinked}))}'
