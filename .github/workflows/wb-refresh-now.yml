name: Refresh WB realized sales now
on:
  push:
    paths: ['.github/workflows/wb-refresh-now.yml']
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 analytics buyouts
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB&days=1&refresh=1' | jq '{ok,available,buyoutCount,buyoutSum,itemCount,updatedAt,lastError,source}'
      - name: WB2 analytics buyouts
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-buyouts-live?market=WB2&days=1&refresh=1' | jq '{ok,available,buyoutCount,buyoutSum,itemCount,updatedAt,lastError,source}'
