name: Refresh WB realized sales now
on:
  push:
    paths: ['.github/workflows/wb-refresh-now.yml']
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 realized status today
        run: |
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-realized-status?market=WB&days=1' | jq '{ok,available,market,sales,returns,buyoutCount,buyoutSum,forPay,priceComplete,payoutEstimated,statusTracked,coverageComplete,recoveryTag,products:[.products[]|{vendorCode,nmId,qty,buyoutSum,forPay,priceLinked}]}'
      - name: WB2 realized status today
        run: |
          curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-realized-status?market=WB2&days=1' | jq '{ok,available,market,sales,returns,buyoutCount,buyoutSum,forPay,coverageComplete,recoveryTag}'
