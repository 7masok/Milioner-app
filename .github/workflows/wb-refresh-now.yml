name: Refresh WB realized sales now
on:
  push:
    paths: ['.github/workflows/wb-refresh-now.yml']
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: WB1 today's known realization candidates
        run: |
          curl -sS 'https://millioner-api.7masok.workers.dev/api/wb-sold-history-debug?market=WB&nmIds=868277285,892404541,1294433488' | jq '{ok,market,candidates:[.candidates[]|{id,rid,article,nmId,createdAt,price,status}]}'
