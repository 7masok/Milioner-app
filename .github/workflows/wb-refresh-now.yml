name: Refresh WB realized sales now
on:
  push:
    paths: ['.github/workflows/wb-refresh-now.yml']
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh WB1
        run: curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=1&refresh=1' | jq '{ok,market,sales,returns,buyoutCount,buyoutSum,forPay,lastSuccessAt,lastError}'
      - name: Refresh WB2
        run: curl -fsS 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB2&days=1&refresh=1' | jq '{ok,market,sales,returns,buyoutCount,buyoutSum,forPay,lastSuccessAt,lastError}'
