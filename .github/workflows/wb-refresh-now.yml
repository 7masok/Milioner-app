name: Refresh WB realized sales now
on:
  push:
    paths: ['.github/workflows/wb-refresh-now.yml']
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Worker market status raw
        run: |
          curl -sS -D /tmp/h 'https://millioner-api.7masok.workers.dev/api/market-status' -o /tmp/b || true
          cat /tmp/h
          head -c 2000 /tmp/b
      - name: Worker WB sales raw
        run: |
          curl -sS -D /tmp/h2 'https://millioner-api.7masok.workers.dev/api/wb-sales-live?market=WB&days=1' -o /tmp/b2 || true
          cat /tmp/h2
          head -c 2000 /tmp/b2
