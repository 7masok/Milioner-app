<section id="finance" class="view active">
  <div class="finance-head"><div><h2>Финансы</h2><p class="muted">Счета, категории и вся история денег · <span id="financeSyncStatus">синхронизация…</span></p></div><button class="btn" onclick="financeRefresh()">↻</button></div>
  <div class="finance-total-card"><div><div class="label">Итого</div><div class="num" id="financeTotalBalance">—</div></div><div class="finance-total-side"><span>Доходы · месяц</span><b id="financeMonthIncome">—</b><span>Расходы · месяц</span><b id="financeMonthExpense">—</b></div></div>
  <div class="finance-mode-tabs"><button data-finance-mode="expense" onclick="financeSetAnalyticsMode('expense')">РАСХОДЫ</button><button data-finance-mode="income" onclick="financeSetAnalyticsMode('income')">ДОХОДЫ</button></div>
  <div class="finance-analysis-card" onpointerdown="financePeriodSwipeStart(event)" onpointerup="financePeriodSwipeEnd(event)" onpointercancel="financePeriodSwipeCancel()">
    <div class="finance-period-tabs"><button data-finance-period="day" onclick="financeSetAnalyticsPeriod('day')">День</button><button data-finance-period="week" onclick="financeSetAnalyticsPeriod('week')">Неделя</button><button data-finance-period="month" onclick="financeSetAnalyticsPeriod('month')">Месяц</button><button data-finance-period="year" onclick="financeSetAnalyticsPeriod('year')">Год</button><button data-finance-period="all" onclick="financeSetAnalyticsPeriod('all')">Всё</button></div>
    <div class="finance-period-nav"><button id="financePeriodPrev" type="button" aria-label="Предыдущий период" onclick="financeShiftAnalyticsPeriod(-1)">‹</button><div id="financeAnalysisPeriodLabel" class="finance-period-label"></div><button id="financePeriodNext" type="button" aria-label="Следующий период" onclick="financeShiftAnalyticsPeriod(1)">›</button></div>
    <div class="finance-donut-wrap"><div id="financeDonut" class="finance-donut"><div class="finance-donut-hole"><b id="financeBreakdownTotal">—</b><span id="financeBreakdownCaption">Расходы</span></div></div></div>
    <div class="finance-category-tools"><button class="btn" type="button" onclick="financeAddCategory()">+ Категория</button><button class="btn" type="button" onclick="financeShowAllCategories()">Все категории</button></div>
    <div id="financeCategoryBreakdown" class="finance-category-breakdown"></div>
  </div>
  <div class="finance-actions"><button class="btn dark" onclick="openModal('financeTransaction')">+ Операция</button><button class="btn" onclick="openModal('financeTransfer')">Перевод</button><button class="btn" onclick="financeImportStatement()">Выписка</button></div>
  <details class="finance-panel finance-collapsible"><summary class="finance-collapsible-head"><div><div class="section-kicker">ДЕНЬГИ</div><h3>Счета</h3></div><span class="finance-collapse-chevron" aria-hidden="true">⌄</span></summary><div class="finance-collapsible-body"><button class="btn full" onclick="financeAddAccount()">+ Счёт</button><div id="financeAccounts" style="margin-top:8px"></div></div></details>

  <details class="finance-panel finance-collapsible" id="financeOperationsPanel"><summary class="finance-collapsible-head"><div><div class="section-kicker">ИСТОРИЯ</div><h3>Журнал операций</h3></div><span class="finance-collapse-chevron" aria-hidden="true">⌄</span></summary><div class="finance-collapsible-body"><div class="finance-filters"><select id="financePeriodFilter" class="select" onchange="financeClearHistoryPeriodOverride();renderFinanceTransactions()"><option value="day">Сегодня</option><option value="month" selected>Этот месяц</option><option value="week">7 дней</option><option value="year">Этот год</option><option value="all">Всё время</option></select><select id="financeTypeFilter" class="select" onchange="renderFinanceTransactions()"><option value="all">Все типы</option><option value="income">Доходы</option><option value="expense">Расходы</option><option value="transfer">Переводы</option><option value="transit">Транзитные</option><option value="adjustment">Корректировки</option></select><select id="financeAccountFilter" class="select" onchange="renderFinanceTransactions()"><option value="all">Все счета</option></select><select id="financeCategoryFilter" class="select" onchange="renderFinanceTransactions()"><option value="all">Все категории</option></select></div><div id="financeTransactions" class="list"><div class="empty">Операций пока нет</div></div></div></details>
</section>
