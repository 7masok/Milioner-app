<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f8"><title>Склад · нет связи</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18232b;font-family:system-ui,-apple-system,sans-serif}main{max-width:480px;margin:auto;padding:32px 22px;min-height:100svh;display:flex;flex-direction:column;justify-content:center}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px;margin-bottom:38px}.card{background:white;border:1px solid #e5e8eb;border-radius:26px;padding:26px;box-shadow:0 12px 48px #17242a07}.symbol{width:54px;height:54px;display:grid;place-items:center;border-radius:18px;background:#fff3d9;color:#a76a14;font-size:30px}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:1.7px;font-weight:750;color:#987342;margin-top:24px}h1{font-size:27px;letter-spacing:-.8px;line-height:1.18;margin:9px 0 16px}p{font-size:14px;line-height:1.6;color:#67717a;margin:10px 0}.info{background:#f5f6f8;border-radius:14px;padding:14px;margin:22px 0}.info p{margin:0;font-size:13px}.info strong{color:#34434e}button{font:650 15px system-ui;width:100%;border:0;background:#172d3a;color:white;border-radius:14px;padding:15px;min-height:50px}button:disabled{opacity:.6}.foot{text-align:center;font-size:12px;color:#8a939b;margin-top:18px}details{border-top:1px solid #eef0f2;padding-top:16px;margin-top:22px;color:#78818a;font-size:12px}summary{cursor:pointer}#code{font-family:ui-monospace,monospace}a{color:inherit}
</style></head><body><main><div class="brand">Склад<span style="color:#bdc6cc"> / </span>статус связи</div><section class="card" aria-labelledby="title"><div class="symbol" aria-hidden="true">↻</div><h1 id="title">Нет связи со складом</h1><p id="reason">Не удалось получить ответ от сервера.</p><button id="retry" type="button">Попробовать снова</button><p id="progress" role="status" class="foot">Автоматическая проверка каждые 20 секунд</p><details><summary>Что произошло</summary><div class="info"><p id="pageCheck">Страница склада · ещё не проверена</p><p id="serverCheck">Сервер · ещё не проверен</p></div><p id="code">__CONNECTION_CODE__</p><p id="attempts"></p></details></section></main><script>
const code=document.getElementById('code').textContent;
if(code.startsWith('HTTP ')){document.getElementById('reason').textContent='При открытии страницы сервер вернул ошибку '+code+'.'}
else if(navigator.onLine===false){document.getElementById('title').textContent='Нет подключения к интернету';document.getElementById('reason').textContent='Подключитесь к интернету. Повторим автоматически.'}
let busy=false;
const SCOPE_BASE=String(location.pathname||'').startsWith('/inferno/')?'/inferno':'';
const HISTORY_KEY=(SCOPE_BASE?'inferno:':'')+'sklad_connection_attempts_v1';
function record(result){try{const list=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');list.push(result);localStorage.setItem(HISTORY_KEY,JSON.stringify(list.slice(-12)))}catch{}}
function time(){return new Date().toLocaleTimeString('ru-RU',{timeZone:'Asia/Almaty'})+' · Алматы'}
async function probe(path,id,label){
 const controller=new AbortController(),started=Date.now();let timer;
 document.getElementById(id).textContent=label+' · проверяем…';
 let result;
 try{result=await Promise.race([(async()=>{
  const response=await fetch(SCOPE_BASE+path,{cache:'no-store',signal:controller.signal});
  const text=await response.text();
  const valid=id==='pageCheck'?text.includes('initOwnerAuth'):(()=>{try{return JSON.parse(text).ok===true}catch{return false}})();
  return {ok:response.ok&&valid,code:'HTTP '+response.status+(response.ok&&!valid?' · неожиданный ответ':''),path};
 })(),new Promise((_,reject)=>{timer=setTimeout(()=>{reject(Object.assign(new Error(),{name:'TimeoutError'}));controller.abort()},8000)})]);}
 catch(error){result={ok:false,path,code:navigator.onLine===false?'OFFLINE':/Timeout|Abort/.test(error.name)?'TIMEOUT 8 с':'NETWORK'}}
 finally{clearTimeout(timer)}
 result.at=Date.now();result.ms=Date.now()-started;record(result);
 document.getElementById(id).textContent=label+' · '+(result.ok?'доступна · ':'')+result.code+' · '+result.ms+' мс · '+time();
 return result;
}
async function check(){
 if(busy)return;busy=true;
 document.getElementById('progress').textContent='Проверяем связь…';
 try{const [page,server]=await Promise.all([probe('/?connection_probe='+Date.now(),'pageCheck','Страница склада'),probe('/health','serverCheck','Сервер')]);
 document.getElementById('attempts').textContent='Последняя попытка: '+time()+'. Страница: '+page.code+'. Сервер: '+server.code+'.';
 if(page.ok){location.reload();return}
 document.getElementById('progress').textContent='Повтор через 20 секунд';
 }finally{busy=false}
}
// A manual navigation must never wait for health or for an automatic probe.
document.getElementById('retry').onclick=()=>location.reload();
window.addEventListener('online',check);setInterval(check,20000);check();
</script></body></html>
